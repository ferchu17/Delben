name: Deploy Delben to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp *.html _site/
          cp -R cargos _site/cargos
                   mkdir -p _site/documentacion
          cp "Documentacion de Supervisor/pagina-github.html" _site/documentacion/index.html
          # Novedades del Personal: la página se arma con los archivos de Apps Script de novedades-app/apps-script
          mkdir -p _site/novedades
          python3 tools/armar_pagina.py novedades-app _site/novedades
          # DELBEN SGI: la página se arma con los archivos de Apps Script de sgi-app/apps-script (Admin + JS1, JS2, JS3)
          mkdir -p _site/sgi
          python3 tools/armar_pagina.py sgi-app _site/sgi Admin
          # Informe de Novedades: app estática (HTML + JS), se copia tal cual
          cp -R informe-de-novedades _site/informe-de-novedades
          # Control de Combustible: la página se arma con los archivos de Apps Script de combustible-app/apps-script
          # (sin el cartel de Google; el link /exec del backend está en combustible-app/web/config.js)
          mkdir -p _site/combustible
          python3 tools/armar_pagina.py combustible-app _site/combustible
          # Instructivo interactivo (supervisor y administrador): https://ferchu17.github.io/Delben/combustible/ayuda.html
          cp combustible-app/web/ayuda.html _site/combustible/ayuda.html
          # Iconos de cada app (se ven en la pestaña del navegador)
          cp -R iconos _site/iconos
          # Juego Mansión Sombranegra (https://ferchu17.github.io/Delben/mansion/). Se arma con: python3 juego-mansion/build.py
          mkdir -p _site/mansion
          cp juego-mansion/index.html _site/mansion/index.html
          # Instructivos interactivos de todas las apps (https://ferchu17.github.io/Delben/instructivos/). Se arman con: python3 instructivos/src/armar.py
          mkdir -p _site/instructivos
          cp instructivos/*.html instructivos/motor.css instructivos/motor.js _site/instructivos/
          # Portal DELBEN: página con todas las apps (https://ferchu17.github.io/Delben/portal/)
          cp -R portal _site/portal
          # DelBen Domótica: página con la descarga de la APK e instrucciones (https://ferchu17.github.io/Delben/domotica/)
          cp -R domotica _site/domotica
          sed -i '0,/<head[^>]*>/s##&\n<link rel="icon" type="image/png" sizes="64x64" href="/Delben/iconos/sgi-64.png">\n<link rel="apple-touch-icon" href="/Delben/iconos/sgi-192.png">#' _site/sgi/index.html
          sed -i '0,/<head[^>]*>/s##&\n<link rel="icon" type="image/png" sizes="64x64" href="/Delben/iconos/sgi-64.png">\n<link rel="apple-touch-icon" href="/Delben/iconos/sgi-192.png">#' _site/novedades/index.html
            

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
