name: APK Minuta Operativa del Servicio

# Arma la APK de Minuta Operativa del Servicio (abre la página con el motor de Chrome: cámara, archivos y la minuta guardada en el celular)
# y la publica siempre en el mismo link:
# https://github.com/ferchu17/Delben/releases/download/minuta-operativa-apk/MinutaOperativa.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-minuta/**", ".github/workflows/apk-minuta.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: SDK de Android (ya viene en el servidor de GitHub)
        run: echo "sdk.dir=$ANDROID_HOME" > android-minuta/local.properties && (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true)
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Compilar APK
        env: { VERSION_CODE: "${{ github.run_number }}" }
        run: gradle -p android-minuta :app:assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: cp android-minuta/app/build/outputs/apk/release/app-release.apk MinutaOperativa.apk
      - uses: actions/upload-artifact@v4
        with: { name: MinutaOperativa-apk, path: MinutaOperativa.apk }
      - name: Publicar en el link fijo
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view minuta-operativa-apk >/dev/null 2>&1 || \
            gh release create minuta-operativa-apk --title "Minuta Operativa del Servicio (APK)" \
              --notes "App de Android de Minuta Operativa del Servicio. Descargar MinutaOperativa.apk e instalar."
          gh release upload minuta-operativa-apk MinutaOperativa.apk --clobber
