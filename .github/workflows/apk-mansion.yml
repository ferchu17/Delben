name: APK Mansión Sombranegra

# Arma la APK del juego Mansión Sombranegra (abre https://ferchu17.github.io/Delben/mansion/
# a pantalla completa) y la publica siempre en el mismo link:
# https://github.com/ferchu17/Delben/releases/download/mansion-apk/MansionSombranegra.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-mansion/**", ".github/workflows/apk-mansion.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: SDK de Android (ya viene en el servidor de GitHub)
        run: echo "sdk.dir=$ANDROID_HOME" > android-mansion/local.properties && (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true)
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Compilar APK
        env: { VERSION_CODE: "${{ github.run_number }}" }
        run: gradle -p android-mansion :app:assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: cp android-mansion/app/build/outputs/apk/release/app-release.apk MansionSombranegra.apk
      - uses: actions/upload-artifact@v4
        with: { name: MansionSombranegra-apk, path: MansionSombranegra.apk }
      - name: Publicar en el link fijo
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view mansion-apk >/dev/null 2>&1 || \
            gh release create mansion-apk --title "Mansión Sombranegra (APK)" \
              --notes "Juego de terror Mansión Sombranegra para Android. Descargar MansionSombranegra.apk e instalar."
          gh release upload mansion-apk MansionSombranegra.apk --clobber
