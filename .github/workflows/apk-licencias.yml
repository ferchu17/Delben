name: APK Licencias del Personal

# Arma la APK de Licencias del Personal (abre la página con el motor de Chrome: cámara para el certificado, archivos y firma)
# y la publica siempre en el mismo link:
# https://github.com/ferchu17/Delben/releases/download/licencias-apk/Licencias.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-licencias/**", ".github/workflows/apk-licencias.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: SDK de Android (ya viene en el servidor de GitHub)
        run: echo "sdk.dir=$ANDROID_HOME" > android-licencias/local.properties && (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true)
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Compilar APK
        env: { VERSION_CODE: "${{ github.run_number }}" }
        run: gradle -p android-licencias :app:assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: cp android-licencias/app/build/outputs/apk/release/app-release.apk Licencias.apk
      - uses: actions/upload-artifact@v4
        with: { name: Licencias-apk, path: Licencias.apk }
      - name: Publicar en el link fijo
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view licencias-apk >/dev/null 2>&1 || \
            gh release create licencias-apk --title "Licencias del Personal (APK)" \
              --notes "App de Android de Licencias del Personal. Descargar Licencias.apk e instalar."
          gh release upload licencias-apk Licencias.apk --clobber
