plugins { id 'com.android.application' }

android {
    namespace 'ar.com.delben.minutaoperativa'
    compileSdk 34
    defaultConfig {
        applicationId 'ar.com.delben.minutaoperativa'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0.' + (System.getenv('VERSION_CODE') ?: '1')
        // Dirección de la app (GitHub Pages)
        manifestPlaceholders = [
            hostName: 'ferchu17.github.io',
            defaultUrl: 'https://ferchu17.github.io/Delben/minuta-operativa/'
        ]
    }
    signingConfigs {
        release {
            storeFile file('../firma/minuta-operativa.keystore')
            storePassword 'agPyssxFIeHWlr1XAiICPdfq'
            keyAlias 'minuta'
            keyPassword 'agPyssxFIeHWlr1XAiICPdfq'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
