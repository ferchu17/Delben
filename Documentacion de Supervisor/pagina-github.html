<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{--ink:#1F2937;--muted:#6B7280;--line:#E3E8EF;--head:#E9EFF7;--danger:#B91C1C;--ok:#1B6B34;--c1:#8A5212;--c2:#C08A2E}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{font-family:'Source Sans 3',Arial,sans-serif;color:var(--ink);font-size:15px}
  body{min-height:100vh;background:linear-gradient(180deg,#BFDAF5 0%,#62A8F8 100%);background-attachment:fixed}
  body.en-seccion{background:#F3F4F6}
  button{font:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7BB4E8;outline-offset:2px}
  .hidden{display:none!important}
  .tt{font-family:'Rajdhani','Source Sans 3',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

  /* ---------- Menú principal (igual a SGI) ---------- */
  .home{max-width:1120px;margin:0 auto;padding:40px 20px 60px}
  .logo{display:block;width:190px;margin:0 auto 26px;mix-blend-mode:multiply}
  .home h1{text-align:center;font-size:1.25rem;color:#1E3A5F;margin-bottom:26px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,262px));gap:18px;justify-content:center}
  .tile{height:126px;border:none;border-radius:8px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 14px rgba(20,40,80,.25);font-size:1.02rem;transition:transform .15s}
  .tile i{font-size:1.9rem}
  .tile:hover{transform:translateY(-3px)}
  .pie{text-align:center;color:#5B6B80;font-size:.8rem;margin-top:40px;letter-spacing:.05em}

  /* ---------- Ventana de sección (igual a SGI) ---------- */
  .barra-top{background:linear-gradient(90deg,var(--c1),var(--c2));border-bottom:4px solid rgba(255,190,60,.85);color:#fff;
    display:flex;align-items:center;gap:16px;padding:14px 18px}
  .btn-menu{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.85);color:#fff;border-radius:999px;padding:7px 18px;font-weight:700}
  .btn-menu:hover{background:rgba(255,255,255,.2)}
  .barra-top h1{font-size:1.6rem;display:flex;align-items:center;gap:12px}
  .esc{margin-left:auto;font-size:.8rem;opacity:.85}
  @media (hover:none){.esc{display:none}}
  .cuerpo{max-width:1500px;margin:0 auto;padding:18px 14px 140px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:3px solid var(--c1);margin-bottom:20px}
  .tab{background:#F6EFE3;border:1px solid #DCCBB0;border-bottom:none;border-radius:6px 6px 0 0;padding:12px 22px;color:#3A2A14;font-size:.95rem}
  .tab.on{background:linear-gradient(180deg,var(--c2),var(--c1));color:#fff;border-color:var(--c1)}
  .card{background:#fff;border-radius:10px;border-left:4px solid var(--c1);box-shadow:0 4px 18px rgba(0,0,0,.08);padding:16px 18px}
  .card-head{display:flex;align-items:center;gap:10px;color:#374151;font-size:1.1rem}
  .card-head .sub{margin-left:auto}
  .ayuda{font-size:.85rem;color:#4B5563;margin:8px 0 12px}
  .tabla-wrap{border:1px solid #C9D6E2;border-radius:8px;overflow:auto;max-height:64vh}
  table{border-collapse:collapse;width:100%;min-width:900px}
  th{position:sticky;top:0;background:var(--head);color:#374151;text-align:left;font-size:.82rem;padding:10px 12px;z-index:2;white-space:nowrap}
  tr.filtros td{position:sticky;top:37px;background:#F8FAFC;z-index:2;padding:5px 8px;border-bottom:2px solid #C9D6E2}
  tr.filtros input{width:100%;padding:5px 8px;border:1px solid #C9D6E2;border-radius:3px;font:inherit;font-size:.85rem}
  td{padding:10px 12px;border-bottom:1px dashed var(--line);vertical-align:middle;font-size:.92rem}
  tbody tr:hover td{background:#FAFBFD}
  td.dom{font-weight:700}
  .sin{color:#B0B7C3}
  .vencido{background:#FDE2E1;color:#9B1C1C;font-weight:700;border-radius:4px;padding:2px 6px}
  .porvencer{background:#FEF3C7;color:#8A5A00;font-weight:700;border-radius:4px;padding:2px 6px}
  .doc{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .doc input{width:17px;height:17px;accent-color:var(--c1)}
  .doc a{color:#2563EB;text-decoration:underline;cursor:pointer}
  .doc i.fa-file-pdf{color:#DC2626}
  .vacio{text-align:center;color:var(--muted);padding:36px 10px}
  .grupo td{background:#F1F5F9;font-weight:700;color:var(--c1)}

  /* ---------- Barra de selección ---------- */
  .barra-sel{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:4px solid var(--c1);box-shadow:0 -6px 18px rgba(0,0,0,.12);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20}
  .barra-sel .in{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .barra-sel .cont{flex:1;font-weight:700;min-width:200px}
  .btn{border:none;border-radius:6px;padding:11px 18px;font-weight:700}
  .btn.pri{background:linear-gradient(180deg,var(--c2),var(--c1));color:#fff}
  .btn.sec{background:#fff;border:1.5px solid var(--c1);color:var(--c1)}
  .btn:disabled{opacity:.5;cursor:default}

  /* ---------- Ventana de envío ---------- */
  .fondo{position:fixed;inset:0;background:rgba(17,24,39,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:12px}
  .modal{background:#fff;width:100%;max-width:520px;border-radius:10px;padding:20px;max-height:92vh;overflow:auto;border-top:6px solid var(--c1)}
  .modal h2{font-size:1.15rem;margin-bottom:12px}
  .campo{margin-bottom:12px}
  .campo label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
  .campo input,.campo textarea{width:100%;padding:10px 12px;border:1.5px solid #C9D6E2;border-radius:6px;font:inherit}
  .campo small{color:var(--muted);font-size:.8rem}
  .lista-sel{font-size:.88rem;background:#F8FAFC;border-radius:6px;padding:8px 12px 8px 26px;margin-bottom:12px;max-height:140px;overflow:auto}
  .acciones{display:flex;gap:8px}.acciones .btn{flex:1}

  /* Chips de empresa (ART / Seguro de vida) */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{border:1.5px solid var(--c1);background:#fff;color:var(--c1);border-radius:999px;padding:6px 16px;font-weight:700;font-size:.9rem}
  .chip.on{background:linear-gradient(180deg,var(--c2),var(--c1));color:#fff}
  .persona-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FFF7E6;border:1px solid #F3D9A4;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:.92rem}
  .persona-banner .link{margin-left:auto;background:none;border:none;color:var(--c1);font-weight:700}
  .btn-ver{border:1.5px solid var(--c1);background:#fff;color:var(--c1);border-radius:6px;padding:5px 10px;font-weight:700;font-size:.85rem;white-space:nowrap}
  .btn-ver:hover{background:var(--c1);color:#fff}

  /* Visor de documentos */
  .visor .visor-box{background:#fff;width:min(1000px,100%);height:94vh;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;border-top:6px solid var(--c1)}
  .visor-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:#F9FAFB}
  .visor-head b{font-size:1.02rem;flex:1;min-width:180px;word-break:break-word}
  .visor-head label{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--c1);cursor:pointer}
  .visor-head label input{width:18px;height:18px;accent-color:var(--c1)}
  .visor-cerrar{background:none;border:none;font-size:1.6rem;line-height:1;color:#4B5563;padding:2px 8px}
  .visor-aviso{padding:8px 14px;font-size:.9rem;font-weight:600}
  .visor-aviso.encontrado{background:#E7F6EC;color:#14532D}
  .visor-aviso.no{background:#FEF3C7;color:#78350F}
  .visor-body{flex:1;overflow:auto;background:#525659;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .visor-body img{max-width:100%;height:auto;background:#fff}
  .pagina{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);outline:4px solid transparent}
  .pagina canvas{display:block;max-width:100%;height:auto}
  .pagina .num{position:absolute;top:6px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.75rem;padding:2px 8px;border-radius:10px}
  .pagina.coincide{outline-color:#22C55E}
  .pagina.coincide .num{background:#16A34A}
  .visor-msj{color:#fff;text-align:center;padding:40px 10px}

  /* Buscador general (solo celular) */
  .buscar-movil{display:none;width:100%;padding:11px 12px;border:1.5px solid #C9D6E2;border-radius:8px;font:inherit;margin-bottom:10px}

  /* ================= CELULAR ================= */
  @media (max-width:700px){
    html,body{font-size:15px}
    .home{padding:24px 14px 40px}
    .logo{width:150px;margin-bottom:16px}
    .home h1{margin-bottom:16px}
    .tiles{grid-template-columns:1fr 1fr;gap:12px}
    .tile{height:104px;font-size:.9rem;gap:8px;padding:0 6px;text-align:center}
    .tile i{font-size:1.6rem}

    .barra-top{padding:10px 12px;gap:10px}
    .barra-top h1{font-size:1.2rem;gap:8px}
    .btn-menu{padding:6px 12px;font-size:.9rem;white-space:nowrap}
    .esc{display:none}
    .cuerpo{padding:12px 10px 150px}
    .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
    .tabs::-webkit-scrollbar{display:none}
    .tab{padding:10px 14px;font-size:.85rem;white-space:nowrap;flex:0 0 auto}
    .card{padding:12px 10px;border-left-width:3px}
    .card-head{font-size:1rem}
    .ayuda{font-size:.82rem}
    .buscar-movil{display:block}
    .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
    .chip{flex:0 0 auto}

    /* Las tablas se ven como tarjetas, una por fila */
    .tabla-wrap{border:none;max-height:none;overflow:visible}
    table{min-width:0}
    table,tbody,tr,td{display:block;width:100%}
    thead{display:none}
    tbody tr{display:flex;flex-direction:column;border:1px solid #D7DFE9;border-radius:10px;padding:8px 12px;margin-bottom:10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.05)}
    td{border:none;padding:6px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right;font-size:.92rem}
    td::before{content:attr(data-label);font-weight:700;font-size:.72rem;color:#6B7280;text-align:left;text-transform:uppercase;letter-spacing:.03em;flex:0 0 auto}
    td:empty{display:none}
    td.dom{order:-1;font-size:1.02rem;border-bottom:1px dashed #E3E8EF;padding-bottom:8px;margin-bottom:2px}
    td.vacio{display:block;text-align:center}
    td.vacio::before{content:none}
    tbody tr:has(td.vacio){border:none;box-shadow:none;background:none}
    .doc{white-space:normal;justify-content:flex-end}
    .btn-ver{padding:8px 12px}

    .barra-sel{padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
    .barra-sel .in{gap:6px}
    .barra-sel .cont{flex:1 1 100%;min-width:0;font-size:.88rem}
    .barra-sel .btn{flex:1;padding:10px 6px;font-size:.85rem}

    .fondo{padding:0}
    .modal{border-radius:12px 12px 0 0;align-self:flex-end;max-height:90vh}
    .visor .visor-box{height:100%;border-radius:0}
    .visor-head{padding:8px 10px;gap:8px}
    .visor-head b{flex:1 1 100%;font-size:.95rem;order:-1}
    .visor-head .btn{padding:8px 12px}
    .visor-cerrar{margin-left:auto}
    .visor-body{padding:8px}
  }

  .aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#1F2937;color:#fff;padding:12px 16px;border-radius:8px;max-width:90%;z-index:60}
  .aviso.error{background:var(--danger)}.aviso.ok{background:var(--ok)}
  .cargando{position:fixed;inset:0;background:rgba(243,244,246,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:50;font-weight:700}
  .spin{width:40px;height:40px;border:4px solid #D1D5DB;border-top-color:var(--c1);border-radius:50%;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
</head>

<script>
  // ---------------------------------------------------------------------------
  // Conexión con Apps Script. Si se publica una implementación nueva, cambiar API_URL.

  var API_URL = 'https://script.google.com/macros/s/AKfycbyYVPr6NI9TeIZ0KeCJsUBDAYSs2PWvUjrXx26-lpy-OW1ihWA953I6BkXyEldlhAb0/exec';
  var PIN = '';
  try { PIN = localStorage.getItem('doc_pin') || ''; } catch (e) {}

  function api(accion, args){
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: accion, args: args || [], pin: PIN })
    }).then(function(r){
      if (!r.ok) throw new Error('No se pudo conectar con el servidor (' + r.status + ').');
      return r.json();
    }, function(){
      throw new Error('No se pudo conectar con el servidor. Revisá la conexión a internet.');
    }).then(function(j){
      if (j.ok) return j.data;
      var e = new Error(j.error || 'Error desconocido.');
      e.codigo = j.codigo;
      if (j.codigo) pedirPin(j.codigo === 'PIN_INCORRECTO');
      throw e;
    });
  }

  // Mismo uso que google.script.run: .withSuccessHandler(f).withFailureHandler(g).funcion(args)
  function Llamada(ok, fallo){ this._ok = ok; this._fallo = fallo; }
  Llamada.prototype.withSuccessHandler = function(f){ return new Llamada(f, this._fallo); };
  Llamada.prototype.withFailureHandler = function(f){ return new Llamada(this._ok, f); };
  ['getConfigApp','getDatosAutomotriz','getPersonal','listarCarpeta','descargarDocumento','enviarDocumentos'].forEach(function(fn){
    Llamada.prototype[fn] = function(){
      var ok = this._ok, fallo = this._fallo;
      api(fn, Array.prototype.slice.call(arguments)).then(function(d){ if (ok) ok(d); }, function(e){ if (fallo && !e.codigo) fallo(e); });
    };
  });
  var google = { script: { run: new Llamada() } };

  function pedirPin(incorrecto){
    try { localStorage.removeItem('doc_pin'); } catch (e) {}
    PIN = '';

  function pedir(clave, fn, args){
    if (PRE[clave]) return PRE[clave];
    var p = PRE[clave] = { listo: false, dato: null, error: null, esperando: [] };
    function fin(){ p.listo = true; var l = p.esperando; p.esperando = []; l.forEach(function(f){ f(); }); }
    var r = google.script.run
      .withSuccessHandler(function(d){ p.dato = d; fin(); })
      .withFailureHandler(function(e){ p.error = e; delete PRE[clave]; fin(); });
    r[fn].apply(r, args);
    return p;
  }
  function obtener(clave, fn, args, ok, txt){

  function filtrar(el){

  function pasa(obj){
    return Object.keys(FILTROS).every(function(k){

      if (k === '_todo') {   // buscador del celular: busca en todos los datos de la fila
        return Object.keys(obj).some(function(c){ var v = obj[c]; return typeof v !== 'object' && String(v).toLowerCase().indexOf(q) >= 0; });
      }
      return String(obj[k] || '').toLowerCase().indexOf(q) >= 0;
    });
  }

  function estadoFecha(f){
    if (!f) return '<span class="sin">—</span>';
    var m = f.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);

    var d = new Date(+m[3], +m[2] - 1, +m[1]), hoy = new Date(); hoy.setHours(0,0,0,0);
    var dias = Math.round((d - hoy) / 86400000);
    if (dias < 0) return '<span class="vencido">' + esc(f) + '</span>';
    if (dias <= 30) return '<span class="porvencer">' + esc(f) + '</span>';
    return esc(f);
  }

  /* ---------- Persona -> documentación de su empresa ---------- */
  function sinAcentos(s){ return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  function n(s){ return sinAcentos(s).replace(/[^a-z0-9]/g, ''); }
  function iniciales(s){ return sinAcentos(s).replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(Boolean).map(function(w){ return w[0]; }).join(''); }
  function empresasDe(docs){
    var l = [];
    docs.forEach(function(d){ if (d.empresa && l.indexOf(d.empresa) < 0) l.push(d.empresa); });
    return l;
  }
  // Empresa de la persona -> carpeta (ej.: "LEG S.R.L." -> LEG, "KONTROL DEFENSA ELECTRONICA S.A." -> KDE)
  function carpetaDeEmpresa(empresa, lista){
    var e = n(empresa), ini = iniciales(empresa), mejor = '';
    lista.forEach(function(c){
      var k = n(c);
      if (k && (e.indexOf(k) === 0 || ini.indexOf(k) === 0) && k.length > n(mejor).length) mejor = c;
    });
    return mejor;
  }
  function verDocPersona(i){
    PERSONA = PERSONAL[i];
    obtener('carpeta_' + SEC.id, 'listarCarpeta', [SEC.id], function(d){
      CARPETA[SEC.id] = d;
      EMPRESA_SEL = carpetaDeEmpresa(PERSONA.empresa, empresasDe(d));
      if (!EMPRESA_SEL) aviso('No hay una carpeta de documentación para la empresa ' + PERSONA.empresa + '.', 'error');
      abrirTab('carpeta');
    }, 'Buscando documentación…');
  }
  function quitarPersona(){ PERSONA = null; render(); }
  function elegirEmpresa(i){ EMPRESA_SEL = i < 0 ? '' : empresasDe(CARPETA[SEC.id] || [])[i]; render(); }

  /* ---------- Visor ---------- */
  function ver(id){
    VISOR.id = id;
    $('visor-titulo').textContent = NOMBRES[id] || '';
    $('visor-sel').checked = !!SELEC[id];
    $('visor-aviso').classList.add('hidden');
    $('visor-body').innerHTML = '<div class="visor-msj"><div class="spin" style="margin:0 auto 10px"></div>Abriendo documento…</div>';
    mostrar('visor', true);
    if (ARCHIVOS[id]) return mostrarArchivo(id, ARCHIVOS[id]);
    google.script.run
      .withSuccessHandler(function(r){ ARCHIVOS[id] = r; if (VISOR.id === id) mostrarArchivo(id, r); })
      .withFailureHandler(function(e){ if (VISOR.id === id) $('visor-body').innerHTML = '<div class="visor-msj">' + esc((e && e.message) || String(e)) + '</div>'; })
      .descargarDocumento(SEC.id, id);
  }
  function cerrarVisor(){ VISOR.id = null; mostrar('visor', false); $('visor-body').innerHTML = ''; }

  function bytesDe(b64){
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function mostrarArchivo(id, r){
    var cuerpo = $('visor-body');
    if (/^image\//.test(r.mime)) {
      cuerpo.innerHTML = '<img alt="" src="data:' + r.mime + ';base64,' + r.base64 + '">';
      return;
    }
    if (r.mime !== 'application/pdf') {
      cuerpo.innerHTML = '<div class="visor-msj">Este tipo de archivo no tiene vista previa.<br><br>' +
        '<button class="btn pri" onclick="descargar(VISOR.id)">Descargar</button></div>';
      return;
    }
    cargarPdfJs(function(){
      pdfjsLib.getDocument({ data: bytesDe(r.base64) }).promise.then(function(pdf){
        if (VISOR.id !== id) return;
        cuerpo.innerHTML = '';
        var ancho = Math.min(cuerpo.clientWidth - 32, 900);
        var terminos = PERSONA && SEC.tipo === 'personas' ? terminosPersona(PERSONA) : null;
        var coincidencias = [];
        var p = 1;
        (function pagina(){
          if (VISOR.id !== id) return;
          if (p > pdf.numPages) { if (terminos) avisoBusqueda(coincidencias); return; }
          var nro = p;
          pdf.getPage(nro).then(function(page){
            var base = page.getViewport({ scale: 1 });
            var dpr = window.devicePixelRatio || 1;
            var vp = page.getViewport({ scale: (ancho / base.width) * dpr });
            var div = document.createElement('div'); div.className = 'pagina';
            var cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; cv.style.width = Math.round(vp.width / dpr) + 'px';
            div.appendChild(cv);
            var num = document.createElement('span'); num.className = 'num'; num.textContent = nro + ' / ' + pdf.numPages; div.appendChild(num);
            cuerpo.appendChild(div);
            var tareas = [page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise];
            if (terminos) tareas.push(page.getTextContent().then(function(tc){
              var texto = tc.items.map(function(it){ return it.str; }).join(' ');
              if (contienePersona(texto, terminos)) {
                div.classList.add('coincide');
                if (!coincidencias.length) div.scrollIntoView({ block: 'start' });
                coincidencias.push(nro);
              }
            }));
            Promise.all(tareas).then(function(){ p++; pagina(); });
          });
        })();
      }).catch(function(){ cuerpo.innerHTML = '<div class="visor-msj">No se pudo abrir el PDF.</div>'; });
    });
  }

  function terminosPersona(per){
    var palabras = sinAcentos(per.nombre).split(/[^a-z]+/).filter(function(w){ return w.length >= 3; });
    return { palabras: palabras, cuil: n(per.cuil), dni: n(per.dni) };
  }
  function contienePersona(texto, t){
    var plano = sinAcentos(texto);
    var digitos = plano.replace(/[^0-9]/g, '');
    if (t.cuil && t.cuil.length >= 10 && digitos.indexOf(t.cuil) >= 0) return true;
    if (t.dni && t.dni.length >= 7 && new RegExp('(^|\\D)' + t.dni + '(\\D|$)').test(plano.replace(/[.\s]/g, ''))) return true;
    return t.palabras.length >= 2 && t.palabras.every(function(w){ return plano.indexOf(w) >= 0; });
  }
  function avisoBusqueda(pags){
    var a = $('visor-aviso');
    if (pags.length) {
      a.className = 'visor-aviso encontrado';
      a.textContent = PERSONA.nombre + ' figura en ' + (pags.length === 1 ? 'la página ' + pags[0] + ' (marcada en verde).' : 'las páginas ' + pags.join(', ') + ' (marcadas en verde).');
    } else {
      a.className = 'visor-aviso no';
      a.textContent = 'No se encontró a ' + PERSONA.nombre + ' en este documento. Si es un escaneo (foto), no se puede buscar el texto.';
    }
  }

  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  var pdfJsEsperando = null;
  function cargarPdfJs(cb){
    if (window.pdfjsLib && pdfjsLib.GlobalWorkerOptions.workerSrc) return cb();
    if (pdfJsEsperando) return pdfJsEsperando.push(cb);
    pdfJsEsperando = [cb];
    var sc = document.createElement('script');
    sc.src = PDFJS + 'pdf.min.js';
    sc.onload = function(){
      fetch(PDFJS + 'pdf.worker.min.js').then(function(r){ return r.text(); }).then(function(t){
        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: 'text/javascript' }));
      }).catch(function(){
        pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
      }).then(function(){ var l = pdfJsEsperando; pdfJsEsperando = null; l.forEach(function(f){ f(); }); });
    };
    sc.onerror = function(){ pdfJsEsperando = null; $('visor-body').innerHTML = '<div class="visor-msj">No se pudo cargar el visor de PDF. Probá descargar el documento.</div>'; };
    document.head.appendChild(sc);
  }

  /* ---------- Selección ---------- */
  function marcar(id, si){
    if (!id) return;
    if (si) SELEC[id] = NOMBRES[id] || id; else delete SELEC[id];
    if (VISOR.id === id) $('visor-sel').checked = !!SELEC[id];
    render();
  }
  function marcarVehiculo(dom, si){
    var v = AUTO.vehiculos.filter(function(x){ return x.dominio === dom; })[0];
    v.docs.forEach(function(d){ if (d.id) { if (si) SELEC[d.id] = d.nombre; else delete SELEC[d.id]; } });
    render();
  }
  function limpiarSeleccion(){ SELEC = {}; render(); }
  function idsSel(){ return Object.keys(SELEC); }
  function actualizarBarra(){
    var n = idsSel().length;
    $('sel-info').textContent = n + (n === 1 ? ' documento seleccionado' : ' documentos seleccionados');
    mostrar('barra-sel', n > 0);
  }

  /* ---------- Descargar ---------- */
  function guardarArchivo(res){
    var bin = atob(res.base64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: res.mime }));
    var a = document.createElement('a'); a.href = url; a.download = res.nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
  function descargar(id){
    if (ARCHIVOS[id]) return guardarArchivo(ARCHIVOS[id]);
    llamar('descargarDocumento', [SEC.id, id], function(r){ ARCHIVOS[id] = r; guardarArchivo(r); }, 'Preparando descarga…');
  }
  function descargarSeleccionados(){
    var ids = idsSel(), i = 0;
    (function sig(){
      if (i >= ids.length) { aviso(ids.length === 1 ? 'Documento descargado.' : ids.length + ' documentos descargados.', 'ok'); return; }
      llamar('descargarDocumento', [SEC.id, ids[i]], function(r){ guardarArchivo(r); i++; setTimeout(sig, 400); }, 'Descargando ' + (i + 1) + ' de ' + ids.length + '…');
    })();
  }

  /* ---------- Enviar por mail ---------- */
  function abrirEnvio(){
    $('envio-lista').innerHTML = idsSel().map(function(id){ return '<li>' + esc(SELEC[id]) + '</li>'; }).join('');
    mostrar('ventana-envio', true);
    setTimeout(function(){ ($('envio-nombre').value ? $('envio-correo') : $('envio-nombre')).focus(); }, 50);
  }
  function cerrarEnvio(){ mostrar('ventana-envio', false); }
  function enviar(){
    var nombre = $('envio-nombre').value.trim(), correo = $('envio-correo').value.trim();
    if (!nombre) { aviso('Escribí tu nombre.', 'error'); $('envio-nombre').focus(); return; }
    if (!correo) { aviso('Escribí el correo de destino.', 'error'); $('envio-correo').focus(); return; }
    try { localStorage.setItem('doc_nombre', nombre); } catch (e) {}
    $('btn-enviar').disabled = true;
    cargando(true, 'Enviando correo…');
    google.script.run.withSuccessHandler(function(res){
        cargando(false); $('btn-enviar').disabled = false; cerrarEnvio();
        $('envio-correo').value = ''; $('envio-mensaje').value = '';
        SELEC = {}; render();
        aviso('Correo enviado a ' + res.destinatarios.join(', ') + '.', 'ok');
      }).withFailureHandler(function(e){
        cargando(false); $('btn-enviar').disabled = false; aviso((e && e.message) || String(e), 'error');
      }).enviarDocumentos(SEC.id, idsSel(), correo, $('envio-mensaje').value, nombre);
  }

  // Esc: cierra la ventana de envío; si no está abierta, vuelve al menú.
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (!$('visor').classList.contains('hidden')) { cerrarVisor(); return; }
    if (!$('ventana-envio').classList.contains('hidden')) { cerrarEnvio(); return; }
    if (!$('cargando').classList.contains('hidden')) return;
    if (SEC) volverMenu();
  });

  function arrancar(){
    cargando(true, 'Cargando…');
    api('getConfigApp', []).then(function(cfg){
      cargando(false);
      APP = cfg;
      PRE = {};
      iniciar();
    }, function(e){
      if (e.codigo) return;
      cargando(false);
      aviso(e.message, 'error');
    });
  }
  arrancar();
</script>
</body>
</html>
