<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0C2F7A">
<title>Control de Combustible - DELBEN</title>
<link rel="icon" type="image/png" sizes="64x64" href="/Delben/iconos/combustible-64.png">
<link rel="apple-touch-icon" href="/Delben/iconos/combustible-192.png">
<style>
  html,body{margin:0;padding:0;height:100%;background:#eef2f7;font-family:Arial,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  .aviso{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#0C2F7A}
  .aviso img{width:140px;height:140px;border-radius:28px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
</style>
</head>
<body>
<script>
  /* =====================================================================
     DIRECCIÓN DE LA APP (Apps Script)
     Pegá acá el link /exec de la implementación de la aplicación web
     de Control de Combustible. Es lo único que hay que cambiar en este
     archivo; la APK y el portal abren esta página, así que no hace falta
     volver a armar la APK si cambia el link.
     ===================================================================== */
  const URL_APP = 'https://script.google.com/macros/s/AKfycbywiOUxo2ZDs7uf3V6jaH9im3WecyDUNRm5CzAnbr07cc7ywSnx87Br0QBvtx082xOEUg/exec';

  if (URL_APP) {
    const f = document.createElement('iframe');
    f.src = URL_APP;
    f.allow = 'camera; clipboard-write; fullscreen';
    f.title = 'Control de Combustible';
    document.body.appendChild(f);
  } else {
    document.body.innerHTML =
      '<div class="aviso"><img src="/Delben/iconos/combustible-192.png" alt="Combustible">' +
      '<h2>Control de Combustible</h2><p>La aplicación todavía no está publicada.</p></div>';
  }
</script>
</body>
</html>
