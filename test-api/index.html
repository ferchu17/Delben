<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba API SGI</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 20px}
button{padding:10px 18px;cursor:pointer}
pre{background:#f4f4f4;padding:15px;border-radius:8px;white-space:pre-wrap}
.ok{color:green}.err{color:#b00020}
</style>
</head>
<body>
<h2>Prueba API del SGI</h2>
<p>Esta página solamente prueba el <code>doPost()</code> de la copia de prueba.</p>
<button onclick="probar()">Probar getData</button>
<pre id="resultado">Esperando prueba...</pre>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyc2gJ6TeTk-F3JzmJQ0kFYKqCX1r67VRP_VQhz26JD1HenhaWBcD5JcX4WAwJosWyRgQ/exec";
async function probar(){
  const out=document.getElementById("resultado");
  out.className="";
  out.textContent="Enviando prueba...";
  try{
    const r=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({op:"getData",args:["Usuarios y contraseñas"]})
    });
    const texto=await r.text();
    out.textContent="HTTP "+r.status+"\n\n"+texto;
    out.className=r.ok?"ok":"err";
  }catch(e){
    out.className="err";
    out.textContent="ERROR DE CONEXIÓN:\n\n"+e;
  }
}
</script>
</body>
</html>
