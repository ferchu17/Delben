<style>
  /* v2: diseño fluo (verde lima, cian, fucsia, naranja) sobre fondo oscuro */
  :root { --fondo: #070b16; --panel: #0f1629; --panel2: #141d36; --borde: #24305a; --texto: #e8f0ff; --sub: #8fa3cc;
    --lima: #39ff14; --cian: #00e5ff; --fucsia: #ff2bd6; --naranja: #ff9f1c; --amarillo: #faff00; --rojo: #ff1744; --violeta: #a46bff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: var(--texto); min-height: 100vh;
    background: radial-gradient(1200px 600px at 10% -10%, #00e5ff22, transparent 60%), radial-gradient(900px 500px at 110% 10%, #ff2bd622, transparent 60%),
      radial-gradient(800px 600px at 50% 120%, #39ff1418, transparent 60%), var(--fondo); background-attachment: fixed; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: #070b16e6; backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 5;
    border-bottom: 2px solid transparent; border-image: linear-gradient(90deg, var(--lima), var(--cian), var(--fucsia), var(--naranja)) 1; box-shadow: 0 6px 30px #00e5ff22; }
  header img { height: 42px; width: auto; background: #fff; border-radius: 10px; padding: 3px; box-shadow: 0 0 14px #39ff1466; }
  header .sep { width: 2px; height: 32px; background: linear-gradient(var(--cian), var(--fucsia)); border-radius: 2px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: .5px; background: linear-gradient(90deg, var(--lima), var(--cian) 45%, var(--fucsia));
    -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 22px #00e5ff44; }
  header .esp { flex: 1; }
  header .quien { font-size: 13px; color: var(--texto); text-align: right; font-weight: 600; }
  .btn { border: 1px solid var(--cian); background: transparent; color: var(--cian); border-radius: 10px; padding: 8px 16px; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: .15s; box-shadow: 0 0 10px #00e5ff33 inset; }
  .btn:hover { background: #00e5ff1f; box-shadow: 0 0 16px #00e5ff88; }
  .btn.prim { background: linear-gradient(90deg, var(--lima), var(--cian)); color: #04121c; border: 0; box-shadow: 0 0 18px #39ff1466; }
  .btn.prim:hover { box-shadow: 0 0 26px #39ff14aa; }
  .btn:disabled { opacity: .5; cursor: default; }
  main { padding: 16px 18px; max-width: 1500px; margin: 0 auto; }
  .panel { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--borde); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px;
    box-shadow: 0 8px 30px #0008, 0 0 0 1px #ffffff08 inset; }
  .panel > b { font-size: 15px; color: var(--amarillo); text-shadow: 0 0 10px #faff0066; letter-spacing: .3px; }
  .barra { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  label.campo { display: flex; flex-direction: column; font-size: 12px; color: var(--cian); gap: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
  label.campo input, label.campo select { font-size: 14px; padding: 9px 11px; border: 1px solid var(--borde); border-radius: 10px; min-width: 220px; background: #0a1022; color: var(--texto); outline: none; }
  label.campo input:focus, label.campo select:focus { border-color: var(--lima); box-shadow: 0 0 12px #39ff1455; }
  .sub { color: var(--sub); font-size: 13px; margin: 4px 0; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { border-radius: 16px; padding: 12px 16px; background: var(--panel); border: 1px solid var(--borde); position: relative; overflow: hidden; }
  .kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--c); box-shadow: 0 0 16px var(--c); }
  .kpi .n { font-size: 30px; font-weight: 900; color: var(--c); text-shadow: 0 0 16px var(--c); line-height: 1.1; }
  .kpi .t { font-size: 12px; color: var(--sub); text-transform: uppercase; letter-spacing: .7px; font-weight: 700; }
  .kpi.mal { animation: late 1.1s ease-in-out infinite; border-color: #ff174488; }
  .login { max-width: 380px; margin: 60px auto; text-align: center; border-color: #00e5ff55; box-shadow: 0 0 40px #00e5ff22, 0 0 80px #ff2bd614; }
  .login img { width: 220px; max-width: 80%; background: #fff; border-radius: 14px; padding: 8px 12px; box-shadow: 0 0 24px #39ff1455; }
  .login h2 { margin: 12px 0 2px; color: var(--cian); text-shadow: 0 0 14px #00e5ff88; }
  .login h2 span { color: var(--lima); text-shadow: 0 0 14px #39ff1488; }
  .login input { width: 100%; margin: 6px 0; padding: 11px; font-size: 15px; border: 1px solid var(--borde); border-radius: 10px; background: #0a1022; color: var(--texto); outline: none; }
  .login input:focus { border-color: var(--fucsia); box-shadow: 0 0 12px #ff2bd655; }
  .login .btn { width: 100%; margin-top: 10px; padding: 11px; font-size: 15px; }
  .err { color: var(--rojo); font-size: 14px; min-height: 20px; margin-top: 8px; text-shadow: 0 0 8px #ff174466; }
  .servs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .serv { --c: var(--lima); border: 1px solid #ffffff14; border-left: 5px solid var(--c); background: #0a1022; color: var(--texto); border-radius: 12px; padding: 10px 12px;
    cursor: pointer; font-size: 13px; text-align: left; transition: .15s; box-shadow: -4px 0 14px -6px var(--c); }
  .serv b { display: block; font-size: 14px; color: #fff; margin-bottom: 2px; }
  .serv:nth-child(4n+2) { --c: var(--cian); } .serv:nth-child(4n+3) { --c: var(--violeta); } .serv:nth-child(4n) { --c: var(--naranja); }
  .serv:hover { transform: translateY(-2px); box-shadow: 0 0 18px -2px var(--c); border-color: var(--c); }
  .serv.sinh { --c: #5b6b8f; }
  .serv.mal { --c: var(--rojo); background: #2a0612; color: #ffd0da; border-color: #ff174488; animation: late 1.1s ease-in-out infinite; }
  .serv.noapp { --c: var(--naranja); background: #2a1606; color: #ffe0c2; border-color: #ff910066; }
  @keyframes late { 50% { box-shadow: 0 0 26px 2px #ff1744aa; } }
  .tabla-wrap { overflow: auto; max-height: calc(100vh - 420px); min-height: 220px; border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid #1d2747; padding: 7px 9px; text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; z-index: 1; background: linear-gradient(90deg, #0b3a4a, #3a0b4a); color: var(--cian); text-transform: uppercase; font-size: 11.5px; letter-spacing: .6px; }
  tbody tr:nth-child(even) td { background: #ffffff05; }
  tbody tr:hover td { background: #00e5ff12; }
  tr.hoy td { background: #39ff140f; }
  tr.hoy td:first-child { box-shadow: 3px 0 0 var(--lima) inset; color: var(--lima); font-weight: 700; }
  .tarde { color: var(--rojo); font-weight: 800; text-shadow: 0 0 10px #ff1744; animation: titila 1s steps(2) infinite; }
  @keyframes titila { 50% { opacity: .3; } }
  .lic { color: var(--naranja); font-weight: 700; text-shadow: 0 0 8px #ff9f1c66; }
  .fondo { position: fixed; inset: 0; background: #02040acc; backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal { background: linear-gradient(180deg, #141d36, #0b1124); color: var(--texto); border: 1px solid var(--cian); border-radius: 18px; max-width: 560px; width: 100%; padding: 18px 20px;
    box-shadow: 0 0 40px #00e5ff44; max-height: 90vh; overflow: auto; }
  .modal.ancho { max-width: 820px; }
  .modal .mini { overflow-x: auto; margin: 4px 0 10px; border-radius: 10px; }
  .modal .mini th { position: static; }
  .modal h4 { margin: 14px 0 4px; color: var(--amarillo); font-size: 14px; text-shadow: 0 0 8px #faff0055; }
  .modal h3 { margin: 0 0 10px; color: var(--cian); text-shadow: 0 0 12px #00e5ff88; }
  .modal.alerta { border-color: var(--rojo); box-shadow: 0 0 50px #ff1744aa; animation: late 1.1s ease-in-out infinite; }
  .modal.alerta h3 { color: var(--rojo); text-shadow: 0 0 14px #ff1744; }
  .modal.alerta .btn.prim { background: linear-gradient(90deg, var(--rojo), var(--fucsia)); color: #fff; box-shadow: 0 0 18px #ff1744aa; }
  .modal ul { padding-left: 18px; } .modal li { margin: 4px 0; }
  .modal .pie { text-align: right; margin-top: 14px; }
  .dato { margin: 8px 0; font-size: 14px; }
  .dato span { color: var(--lima); display: inline-block; min-width: 110px; font-weight: 700; }
  a.tel { color: var(--amarillo); font-weight: 800; text-decoration: none; text-shadow: 0 0 8px #faff0066; }
  .estado { font-size: 12px; color: var(--lima); font-weight: 600; }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: linear-gradient(var(--cian), var(--fucsia)); border-radius: 8px; } ::-webkit-scrollbar-track { background: #0a1022; }
  @media (max-width: 700px) { label.campo input, label.campo select { min-width: 150px; } .servs { grid-template-columns: 1fr 1fr; } header h1 { font-size: 16px; } }
</style>
