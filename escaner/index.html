<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escáner SGI</title>
<meta name="theme-color" content="#1d4ed8">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--az:#1d4ed8;--na:#f97316;--tx:#0f172a;--mu:#64748b;--bd:#cbd5e1;--bg:#f1f5f9}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(110deg,var(--na),var(--az));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:1.1rem;margin:0;flex:1}
header button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;padding:6px 10px}
nav{display:flex;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:48px;z-index:4}
nav button{flex:1;border:0;background:none;padding:12px 6px;font-weight:700;color:var(--mu);border-bottom:3px solid transparent;font-size:.92rem}
nav button.on{color:var(--az);border-color:var(--na)}
main{max-width:720px;margin:0 auto;padding:14px 16px 80px}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(15,23,42,.06);margin-bottom:12px}
label{display:block;font-weight:700;font-size:.85rem;margin:8px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:10px;font:inherit;font-size:1rem;background:#fff}
input[readonly]{background:#f8fafc;color:#334155}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;font-size:1rem;color:#fff;background:linear-gradient(90deg,var(--na),var(--az));width:100%;margin-top:12px}
.btn.gris{background:#64748b}.btn.chico{width:auto;padding:8px 12px;font-size:.85rem;margin:0}
#lector{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:60px}
.esc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#fff7ed;border:1.5px solid #fdba74;margin-top:10px}
.esc b{flex:1}
.err{color:#b91c1c;font-weight:700;margin-top:8px}
.ok{color:#15803d;font-weight:700}
.lista .it{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #e2e8f0;font-size:.9rem}
.lista .it span{flex:1}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;margin-top:10px}
.chk input{width:22px;height:22px}
.qr-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eef2f7;font-size:.9rem}
.qr-item input{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;z-index:50;max-width:90vw}
.toast.ver{opacity:1}
#print{display:none}
.ac{position:relative}
.ac-l{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1.5px solid var(--bd);border-radius:10px;margin-top:2px;max-height:260px;overflow:auto;box-shadow:0 8px 20px rgba(15,23,42,.15)}
.ac-l div{padding:10px 12px;border-bottom:1px solid #eef2f7;font-size:.95rem;cursor:pointer}
.ac-l div small{display:block;color:var(--mu);font-size:.8rem}
.ac-l div:hover,.ac-l div.on{background:#eff6ff}
.mfondo{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.mcaja{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mcaja h3{margin:0 0 8px}.mcaja .bot{display:flex;gap:8px;margin-top:14px}.mcaja .bot .btn{margin:0}
@media print{
  body{background:#fff}
  header,nav,main,.toast{display:none!important}
  #print{display:block}
  @page{size:A4;margin:8mm}
  .et{display:inline-flex;align-items:center;gap:2mm;width:63mm;height:29mm;padding:2mm;border:0.2mm dashed #999;vertical-align:top;overflow:hidden;page-break-inside:avoid}
  .et .q{width:25mm;height:25mm;flex:0 0 25mm}
  .et .q img,.et .q canvas{width:25mm!important;height:25mm!important}
  .et .n{font:bold 9pt Arial;line-height:1.15;word-break:break-word}
  .et .n small{display:block;font:8pt Arial;color:#333;margin-top:1mm}
}
</style>
