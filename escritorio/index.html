<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escritorio DELBEN</title>
<link rel="icon" type="image/png" sizes="64x64" href="/Delben/iconos/escritorio-64.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1a4a">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
/* =====================================================================
   ESCRITORIO DELBEN — cada persona ve las apps de su perfil (administración ve todo)
   - Se entra una sola vez (usuario y clave del SGI).
   - Cada app se abre en una ventana emergente que se mueve, agranda, minimiza y queda abierta.
   - SGI, Novedades del Personal y la Minuta Operativa entran solas, sin volver a poner la clave.
   - La lista de apps sale de acceso/apps.js (la misma del Portal de acceso): una app nueva aparece sola acá.
   - Botón Compartir: link, instructivo y APK de cada app por WhatsApp, correo o copiar.
   ===================================================================== */
:root{--head:'Rajdhani',sans-serif;--body:'Source Sans 3',sans-serif;--barra:58px;--tareas:50px;--txt:#0f172a;--txt2:#475569}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--body);color:var(--txt);background:#0b1430}
[hidden]{display:none!important}
button,input{font:inherit}
button{cursor:pointer}
/* Fondo con color */
.fondo{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(135deg,#0b1a4a 0%,#14306e 40%,#1b1f5e 100%)}
.fondo i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:flota 22s ease-in-out infinite alternate}
.fondo i:nth-child(1){width:520px;height:520px;background:#06b6d4;left:-120px;top:-140px}
.fondo i:nth-child(2){width:460px;height:460px;background:#ec4899;right:-120px;top:10%;animation-delay:-6s}
.fondo i:nth-child(3){width:520px;height:520px;background:#22c55e;left:25%;bottom:-260px;animation-delay:-11s;opacity:.4}
.fondo i:nth-child(4){width:380px;height:380px;background:#f59e0b;right:18%;bottom:-120px;animation-delay:-3s;opacity:.45}
.fondo i:nth-child(5){width:340px;height:340px;background:#8b5cf6;left:40%;top:-120px;animation-delay:-15s}
@keyframes flota{to{transform:translate(60px,40px) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.fondo i{animation:none}}

/* Ingreso */
#vLogin{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.login{width:100%;max-width:390px;background:rgba(255,255,255,.97);border-radius:22px;padding:28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.4);position:relative;overflow:hidden}
.login::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#06b6d4,#8b5cf6,#ec4899,#f59e0b,#22c55e)}
.login img{width:210px;max-width:80%;display:block;margin:0 auto 6px}
.login h1{font-family:var(--head);text-align:center;letter-spacing:3px;font-size:1.6rem;text-transform:uppercase;background:linear-gradient(90deg,#2563eb,#9333ea,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent}
.login p{text-align:center;color:var(--txt2);font-size:.93rem;margin:2px 0 16px}
.campo{display:block;font-weight:600;font-size:.88rem;margin-bottom:12px}
.campo input{display:block;width:100%;margin-top:4px;padding:11px 12px;border:2px solid #dbe3f0;border-radius:12px;font-size:1rem}
.campo input:focus{outline:none;border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.18)}
.btn-ok{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#2563eb,#9333ea,#db2777);color:#fff;font-weight:700;font-size:1.05rem;box-shadow:0 8px 20px rgba(147,51,234,.35)}
.btn-ok:disabled{opacity:.6}
.error{color:#b91c1c;font-size:.88rem;min-height:1.2em;margin-top:10px;text-align:center}

/* Escritorio */
#vEsc{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.barra{height:var(--barra);flex:0 0 var(--barra);display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(8,15,40,.72);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.12);color:#fff;z-index:5}
.marca{display:flex;align-items:center;gap:9px;font-family:var(--head);font-weight:700;letter-spacing:1.5px;font-size:1.15rem;white-space:nowrap}
.marca img{width:34px;height:34px;border-radius:9px;background:#fff;padding:2px}
.marca b{background:linear-gradient(90deg,#67e8f9,#c4b5fd,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:5px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
.tab{--c:#fff;display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#e2e8f0;padding:7px 12px;border-radius:11px;font-weight:700;white-space:nowrap;font-size:.92rem;transition:.15s}
.tab i{color:var(--c)}
.tab:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.tab.on{background:var(--c);color:#fff;border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 55%,transparent)}
.tab.on i{color:#fff}
.buscar{position:relative;flex:0 1 250px}
.buscar input{width:100%;padding:8px 12px 8px 34px;border-radius:11px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff}
.buscar input::placeholder{color:#cbd5e1}
.buscar input:focus{outline:none;background:rgba(255,255,255,.2);border-color:#67e8f9}
.buscar i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#67e8f9}
.quien{font-size:.85rem;text-align:right;line-height:1.15;white-space:nowrap}
.quien small{display:block;color:#c4b5fd}
.icb{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;width:38px;height:36px}
.icb:hover{background:#ef4444;border-color:#ef4444}
.escritorio{flex:1;position:relative;overflow:hidden}
.panel{position:absolute;inset:0;overflow:auto;padding:22px 22px calc(var(--tareas) + 26px)}
.hola{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px;color:#fff}
.hola h2{font-family:var(--head);font-size:1.8rem;letter-spacing:1px}
.hola h2 span{background:linear-gradient(90deg,#67e8f9,#f9a8d4,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hola p{color:#cbd5e1;max-width:760px;font-size:.95rem}
.kbd{display:inline-block;padding:0 6px;border-radius:5px;background:rgba(255,255,255,.15);font-size:.8rem;font-weight:700}
.recientes{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 18px}
.chip{display:flex;align-items:center;gap:7px;border:0;border-radius:30px;padding:6px 13px 6px 6px;color:#fff;font-weight:700;font-size:.86rem;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 4px 12px rgba(0,0,0,.25);transition:.15s}
.chip:hover{transform:translateY(-2px) scale(1.03)}
.chip .mini{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:.75rem}
.chip .mini img{width:100%;height:100%;object-fit:cover}
.grupo{margin-bottom:24px}
.grupo h3{font-family:var(--head);font-size:1.15rem;letter-spacing:1.5px;text-transform:uppercase;color:#fff;margin:0 0 10px;display:flex;align-items:center;gap:9px}
.grupo h3 i{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--c);font-size:.9rem;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 55%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.app{position:relative;display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:18px;padding:14px 14px;min-height:92px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 22px color-mix(in srgb,var(--a) 40%,transparent);transition:transform .15s,box-shadow .15s;overflow:hidden;animation:entra .35s ease both}
.app::after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.app:hover,.app:focus-visible{transform:translateY(-3px) scale(1.015);box-shadow:0 14px 30px color-mix(in srgb,var(--a) 55%,transparent);outline:none}
.app:active{transform:scale(.98)}
.app .ic{flex:0 0 52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.95);color:var(--a);font-size:1.45rem;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.18);z-index:1}
.app .ic img{width:100%;height:100%;object-fit:cover}
.app .tx{z-index:1;flex:1;min-width:0;padding-right:22px}
.app b{display:block;font-size:1rem;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.app small{display:block;color:rgba(255,255,255,.92);font-size:.8rem;line-height:1.25;margin-top:2px}
.app .tag{display:inline-block;margin-top:5px;font-size:.68rem;font-weight:700;padding:1px 8px;border-radius:20px;background:rgba(255,255,255,.95);color:#15803d}
.app .tag.pide{color:#b45309}
.app .comp{position:absolute;right:8px;top:8px;z-index:2;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:.82rem;transition:.15s}
.app .comp:hover{background:#fff;color:var(--a);transform:scale(1.1)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
.vacio-b{color:#e2e8f0;background:rgba(255,255,255,.08);border-radius:14px;padding:18px;text-align:center}

/* Pestaña Compartir */
.lista-comp{display:grid;gap:12px}
.fila-comp{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:rgba(255,255,255,.96);border-radius:16px;padding:12px 14px;border-left:7px solid var(--a);box-shadow:0 6px 16px rgba(0,0,0,.2)}
.fila-comp .ic{width:42px;height:42px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}
.fila-comp .ic img{width:100%;height:100%;object-fit:cover}
.fila-comp .nom{flex:1 1 200px;font-weight:700}
.fila-comp .nom small{display:block;font-weight:400;color:var(--txt2)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:0;border-radius:20px;padding:6px 12px;font-weight:700;font-size:.82rem;color:#fff;display:flex;align-items:center;gap:6px;transition:.12s}
.pill.wa{background:#22c55e}.pill.ml{background:#2563eb}.pill.cp{background:#7c3aed}.pill.sh{background:#f97316}
.pill:hover{filter:brightness(1.1);transform:translateY(-1px)}

/* Ventana de compartir */
.capa{position:fixed;inset:0;background:rgba(5,10,30,.55);backdrop-filter:blur(3px);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:abre .18s ease}
.modal .mh{display:flex;align-items:center;gap:12px;padding:16px 18px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}
.modal .mh .ic{width:44px;height:44px;border-radius:12px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--a);font-size:1.2rem}
.modal .mh .ic img{width:100%;height:100%;object-fit:cover}
.modal .mh h3{flex:1;font-family:var(--head);font-size:1.3rem;letter-spacing:.5px}
.modal .mh button{border:0;background:rgba(255,255,255,.25);color:#fff;width:34px;height:34px;border-radius:50%}
.modal .mb{padding:16px 18px;display:grid;gap:12px}
.item-comp{border:2px solid #eef2f7;border-radius:14px;padding:10px 12px}
.item-comp b{display:flex;align-items:center;gap:8px;font-size:.95rem}
.item-comp b i{color:var(--a)}
.item-comp code{display:block;font-size:.78rem;color:var(--txt2);word-break:break-all;margin:4px 0 8px}
.modal .todo{border-color:#fde68a;background:#fffbeb}

/* Ventanas emergentes */
.ventana{position:absolute;display:flex;flex-direction:column;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);border:2px solid color-mix(in srgb,var(--a) 70%,#fff);min-width:320px;min-height:200px;animation:abre .18s ease}
@keyframes abre{from{opacity:0;transform:scale(.96)}}
.ventana.activa{border-color:var(--a);box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 3px color-mix(in srgb,var(--b) 55%,transparent)}
.ventana.max{position:fixed;left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border:0}
body.vmax .tareas,body.vmax .barra{visibility:hidden}
.ventana.min{display:none}
.vtit{flex:0 0 40px;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;background:linear-gradient(90deg,var(--a),var(--b));color:#fff;cursor:move;user-select:none;touch-action:none;filter:saturate(.75) brightness(.92);transition:filter .15s}
.ventana.activa .vtit{filter:none}
.vtit .vic{width:26px;height:26px;border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex:0 0 26px;background:#fff;color:var(--a)}
.vtit .vic img{width:100%;height:100%;object-fit:cover}
.vtit .vnom{flex:1;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.vtit button{width:32px;height:28px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-size:.85rem;margin-left:2px}
.vtit button:hover{background:rgba(255,255,255,.35)}
.vtit button.x:hover{background:#dc2626}
.vcuerpo{flex:1;position:relative;background:#f8fafc}
.vcuerpo iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.vcarga{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#334155;font-weight:700;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 12%,#fff),color-mix(in srgb,var(--b) 12%,#fff))}
.vcarga .rueda{width:46px;height:46px;border-radius:50%;border:5px solid color-mix(in srgb,var(--a) 25%,#fff);border-top-color:var(--a);border-right-color:var(--b);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.vredim{position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,var(--a) 50%,var(--a) 62%,transparent 62%,transparent 72%,var(--b) 72%,var(--b) 84%,transparent 84%)}
.ventana.max .vredim{display:none}
body.arrastrando iframe{pointer-events:none}

/* Barra de tareas */
.tareas{position:absolute;left:0;right:0;bottom:0;height:var(--tareas);display:flex;align-items:center;gap:7px;padding:0 10px;background:rgba(8,15,40,.86);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.12);z-index:99990;overflow-x:auto;scrollbar-width:thin}
.tareas .inicio{border:0;background:linear-gradient(90deg,#06b6d4,#8b5cf6);color:#fff;border-radius:11px;padding:8px 13px;font-weight:700;white-space:nowrap;box-shadow:0 4px 12px rgba(139,92,246,.4)}
.tarea{display:flex;align-items:center;gap:7px;max-width:250px;border:2px solid var(--a);background:rgba(255,255,255,.06);color:#e2e8f0;border-radius:11px;padding:5px 11px;white-space:nowrap;font-size:.85rem;font-weight:600;transition:.15s}
.tarea:hover{background:rgba(255,255,255,.14)}
.tarea span{overflow:hidden;text-overflow:ellipsis}
.tarea .mini{width:20px;height:20px;border-radius:5px;background:#fff;color:var(--a);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:.7rem;flex:0 0 20px}
.tarea .mini img{width:100%;height:100%;object-fit:cover}
.tarea.activa{background:linear-gradient(90deg,var(--a),var(--b));border-color:transparent;color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--a) 55%,transparent)}
.tarea.min{opacity:.6;font-style:italic}
.tareas .vacio{color:#94a3b8;font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(var(--tareas) + 14px);transform:translateX(-50%) translateY(20px);background:linear-gradient(90deg,#7c3aed,#db2777);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:100001;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.ver{opacity:1;transform:translateX(-50%) translateY(0)}
/* Modo pestañas (como Chrome): cada app abierta es una pestaña arriba */
.icb.modo{width:auto;padding:0 10px;font-weight:700;font-size:.82rem;display:flex;align-items:center;gap:6px}
.icb.modo:hover,.icb.inst:hover{background:rgba(255,255,255,.2);border-color:#67e8f9}
.icb.inst{width:auto;padding:0 12px;font-weight:700;font-size:.82rem;display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,#22c55e,#06b6d4);border-color:transparent}
.btn-inst{width:100%;margin-top:10px;padding:11px;border:2px dashed #a78bfa;border-radius:12px;background:#f5f3ff;color:#6d28d9;font-weight:700}
body.modo-pestanas .tareas{top:0;bottom:auto;height:46px;padding:7px 8px 0;align-items:flex-end;gap:3px;border-top:0;border-bottom:3px solid var(--tabact,#8b5cf6);background:rgba(8,15,40,.94)}
body.modo-pestanas .tareas .inicio{border-radius:12px 12px 0 0;padding:9px 14px;box-shadow:none;opacity:.85}
body.modo-pestanas .tareas .inicio.on{opacity:1;background:linear-gradient(90deg,#f59e0b,#f97316)}
body.modo-pestanas .tarea{border:0;border-radius:12px 12px 0 0;padding:8px 8px 8px 11px;min-width:130px;max-width:230px;background:color-mix(in srgb,var(--a) 34%,#0b1430);color:#e2e8f0;box-shadow:none;font-style:normal;opacity:1}
body.modo-pestanas .tarea:hover{background:color-mix(in srgb,var(--a) 55%,#0b1430)}
body.modo-pestanas .tarea.activa{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;padding-bottom:10px}
.tarea .cerrar{margin-left:auto;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;opacity:.75;flex:0 0 20px}
.tarea .cerrar:hover{background:rgba(255,255,255,.3);opacity:1}
.tareas .mas{border:0;background:transparent;color:#cbd5e1;width:34px;height:32px;border-radius:9px;font-size:1rem;margin-bottom:3px}
.tareas .mas:hover{background:rgba(255,255,255,.14);color:#fff}
.tareas .acciones{margin-left:auto;display:flex;gap:4px;margin-bottom:5px;padding-left:8px}
.tareas .acciones button{border:0;width:34px;height:30px;border-radius:9px;background:rgba(255,255,255,.1);color:#fff}
.tareas .acciones button:hover{background:rgba(255,255,255,.28)}
body.modo-pestanas .panel{padding-top:68px;padding-bottom:22px}
body.modo-pestanas .ventana:not(.max){left:0!important;top:46px!important;width:100%!important;height:calc(100% - 46px)!important;border-radius:0;border:0;box-shadow:none;animation:none}
body.modo-pestanas .ventana:not(.activa){display:none}
body.modo-pestanas .ventana .vtit,body.modo-pestanas .vredim{display:none}
@media (max-width:1500px){.quien{display:none}.buscar{flex-basis:200px}.icb.modo span,.icb.inst span{display:none}.icb.modo,.icb.inst{width:38px;padding:0;justify-content:center}}
@media (max-width:900px){.buscar{flex-basis:160px}}
@media (max-width:760px){
  .marca b,.buscar{display:none}
  .ventana:not(.max){left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--tareas))!important;border-radius:0}
  .vredim,.vtit .bmax,.vtit .bext{display:none}
}
</style>
</head>
<body>
<div class="fondo"><i></i><i></i><i></i><i></i><i></i></div>

<div id="vCargando" style="position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700"><i class="fa-solid fa-spinner fa-spin" style="margin-right:8px"></i>Cargando…</div>

<form id="vLogin" hidden autocomplete="on">
  <div class="login">
    <img src="delben-logo.webp" alt="Delben">
    <h1>Escritorio</h1>
    <p>Entrás una sola vez y abrís todas las aplicaciones en ventanas.</p>
    <label class="campo">Usuario<input id="lUsuario" autocomplete="username" required></label>
