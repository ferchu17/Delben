<style>
  :root { --azul: #1040a0; --azul2: #1e6fc8; --fondo: #eef3fb; --borde: #d5deec; --texto: #1f2a3d; --sub: #5b6b86; --verde: #15803d; --rojo: #b91c1c; --amarillo: #a16207; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--fondo); color: var(--texto); }
  header { background: linear-gradient(90deg, var(--azul), var(--azul2)); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header small { opacity: .85; }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 14px; padding: 14px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 12px; }
  .lista { max-height: calc(100vh - 170px); overflow: auto; margin-top: 8px; }
  .srv { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; font: inherit; color: inherit; }
  .srv:hover { background: #f2f6fd; }
  .srv.act { background: #e3edfc; border-color: #9fbbe8; }
  .srv b { display: block; font-size: 14px; }
  .srv span { font-size: 12px; color: var(--sub); }
  .ok { color: var(--verde); } .falta { color: var(--amarillo); }
  input, select { font: inherit; padding: 7px 9px; border: 1px solid var(--borde); border-radius: 8px; background: #fff; color: inherit; }
  input[type=search] { width: 100%; }
  .btn { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: #e7edf7; color: var(--azul); }
  .btn.prim { background: var(--azul2); color: #fff; }
  .btn.peligro { background: #fde8e8; color: var(--rojo); }
  .btn:disabled { opacity: .6; cursor: default; }
  h2 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--sub); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border-bottom: 1px solid #edf1f7; padding: 6px 5px; text-align: left; vertical-align: middle; font-size: 14px; }
  th { font-size: 12px; color: var(--sub); text-transform: uppercase; letter-spacing: .03em; }
  td input.puesto { width: 140px; } td input.cant { width: 60px; } td input.obs { width: 100%; min-width: 120px; } td input[type=time] { width: 105px; }
  .dias { display: flex; flex-wrap: wrap; gap: 3px; }
  .dia { border: 1px solid var(--borde); background: #fff; border-radius: 6px; padding: 3px 6px; font-size: 12px; cursor: pointer; user-select: none; }
  .dia.on { background: var(--azul2); color: #fff; border-color: var(--azul2); }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .resumen { margin-top: 14px; overflow-x: auto; }
  .resumen td, .resumen th { text-align: center; }
  .dif { color: var(--rojo); font-weight: 700; }
  .vacio { padding: 30px; text-align: center; color: var(--sub); }
  .fondo { position: fixed; inset: 0; background: rgba(15, 30, 60, .45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal { background: #fff; border-radius: 14px; padding: 20px; max-width: 460px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 8px; color: var(--azul); }
  .modal .pie { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1f2a3d; color: #fff; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
  .toast.ver { opacity: 1; }
