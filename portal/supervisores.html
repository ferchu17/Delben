<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Supervisores · DELBEN</title>
<link rel="icon" type="image/png" sizes="64x64" href="/Delben/iconos/sgi-64.png">
<link rel="apple-touch-icon" href="/Delben/iconos/sgi-192.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
/* =====================================================================
   PORTAL DE SUPERVISORES — las apps de trabajo (sin DelBen Domótica ni Mansión Sombranegra).
   Es una copia de portal/index.html: si se agrega una app de trabajo allá, agregarla también acá.
   Para agregar, sacar o cambiar una app, se edita SOLO la lista APPS
   que está al final de este archivo (en el <script>).
   ===================================================================== */
:root{
  --font-head:'Rajdhani',sans-serif;
  --font-body:'Source Sans 3',sans-serif;
  --text:#111827;
  --text2:#4b5563;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{min-height:100%;background:linear-gradient(180deg,#bcd9f7 0%,#8ec4f5 40%,#63aeff 100%) #63aeff;}
body{
  font-family:var(--font-body);
  color:var(--text);
  min-height:100vh;
  padding:0 20px 40px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.header{text-align:center;margin:18px 0 6px;}
.logo{
  width:320px;max-width:72vw;height:auto;display:block;margin:0 auto;
  mix-blend-mode:multiply;
}
.titulo{
  font-family:var(--font-head);font-weight:700;font-size:1.5rem;
  letter-spacing:3px;text-transform:uppercase;color:#0c3078;
  margin-top:4px;
}
.subtitulo{color:#1f3b63;font-size:.95rem;margin-top:2px;}

.buscar{
  width:100%;max-width:1100px;margin:18px 0 18px;
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.92);border-radius:50px;
  padding:10px 18px;box-shadow:0 4px 16px rgba(0,0,0,.15);
}
.buscar i{color:#4b5563;}
.buscar input{
  flex:1;border:none;outline:none;background:transparent;
  font-family:var(--font-body);font-size:1rem;color:var(--text);
}

.grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:18px;
  width:100%;max-width:1100px;
}
.app{
  display:flex;flex-direction:column;border-radius:12px;overflow:hidden;
  background:linear-gradient(135deg,var(--a),var(--b));
  box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15);
  transition:transform .15s,box-shadow .15s,filter .15s;
}
.app:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 36px rgba(0,0,0,.5);filter:brightness(1.08);}
.app-main{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:26px 14px 16px;text-align:center;text-decoration:none;color:#fff;
}
.app-main i{font-size:2.1rem;text-shadow:0 2px 6px rgba(0,0,0,.4);}
.app-main h2{
  font-family:var(--font-head);font-size:1.15rem;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 2px 6px rgba(0,0,0,.5);
}
.app-main p{font-size:.88rem;line-height:1.3;opacity:.92;}
.app-actions{
  display:flex;gap:6px;padding:10px;background:rgba(0,0,0,.18);
  border-top:1px solid rgba(255,255,255,.18);flex-wrap:wrap;justify-content:center;
}
.accion{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:50px;cursor:pointer;
  background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.8);
  color:#fff;font-family:var(--font-body);font-weight:700;font-size:.82rem;
  text-decoration:none;white-space:nowrap;transition:background .15s;
}
.accion:hover{background:rgba(255,255,255,.32);}
.accion.apk{background:#fff;color:#1a7a40;border-color:#fff;}
.accion.apk:hover{background:#e8fff0;}
.accion.wsp{background:#25d366;border-color:#25d366;}
.accion.guia{background:#ffd60a;border-color:#ffd60a;color:#3a2a00;}
.accion.guia:hover{background:#ffe45c;}
.instr{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:8px 16px;border-radius:50px;background:#fff;color:#0c3078;font-weight:700;text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.accion.wsp:hover{background:#1ebe5b;}

.vacio{display:none;color:#0c3078;font-weight:600;margin-top:20px;}
.footer{margin-top:36px;color:#1f3b63;font-size:.82rem;letter-spacing:1px;text-align:center;}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);
  background:#111827;color:#fff;padding:10px 20px;border-radius:50px;
  font-weight:600;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.35);
  transition:transform .25s,opacity .25s;z-index:50;opacity:0;pointer-events:none;
}
.toast.ver{transform:translateX(-50%) translateY(0);opacity:1;}

@media (max-width:1000px){.grid{grid-template-columns:repeat(3,1fr);gap:14px;}}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,1fr);gap:10px;}.logo{width:230px;}}
@media (max-width:440px){
  body{padding:0 16px 32px;}
  .grid{grid-template-columns:1fr;}
  .app-main{flex-direction:row;justify-content:flex-start;text-align:left;padding:16px 14px;gap:14px;}
  .app-main i{font-size:1.8rem;width:40px;text-align:center;flex-shrink:0;}
  .logo{width:190px;}
  .titulo{font-size:1.25rem;}
}
</style>
</head>

<script>
/* =====================================================================
   LISTA DE APLICACIONES
   - nombre:      lo que se ve en la tarjeta
   - descripcion: una línea corta
   - icono:       nombre del ícono de Font Awesome (fontawesome.com/icons)
   - link:        dirección de la app (las de este repositorio van con ../)
   - apk:         (opcional) link de descarga de la APK. Las APK se guardan en la
                  carpeta portal/apk/ del repositorio (nombre sin espacios).
                  La de Informe de Novedades usa el link fijo que arma GitHub solo.
   - color1/2:    colores del degradé de la tarjeta (mismos que el menú de SGI)
   Para agregar una app nueva, copiá una línea y cambiá los datos.
   ===================================================================== */
const APPS = [
  { nombre:'DELBEN SGI',            descripcion:'Sistema de Gestión Integral',               icono:'fa-solid fa-gauge-high',     link:'../sgi/',                  color1:'#1040a0', color2:'#1e6fc8',
    apk:'apk/DelbenSGI.apk' },
  { nombre:'Novedades del Personal', descripcion:'Planillas de cobertura y novedades',        icono:'fa-solid fa-calendar-check', link:'../novedades/',            color1:'#5a1a7a', color2:'#8a30b0' },
  { nombre:'Informe de Novedades',  descripcion:'Informes con fotos, PDF y envío por mail',  icono:'fa-solid fa-file-pen',       link:'../informe-de-novedades/', color1:'#1a7a40', color2:'#2db865',
    apk:'https://github.com/ferchu17/Delben/releases/download/informe-novedades-apk/InformeNovedades.apk' },
  { nombre:'Minuta Operativa del Servicio', descripcion:'Minuta diaria de cada servicio: presentismo, novedades, fotos y PDF', icono:'fa-solid fa-clipboard-check', link:'../minuta-operativa/', color1:'#1F3864', color2:'#2E5597',
    apk:'https://github.com/ferchu17/Delben/releases/download/minuta-operativa-apk/MinutaOperativa.apk' },
  { nombre:'Control de Móviles',    descripcion:'Control de vehículos con fotos e informe',  icono:'fa-solid fa-car-side',       link:'../',                      color1:'#1a4a7a', color2:'#2060b0',
    apk:'apk/Moviles.apk' },
  { nombre:'Cargos del Personal',   descripcion:'Entrega y devolución de indumentaria',      icono:'fa-solid fa-shirt',          link:'../cargos/',               color1:'#2a4a7a', color2:'#3a70c0',
    apk:'apk/Cargos.apk' },
  { nombre:'Licencias del Personal', descripcion:'Vacaciones, enfermedad y demás licencias con firma', icono:'fa-solid fa-file-signature', link:'../licencias/', color1:'#6B2D5C', color2:'#8E3B7A',
    apk:'https://github.com/ferchu17/Delben/releases/download/licencias-apk/Licencias.apk' },
  { nombre:'Documentación',         descripcion:'Automotriz, ART y Seguro de vida',          icono:'fa-solid fa-folder-open',    link:'../documentacion/',        color1:'#6b4a1a', color2:'#a07030',
    apk:'apk/Documentacion.apk' },
  { nombre:'Datos Personales',      descripcion:'Ficha de datos del personal',               icono:'fa-solid fa-id-card',        link:'../datos-personal.html',   color1:'#1a4a3a', color2:'#307060',
    apk:'apk/DatosPersonal.apk' },
  { nombre:'Combustible',           descripcion:'Fondos, tickets y rendición de combustible', icono:'fa-solid fa-gas-pump',       link:'../combustible/',          color1:'#a0141e', color2:'#d42a2a',
    apk:'https://github.com/ferchu17/Delben/releases/download/combustible-apk/Combustible.apk' }
];

/* Instructivo interactivo de cada app (carpeta instructivos/ del repositorio) */
const INSTRUCTIVOS = {
  'DELBEN SGI':'../instructivos/sgi.html', 'Novedades del Personal':'../instructivos/novedades.html',
  'Informe de Novedades':'../instructivos/informe.html', 'Minuta Operativa del Servicio':'../instructivos/minuta.html', 'Control de Móviles':'../instructivos/moviles.html',
  'Cargos del Personal':'../instructivos/cargos.html', 'Licencias del Personal':'../instructivos/licencias.html', 'Documentación':'../instructivos/documentacion.html',
  'Datos Personales':'../instructivos/datos-personales.html', 'Combustible':'../combustible/ayuda.html',
  'Mansión Sombranegra':'../instructivos/mansion.html', 'DelBen Domótica':'../instructivos/domotica.html'
};
APPS.forEach(a => { if (!a.guia && INSTRUCTIVOS[a.nombre]) a.guia = INSTRUCTIVOS[a.nombre]; });

/* En la PC (con mouse) las apps se abren en una pestaña nueva y el portal queda abierto.
   En el celular se abren en la misma pantalla. */
const conMouse = window.matchMedia('(pointer:fine)').matches;

function linkCompleto(l){ try{ return new URL(l, location.href).href; }catch(e){ return l; } }
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function dibujar(){
  const destino = conMouse ? ' target="_blank" rel="noopener"' : '';
  document.getElementById('grid').innerHTML = APPS.map((a, i) => `
    <article class="app" data-buscar="${esc((a.nombre + ' ' + a.descripcion).toLowerCase())}"
             style="--a:${a.color1};--b:${a.color2}">
      <a class="app-main" href="${esc(a.link)}"${destino}>
        <i class="${esc(a.icono)}"></i>
        <div><h2>${esc(a.nombre)}</h2><p>${esc(a.descripcion)}</p></div>
      </a>
      <div class="app-actions">
        <a class="accion" href="${esc(a.link)}"${destino}><i class="fa-solid fa-arrow-up-right-from-square"></i>Abrir</a>
        ${a.apk ? `<a class="accion apk" href="${esc(a.apk)}" download><i class="fa-brands fa-android"></i>Descargar APK</a>` : ''}
        ${a.guia ? `<a class="accion guia" href="${esc(a.guia)}"${destino}><i class="fa-solid fa-book-open"></i>Instructivo</a>` : ''}
        <button class="accion wsp" type="button" onclick="compartir(${i})"><i class="fa-brands fa-whatsapp"></i>WhatsApp</button>
        <button class="accion" type="button" onclick="copiar(${i})"><i class="fa-regular fa-copy"></i>Copiar link</button>
      </div>
    </article>`).join('');
}

function copiar(i){
  const url = linkCompleto(APPS[i].link);
  const listo = () => avisar('Link copiado: ' + APPS[i].nombre);
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(url).then(listo).catch(() => copiarViejo(url, listo));
  } else { copiarViejo(url, listo); }
}
function copiarViejo(url, listo){
  const t = document.createElement('textarea');
  t.value = url; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); listo(); } catch(e){ prompt('Copiá este link:', url); }
  t.remove();
}

/* Compartir por WhatsApp: arma el mensaje con el link de descarga de la APK
   (si tiene) y el link para abrirla desde el navegador. */
function compartir(i){
  const a = APPS[i];
  let texto = '*' + a.nombre + '* - DELBEN';
  if (a.apk) texto += '\n\nDescargá e instalá la app:\n' + linkCompleto(a.apk);
  texto += '\n\nAbrir desde el navegador:\n' + linkCompleto(a.link);
  if (a.guia) texto += '\n\nInstructivo paso a paso:\n' + linkCompleto(a.guia);
  window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
}

let tAviso;
function avisar(texto){
  const el = document.getElementById('toast');
  el.textContent = texto; el.classList.add('ver');
  clearTimeout(tAviso); tAviso = setTimeout(() => el.classList.remove('ver'), 2200);
}

document.getElementById('filtro').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  let visibles = 0;
  document.querySelectorAll('.app').forEach(c => {
    const ok = !q || c.dataset.buscar.includes(q);
    c.style.display = ok ? '' : 'none';
    if (ok) visibles++;
  });
  document.getElementById('vacio').style.display = visibles ? 'none' : 'block';
});

dibujar();
</script>
