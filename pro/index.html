<style>
  /* DELBEN Pro · v2026.11.09d · Control: servicios que todavía no usan la app */
  :root { --fondo:#f4f6fb; --panel:#fff; --texto:#0f172a; --suave:#64748b; --borde:#e2e8f0; --azul:#1040a0; --azul2:#1e6fc8; --rojo:#dc2626; --verde:#15803d; --ambar:#b45309; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif; background: var(--fondo); color: var(--texto); font-size: 14px; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: linear-gradient(90deg, var(--azul), var(--azul2)); color: #fff; position: sticky; top: 0; z-index: 5; }
  header .marca { font-weight: 700; font-size: 17px; letter-spacing: .3px; }
  header .marca span { font-weight: 500; opacity: .8; font-size: 12px; margin-left: 6px; padding: 2px 8px; border: 1px solid rgba(255,255,255,.5); border-radius: 20px; }
  header nav { display: flex; gap: 4px; margin-left: 18px; flex-wrap: wrap; }
  header nav button { background: transparent; border: 0; color: #fff; opacity: .8; padding: 8px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
  header nav button.act, header nav button:hover { opacity: 1; background: rgba(255,255,255,.16); }
  header .yo { margin-left: auto; text-align: right; font-size: 12px; line-height: 1.3; }
  header .yo b { font-size: 13px; }
  header .salir { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 20px; margin: 4px 0 4px; }
  .sub { color: var(--suave); font-size: 13px; }
  .tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 16px; }
  .tarj { background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; padding: 16px; cursor: pointer; transition: .15s; }
  .tarj:hover { border-color: var(--azul2); box-shadow: 0 6px 18px rgba(16,64,160,.1); }
  .tarj .n { font-size: 28px; font-weight: 700; color: var(--azul); }
  .tarj .t { font-weight: 600; margin-top: 2px; }
  .tarj.pronto { cursor: default; opacity: .7; }
  .barra { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; align-items: center; }
  input, select { font: inherit; padding: 8px 10px; border: 1px solid var(--borde); border-radius: 8px; background: #fff; }
  input[type=search] { min-width: 260px; flex: 1; max-width: 420px; }
  .tabla { background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--suave); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--borde); background: #f8fafc; position: sticky; top: 0; white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #f8fbff; }
  .chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; color: #fff; }
  .est-ACTIVO { color: var(--verde); font-weight: 600; } .est-BAJA { color: var(--suave); }
  .codigo { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--azul); }
  .vacio { padding: 30px; text-align: center; color: var(--suave); }
  .fondo { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow: auto; }
  .modal { background: #fff; border-radius: 16px; max-width: 860px; width: 100%; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal h2 { margin: 0 0 2px; font-size: 18px; } .modal h3 { font-size: 14px; margin: 18px 0 6px; color: var(--azul); }
  .pie { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn { background: var(--azul); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .centro { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
  .caja { background: #fff; border: 1px solid var(--borde); border-radius: 16px; padding: 28px; max-width: 420px; text-align: center; }
  .caja a { color: var(--azul); font-weight: 600; }
  /* Control de Presentismo */
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin: 14px 0; }
  .kpi { background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 12px 14px; }
  .kpi .n { font-size: 26px; font-weight: 700; } .kpi .t { font-size: 12px; color: var(--suave); font-weight: 600; }
  .kpi.mal { border-color: var(--rojo); background: #fef2f2; cursor: pointer; animation: late 1.2s infinite; } .kpi.mal .n { color: var(--rojo); }
  @keyframes late { 50% { box-shadow: 0 0 0 4px rgba(220,38,38,.25); } }
  .servs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .sv { background: #fff; border: 1px solid var(--borde); border-left: 5px solid var(--verde); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .sv.mal { border-left-color: var(--rojo); background: #fff7f7; } .sv.noapp { border-left-color: #ea580c; background: #fff7ed; } .sv.nada { border-left-color: #cbd5e1; }
  .sv b { display: block; font-size: 13px; } .sv .sub { font-size: 12px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 20px; background: #eef2ff; color: var(--azul); margin: 2px 4px 0 0; }
  .tag.mal { background: #fee2e2; color: var(--rojo); } .tag.ok { background: #dcfce7; color: var(--verde); }
  @media (max-width: 720px) { header { flex-wrap: wrap; } header nav { margin-left: 0; order: 3; width: 100%; } input[type=search] { min-width: 0; width: 100%; } }
</style>
