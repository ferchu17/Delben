<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" sizes="64x64" href="/Delben/iconos/presentismo-64.png">
<link rel="apple-touch-icon" href="/Delben/iconos/presentismo-192.png">
<base target="_top">
<meta charset="utf-8">
<style>
:root{--bg:#eef6f5;--top:#0b3b3c;--pri:#0f766e;--pri2:#5eead4;--ok:#15803d;--lic:#b45309;--err:#b91c1c;--tx:#10201f;--mut:#5b6b6a;--line:#d5e4e2;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.top{background:#fff;color:var(--top);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;border-bottom:4px solid var(--pri);box-shadow:0 2px 10px rgba(11,59,60,.08)}
.marca{display:flex;align-items:center;gap:12px}
.marca img{height:52px;width:auto;display:block}
.marca span{font-weight:800;font-size:14px;line-height:1.15;color:var(--pri);border-left:2px solid var(--line);padding-left:12px}
#reloj{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--top)}
@media (max-width:420px){.marca img{height:42px}.marca span{font-size:12px;padding-left:8px}#reloj{font-size:20px}}
.vista{max-width:560px;margin:0 auto;padding:16px}
.vista.ancha{max-width:1200px}
.hide{display:none!important}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(11,59,60,.08);margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:17px}
label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:14px 0 6px}
label.sm{margin:8px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
select:disabled{background:#f3f8f7;color:var(--tx);opacity:1;font-weight:700}
input[type=time]{font-size:20px;font-weight:700;text-align:center}
#vDni{font-size:32px;text-align:center;letter-spacing:4px;font-weight:800;padding:16px}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
.btn.ok{background:var(--ok)}.btn.gris{background:#e2ebe9;color:var(--tx)}.btn.err{background:var(--err)}.btn.chico{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.grande{width:100%;font-size:22px;padding:20px;margin-top:20px;border-radius:14px;letter-spacing:1px}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;color:var(--tx)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.link{background:none;border:0;color:var(--pri);font:inherit;font-weight:600;text-decoration:underline;width:100%;padding:14px;cursor:pointer}
.aviso{background:#fff7ed;color:var(--lic);border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:700}
.mut{color:var(--mut)}
.fila{display:flex;gap:10px;flex-wrap:wrap}
.fila>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hs{margin-top:8px;font-weight:700;color:var(--pri)}
/* inicio */
.inicio h2{margin:6px 0 18px;text-align:center;color:var(--top);font-size:22px}
.btnrol{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;font:inherit;cursor:pointer;color:var(--tx);box-shadow:0 2px 10px rgba(11,59,60,.06)}
.btnrol .ic{flex:0 0 54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff}
.btnrol b{display:block;font-size:19px}
.btnrol small{color:var(--mut);font-size:14px}
.btnrol.vig .ic{background:var(--ok)}.btnrol.enc .ic{background:var(--pri)}.btnrol.sup .ic{background:var(--top)}
/* panel */
.barra{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.barra b{font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:#dcebe8;color:var(--tx);padding:10px 16px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--pri);color:#fff}
/* desplegable con buscador */
.combo{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:20;border:1.5px solid var(--pri);border-radius:10px;margin-top:4px;max-height:340px;overflow:auto;background:#fff;box-shadow:0 10px 24px rgba(11,59,60,.18)}
.sug .grp{background:#e6f4f2;color:var(--pri);font-size:12px;font-weight:800;padding:6px 12px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}
.sug .op{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sug .op:hover,.sug .op.act{background:#f0faf8}
.sug .op.ya{opacity:.45}
.sug small{display:block;color:var(--mut)}
.sug .pad{padding:12px}
/* lista para informar */
.pend{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;background:#fbfefd}
.pend.conerror{border-color:var(--err);background:#fff7f7}
.pcab{display:flex;align-items:flex-start;gap:8px}
.pcab>div{flex:1}
.pcab small{display:block;color:var(--mut)}
.x{border:0;background:#e2ebe9;border-radius:8px;width:32px;height:32px;font-weight:800;cursor:pointer;flex:0 0 32px}
.pcampos{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(90px,.8fr) minmax(90px,.8fr) minmax(160px,2fr);gap:8px;margin-top:8px}
.pcampos.lic{grid-template-columns:minmax(120px,1.2fr) minmax(150px,1fr) minmax(160px,2fr)}
.pcampos input,.pcampos select{padding:9px;font-size:15px}
.pcampos input[type=time]{font-size:16px}
@media (max-width:620px){.pcampos,.pcampos.lic{grid-template-columns:1fr 1fr}.pcampos .tipo,.pcampos .obs{grid-column:1/-1}}
.perr{color:var(--err);font-weight:700;margin-top:8px;font-size:14px}
.perr input{margin-top:4px;max-width:160px}
.reg{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.reg:last-child{border-bottom:0}
.reg .nom{font-weight:700}
.reg small{color:var(--mut);display:block;margin-top:2px}
.reg.anulado .nom{text-decoration:line-through;color:var(--mut)}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.b-pres{background:#dcfce7;color:var(--ok)}.b-lic{background:#ffedd5;color:var(--lic)}.b-anu{background:#e5e7eb;color:#4b5563}.b-auto{background:#e0f2fe;color:#0369a1}
.tablaWrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--top);color:#fff;text-align:left;padding:8px;white-space:nowrap;position:sticky;top:0}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:800;background:#e6f4f2;border-top:2px solid var(--pri)}
tr.anulado td{color:#9ca3af;text-decoration:line-through}
.resumen{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.resumen div{background:#f0faf8;border-radius:10px;padding:8px 12px;font-weight:700}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.qr{text-align:center}
.qr img{width:190px;height:190px;margin:8px auto;display:block}
.qr input{font-size:12px;padding:8px}
/* overlays */
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:50;color:#fff}
.overlay.ok{background:var(--ok)}
.overlay .check{font-size:96px;line-height:1;font-weight:900}
.overlay h2{font-size:28px;margin:12px 0 6px}
.overlay p{font-size:20px;margin:4px 0}
.overlay .btn{margin-top:24px;background:#fff;color:var(--ok);font-size:18px;padding:14px 40px}
.modalbg{position:fixed;inset:0;background:rgba(5,25,25,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:460px;max-height:88vh;overflow:auto}
.modal h3{margin:0 0 10px}
.modal .fila{margin-top:16px}
.grandeNom{font-size:22px;font-weight:800;margin:6px 0}
#carga{position:fixed;inset:0;background:rgba(255,255,255,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60;font-weight:700;color:var(--top)}
.spin{width:46px;height:46px;border:5px solid #cfe5e1;border-top-color:var(--pri);border-radius:50%;animation:g .8s linear infinite;margin-bottom:12px}
@keyframes g{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--top);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:70;max-width:92%;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.err{background:var(--err)}#toast.ok{background:var(--ok)}

/* ===== Colores con más vida (verde y azul del logo de Delben) ===== */
:root{--verde:#2e9d3a;--verde2:#7cc242;--azul:#1565c0;--azul2:#3b8fe8;--celeste:#0ea5c6;--violeta:#7c3aed;--naranja:#ea7a12;--amarillo:#f5b301;--noche:#3730a3}
body{background:linear-gradient(160deg,#e8f7ee 0%,#eef6fb 55%,#f3effd 100%) fixed}
.top{border-bottom:0;box-shadow:0 2px 12px rgba(21,101,192,.12)}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:5px;background:linear-gradient(90deg,var(--verde),var(--verde2),var(--celeste),var(--azul))}
.marca span{background:linear-gradient(90deg,var(--verde),var(--azul));-webkit-background-clip:text;background-clip:text;color:transparent}
#reloj{background:linear-gradient(135deg,var(--verde),var(--azul));color:#fff;padding:4px 12px;border-radius:12px;font-size:20px}
.card{border-top:5px solid var(--pri)}
.card.c-verde{border-top-color:var(--verde)}.card.c-azul{border-top-color:var(--azul)}.card.c-violeta{border-top-color:var(--violeta)}.card.c-naranja{border-top-color:var(--naranja)}
.card h3{color:var(--top)}
.inicio h2{background:linear-gradient(90deg,var(--verde),var(--azul));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:26px}
.btnrol{border:0;border-left:6px solid var(--pri);transition:transform .12s,box-shadow .12s}
.btnrol:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(11,59,60,.14)}
.btnrol.vig{border-left-color:var(--verde)}.btnrol.enc{border-left-color:var(--celeste)}.btnrol.sup{border-left-color:var(--violeta)}
.btnrol.vig .ic{background:linear-gradient(135deg,var(--verde),var(--verde2))}
.btnrol.enc .ic{background:linear-gradient(135deg,var(--celeste),var(--azul))}
.btnrol.sup .ic{background:linear-gradient(135deg,var(--violeta),var(--azul2))}
.btn{background:linear-gradient(135deg,var(--celeste),var(--azul));box-shadow:0 3px 10px rgba(21,101,192,.22)}
.btn.ok{background:linear-gradient(135deg,var(--verde),var(--verde2));box-shadow:0 3px 10px rgba(46,157,58,.28)}
.btn.err{background:linear-gradient(135deg,#dc2626,#f97316)}
.btn.gris{background:#e7eef6;box-shadow:none}
.btn.grande.ok{font-size:24px;box-shadow:0 6px 18px rgba(46,157,58,.35)}
.chip{border-color:#cfe0f2}
.chip.on{background:linear-gradient(135deg,var(--celeste),var(--azul));border-color:transparent}
.hs{display:inline-block;background:linear-gradient(90deg,#fff6d6,#e3e6ff);color:var(--top);padding:6px 12px;border-radius:999px}
input:focus,select:focus,textarea:focus{border-color:var(--azul2);box-shadow:0 0 0 3px rgba(59,143,232,.15)}
.tab{background:#fff;border:2px solid #dbe6f3}
.tab[data-tab=tCargar].on{background:linear-gradient(135deg,var(--verde),var(--verde2));border-color:transparent}
.tab[data-tab=tBuscar].on{background:linear-gradient(135deg,var(--celeste),var(--azul));border-color:transparent}
.tab[data-tab=tQR].on{background:linear-gradient(135deg,var(--violeta),var(--azul2));border-color:transparent}
.sug{border-color:var(--azul2)}
.sug .grp{background:linear-gradient(90deg,#e3f6e5,#e3eefc);color:var(--azul)}
.sug .op:hover{background:#eef6ff}
.pend{border:0;border-left:6px solid var(--azul2);background:#fff;box-shadow:0 2px 8px rgba(21,101,192,.10)}
.pend.conerror{border-left-color:var(--err);background:#fff6f6}
.pcampos .obs{background:#fffbea;border-color:#f3dd8f}
.resumen div{background:#eef6ff;color:var(--azul)}
.resumen .t-pres{background:#e3f7e6;color:var(--verde)}
.resumen .t-lic{background:#fff0e0;color:var(--naranja)}
.resumen .t-dia{background:#fff6d6;color:#9a6a00}
.resumen .t-dia::before{content:'☀ '}
.resumen .t-noc{background:#e6e8ff;color:var(--noche)}
.resumen .t-noc::before{content:'☾ '}
.resumen .t-tot{background:linear-gradient(135deg,var(--celeste),var(--azul));color:#fff}
th{background:linear-gradient(135deg,var(--top),#12507a)}
tfoot td{background:#e9f2ff;border-top-color:var(--azul)}
.badge.b-pres{background:#d6f5db}.badge.b-auto{background:#dbeafe;color:var(--azul)}
.overlay.ok{background:linear-gradient(160deg,var(--verde),#159a7c 60%,var(--azul))}
.mini{display:inline-block;width:14px;height:14px;border:3px solid #cfe0f2;border-top-color:var(--azul);border-radius:50%;animation:g .8s linear infinite;vertical-align:-2px}

/* ==== Pestañas de colores vivos · Presentismo: cada pestaña tiene su color; la que se usa queda llena con su degradé ==== */
.tabs .tab:nth-child(10n+1){--tv1:#2563eb;--tv2:#06b6d4}
.tabs .tab:nth-child(10n+2){--tv1:#db2777;--tv2:#f472b6}
.tabs .tab:nth-child(10n+3){--tv1:#16a34a;--tv2:#84cc16}
.tabs .tab:nth-child(10n+4){--tv1:#ea580c;--tv2:#f59e0b}
.tabs .tab:nth-child(10n+5){--tv1:#7c3aed;--tv2:#a855f7}
.tabs .tab:nth-child(10n+6){--tv1:#0d9488;--tv2:#2dd4bf}
.tabs .tab:nth-child(10n+7){--tv1:#dc2626;--tv2:#fb7185}
.tabs .tab:nth-child(10n+8){--tv1:#ca8a04;--tv2:#facc15}
.tabs .tab:nth-child(10n+9){--tv1:#4f46e5;--tv2:#818cf8}
.tabs .tab:nth-child(10n+10){--tv1:#0891b2;--tv2:#22d3ee}
.tabs .tab{background:color-mix(in srgb,var(--tv1) 13%,#fff)!important;color:color-mix(in srgb,var(--tv1) 85%,#000)!important;border-color:color-mix(in srgb,var(--tv1) 40%,#fff)!important;border-top:3px solid var(--tv1)!important;transition:transform .15s,box-shadow .15s,background .15s!important}
.tabs .tab:hover{background:color-mix(in srgb,var(--tv1) 24%,#fff)!important;transform:translateY(-1px)}
.tabs .tab.on,.tabs .tab.on:hover{background:linear-gradient(135deg,var(--tv1),var(--tv2))!important;color:#fff!important;border-color:transparent!important;box-shadow:0 4px 14px color-mix(in srgb,var(--tv1) 55%,transparent)!important;transform:translateY(-2px);text-shadow:0 1px 2px rgba(0,0,0,.25)}
</style>
<script src="config.js?v=c7b17deba1"></script>
<script src="puente.js?v=fbf6339ef7"></script>
</head>
<body>

<header class="top">
  <div class="marca"><img id="logoTop" alt="Delben"><span>Presentismo<br>de servicios</span></div>
  <div id="reloj"></div>
</header>


<main id="vInicio" class="vista inicio">
  <h2>¿Cómo querés ingresar?</h2>
  <button class="btnrol vig" onclick="mostrar('vVig')"><span class="ic">✓</span><span><b>Ingresar como vigilador</b><small>Dar presente con tu DNI y ver tus presentes</small></span></button>
  <button class="btnrol enc" onclick="irLogin('encargado')"><span class="ic">👥</span><span><b>Ingresar como encargado</b><small>Informar el personal del servicio</small></span></button>
  <button class="btnrol sup" onclick="irLogin('supervisor')"><span class="ic">🔍</span><span><b>Ingresar como supervisor</b><small>Buscador de presentes</small></span></button>
</main>


<main id="vVig" class="vista hide">
  <div class="card c-verde">
    <label>Servicio</label>
    <select id="vServ"></select>
    <div id="vAviso" class="aviso hide"></div>
    <label>Tu horario</label>
    <div class="chips" id="vChips">
      <button type="button" class="chip" data-e="06:00" data-s="18:00">06 a 18</button>
      <button type="button" class="chip" data-e="18:00" data-s="06:00">18 a 06</button>
    </div>
    <div class="grid2">
      <div><label class="sm">Entrada</label><input type="time" id="vEnt"></div>
      <div><label class="sm">Salida</label><input type="time" id="vSal"></div>
    </div>
    <div id="vHs" class="hs"></div>
    <label>Tu DNI</label>
    <input id="vDni" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="Sin puntos" autocomplete="off">
    <button id="vBtn" class="btn grande ok">DAR PRESENTE</button>
    <button id="vMisBtn" class="btn gris" style="width:100%;margin-top:10px">Ver mis presentes</button>
  </div>
  <button class="link" onclick="mostrar('vInicio')">Volver al inicio</button>
</main>


<main id="vMis" class="vista ancha hide">
  <div class="card c-azul">
    <h3 id="misNom"></h3>
    <div class="mut" id="misSub"></div>
    <div class="resumen" id="misTot"></div>
    <div class="tablaWrap"><table id="misTabla"></table></div>
  </div>
  <button class="link" onclick="mostrar('vVig')">Volver</button>
</main>


<main id="vLogin" class="vista hide">
  <div class="card">
    <h3 id="lTit">Ingresar</h3>
    <label>Usuario</label>
    <input id="lUsu" autocomplete="username" autocapitalize="off">
    <label>Contraseña</label>
    <input id="lPass" type="password" autocomplete="current-password">
    <button id="lBtn" class="btn grande">INGRESAR</button>
  </div>
  <button class="link" onclick="mostrar('vInicio')">Volver al inicio</button>
</main>


<main id="vPanel" class="vista ancha hide">
  <div class="barra">
    <div><b id="pNombre"></b><div class="mut" id="pRol"></div></div>
    <button class="btn gris chico" onclick="salir()">Salir</button>
  </div>
  <div class="tabs">
    <button class="tab" data-tab="tCargar">Informar presentes</button>
    <button class="tab" data-tab="tBuscar">Buscador de presentes</button>
    <button class="tab sup" data-tab="tQR">QR de servicios</button>
  </div>

  
  <section id="tCargar" class="hide">
    <div class="card c-verde">
      <div class="grid">
        <div><label>Servicio</label><select id="cServ"></select></div>
        <div><label>Fecha que se informa</label><input type="date" id="cFecha"></div>
      </div>
      <label>Horario que se pone al agregar a alguien</label>
      <div class="chips" id="cChips">
        <button type="button" class="chip" data-e="06:00" data-s="18:00">06 a 18</button>
        <button type="button" class="chip" data-e="18:00" data-s="06:00">18 a 06</button>
      </div>
      <div class="grid2" style="max-width:380px">
        <div><label class="sm">Entrada</label><input type="time" id="cEnt"></div>
        <div><label class="sm">Salida</label><input type="time" id="cSal"></div>
      </div>
    </div>

    <div class="card c-azul">
      <h3>Agregar personal</h3>
      <div class="combo">
        <input id="cBusca" autocomplete="off" placeholder="Tocá acá para ver el personal o escribí apellido o DNI">
        <div id="cSug" class="sug hide"></div>
      </div>
      <h3 style="margin-top:18px">Para informar <span id="pCant" class="mut"></span></h3>
      <div id="pLista"></div>
      <div class="fila" style="margin-top:14px">
        <button class="btn" id="pGuardar">Guardar</button>
        <button class="btn ok" id="pEnviar">Guardar y enviar correo</button>
      </div>
    </div>

    <div class="card c-violeta">
      <div class="barra" style="margin:0">
        <h3 style="margin:0">Ya informados el <span id="dFecha"></span></h3>
        <button class="btn gris chico" id="dEnviar">Enviar correo al servicio</button>
      </div>
      <div class="resumen" id="dTot"></div>
      <div id="dLista"></div>
    </div>
  </section>

  
  <section id="tBuscar" class="hide">
    <div class="card c-azul">
