<style>
:root{--r:#C71C22;--rd:#8E1217;--g:#6B6D70;--bg:#EEF0F2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);font-family:"Helvetica Neue",Arial,sans-serif;color:#1d1d1f;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-print-color-adjust:exact}
.app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#f3f1f1;position:relative;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.12)}
.top{background:linear-gradient(135deg,var(--r) 0%,var(--r) 62%,var(--rd) 100%);color:#fff;padding:18px 18px 70px;display:flex;align-items:center;justify-content:space-between}
.top img{height:54px;border-radius:8px;box-shadow:0 0 0 3px #fff;display:block}
.top .t{text-align:right;font-weight:800;font-size:17px;line-height:1.15}.top .t small{display:block;font-weight:500;font-size:12px;opacity:.92;letter-spacing:.04em}
.foto{width:132px;height:164px;margin:-52px auto 0;border-radius:14px;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.25);background:#e9e6e6;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;position:relative;z-index:2}
.foto img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.foto svg{width:86%}
.nom{text-align:center;font-weight:800;font-size:22px;letter-spacing:.01em;margin:14px 16px 8px;line-height:1.15;position:relative;z-index:2}
.est{display:flex;justify-content:center;position:relative;z-index:2}.est span{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:99px;font-weight:700;font-size:13px;letter-spacing:.06em}
.est .ok{background:#e3f4e8;color:#14703a}.est .no{background:#fde4e4;color:#b01a1a}.est .sin{background:#fff1d6;color:#8a5a00}
.est i{width:9px;height:9px;border-radius:50%;background:currentColor;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px 14px 12px;position:relative;z-index:2}
.cd{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.07);min-width:0}.cd.full{grid-column:1/3}
.cd i{display:block;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--r);text-transform:uppercase;margin-bottom:3px}.cd b{display:block;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.vig{grid-column:1/3;display:flex;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);overflow:hidden}.vig div{flex:1;text-align:center;padding:10px 6px}.vig div+div{border-left:1px solid #e6e1e1}.vig i{display:block;font-style:normal;font-size:10px;letter-spacing:.1em;color:var(--g);font-weight:700;margin-bottom:3px}.vig b{font-size:16px}.vig .v b{color:var(--r)}
.pie{margin-top:auto;background:var(--r);color:#fff;text-align:center;padding:14px 12px calc(14px + env(safe-area-inset-bottom));font-size:13px;line-height:1.5;position:relative;z-index:2}.pie b{font-size:14px;letter-spacing:.03em}.pie span{display:block;opacity:.9;font-size:11px}
.marca{position:absolute;inset:0;z-index:3;pointer-events:none;background-repeat:repeat}
.app,.app *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.msg{padding:60px 24px;text-align:center;font-size:16px;color:#444;line-height:1.5}.msg b{display:block;font-size:20px;margin-bottom:8px;color:#1d1d1f}
.vel{position:fixed;inset:0;background:#fff;z-index:99;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--r);font-weight:800;font-size:18px}
body.oculto .vel{display:flex}body.oculto .app{visibility:hidden}
@media print{body{display:none!important}}
</style>
