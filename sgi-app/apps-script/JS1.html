<script>

function cargarUltimasConexiones(){
var lista=document.getElementById('lista-conexiones');
if(!lista)return;
lista.innerHTML='<div style="color:var(--text2,#999)"><i class="fas fa-spinner fa-spin"></i> Cargando...</div>';
google.script.run
.withSuccessHandler(function(data){
if(!lista)return;
if(!data||!data.length){
lista.innerHTML='<div style="color:var(--text2,#999);font-size:.78rem">Sin datos de conexiones</div>';
return;
}
data.sort(function(a,b){
if(!b.ultimaConexion)return -1;
if(!a.ultimaConexion)return 1;
return b.ultimaConexion>a.ultimaConexion?1:-1;
});
lista.innerHTML=data.slice(0,12).map(function(u){
var conn=u.ultimaConexion?_fmtConn(u.ultimaConexion):'Sin registro';
var isMe=SESSION&&u.usuario===SESSION.usuario;
var dot=isMe
?'<span style="color:#2db865;font-size:.6rem">*</span>'
:'<span style="color:#bbb;font-size:.6rem">*</span>';
return'<div style="padding:5px 0;border-bottom:1px solid var(--border,#eee)">'
+dot+' <strong style="font-size:.8rem">'+escH(u.nombre||u.usuario)+'</strong>'
+' <span style="color:var(--text2,#888);font-size:.68rem">('+escH(u.rol)+')</span>'
+'<br><span style="color:var(--text2,#aaa);font-size:.67rem;padding-left:10px">'+escH(conn)+'</span>'
+'</div>';
}).join('');
})
.withFailureHandler(function(e){
if(lista)lista.innerHTML='<div style="color:#b71c1c;font-size:.75rem">Error al cargar</div>';
})
.getUltimasConexiones();
}
function _fmtConn(iso){
try{
var d=new Date(iso);
if(isNaN(d.getTime()))return String(iso);
var now=new Date(),diff=Math.floor((now-d)/60000);
if(diff<1)return 'Ahora mismo';
if(diff<60)return 'Hace '+diff+' min';
if(diff<1440)return 'Hace '+Math.floor(diff/60)+' h';
if(diff<10080)return 'Hace '+Math.floor(diff/1440)+' d';
return fmtFecha(d.toISOString().split('T')[0]);
}catch(ex){return String(iso);}
}

function rowsToObjects(sn,rows){
if(!rows||!Array.isArray(rows)||rows.length<1)return[];
if(rows.length<2)return[];
var shHdr=rows[0];
if(!shHdr||!Array.isArray(shHdr))return[];
if(sn==='precios'){
var hdrs=shHdr.map(function(h){return String(h||'');});
_preciosHeaders=hdrs;
return rows.slice(1).filter(function(r){return r[0]!==null&&r[0]!==undefined&&r[0]!=='';}).map(function(r){
var obj={};hdrs.forEach(function(h,i){obj[h]=r[i]!==null&&r[i]!==undefined?r[i]:'';});return obj;
});
}
if(sn==='movileros'){
// Igual criterio que "precios": la hoja "Movileros" no tiene un esquema
// fijo en HEADERS, así que se toman sus columnas tal cual están escritas
// en la fila 1 de la hoja real. Además se guarda en cada objeto __row
// con el número de fila REAL de la hoja (no la posición en este array),
// para poder tildar una fila con total seguridad aunque haya filas en
// blanco de por medio o la lista esté filtrada en pantalla.
var mHdrs=shHdr.map(function(h){return String(h||'');});
_movHeaders=mHdrs;
var out=[];
for(var ri=1;ri<rows.length;ri++){
var row=rows[ri];
var blank=row.every(function(c){return c===null||c===undefined||c==='';});
if(blank)continue;
var mobj={};
mHdrs.forEach(function(h,i){mobj[h]=row[i]!==null&&row[i]!==undefined?row[i]:'';});
mobj.__row=ri+1; // rows[0]=encabezados=fila 1, rows[1]=fila 2, etc.
out.push(mobj);
}
return out;
}
var intern=HEADERS[sn]||[];
var colMap={};var usedMapped={};
shHdr.forEach(function(h,i){
if(h===null||h===undefined)return;
var raw=String(h).toLowerCase().trim();
var mapped=HA[raw];
if(!mapped)mapped=HA[raw.replace(/\s+/g,'')];
if(!mapped)mapped=HA[raw.replace(/_/g,' ')];
if(mapped==='_skip')return;
if(mapped&&intern.indexOf(mapped)>=0){
if(!usedMapped[mapped]){colMap[i]=mapped;usedMapped[mapped]=true;}else if(i<intern.length){colMap[i]=intern[i];}
return;
}
if(mapped&&i<intern.length){colMap[i]=intern[i];return;}
if(mapped){colMap[i]=mapped;return;}
var directMatch=intern.indexOf(raw);
if(directMatch>=0){colMap[i]=intern[directMatch];return;}
if(i<intern.length)colMap[i]=intern[i];
});
return rows.slice(1).filter(function(r){
var first=r[0];
if(first===null||first===undefined||first==='')return false;
var s=String(first);
if(s.indexOf('__')>=0||s.indexOf('=A')>=0)return false; // skip formula rows
return true;
}).map(function(row){
var obj={};
intern.forEach(function(h){obj[h]='';});
Object.keys(colMap).forEach(function(i){
var f=colMap[i];
var v=row[parseInt(i)];
if(v!==undefined&&v!==null&&v!==''){
if(f==='id'||f==='nro')obj[f]=parseInt(v)||0;
else obj[f]=v;
}
});
if(sn==='listadooc'){
obj.id=parseInt(obj.oc||obj.id||0)||0;
if(obj.items){
var itemStr=String(obj.items);
if(itemStr.indexOf('|')>=0){
var parts=itemStr.split(';').filter(function(p){return p.trim();});
var descs=parts.map(function(p){
var cols=p.split('|');
return cols.length>=3?cols[2].trim():cols[cols.length-1].trim();
}).filter(function(d){return d;});
obj.items=descs.join(', ');
}
}
obj.precio=cleanNum(obj.precio);
obj.total=cleanNum(obj.total);
obj.conIva=cleanNum(obj.conIva);
obj.ivaFactura=cleanNum(obj.ivaFactura);
obj.totalFactura=cleanNum(obj.totalFactura);
} else {
if(obj.id!==undefined&&obj.id!=='')obj.id=parseInt(obj.id)||0;
}
if(sn==='quienRetira'){
if(!obj.nombre&&obj['nombre_y_apellido'])obj.nombre=obj['nombre_y_apellido'];
}
if((sn==='imputacionOC'||sn==='concepto'||sn==='condicion')&&!obj.nombre){
if(row&&row[1]!==undefined&&row[1]!==null&&row[1]!=='')obj.nombre=String(row[1]);
}
if(sn==='familia'){
if(!obj.nombre&&obj.familia)obj.nombre=obj.familia;
}
if(sn==='objetivos'&&!obj.nombre&&obj.objetivo)obj.nombre=obj.objetivo;
if(sn==='empresas'&&!obj.nombre&&obj.empresa)obj.nombre=obj.empresa;
return obj;
});
}

return v.toLowerCase().indexOf(val)>=0;
});
});
var st=DB.sortState[key];
if(st&&st.col>=0){
var campo=fm[st.col];
data.sort(function(a,b){
var av=campo?String(a[campo]||''):String(Object.values(a)[st.col]||'');
var bv=campo?String(b[campo]||''):String(Object.values(b)[st.col]||'');

});
return data;
}

function calcPrecioTotal(){
var e=parseFloat(document.getElementById('inv-existencia').value)||0;
var p=parseFloat(document.getElementById('inv-precio').value)||0;
var v=parseFloat(document.getElementById('inv-iva').value)||0;
var pIva=p*(1+v/100);
document.getElementById('inv-precio-iva').value=fmt$(pIva);
document.getElementById('inv-precio-total').value=fmt$(e*pIva);
}
function guardarInventario(){
var cod=document.getElementById('inv-codigo').value.trim();var items=document.getElementById('inv-items').value.trim();
if(!cod||!items){alert('C\u00F3digo e \u00CDtems son obligatorios');return;}
var e=parseFloat(document.getElementById('inv-existencia').value)||0;
var p=parseFloat(document.getElementById('inv-precio').value)||0;
var v=parseFloat(document.getElementById('inv-iva').value)||0;
var ex=null;for(var i=0;i<DB.inventario.length;i++){if(DB.inventario[i].codigo===cod){ex=DB.inventario[i];break;}}
if(ex){ex.items=items;ex.familia=document.getElementById('inv-familia').value;ex.existencia=e;ex.precio=p;ex.iva=v;ex.precioIva=p*(1+v/100);ex.precioTotal=e*p*(1+v/100);}
else DB.inventario.push({id:nextId(DB.inventario),codigo:cod,items:items,familia:document.getElementById('inv-familia').value,existencia:e,precio:p,iva:v,precioIva:p*(1+v/100),precioTotal:e*p*(1+v/100)});
saveDB('inventario',function(){renderInventario();updateInvTotal();limpiarInventario();});
}

function aplicarIngreso(rec){
var found=false;
for(var i=0;i<DB.inventario.length;i++){
if(DB.inventario[i].codigo===rec.codigo){
DB.inventario[i].existencia=(parseInt(DB.inventario[i].existencia)||0)+parseInt(rec.cantidad||0);
DB.inventario[i].precioTotal=DB.inventario[i].existencia*(parseFloat(DB.inventario[i].precio)||0);
found=true;
break;
}
}
if(!found&&rec.codigo){
DB.inventario.push({
id:nextId(DB.inventario),
codigo:rec.codigo,
items:rec.items||rec.codigo,
familia:'',
existencia:parseInt(rec.cantidad)||0,
precio:0,
iva:21,
precioIva:0,
precioTotal:0
});
}
}

function calcEdad(){var v=document.getElementById('per-nacimiento').value;if(!v)return;var h=new Date(),n=new Date(v);var e=h.getFullYear()-n.getFullYear();if(h.getMonth()<n.getMonth()||(h.getMonth()===n.getMonth()&&h.getDate()<n.getDate()))e--;document.getElementById('per-edad').value=e+' a\u00F1os';}
function calcAntiguedad(){var v=document.getElementById('per-ingreso').value;if(!v)return;var h=new Date(),n=new Date(v);var a=h.getFullYear()-n.getFullYear(),m=h.getMonth()-n.getMonth();if(m<0){a--;m+=12;}document.getElementById('per-antiguedad').value=a+' a\u00F1os, '+m+' meses';}
function calcEdadStr(nac){if(!nac)return'';var h=new Date(),n=new Date(nac);if(isNaN(n))return'';var e=h.getFullYear()-n.getFullYear();if(h.getMonth()<n.getMonth()||(h.getMonth()===n.getMonth()&&h.getDate()<n.getDate()))e--;return e+' a\u00F1os';}
function calcAntStr(ing,endDate){
if(!ing)return'';var n=new Date(ing);if(isNaN(n))return'';
var h=endDate?new Date(endDate):new Date();if(isNaN(h))h=new Date();
var a=h.getFullYear()-n.getFullYear(),m=h.getMonth()-n.getMonth();
if(m<0){a--;m+=12;}return a+' a\u00F1os, '+m+' meses';
}
// ===== Cantidad de días de Vacaciones (LCT) y Remanente =====
// Escala legal según antigüedad (Ley de Contrato de Trabajo Art. 150):
// <5 años: 14 | 5 a <10: 21 | 10 a <20: 28 | >=20: 35
// El admin puede sobrescribir este valor por persona cargando manualmente
// la columna "diasvacaciones" directamente en la hoja de cálculo.
function diasVacacionesLCT(ingreso){
var n=ingreso?new Date(ingreso):null;if(!n||isNaN(n))return 14;
var h=new Date();
var years=h.getFullYear()-n.getFullYear();
var m=h.getMonth()-n.getMonth();
if(m<0||(m===0&&h.getDate()<n.getDate()))years--;
if(years<5)return 14;
if(years<10)return 21;
if(years<20)return 28;
return 35;
}
function getDiasVacacionesPersonal(r){
if(r&&r.diasvacaciones!==undefined&&r.diasvacaciones!==null&&String(r.diasvacaciones).trim()!==''){
var v=parseInt(r.diasvacaciones,10);
if(!isNaN(v))return v;
}
return diasVacacionesLCT(r?r.ingreso:'');
}
function getDiasVacacionesPorNombre(nombre){
var p=(DB.personal||[]).find(function(x){return String(x.nombre||'').trim()===String(nombre||'').trim();});
return getDiasVacacionesPersonal(p);
}
// Calcula, para cada registro de vacaciones, el remanente acumulado:
// total de días asignados a la persona menos la suma de días ya tomados
// (en orden cronológico por fecha "desde"). Si se otorgan más días de los
// que quedan disponibles, el remanente queda en negativo.
function calcRemanentesVacaciones(){
var byPerson={};
(DB.vacaciones||[]).forEach(function(r){
var key=String(r.personal||'').trim();
if(!byPerson[key])byPerson[key]=[];
byPerson[key].push(r);
});
var remMap={};
Object.keys(byPerson).forEach(function(key){
var list=byPerson[key].slice().sort(function(a,b){
var da=a.desde?new Date(a.desde).getTime():0;
var db=b.desde?new Date(b.desde).getTime():0;
if(da!==db)return da-db;
return (a.id||0)-(b.id||0);
});
var total=getDiasVacacionesPorNombre(key);
var acumulado=0;
list.forEach(function(r){
acumulado+=Number(r.dias)||0;
remMap[r.id]=total-acumulado;
});
});
return remMap;
}

function calcAntiguedadHasta(fi, fh) {
if(!fi||!fh)return '';
var d1=new Date(String(fi).length===10?fi+'T12:00:00':fi);
var d2=new Date(String(fh).length===10?fh+'T12:00:00':fh);
if(isNaN(d1.getTime())||isNaN(d2.getTime()))return '';
var a=d2.getFullYear()-d1.getFullYear();
var m=d2.getMonth()-d1.getMonth();
if(m<0){a--;m+=12;}
if(d2.getDate()<d1.getDate()){m--;if(m<0){a--;m+=12;}}
if(a<0)return '0 anos';
return a+' ano'+(a!==1?'s':'')+( m>0?' '+m+' mes'+(m!==1?'es':''):'');
}
function calcAntiguedad(ingreso,hasta){
if(!ingreso)return '';
var p=String(ingreso).split('/');
var d=p.length===3&&p[2].length===4?new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0])):new Date(ingreso);
if(isNaN(d.getTime()))return '';
var n;
if(hasta){
var h=String(hasta).split('/');
n=h.length===3&&h[2].length===4?new Date(parseInt(h[2]),parseInt(h[1])-1,parseInt(h[0])):new Date(hasta);
if(isNaN(n.getTime()))n=new Date();
} else {
n=new Date();
}
var y=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth();
if(m<0){y--;m+=12;}
if(y<0)return '';
return y+' años y '+m+' meses';
}

function calcularTotalesAus(){
var desde=(document.getElementById('tot-desde')||{value:''}).value||'';
var hasta=(document.getElementById('tot-hasta')||{value:''}).value||'';
var perFil=(document.getElementById('tot-per')||{value:''}).value||'';
var empFil=(document.getElementById('tot-emp')||{value:''}).value||'';
var rows=(DB.ausencias||[]).filter(function(r){
if(desde&&(r.fecha||'')<desde)return false;
if(hasta&&(r.fecha||'')>hasta)return false;
if(perFil&&r.personal!==perFil)return false;
if(empFil){var emp=(DB.personal||[]).find(function(px){return px.nombre===r.personal;});if(!emp||emp.empresa!==empFil)return false;}
return true;
});
var tipos=['Injustificado','Licencia Sin Goce de Sueldo','Enfermedad','ART','Suspendido','Nacimiento','Matrimonio','Fallecimiento','Reserva de Puesto','Casamiento'];
var totals={};tipos.forEach(function(t){totals[t]=0;});
rows.forEach(function(r){var t=r.ausencia||'';if(totals.hasOwnProperty(t))totals[t]++;});

// By month
var byMonth={};
rows.forEach(function(r){
var f=r.fecha||'';
var key='';
if(f.indexOf('-')>=0){var p=f.split('-');key=p[1]+'/'+p[0];}
else if(f.indexOf('/')>=0){var p=f.split('/');key=p.length===3?p[1]+'/'+p[2]:f;}
if(!key)return;
if(!byMonth[key]){byMonth[key]={total:0,tipos:{}};}
byMonth[key].total++;
var t=r.ausencia||'Otro';
byMonth[key].tipos[t]=(byMonth[key].tipos[t]||0)+1;
});

// By year
var byYear={};
rows.forEach(function(r){
var f=r.fecha||'';
var yr='';
if(f.indexOf('-')>=0)yr=f.split('-')[0];
else if(f.indexOf('/')>=0){var p=f.split('/');yr=p.length===3?p[2]:'';}
if(!yr)return;
if(!byYear[yr]){byYear[yr]={total:0,tipos:{}};}
byYear[yr].total++;
var t=r.ausencia||'Otro';
byYear[yr].tipos[t]=(byYear[yr].tipos[t]||0)+1;
});

var html='';
// Totals by type
html+='<h4 style="margin:0 0 8px;font-size:.88rem">Por Tipo de Ausencia</h4>';
html+='<table style="width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:16px">'
+'<thead><tr style="background:#1e3a5f;color:#fff"><th style="padding:7px;text-align:left">Tipo</th><th style="padding:7px;text-align:center">Total</th></tr></thead><tbody>';
var tieneData=false;
tipos.forEach(function(t){
if(totals[t]>0){tieneData=true;html+='<tr style="border-bottom:1px solid #eee"><td style="padding:6px 8px">'+t+'</td><td style="padding:6px 8px;text-align:center;font-weight:600">'+totals[t]+'</td></tr>';}
});
if(!tieneData)html+='<tr><td colspan="2" style="padding:10px;text-align:center;color:#999">Sin resultados</td></tr>';
html+='<tr style="background:#f0f4ff;font-weight:700"><td style="padding:6px 8px">TOTAL</td><td style="padding:6px 8px;text-align:center">'+rows.length+'</td></tr></tbody></table>';

// By year
var years=Object.keys(byYear).sort();
if(years.length>0){
html+='<h4 style="margin:0 0 8px;font-size:.88rem">Por Año</h4>';
html+='<table style="width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:16px">'
+'<thead><tr style="background:#2d5a1b;color:#fff"><th style="padding:6px 8px;text-align:left">Año</th>';
tipos.forEach(function(t){if(totals[t]>0)html+='<th style="padding:4px 6px;text-align:center;font-size:.75rem">'+t.substring(0,8)+'</th>';});
html+='<th style="padding:6px 8px;text-align:center">Total</th></tr></thead><tbody>';
years.forEach(function(yr,idx){
var row=byYear[yr];var bg=idx%2===0?'':'background:#f0f4ee';
html+='<tr style="border-bottom:1px solid #eee;'+bg+'"><td style="padding:6px 8px;font-weight:600">'+yr+'</td>';
tipos.forEach(function(t){if(totals[t]>0)html+='<td style="padding:6px 8px;text-align:center">'+(row.tipos[t]||'')+'</td>';});
html+='<td style="padding:6px 8px;text-align:center;font-weight:700">'+row.total+'</td></tr>';
});
html+='</tbody></table>';
}

// By month
var months=Object.keys(byMonth).sort(function(a,b){
var pa=a.split('/'),pb=b.split('/');
return (parseInt(pa[1])*12+parseInt(pa[0]))-(parseInt(pb[1])*12+parseInt(pb[0]));
});
if(months.length>0){
html+='<h4 style="margin:0 0 8px;font-size:.88rem">Por Mes</h4>';
html+='<table style="width:100%;border-collapse:collapse;font-size:.83rem">'
+'<thead><tr style="background:#1e5a8a;color:#fff"><th style="padding:6px 8px;text-align:left">Mes/Año</th>';
tipos.forEach(function(t){if(totals[t]>0)html+='<th style="padding:4px 6px;text-align:center;font-size:.75rem">'+t.substring(0,8)+'</th>';});
html+='<th style="padding:6px 8px;text-align:center">Total</th></tr></thead><tbody>';
months.forEach(function(m,idx){
var row=byMonth[m];var bg=idx%2===0?'':'background:#f0f4f8';
html+='<tr style="border-bottom:1px solid #eee;'+bg+'"><td style="padding:6px 8px;font-weight:600">'+m+'</td>';
tipos.forEach(function(t){if(totals[t]>0)html+='<td style="padding:6px 8px;text-align:center">'+(row.tipos[t]||'')+'</td>';});
html+='<td style="padding:6px 8px;text-align:center;font-weight:700">'+row.total+'</td></tr>';
});
html+='</tbody></table>';
}

var el=document.getElementById('tot-result');if(el)el.innerHTML=html;
// Add PDF button
var pdfBtn=document.getElementById('btn-tot-pdf');
if(!pdfBtn){
pdfBtn=document.createElement('button');
pdfBtn.id='btn-tot-pdf';
pdfBtn.innerHTML='<i class="fas fa-file-pdf"></i> Exportar PDF';
pdfBtn.style.cssText='margin-top:12px;padding:8px 16px;background:#dc2626;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600;display:block';

if(el)el.parentNode.insertBefore(pdfBtn,el.nextSibling);
}
}

  });

  win.document.write(h);win.document.close();setTimeout(function(){win.print();},400);
