<script>
function abrirBuscadorVac(){
var q=prompt('Buscar vacaciones (nombre, supervisor, per\u00EDodo...):');
if(!q)return;
q=q.toLowerCase();
var rows=(DB.vacaciones||[]).filter(function(r){return Object.values(r).some(function(v){return String(v).toLowerCase().indexOf(q)>=0;});});
var tbody=document.getElementById('tbody-vacaciones');if(!tbody)return;
tbody.innerHTML=rows.map(function(r){
return'<tr style="background:#fff3cd"><td>'+r.id+'</td><td>'+(r.supervisor||'')+'</td>'
+'<td>'+(r.personal||'')+'</td><td>'+(r.legajo||'')+'</td><td>'+(r.empresa||'')+'</td>'
+'<td>'+fmtFecha(r.fingreso||'')+'</td><td>'+(r.antiguedad||'')+'</td>'
+'<td>'+fmtFecha(r.desde||'')+'</td><td>'+fmtFecha(r.hasta||'')+'</td>'
+'<td>'+(r.dias||0)+'</td><td>'+(r.obs||'')+'</td>'
+'<td>'+editBtn('vacaciones',r.id,'renderVacaciones')+'</td></tr>';
}).join('');
showToast(rows.length+' resultados encontrados');
}
function calcVacPeriodo(){
var desde=document.getElementById('vac-periodo-desde').value;
var hasta=document.getElementById('vac-periodo-hasta').value;
if(!desde||!hasta){alert('Complet\u00E1 el per\u00EDodo');return;}
var rows=(DB.vacaciones||[]).filter(function(r){return r.desde>=desde&&r.hasta<=hasta;});
var totalDias=rows.reduce(function(s,r){return s+(parseInt(r.dias)||0);},0);
var totalHoras=(totalDias*6.93).toFixed(2);
var supOrder=[];var bySup={};
rows.forEach(function(r){
var s=r.supervisor||'Sin Supervisor';
if(!bySup[s]){bySup[s]={dias:0,rows:[]};supOrder.push(s);}
bySup[s].dias+=(parseInt(r.dias)||0);
bySup[s].rows.push(r);
});
var byEmp={};
rows.forEach(function(r){
var e=r.empresa||'Sin Empresa';
if(!byEmp[e])byEmp[e]=0;
byEmp[e]+=(parseInt(r.dias)||0);
});
var html='<div class="stats-bar" style="margin-bottom:16px">'
+'<div class="stat-chip green"><span>Total d\u00EDas:</span><span class="val">'+totalDias+'</span></div>'
+'<div class="stat-chip"><span>Horas (x6,93):</span><span class="val">'+totalHoras+'</span></div>'
+'<div class="stat-chip"><span>Personas:</span><span class="val">'+rows.length+'</span></div>'
+'</div>';
if(supOrder.length>0){
html+='<h4 style="margin-bottom:8px;font-size:.9rem;color:var(--text2)">Por Supervisor (cada columna = un supervisor)</h4>'
+'<div class="table-wrapper" style="overflow-x:auto"><table style="border-collapse:collapse;min-width:100%"><thead><tr>';
supOrder.forEach(function(s){
html+='<th style="border:1px solid #ccc;padding:10px 14px;background:#4a7a3a;color:#fff;min-width:200px;font-size:15px">'+escH(s)+'<br>'
+'<small style="font-weight:normal">'+bySup[s].dias+' d\u00EDas / '+(bySup[s].dias*6.93).toFixed(1)+' hs</small></th>';
});
html+='</tr></thead><tbody>';
var maxRows=Math.max.apply(null,supOrder.map(function(s){return bySup[s].rows.length;}));
for(var ri=0;ri<maxRows;ri++){
html+='<tr>';
supOrder.forEach(function(s){
var r=bySup[s].rows[ri];
if(r){
html+='<td style="border:1px solid #ddd;padding:8px 12px;font-size:14px;vertical-align:top">'
+'<strong>'+escH(r.personal||'')+'</strong><br>'
+'<small>'+fmtFecha(r.desde||'')+' -> '+fmtFecha(r.hasta||'')+'</small><br>'
+'<small style="color:#27994f;font-weight:bold">'+r.dias+' d\u00EDas</small></td>';
} else {
html+='<td style="border:1px solid #ddd;padding:6px 10px"></td>';
}
});
html+='</tr>';
}
html+='</tbody></table></div>';
}
html+='<h4 style="margin:12px 0 8px;font-size:.9rem;color:var(--text2)">Por Servicio/Empresa</h4>'
+'<div class="table-wrapper"><table style="border-collapse:collapse;width:100%"><thead>'
+'<tr><th style="border:1px solid #ccc;padding:6px;background:#e8eef5">Empresa</th>'
+'<th style="border:1px solid #ccc;padding:6px;background:#e8eef5">D\u00EDas</th>'
+'<th style="border:1px solid #ccc;padding:6px;background:#e8eef5">Horas</th></tr></thead><tbody>'
+Object.keys(byEmp).map(function(e){
var d=byEmp[e];
return'<tr><td style="border:1px solid #ddd;padding:6px">'+e+'</td>'
+'<td style="border:1px solid #ddd;padding:6px;text-align:center">'+d+'</td>'
+'<td style="border:1px solid #ddd;padding:6px;text-align:center">'+(d*6.93).toFixed(2)+'</td></tr>';
}).join('')
+'</tbody></table></div>';
document.getElementById('vac-periodo-result').innerHTML=html;
}
var OC_ROWS=10;
function initOCItems(){
var tbody=document.getElementById('tbody-oc-items');if(!tbody)return;
var h='';
for(var i=1;i<=OC_ROWS;i++){
var bg=i%2===0?'background:rgba(100,180,100,.06)':'';
h+='<tr style="'+bg+'">'
+'<td style="text-align:center;padding:4px;border:1px solid var(--border)">'+i+'</td>'
+'<td style="border:1px solid var(--border);padding:2px"><input class="oc-q" data-r="'+i+'" type="number" min="0" oninput="calcOCRow('+i+')" style="background:transparent;border:none;width:80px;color:var(--text);font-size:12px;outline:none;padding:4px"></td>'
+'<td style="border:1px solid var(--border);padding:2px"><div style="display:flex;align-items:center"><span style="color:var(--text2);font-size:11px;padding:0 3px">$</span><input class="oc-p" data-r="'+i+'" type="number" min="0" step="0.01" oninput="calcOCRow('+i+')" style="background:transparent;border:none;width:100px;color:var(--text);font-size:12px;outline:none;padding:4px"></div></td>'
+'<td style="border:1px solid var(--border);padding:2px"><input class="oc-i" data-r="'+i+'" type="text" style="background:transparent;border:none;width:100%;color:var(--text);font-size:12px;outline:none;padding:4px"></td>'
+'<td style="border:1px solid var(--border);padding:2px"><input class="oc-s" data-r="'+i+'" type="text" style="background:transparent;border:none;width:110px;color:var(--text);font-size:12px;outline:none;padding:4px"></td>'
+'<td style="border:1px solid var(--border);padding:4px;color:var(--accent3);font-weight:bold;font-size:12px;min-width:100px" id="oc-tot-'+i+'">-</td></tr>';
}
tbody.innerHTML=h;
}
function calcOCRow(r){
var q=parseFloat((document.querySelector('.oc-q[data-r="'+r+'"]')||{}).value)||0;
var p=parseFloat((document.querySelector('.oc-p[data-r="'+r+'"]')||{}).value)||0;
var tot=document.getElementById('oc-tot-'+r);
if(tot)tot.textContent=(q&&p)?fmt$(q*p):'-';
calcOCTotales();
}
function calcOCTotales(){
var sub=0;
for(var i=1;i<=OC_ROWS;i++){
var q=parseFloat((document.querySelector('.oc-q[data-r="'+i+'"]')||{value:0}).value)||0;
var p=parseFloat((document.querySelector('.oc-p[data-r="'+i+'"]')||{value:0}).value)||0;
sub+=q*p;
}
var ivaPct=parseFloat(document.getElementById('oc-iva-pct').value)||0;
var ivaM=sub*ivaPct/100;
document.getElementById('oc-subtotal').value=fmt$(sub);
document.getElementById('oc-iva-monto').value=fmt$(ivaM);
document.getElementById('oc-total').value=fmt$(sub+ivaM);
}
function ocProveedorChange(){
var razon=document.getElementById('oc-proveedor').value.trim();
for(var i=0;i<DB.proveedores.length;i++){
if(DB.proveedores[i].razon===razon){
var p=DB.proveedores[i];
document.getElementById('oc-tel').value=p.tel||'';
document.getElementById('oc-cuit').value=p.cuit||'';
document.getElementById('oc-domfiscal').value=p.domFiscal||'';
document.getElementById('oc-dompago').value=p.domPago||'';
document.getElementById('oc-formapago').value=p.formaPago||'';
break;
}
}
}
function populateOCDatalists(){
var de=document.getElementById('dl-oc-emp');if(de)de.innerHTML=DB.empresas.map(function(r){return'<option value="'+escH(r.nombre)+'">';}).join('');
var dp=document.getElementById('dl-oc-prov');if(dp)dp.innerHTML=DB.proveedores.map(function(r){return'<option value="'+escH(r.razon)+'">';}).join('');
var di=document.getElementById('dl-oc-imp');if(di)di.innerHTML=DB.imputacionOC.map(function(r){return'<option value="'+escH(r.nombre)+'">';}).join('');
var dc=document.getElementById('dl-oc-con');if(dc)dc.innerHTML=DB.concepto.map(function(r){return'<option value="'+escH(r.nombre)+'">';}).join('');
var fp=document.getElementById('dl-prov-fp');if(fp)fp.innerHTML=DB.condicion.map(function(r){return'<option value="'+escH(r.nombre)+'">';}).join('');
var ocNums=DB.listadooc.map(function(r){return parseInt(r.oc)||parseInt(r.id)||0;});
var nxt=ocNums.length?Math.max.apply(null,ocNums)+1:1;
var el=document.getElementById('oc-numero');if(el&&!el.value)el.value=nxt;
}
function guardarOC(){
var oc=document.getElementById('oc-numero').value;if(!oc){alert('No hay n\u00FAmero de OC');return;}
var sub=document.getElementById('oc-subtotal').value;
var ivaMontoRaw=document.getElementById('oc-iva-monto').value;
var tot=document.getElementById('oc-total').value;
var ivaPct=document.getElementById('oc-iva-pct').value||'21';
var subNum=cleanNum(sub)||0;
var ivaNum=cleanNum(ivaMontoRaw)||0;
var totNum=cleanNum(tot)||0;
var itemRecs=[];
for(var i=1;i<=OC_ROWS;i++){
var q=(document.querySelector('.oc-q[data-r="'+i+'"]')||{}).value||'';
var p=(document.querySelector('.oc-p[data-r="'+i+'"]')||{}).value||'';
var it=(document.querySelector('.oc-i[data-r="'+i+'"]')||{}).value||'';
var s=(document.querySelector('.oc-s[data-r="'+i+'"]')||{}).value||'';
if(it.trim()||q)itemRecs.push({nro:itemRecs.length+1,q:q,p:parseFloat(p)||0,it:it,s:s});
}
if(!itemRecs.length)itemRecs=[{nro:1,q:'',p:0,it:'',s:''}];
// Preservar la Fecha de Autorización existente de esta OC (si la tenía) en
// vez de pisarla siempre con vacío al modificar/re-guardar la orden.
var _fechaAuthPrevia='';
DB.listadooc.forEach(function(r){
if(String(r.oc)===String(oc)&&r.fechaAuth){_fechaAuthPrevia=r.fechaAuth;}
});
DB.listadooc=DB.listadooc.filter(function(r){return String(r.oc)!==String(oc);});
itemRecs.forEach(function(item){
var rowTot=item.q&&item.p?(parseFloat(item.q)*item.p):0;
DB.listadooc.push({
id:parseInt(oc)||0,
nro:item.nro,   // FIX #20: row number 1,2,3...
fecha:document.getElementById('oc-fecha').value||today(),
oc:oc,
empresa:document.getElementById('oc-empresa').value,
mes:document.getElementById('oc-mes').value,
imputacion:document.getElementById('oc-imputacion').value,
concepto:document.getElementById('oc-concepto').value,
proveedor:document.getElementById('oc-proveedor').value,
cuit:document.getElementById('oc-cuit').value,
domicilio:document.getElementById('oc-domfiscal').value,
telefono:document.getElementById('oc-tel').value,
formapago:document.getElementById('oc-formapago').value,
factura:document.getElementById('oc-factura').value,
cantidad:item.q,
precio:item.p,
items:item.it,   // FIX #21: plain text, no pipe encoding
sector:item.s,
total:totNum,
iva:parseFloat(ivaPct)||21,
conIva:totNum,
ivaFactura:ivaNum,
totalFactura:totNum,
obs:document.getElementById('oc-obs').value,
fechaAuth:_fechaAuthPrevia
});
});
saveDB('listadooc',function(){renderListadoOC();showToast('OC '+oc+' guardada');});
}
function limpiarOC(){
['oc-empresa','oc-proveedor','oc-tel','oc-cuit','oc-domfiscal','oc-dompago','oc-formapago','oc-factura','oc-obs','oc-subtotal','oc-iva-monto','oc-total'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
document.getElementById('oc-fecha').value=today();
document.getElementById('oc-mes').value='';
document.getElementById('oc-imputacion').value='';
document.getElementById('oc-concepto').value='';
document.getElementById('oc-iva-pct').value='21';
document.getElementById('oc-numero').value='';
initOCItems();
populateOCDatalists();
}
function renderListadoOC(){
var rows=applyFiltersAndSort('listadooc',DB.listadooc).filter(function(r){
return Object.keys(_ocFiltros).every(function(campo){
var val=_ocFiltros[campo];if(!val)return true;
return String(r[campo]||'').toLowerCase().indexOf(val)>=0;
});
});
var t=document.getElementById('tbody-listadooc');if(!t)return;
t.innerHTML=rows.map(function(r){
var auth=String(r.fechaAuth||'').trim().toLowerCase();
var rs='';
if(auth==='no autorizado'||auth.indexOf('no autori')>=0)rs='background:#ffebee;';
else if(auth&&auth.length>2)rs='background:#e8f5e9;';
var oc=String(r.oc||r.id||'');
var precio=parseFloat(r.precio)||0;
var total=parseFloat(r.total)||0;
var ivaPct=parseFloat(r.iva)||0;
return'<tr style="'+rs+'">'
+'<td>'+fmtFecha(r.fecha||'')+'</td>'
+'<td><strong>'+escH(oc)+'</strong></td>'
+'<td>'+(r.empresa||'')+'</td>'
+'<td>'+(r.mes||'')+'</td>'
+'<td>'+(r.imputacion||'')+'</td>'
+'<td>'+(r.concepto||'')+'</td>'
+'<td>'+(r.proveedor||'')+'</td>'
+'<td>'+(r.cuit||'')+'</td>'
+'<td>'+(r.domicilio||'')+'</td>'
+'<td>'+(r.telefono||'')+'</td>'
+'<td>'+(r.formapago||'')+'</td>'
+'<td>'+(r.factura||'')+'</td>'
+'<td>'+(r.cantidad||'')+'</td>'
+'<td>'+(precio?fmt$(precio):'')+'</td>'
+'<td style="max-width:200px;white-space:normal">'+(r.items||'')+'</td>'
+'<td>'+(r.sector||'')+'</td>'
+'<td>'+(total?fmt$(total):'')+'</td>'
+'<td>'+(ivaPct?ivaPct+'%':'')+'</td>'
+'<td>'+(r.conIva?fmt$(parseFloat(r.conIva)||0):'')+'</td>'
+'<td style="max-width:150px;white-space:normal">'+(r.obs||'')+'</td>'
+'<td><input type="text" value="'+escH(r.fechaAuth||'')+'" onchange="ocAuthChange(this,\''+oc+'\')" style="background:transparent;border:1px solid #4fcc8e;border-radius:4px;color:inherit;padding:2px 6px;width:130px;font-size:11px" placeholder="Fecha o No autorizado"></td>'
+'</tr>';
}).join('');
}
function ocAuthChange(el,oc){
var val=el.value.trim();
for(var i=0;i<DB.listadooc.length;i++){
if(String(DB.listadooc[i].oc)===String(oc)||String(DB.listadooc[i].id)===String(oc)){
DB.listadooc[i].fechaAuth=val;
}
}
saveDB('listadooc',function(){renderListadoOC();showToast('Fecha actualizada');});
}
function cargarOCParaEditar(oc){
var recs=[];
for(var i=0;i<DB.listadooc.length;i++){
if(String(DB.listadooc[i].oc)===String(oc)||String(DB.listadooc[i].id)===String(oc)){
recs.push(DB.listadooc[i]);
}
}
if(!recs.length){showToast('OC '+oc+' no encontrada','#b02020');return;}
var rec=recs[0]; // header data from first record
var tabs=document.querySelectorAll('#tabs-oc .tab');
if(tabs.length){switchTab(tabs[0],'tab-oc-nueva','tabs-oc');}
document.getElementById('oc-numero').value=rec.oc||rec.id||'';
document.getElementById('oc-fecha').value=rec.fecha||today();
document.getElementById('oc-empresa').value=rec.empresa||'';
document.getElementById('oc-proveedor').value=rec.proveedor||'';
document.getElementById('oc-mes').value=rec.mes||'';
document.getElementById('oc-imputacion').value=rec.imputacion||'';
document.getElementById('oc-concepto').value=rec.concepto||'';
document.getElementById('oc-factura').value=rec.factura||'';
document.getElementById('oc-obs').value=rec.obs||'';
var ivaPct=parseFloat(rec.iva)||21;
document.getElementById('oc-iva-pct').value=ivaPct;
ocProveedorChange();
initOCItems();
recs.forEach(function(r,idx){
var rowNum=r.nro||idx+1;
if(rowNum<1||rowNum>OC_ROWS)rowNum=idx+1;
var qEl=document.querySelector('.oc-q[data-r="'+rowNum+'"]');
var pEl=document.querySelector('.oc-p[data-r="'+rowNum+'"]');
var iEl=document.querySelector('.oc-i[data-r="'+rowNum+'"]');
var sEl=document.querySelector('.oc-s[data-r="'+rowNum+'"]');
if(qEl)qEl.value=r.cantidad||'';
if(pEl)pEl.value=parseFloat(r.precio)||'';
if(iEl)iEl.value=r.items||'';  // FIX: plain text items
if(sEl)sEl.value=r.sector||'';
if(r.cantidad||r.precio)calcOCRow(rowNum);
});
calcOCTotales();
showToast('OC '+oc+' cargada');
}
function buscarOC(){
var num=document.getElementById('oc-buscar-num').value.trim();
var recs=DB.listadooc.filter(function(r){return String(r.oc)===num||String(r.id)===num;});
var div=document.getElementById('oc-ver-resultado');
if(!recs.length){div.innerHTML='<p style="color:var(--danger);padding:12px">No se encontr\u00F3 OC N\u00B0 '+escH(num)+'</p>';return;}
var rec=recs[0];
window._ocVerActual=String(rec.oc||rec.id||'');
var ocId=window._ocVerActual;
var total=parseFloat(rec.total)||parseFloat(rec.conIva)||0;
div.innerHTML='<div class="form-card" style="margin-top:0;background:var(--surface2)">'
+'<p style="color:var(--accent3);font-weight:bold;font-size:1.05rem;margin-bottom:14px">OK OC N\u00B0 '+escH(ocId)+' encontrada</p>'
+'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;font-size:.93rem;margin-bottom:16px">'
+'<div><b>Empresa:</b> '+escH(rec.empresa||'')+'</div>'
+'<div><b>Proveedor:</b> '+escH(rec.proveedor||'')+'</div>'
+'<div><b>Fecha:</b> '+fmtFecha(rec.fecha||'')+'</div>'
+'<div><b>Mes:</b> '+escH(rec.mes||'')+'</div>'
+'<div><b>Imputaci\u00F3n:</b> '+escH(rec.imputacion||'')+'</div>'
+'<div><b>Concepto:</b> '+escH(rec.concepto||'')+'</div>'
+'<div><b>Factura:</b> '+escH(rec.factura||'')+'</div>'
+'<div><b>Total:</b> '+fmt$(total)+'</div>'
+'</div>'
+'<div style="margin-bottom:14px">'
+'<label style="display:block;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:6px">Fecha de Autorizaci\u00F3n</label>'
+'<div style="display:flex;gap:10px;align-items:center">'
+'<input type="text" id="ver-fechaauth" value="'+escH(rec.fechaAuth||'')+'" placeholder="Ej: 26/03/2026 o No autorizado" style="flex:1;border:2px solid #4fcc8e;border-radius:6px;padding:10px 14px;font-size:1rem;background:var(--surface);color:var(--text)">'
+'<button class="btn btn-success" id="btn-guardar-auth"><i class="fas fa-save"></i> Guardar Autorizaci\u00F3n</button>'
+'</div></div>'
+'<div class="btn-row">'
+'<button class="btn btn-primary" id="btn-modificar-oc"><i class="fas fa-edit"></i> Modificar OC</button>'
+'<button class="btn btn-danger" id="btn-pdf-oc"><i class="fas fa-file-pdf"></i> PDF</button>'
+'</div></div>';
document.getElementById('btn-guardar-auth').onclick=function(){guardarAuthOC(window._ocVerActual);};
document.getElementById('btn-modificar-oc').onclick=function(){cargarOCParaEditar(window._ocVerActual);};
document.getElementById('btn-pdf-oc').onclick=function(){cargarOCParaEditar(window._ocVerActual);setTimeout(function(){imprimirOC();},800);};
}
function guardarAuthOC(oc){
var el=document.getElementById('ver-fechaauth');if(!el)return;
var val=el.value.trim();if(!val){alert('Ingres\u00E1 una fecha o "No autorizado"');return;}
var found=false;
DB.listadooc.forEach(function(r){
if(String(r.oc)===String(oc)||String(r.id)===String(oc)){r.fechaAuth=val;found=true;}
});
if(!found){showToast('OC no encontrada','#b02020');return;}
saveDB('listadooc',function(){renderListadoOC();showToast('Autorizaci\u00F3n guardada');});
}
function renderOCAuth(){
var rows=(DB.listadooc||[]).filter(function(r){var a=String(r.fechaAuth||'').trim().toLowerCase();return a&&a!=='no autorizado'&&a.indexOf('no autori')<0;});
var seen={};rows=rows.filter(function(r){var k=String(r.oc||r.id);if(seen[k])return false;seen[k]=1;return true;});
var el=document.getElementById('cnt-oc-auth');if(el)el.textContent=rows.length;
var tb=document.getElementById('tbody-oc-auth');if(!tb)return;
tb.innerHTML=rows.sort(function(a,b){return(parseInt(b.oc)||0)-(parseInt(a.oc)||0);}).map(function(r){
return'<tr style="background:#e8f5e9"><td><strong>'+(r.oc||r.id||'')+'</strong></td><td>'+fmtFecha(r.fecha||'')+'</td><td>'+(r.empresa||'')+'</td><td>'+(r.proveedor||'')+'</td><td>'+(r.total?fmt$(parseFloat(r.total)||0):'')+'</td><td style="color:#27994f;font-weight:bold">'+escH(r.fechaAuth||'')+'</td></tr>';
}).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--text2);padding:20px">Sin OC autorizadas</td></tr>';
}
function renderOCNoAuth(){
var rows=(DB.listadooc||[]).filter(function(r){var a=String(r.fechaAuth||'').trim().toLowerCase();return a==='no autorizado'||a.indexOf('no autori')>=0;});
var seen={};rows=rows.filter(function(r){var k=String(r.oc||r.id);if(seen[k])return false;seen[k]=1;return true;});
var el=document.getElementById('cnt-oc-noauth');if(el)el.textContent=rows.length;
var tb=document.getElementById('tbody-oc-noauth');if(!tb)return;

if(!personal || !items){ alert('Personal e \u00CDtems son obligatorios'); return; }
var supEl=document.getElementById('ind-supervisor');
var rec = {
id: 0,
fechaSolicitud: document.getElementById('ind-fechaSolicitud').value||'',
fechaRetiro:    document.getElementById('ind-fechaRetiro').value||'',
legajo:         document.getElementById('ind-legajo').value||'',
personal:       personal,
estado:         document.getElementById('ind-estado').value||'',
empresa:        document.getElementById('ind-empresa').value||'',
objetivo:       document.getElementById('ind-objetivo').value||'',
ley299:         document.getElementById('ind-ley299').value||'',

talle:          document.getElementById('ind-talle').value||'',
dni:            document.getElementById('ind-talle').value||'',
fechaEntrega:   document.getElementById('ind-fechaEntrega').value||'',
diasDemora:     document.getElementById('ind-diasDemora').value||'',
obs:            document.getElementById('ind-obs').value||'',
// Antes este formulario no tenía campo de Supervisor y quedaba siempre
// vacío. Ahora toma lo que se cargue en "Supervisor" y, si no se cargó
// nada, usa el usuario logueado como antes lo hacía el ingreso masivo.
supervisor:     (supEl?supEl.value.trim():'')||(SESSION&&SESSION.nombre)||''
};
if(!DB.solicitud) DB.solicitud = [];
// El ID se asigna en el servidor (appendRowsAutoId, con Lock) para que dos
// solicitudes guardadas casi al mismo tiempo desde distintas sesiones nunca
// puedan chocar de ID. Se usa HEADERS.solicitud (fuente única de columnas)
// en vez de una lista propia: la anterior tenía 'observaciones' en vez de
// 'obs', por lo que el campo Observaciones nunca se guardaba en la hoja.
var _r=HEADERS.solicitud.map(function(h){return rec[h]!==undefined?rec[h]:'';});
google.script.run
.withSuccessHandler(function(res){
if(res&&res.ok&&res.ids&&res.ids.length===1){
rec.id=res.ids[0];
}else{
showToast('No se pudo confirmar el ID, revisar la hoja','#d97706');
rec.id=nextId(DB.solicitud||[]);
}
DB.solicitud.push(rec);
renderSolicitud();limpiarSolicitud();showToast('Solicitud guardada');
})
.withFailureHandler(function(e){showToast('Error al guardar: '+(e&&e.message?e.message:String(e)),'#dc2626');})
.appendRowsAutoId('solicitudropa',[_r]);
}

function _getIndumRowType(r){
var ley = String(r.ley299||'').trim();
var tieneEntrega = r.fechaEntrega && String(r.fechaEntrega).trim() !== '';
var tieneRetiro  = r.fechaRetiro  && String(r.fechaRetiro).trim()  !== '';
var tieneDate = ley !== '' && ley.toLowerCase() !== 'x';
if(tieneDate && tieneEntrega)    return 'azul';     // LEY fecha + entrega = AZUL
if(tieneEntrega)                 return 'verde';    // cualquier entrega = VERDE
if(tieneRetiro && !tieneEntrega) return 'amarillo'; // fecha retiro sin entrega = AMARILLO
return 'normal';
}

tbody.innerHTML = rows.map(function(r){
var tipo = _getIndumRowType(r);
var rowStyle='', cellStyle='';
if(tipo==='azul'){
rowStyle='style="background:#1040a0!important;font-weight:bold;"';
cellStyle='style="color:#fff!important;"';
} else if(tipo==='verde'){
rowStyle='style="background:#1a6b3a!important;font-weight:bold;"';

// Dynamic diasDemora: fechaEntrega - fechaRetiro

// DNI: r.dni is the personal's DNI (Code.gs fix makes second "dni" column become "dni_2")
var rawDni=String(r.dni||'').replace(/\D/g,'');
var dniDisplay=rawDni?Number(rawDni).toLocaleString('es-AR'):String(r.dni||'');
return '<tr '+rowStyle+'>'
+'<td '+cellStyle+'>'+r.id+'</td>'
+'<td '+cellStyle+'>'+fmtFecha(r.fechaSolicitud||'')+'</td>'
+'<td '+cellStyle+'>'+fmtFecha(r.fechaRetiro||'')+'</td>'
+'<td '+cellStyle+'>'+(r.legajo||'')+'</td>'
+'<td '+cellStyle+'>'+(SESSION&&SESSION.rol==='Administrador'?'<span style="font-weight:700;cursor:pointer" onclick="editarSolicitudAdmin('+r.id+')">'+(r.personal||'')+'</span>':(r.personal||''))+'</td>'
+'<td '+cellStyle+'>'+dniDisplay+'</td>'
+'<td '+cellStyle+'>'+(r.estado||'')+'</td>'
+'<td '+cellStyle+'>'+(r.empresa||'')+'</td>'
+'<td '+cellStyle+'>'+(r.objetivo||'')+'</td>'

+'<td '+cellStyle+'>'+(r.codigo||'')+'</td>'
+'<td '+cellStyle+'>'+(r.items||'')+'</td>'
+'<td '+cellStyle+'>'+(r.cantidad||'')+'</td>'

+'onchange="guardarFechaEntrega('+r.id+',this.value)" '

+(tipo==='azul'?'#1a55c0':tipo==='amarillo'?'#c8940a':tipo==='verde'?'#1a5530':'var(--surface2)')
+';color:'+(tipo==='azul'||tipo==='verde'?'#fff':tipo==='amarillo'?'#000':'var(--text)')
+'"></td>'
+'<td '+cellStyle+'>'+dd+'</td>'
+'<td '+cellStyle+'>'+(r.obs||r.observaciones||'')+'</td>'

function eliminarSolicitudAdmin(id){

var pwd=prompt('Contrasena de administrador:');if(!pwd)return;
if(pwd!==SESSION.password&&pwd!=='admin'){showToast('Contrasena incorrecta','#dc2626');return;}
if(!confirm('Eliminar definitivamente la solicitud #'+id+'?'))return;
var idx=-1;for(var i=0;i<(DB.solicitud||[]).length;i++){if(String(DB.solicitud[i].id)===String(id)){idx=i;break;}}

var removed=DB.solicitud.splice(idx,1)[0];

}

function confirmarRetiros(pend){
var errores=[];
var seleccionados=[];
pend.forEach(function(r,idx){
var chk=document.getElementById('ret-chk-'+r.id);
var fechaEl=document.getElementById('ret-fecha-'+r.id);
var marcado=chk&&chk.checked;
var fecha=fechaEl?fechaEl.value:'';
var filaNum=idx+1;
if(marcado&&!fecha){errores.push('Falta la fecha de retiro en la fila '+filaNum+' ('+(r.items||r.codigo||'')+')');return;}
if(!marcado&&fecha){errores.push('La fila '+filaNum+' ('+(r.items||r.codigo||'')+') tiene fecha cargada pero no está tildada');return;}
if(marcado&&fecha){seleccionados.push({rec:r,fecha:fecha});}
});
if(errores.length){alert('No se pudo procesar el retiro:\n\n'+errores.join('\n'));return;}
if(!seleccionados.length){showToast('No seleccionó ninguna fila para retirar','#d97706');return;}
// Crear el registro definitivo en "salidas" (Registros de Salida) con la fecha real de retiro
if(!DB.salidas)DB.salidas=[];
var nuevasSalidas=seleccionados.map(function(s){
return{
id:0,
fecha:s.fecha,
quien:s.rec.quien,
objetivo:s.rec.objetivo,
cantidad:s.rec.cantidad,
codigo:s.rec.codigo,
items:s.rec.items,
asignado:s.rec.asignado,
legajo:s.rec.legajo,
empresa:s.rec.empresa,
dni:s.rec.dni,
obs:s.rec.obs
};
});
// El ID de "salidas" se asigna en el servidor (appendRowsAutoId, con Lock)
// para que dos retiros confirmados al mismo tiempo por distintos usuarios
// nunca choquen de ID.
var _salidasRows=nuevasSalidas.map(function(r){return HEADERS.salidas.map(function(h){return r[h]!==undefined?r[h]:'';});});
google.script.run
.withSuccessHandler(function(res){
if(res&&res.ok&&res.ids&&res.ids.length===nuevasSalidas.length){
nuevasSalidas.forEach(function(rec,idx){rec.id=res.ids[idx];});
}else{
showToast('No se pudo confirmar el ID de las salidas, revisar la hoja','#d97706');
nuevasSalidas.forEach(function(rec,idx){if(!rec.id)rec.id=nextId((DB.salidas||[]).concat(nuevasSalidas.slice(0,idx)));});
}
DB.salidas=DB.salidas.concat(nuevasSalidas);
window.lazyLoaded.salidas=true;
_continuarSalidaGuardada();
})
.withFailureHandler(function(e){
showToast('Error al guardar el retiro: '+(e&&e.message?e.message:String(e)),'#dc2626');
})
.appendRowsAutoId('salidas',_salidasRows);
function _continuarSalidaGuardada(){
// Sacar los registros confirmados de "preparacionok" (no se vuelve a tocar el inventario).
// Se borra SOLO por ID (deleteRowsByIds) y ya no se vuelve a re-guardar toda la hoja
// "preparacionok" desde el navegador: hacerlo podía pisar con datos viejos alguna
// otra fila que hubiese quedado pendiente y que otro usuario editó mientras tanto.
var idsRetirados={};
seleccionados.forEach(function(s){idsRetirados[s.rec.id]=true;});
DB.preparacionok=(DB.preparacionok||[]).filter(function(r){return !idsRetirados[r.id];});
var _asPrep=(window.sheetMap&&window.sheetMap['preparacionok'])||'preparacionok';
google.script.run.withSuccessHandler(function(){_continuarRetiro();}).withFailureHandler(function(){_continuarRetiro();}).deleteRowsByIds(_asPrep,Object.keys(idsRetirados));

// --- Correo de confirmación de retiro, agrupado por "Quien Retira" ---
var _gruposR={};
seleccionados.forEach(function(s){
var _qn=(s.rec.quien||'').toLowerCase().trim();if(!_qn)return;
if(!_gruposR[_qn])_gruposR[_qn]=[];
_gruposR[_qn].push(Object.assign({},s.rec,{fecha:s.fecha}));
});
Object.keys(_gruposR).forEach(function(qn){
var _filasR=_gruposR[qn];
var _correoR='';
(DB.quienRetira||[]).forEach(function(qr){
if(String(qr.nombre||'').toLowerCase().trim()===qn){
if(!_correoR&&qr.correo)_correoR=qr.correo;
}
});
if(_correoR){
var _emailDatosR={fecha:_filasR[0].fecha,quien:_filasR[0].quien,filas:_filasR};
google.script.run
.withSuccessHandler(function(res){showToast(res&&res.ok?'Correo de retiro enviado a '+_correoR:'Sin correo: '+_correoR,res&&res.ok?'#059669':'#d97706');})
.withFailureHandler(function(e){showToast('Error correo: '+(e&&e.message?e.message:String(e)),'#dc2626');})
.enviarCorreoSalidaMasiva(_emailDatosR,_correoR);
} else {
showToast('Sin correo para '+_filasR[0].quien+'. Agregue en Datos Varios → Quien Retira','#d97706');
}
});
}
}
}

(DB.solicitud||[]).forEach(function(r){if(r.items)itemSet[r.items]=1;});
dl.innerHTML=Object.keys(itemSet).sort().map(function(v){return'<option value="'+escH(v)+'">';}).join('');
}
}

var dlObj=document.getElementById('dl-ind-obj');
if(dlObj){var objSet={};(DB.objetivos||[]).forEach(function(r){var n=r.nombre||r.objetivo||'';if(n)objSet[n]=1;});(DB.salidas||[]).forEach(function(r){if(r.objetivo)objSet[r.objetivo]=1;});dlObj.innerHTML=Object.keys(objSet).sort().map(function(o){return'<option value="'+escH(o)+'">'+escH(o)+'</option>';}).join('');}
var dlItems=document.getElementById('dl-ind-items');
if(dlItems)dlItems.innerHTML=(DB.inventario||[]).map(function(r){return'<option value="'+escH(r.items||'')+'">'+escH(r.items||'')+'</option>';}).join('');
var dlCod=document.getElementById('dl-ind-cod');
if(dlCod)dlCod.innerHTML=(DB.inventario||[]).map(function(r){return'<option value="'+escH(r.codigo||'')+'">'+escH(r.codigo||'')+' - '+escH(r.items||'')+'</option>';}).join('');

// Populate IMS asignado datalist
var dlImsAsg=document.getElementById('ims-dl-asg');
if(dlImsAsg)dlImsAsg.innerHTML=(DB.personal||[]).filter(function(p){return p.nombre&&p.estado!=='Baja';}).sort(function(a,b){return(a.nombre||'').localeCompare(b.nombre||'');}).map(function(p){var n=escH(p.nombre||'');return'<option value="'+n+'">'+n+'</option>';}).join('');

// Datalist de supervisores para "Nueva Solicitud" de Indumentaria (misma
// fuente que se usa en Solicitud de Indumentaria y en la edición de
// Solicitud: DB.quienRetira). Se fuerza la carga de esa hoja porque al
// entrar a la pantalla Indumentaria no se pedía, y por eso el desplegable
// aparecía vacío.
loadSheetLazy('quienRetira',function(){

var _indSupSet={};

if(indSupEl&&!indSupEl.value) indSupEl.value=(SESSION&&SESSION.nombre)||'';
});
}
function indPersonalChange(){
var val=(document.getElementById('ind-personal')||{value:''}).value.trim();
var rec=(DB.personal||[]).find(function(p){return(p.nombre||'').trim().toLowerCase()===val.toLowerCase();});
if(rec){
var dniEl=document.getElementById('ind-talle');if(dniEl){var rawDni=String(rec.dni||'').replace(/\D/g,'');dniEl.value=rawDni?Number(rawDni).toLocaleString('es-AR'):rec.dni||'';}
var leg=document.getElementById('ind-legajo');if(leg&&!leg.value)leg.value=rec.legajo||'';
var emp=document.getElementById('ind-empresa');if(emp&&!emp.value)emp.value=rec.empresa||'';
var est=document.getElementById('ind-estado');if(est&&rec.estado)est.value=rec.estado;
}
}
function indLegajoChange(){
var val=String((document.getElementById('ind-legajo')||{value:''}).value).trim();
var rec=(DB.personal||[]).find(function(p){return String(p.legajo||'').trim()===val;});
if(rec){
var per=document.getElementById('ind-personal');if(per&&!per.value)per.value=rec.nombre||'';
var emp=document.getElementById('ind-empresa');if(emp&&!emp.value)emp.value=rec.empresa||'';
}
}
function indItemsChange(){
var val=(document.getElementById('ind-items')||{value:''}).value.trim();
var rec=(DB.inventario||[]).find(function(r){return(r.items||'').trim().toLowerCase()===val.toLowerCase();});
if(rec){
var cod=document.getElementById('ind-codigo');if(cod&&!cod.value)cod.value=rec.codigo||'';
}
}
function indFechasChange(){
var fSol=(document.getElementById('ind-fechaSolicitud')||{value:''}).value;
var fRet=(document.getElementById('ind-fechaRetiro')||{value:''}).value;
var fEnt=(document.getElementById('ind-fechaEntrega')||{value:''}).value;
// Dias de demora = fechaEntrega - fechaRetiro (si ambas existen)
if(fRet&&fEnt){
var d1=new Date(fRet),d2=new Date(fEnt);
if(!isNaN(d1)&&!isNaN(d2)){
var diff=Math.round((d2-d1)/(1000*60*60*24));
var elDemora=document.getElementById('ind-diasDemora');
if(elDemora)elDemora.value=diff>=0?diff:'';
}
}
}

function mantDominioChange(){
var dlDom=document.getElementById('dl-man-dom');
if(dlDom&&DB.flota){
dlDom.innerHTML=(DB.flota||[]).filter(function(r){
var obs=String(r.obs||'').toLowerCase();
return obs.indexOf('baja')<0&&obs.indexOf('no ver')<0;
}).map(function(r){
return'<option value="'+escH(r.dominio||'')+'">'
+escH(r.dominio||'')+' - '+escH((r.marca||'')+' '+(r.modelo||''))+'</option>';
}).join('');
}
var dom=String((document.getElementById('man-dominio')||{value:''}).value).trim().toUpperCase();
if(!dom)return;
var rec=(DB.flota||[]).find(function(r){
var obs=String(r.obs||'').toLowerCase();
return String(r.dominio||'').toUpperCase()===dom&&obs.indexOf('baja')<0&&obs.indexOf('no ver')<0;
});
if(!rec)return;
['man-marca','man-modelo','man-empresa','man-anio'].forEach(function(elId){
var key=elId.replace('man-','');
var el=document.getElementById(elId);
if(el)el.value=rec[key]||'';
});
}


function exportarGanttExcel(){
  var chart=document.getElementById('gantt-chart');
  if(!chart||!chart.querySelector('table')){showToast('El diagrama está vacío','#d97706');return;}
  var h='<html><head><meta charset="UTF-8"><style>table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 6px;font-size:11px;font-family:Arial}</style></head><body>';
  chart.querySelectorAll('table').forEach(function(t){h+=t.outerHTML;});
  h+='<footer style="position:fixed;bottom:0;left:0;right:0;text-align:center;font-family:Arial;font-size:10px;color:#555;border-top:1px solid #ddd;padding:4px 0;background:#fff">Delben - SGI</footer></body></html>';
  var blob=new Blob([h],{type:'application/vnd.ms-excel;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='Diagrama_Vacaciones.xls';a.click();
}
