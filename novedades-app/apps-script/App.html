// v1.25.3: resumen del período en el Control de cierre: vacaciones, horas extras y licencias, con sus totales.
// Cada persona cuenta una sola vez por día aunque esté cargada en dos servicios. Tocando un total o un estado
// se abre la lista de personas, ordenada por supervisor y empresa.
function htmlResumenCierre(rs) {
  if (!rs) return '';
  if (rs.error) return '<div class="panel"><b>Resumen del período</b><p class="sub">No se pudo armar: ' + esc(rs.error) + '</p></div>';
  CIERRE.rs = rs;
  const t = rs.totales || {}, nf = numCierre;
  const desc = c => (S.codigos[c] && S.codigos[c].Descripcion) || c;
  const cods = Object.keys(rs.porCodigo || {}).sort((a, b) => (rs.porCodigo[b].dias - rs.porCodigo[a].dias) || a.localeCompare(b));
  const pp = x => x + ' persona' + (x === 1 ? '' : 's');
  return '<div class="panel ci-res"><h2 style="margin:0 0 4px">Resumen del período</h2><p class="sub" style="margin:0 0 10px">Lo que cargaron los supervisores en todas las planillas. ' +
    'Cada persona cuenta <b>una sola vez por día</b>, aunque esté cargada en dos servicios. <b>Tocá un total o un estado</b> para ver la lista de personas por supervisor y empresa.</p>' +
    '<div class="ci-cards">' +
      '<button class="ci-card ci-vac ci-clic" data-cires="VAC"><b>' + nf(t.vacDias || 0) + '</b><span>días de vacaciones<br>' + pp(t.vacPersonas || 0) + '</span></button>' +
      '<button class="ci-card ci-ext ci-clic" data-cires="__EXT"><b>' + nf(t.extras || 0) + '</b><span>horas extras en total<br>' + pp(t.extrasPersonas || 0) + '</span></button>' +
      '<button class="ci-card ci-lic ci-clic" data-cires="__LIC"><b>' + nf(t.licDias || 0) + '</b><span>días de licencias y ausencias<br>(sin vacaciones) · ' + pp(t.licPersonas || 0) + '</span></button>' +
    '</div>' +
    (cods.length ? '<div class="tabla-wrap"><table class="t ci-cods"><thead><tr><th>Estado</th><th>Descripción</th><th>Personas</th><th>Días</th></tr></thead><tbody>' +
      cods.map(c => '<tr class="ci-clic" data-cires="' + esc(c) + '" title="Ver la lista de personas"><td><b>' + esc(c) + '</b></td><td>' + esc(desc(c)) + ' <small class="ci-ver">ver lista →</small></td><td style="text-align:right">' + rs.porCodigo[c].personas + '</td><td style="text-align:right"><b>' + rs.porCodigo[c].dias + '</b></td></tr>').join('') +
      '<tr class="ci-tot"><td colspan="2"><b>Total</b></td><td></td><td style="text-align:right"><b>' + cods.reduce((a, c) => a + rs.porCodigo[c].dias, 0) + '</b></td></tr></tbody></table></div>' : '<p class="sub">No hay vacaciones ni licencias cargadas en el período.</p>') +
    '</div>';
}
const numCierre = v => (Math.round((Number(v) || 0) * 100) / 100).toLocaleString('es-AR');
// Ventana con la lista de personas de un estado (o de horas extras / todas las licencias), por supervisor y empresa
function ventanaResumenCierre(que) {
  const rs = CIERRE.rs; if (!rs) return;
  const desc = c => (S.codigos[c] && S.codigos[c].Descripcion) || c;
  const ext = que === '__EXT', lic = que === '__LIC';
  let filas = [];
  (rs.personas || []).forEach(p => {
    if (ext) { if (p.Extras > 0) filas.push({ p, val: p.Extras }); return; }
    Object.keys(p.codigos).forEach(c => {
      if (lic ? c === 'VAC' : c !== que) return;
      filas.push({ p, cod: c, val: p.codigos[c].dias, fechas: p.codigos[c].fechas });
    });
  });
  const cmp = (a, b) => String(a || 'zzz').localeCompare(String(b || 'zzz'));
  filas.sort((a, b) => cmp(a.p.Supervisor, b.p.Supervisor) || cmp(a.p.Empresa, b.p.Empresa) || String(a.p.Nombre).localeCompare(String(b.p.Nombre)) || String(a.cod || '').localeCompare(String(b.cod || '')));
  const titulo = ext ? 'Horas extras' : lic ? 'Licencias y ausencias (sin vacaciones)' : que + ' · ' + desc(que);
  const unidad = ext ? 'hs extras' : 'días';
  const cab = ['Supervisor', 'Empresa', 'Legajo', 'Apellido y nombre', 'Servicio'].concat(lic ? ['Estado'] : []).concat(ext ? ['Total a liquidar', 'Hs. normales', 'Días de ausentismo', 'Horas extras'] : ['Días', 'Fechas']);
  const total = filas.reduce((a, x) => a + x.val, 0);
  let h = '', supAnt = null, empAnt = null, subS = 0, subE = 0;
  const vi = ext ? cab.length - 1 : cab.length - 2, resto = '<td></td>'.repeat(cab.length - 1 - vi);   // columna de la cantidad
  const cierraEmp = () => { if (empAnt !== null) h += '<tr class="ci-sub2"><td></td><td colspan="' + (vi - 1) + '">Subtotal ' + esc(empAnt || 'Sin empresa') + '</td><td style="text-align:right"><b>' + numCierre(subE) + '</b></td>' + resto + '</tr>'; };
  const cierraSup = () => { if (supAnt !== null) h += '<tr class="ci-sub1"><td colspan="' + vi + '">Total ' + esc(supAnt || 'Sin supervisor') + '</td><td style="text-align:right"><b>' + numCierre(subS) + '</b></td>' + resto + '</tr>'; };
  filas.forEach(x => {
    const sup = x.p.Supervisor || '', emp = x.p.Empresa || '';
    if (sup !== supAnt) { cierraEmp(); cierraSup(); h += '<tr class="ci-grp"><td colspan="' + cab.length + '">' + esc(sup || 'Sin supervisor') + '</td></tr>'; supAnt = sup; empAnt = null; subS = 0; }
    if (emp !== empAnt) { cierraEmp(); empAnt = emp; subE = 0; }
    subS += x.val; subE += x.val;
    const ultimo = ext ? [numCierre(x.p.Total), numCierre(x.p.Normales), x.p.Ausentismo || 0, '<b>' + numCierre(x.val) + '</b>'] : ['<b>' + x.val + '</b>', '<small>' + esc(x.fechas || '') + '</small>'];
    h += '<tr><td><small>' + esc(sup) + '</small></td><td>' + esc(emp) + '</td><td>' + esc(x.p.Legajo || '') + '</td><td><b>' + esc(x.p.Nombre) + '</b></td><td><small title="' + esc(x.p.Servicios || '') + '">' + esc(x.p.Servicio || '') + '</small></td>' +
      (lic ? '<td><b>' + esc(x.cod) + '</b> <small>' + esc(desc(x.cod)) + '</small></td>' : '') +
      ultimo.map((v, k) => '<td' + (ext || k === 0 ? ' style="text-align:right"' : '') + '>' + v + '</td>').join('') + '</tr>';
  });
  cierraEmp(); cierraSup();
  // la columna de la cantidad es la de días (o la de horas extras): los subtotales van debajo de esa columna
  const m = modal('<h3>' + esc(titulo) + ' · ' + esc(nombrePeriodo(CIERRE.periodo)) + '</h3>' +
    '<p class="sub">' + filas.length + ' ' + (filas.length === 1 ? 'renglón' : 'renglones') + ' · Total: <b>' + numCierre(total) + ' ' + unidad + '</b>. Por supervisor y por empresa. Si una persona está en dos servicios, figura en uno (el de más horas) y sus días cuentan una sola vez.' +
      (ext && rs.notaExtras ? '<br>' + esc(rs.notaExtras) : '') + '</p>' +
    (filas.length ? '<div class="tabla-wrap ci-modal-tabla"><table class="t ci-lista' + (ext ? ' ci-ext-t' : '') + '"><thead><tr>' + cab.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' + h + '</tbody></table></div>' : '<p class="vacio-msg">Sin datos en el período.</p>') +
    '<div class="pie"><button class="btn btn-excel" id="crBajar">Descargar (Excel)</button><button class="btn" id="crCopiar">Copiar</button><div class="esp"></div><button class="btn prim" id="crCerrar">Cerrar</button></div>');
  m.classList.add('modal-ancho');
  const plano = () => [cab.join('\t')].concat(filas.map(x => [x.p.Supervisor || '', x.p.Empresa || '', x.p.Legajo || '', x.p.Nombre, x.p.Servicio || ''].concat(lic ? [x.cod] : [])
    .concat(ext ? [x.p.Total, x.p.Normales, x.p.Ausentismo || 0, x.val] : [x.val, x.fechas || '']).map(v => typeof v === 'number' ? String(v).replace('.', ',') : String(v)).join('\t'))).join('\n');
  $('#crCerrar').onclick = cerrarModal;
  $('#crCopiar').onclick = () => { const html = '<table border="1">' + $('.ci-lista', m).innerHTML + '</table>'; if (copiarConColores({ tsv: plano(), html, filas: filas.length })) toast('Copiado. Pegalo en Excel con Ctrl+V.'); else copiar(plano()); };
  $('#crBajar').onclick = () => {
    const csv = '﻿' + plano().split('\n').map(l => l.split('\t').map(c => '"' + c.replace(/"/g, '""') + '"').join(';')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = titulo.replace(/[\\/:*?"<>|·]/g, '-') + ' - ' + nombrePeriodo(CIERRE.periodo) + '.csv'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  };
}

// v1.21 · SGI: se abre en otra pestaña con un pase de un solo uso (no pide la clave otra vez).
async function abrirSGI() {
  if (!puede('sgi')) { toast('Tu perfil no tiene acceso al SGI.', true); return; }
  const w = window.open('', '_blank');
  try {
    const r = await api('sgiLink', {});
    if (r.demo) { if (w) w.close(); toast(r.demo); return; }
    if (w) w.location.href = r.url; else window.open(r.url, '_blank');
  } catch (e) { if (w) w.close(); toast(e.message, true); }
}

   v1.19: ventanas nuevas (pantalla completa), Resumen, Ausencias, Consultas,

// Ventana que ocupa toda la pantalla (Esc la cierra).
function ventanaGrande(titulo, cuerpo, botones) {
  const d = document.createElement('div');
  d.className = 'fs-std fs-gen';
  d.innerHTML = '<div class="fs-barra"><b>' + titulo + '</b><div class="esp"></div>' + (botones || '') + '<button class="btn" data-fscerrar>Cerrar (Esc)</button></div>' +
    '<div class="fs-cuerpo">' + cuerpo + '</div>';

const selPeriodos = (sel, extra) => opciones([...new Set(listaPeriodos(periodoActual()).concat(S.base.periodosDatos || []).concat(extra || []))].sort().reverse()
  .map(p => ({ v: p, t: nombrePeriodo(p) + (p === periodoActual() ? ' (actual)' : '') })), sel);

/* ---------- Tablas rápidas de informes (Facturación, Contratadas vs. Realizadas, Plus, Licencias, Eventos) ---------- */
function htmlTablaGen(r) {
  const cols = r.cols, grupos = [];
  cols.forEach(c => { const g = grupos[grupos.length - 1]; if (g && g.g === c.g && c.g) g.n++; else grupos.push({ g: c.g, n: 1 }); });
  const conGrupo = grupos.some(g => g.g);
  // v1.22.9: colores por columna (los del Excel), negativos en rojo, colores por celda (líneas con VigiControl)
  // y lo que administración modificó a mano (doble clic en la celda)
  const AJ = r.ajustes || {}, editable = esAdmin();
  (r.filas || []).forEach(f => { const fk = claveFilaInf(f); cols.forEach(c => { const a = AJ[fk + '#' + c.k]; if (a !== undefined) { f[c.k] = c.n ? (Number(String(a).replace(',', '.')) || 0) : a; (f._aj = f._aj || {})[c.k] = 1; } }); });
  const estC = (c, f) => {
    const x = (f && f._st && f._st[c.k]) || {}, bg = x.bg || c.bg, fc = c.fc;
    return (bg ? 'background:' + bg + ';' : '') + (fc ? 'color:' + fc + ';' : '');
  };
  const celda = (c, f) => {
    let v = f[c.k];
    const st = estC(c, f), x = (f._st && f._st[c.k]) || {};
    const at = (st ? ' style="' + st + '"' : '') + (x.title ? ' title="' + esc(x.title) + '"' : '') +
      (editable ? ' data-af="' + esc(claveFilaInf(f)) + '" data-ac="' + esc(c.k) + '"' + (f._aj && f._aj[c.k] ? ' data-aj="1"' : '') : '') + (c.tel ? ' data-tel="' + esc(f.sid || '') + '"' : '');
    if (c.n) { let num0 = typeof v === 'number' ? v : Number(v) || 0; if (c.neg && num0 > 0) num0 = -num0; return '<td class="n"' + at + '>' + nz(num0) + '</td>'; }
    if (r.colorCodigo === c.k) return '<td class="c"' + at + '><span class="cod-cel ' + claseCodigoXl(String(v || '')) + '">' + esc(v) + '</span></td>';
    if (r.enlace && f[r.enlace] && (c.k === 'cliente' || c.k === 'Servicio' || c.k === 'Cliente')) return '<td' + at + '><a href="#" data-irserv="' + esc(f[r.enlace]) + '">' + esc(v) + '</a></td>';
    return '<td' + at + '>' + esc(v === undefined || v === null ? '' : v) + '</td>';
  };
  let filas = r.filas;
  let cuerpo;
  if (r.grupo) {
    const gs = [...new Set(filas.map(f => f[r.grupo] || 'Sin ' + r.grupo.toLowerCase()))];
    cuerpo = gs.map(g => {
      const l = filas.filter(f => (f[r.grupo] || 'Sin ' + r.grupo.toLowerCase()) === g);
      const sub = {}; cols.forEach(c => { if (c.n) sub[c.k] = l.reduce((s, f) => s + (Number(f[c.k]) || 0), 0); });
      return '<tr class="gen-grupo"><td colspan="' + cols.length + '">' + pillEmpresa(g) + '</td></tr>' + l.map(f => '<tr>' + cols.map(c => celda(c, f)).join('') + '</tr>').join('') +
        '<tr class="gen-sub">' + cols.map((c, k) => k === 0 ? '<td>Total ' + esc(g) + '</td>' : (c.n ? '<td class="n">' + nz(Math.round(sub[c.k] * 100) / 100) + '</td>' : '<td></td>')).join('') + '</tr>';
    }).join('');
  } else cuerpo = filas.map(f => '<tr>' + cols.map(c => celda(c, f)).join('') + '</tr>').join('');
  return '<table class="t gen-t" data-inf="' + esc((r.tipo || '') + '|' + (r.periodo || '')) + '"><thead>' +

// Tabla de la app a Excel (solo valores), armada en el navegador.
async function bajarTablaXlsx(nombre, cols, filas, total) {
  if (!window.XLSX) {
    toast('Preparando el Excel…');
    await new Promise((ok, mal) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload = ok; s.onerror = () => mal(new Error('No se pudo cargar el generador de Excel.')); document.head.appendChild(s); });
  }
  const aoa = [cols.map(c => c.t)].concat(filas.map(f => cols.map(c => c.n ? (Number(f[c.k]) || '') : (f[c.k] === undefined ? '' : f[c.k]))));
  if (total) aoa.push(cols.map((c, k) => k === 0 ? 'Totales' : (c.n ? total[c.k] || '' : '')));
  const ws = XLSX.utils.aoa_to_sheet(aoa), wb = XLSX.utils.book_new();
  ws['!cols'] = cols.map(c => ({ wch: c.n ? 14 : 30 }));
  XLSX.utils.book_append_sheet(wb, ws, 'Resumen');
  XLSX.writeFile(wb, nombre.replace(/[\\/:*?"<>|]/g, ' ') + '.xlsx');
}

    d.onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; d.querySelectorAll('.chip').forEach(c => { c.disabled = true; }); b.classList.add('on'); al(lista[+b.dataset.k]); };
  };

  const fechaL = iso0 => { const m = String(iso0 || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : fechaDMA(iso0); };
  const AYUDA = ['Fecha de ingreso', 'Fecha de nacimiento', 'Domicilio', '¿Qué servicios trabajó?', '¿Cuántas ausencias tuvo?', '¿Las ausencias se repiten año tras año?', 'Horas del período', 'Otro período', 'Otra persona'];
  const ofrecer = () => chips(AYUDA.map(t => ({ t })), x => responder(x.t));

    const conMes = !!periodoDeTexto(texto);
    if (r.tipo === 'opciones') {
      w.innerHTML = 'Encontré <b>' + r.opciones.length + '</b> personas con "' + esc(texto) + '". ¿Cuál es?';
      chips(r.opciones.map(o => ({ t: esc(o.Nombre) + ' <small>· LP ' + esc(o.Legajo) + ' · ' + esc(o.Empresa || '') + (o.Estado === 'Baja' ? ' · baja' : '') + (o.Clientes ? ' · ' + esc(o.Clientes) : '') + '</small>', o })),
        x => elegido(x.o, conMes ? r.periodo : ''));
      return;
    }
    w.innerHTML = 'Es <b>' + esc(r.persona.Nombre) + '</b> (LP ' + esc(r.persona.Legajo) + ').';
    elegido(r.persona, conMes ? r.periodo : '');
  };
  // 2) ¿de qué período?
  const elegido = (o, per) => {
    CONS.persona = { Legajo: o.Legajo, Nombre: o.Nombre, Empresa: o.Empresa };
    decir(esc(o.Nombre), 'yo');
    if (per) { cargar(per); return; }
    decir('¿De qué período querés la información?');
    const pers = listaPeriodos(periodoActual()).filter(p => p <= periodoActual()).slice(-8).reverse();
    chips(pers.map(p => ({ t: nombrePeriodo(p), p })).concat([{ t: 'Todo el historial', p: 'todo' }]), x => { decir(x.t, 'yo'); cargar(x.p); });
  };
  // 3) la información
  const cargar = async per => {

    const w = pensando();
    let r;

    if (r.demo) { w.innerHTML = esc(r.demo); return; }
    CONS.datos = r;
    w.innerHTML = resumenCons(r);
    decir('¿Qué más querés saber de ' + esc(r.persona.Nombre) + '?');
    ofrecer();
  };
  const resumenCons = r => {
    const p = r.persona, fi = r.ficha || {}, dt = r.detalle;
    let h = '<b>' + esc(p.Nombre) + '</b> · LP ' + esc(p.Legajo) + ' · ' + esc(p.Empresa || '') + (fi.Estado ? ' · ' + esc(fi.Estado) : '') + (fi.Categoria ? ' · ' + esc(fi.Categoria) : '');
    if (dt) {
      const hs = dt.servicios.reduce((a, x) => a + x.total, 0), ex = dt.servicios.reduce((a, x) => a + (x.extras || 0), 0);
      const est = {}; dt.servicios.forEach(x => Object.keys(x.estados || {}).forEach(k => { est[k] = (est[k] || 0) + x.estados[k]; }));
      h += '<br>En <b>' + esc(r.nombrePeriodo) + '</b>: ' + (dt.servicios.length ? 'trabajó en ' + dt.servicios.map(x => '<b>' + esc(x.servicio) + '</b> (' + f2(x.total) + ' hs, ' + x.trabajados + ' días)').join(', ') +
        '. Total: <b>' + f2(hs) + ' hs</b>' + (ex ? ', ' + f2(ex) + ' extras' : '') + '.' : 'no figura en ninguna planilla.') +

    return h;
  };
  // 4) preguntas sobre la persona elegida

    if (/OTRO PERIODO/.test(t) || (CONS.persona && periodoDeTexto(texto) && !/INGRES|NACI/.test(t))) {
      const pp = periodoDeTexto(texto); if (pp) { cargar(pp); return; }
      elegido(CONS.persona, ''); return;
    }
    if (!r) { buscar(texto); return; }
    const fi = r.ficha || {};
    const dato = (etq, v) => decir(etq + ': <b>' + esc(v || 'no figura en SGI') + '</b>');
    if (/INGRES|ANTIGUEDAD/.test(t)) return dato('Fecha de ingreso', fechaDMA(fi.Ingreso) + (fi.Antiguedad ? ' (antigüedad ' + fi.Antiguedad + ')' : ''));
    if (/NACI|EDAD|CUMPLE/.test(t)) return dato('Fecha de nacimiento', fechaDMA(fi.Nacimiento) + (fi.Edad ? ' (' + fi.Edad + ' años)' : ''));
    if (/DOMICILIO|DIRECCION|VIVE/.test(t)) return dato('Domicilio', fi.Domicilio);
    if (/TELEFONO|CELULAR/.test(t)) return dato('Teléfono', fi.Telefono);
    if (/CORREO|MAIL/.test(t)) return dato('Correo', fi.Correo);
    if (/CUIL/.test(t)) return dato('CUIL', fi.Cuil);
    if (/DNI|DOCUMENTO/.test(t)) return dato('DNI', fi.Dni);
    if (/CATEGORIA/.test(t)) return dato('Categoría', fi.Categoria);
    if (/SUPERVISOR|ZONA/.test(t)) return dato('Supervisor / zona', [fi.Supervisor, fi.Zona].filter(Boolean).join(' · '));
    if (/VACACION/.test(t) && /DISPON|LE QUEDAN|CORRESPOND|CUANTOS DIAS/.test(t)) return dato('Días de vacaciones', fi.DiasVacaciones);
    if (/REPIT|COINCID|ANO TRAS|ANO A ANO|TODOS LOS ANOS/.test(t)) {
      if (!r.repetidas.length) return decir('No: ninguna de sus ' + r.ausencias.length + ' ausencias cae en la misma fecha en años distintos.');
      return decir('Sí, hay fechas que se repiten en distintos años:<br>' + r.repetidas.map(x => '<b>' + esc(x.dia) + '</b>: ' + x.veces.map(fechaL).join(', ')).join('<br>'));
    }
    if (/AUSENC|FALTA|INJUSTIF|ENFERM|LICENC|ART\b/.test(t)) {
      if (!r.ausencias.length) return decir('No tiene ausencias registradas en Stock Manager.');
      const por = {}; r.ausencias.forEach(x => { por[x.ausencia || 'Sin tipo'] = (por[x.ausencia || 'Sin tipo'] || 0) + 1; });
      const anio = {}; r.ausencias.forEach(x => { anio[x.fecha.slice(0, 4)] = (anio[x.fecha.slice(0, 4)] || 0) + 1; });
      return decir('Tiene <b>' + r.ausencias.length + '</b> ausencias registradas: ' + Object.keys(por).map(k => esc(k) + ' ' + por[k]).join(' · ') +
        '.<br>Por año: ' + Object.keys(anio).sort().map(k => k + ': ' + anio[k]).join(' · ') +
        '<details><summary>Ver todas las fechas</summary>' + r.ausencias.map(x => fechaL(x.fecha) + ' · ' + esc(x.ausencia) + (x.objetivo ? ' · ' + esc(x.objetivo) : '')).join('<br>') + '</details>');
    }
    if (/SERVICIO|DONDE|TRABAJO|OBJETIVO|CLIENTE/.test(t) && !/HORAS/.test(t)) {
      if (!r.historial.length) return decir('No encontré servicios registrados.');
      const cuenta = {}; r.historial.forEach(h => h.servicios.forEach(sv => { cuenta[sv] = (cuenta[sv] || 0) + 1; }));
      return decir('Trabajó en: ' + Object.keys(cuenta).sort((a, b) => cuenta[b] - cuenta[a]).map(k => '<b>' + esc(k) + '</b> (' + cuenta[k] + (cuenta[k] === 1 ? ' período' : ' períodos') + ')').join(', ') +
        '<details><summary>Período por período</summary>' + r.historial.map(h => esc(h.periodo) + ': ' + h.servicios.map(esc).join(', ')).join('<br>') + '</details>');
    }
    if (/HORA|EXTRA|TRABAJ/.test(t)) {
      if (!r.detalle) { decir('¿De qué período? Elegilo y te digo las horas.'); elegido(CONS.persona, ''); return; }
      return decir(resumenCons(r));
    }
    // ¿es otra persona?
    CONS.datos = null; buscar(texto);
  };
  const enviar = () => {
    const txt = $('#consTxt').value.trim(); if (!txt) return;
    $('#consTxt').value = '';
    if (CONS.datos) responder(txt); else { decir(esc(txt), 'yo'); buscar(txt); }
  };
  decir('¡Hola! ¿Qué querés consultar? Puede ser una persona (apellido o legajo) o un servicio.');
  $('#consIr').onclick = enviar;
  $('#consNueva').onclick = () => vConsultas();
  $('#consTxt').addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });
  if ($('#consMic')) $('#consMic').onclick = () => {
    const rec = new voz(); rec.lang = 'es-AR'; rec.interimResults = false; rec.maxAlternatives = 1;
    $('#consMic').classList.add('grabando');
    rec.onresult = e => { $('#consTxt').value = e.results[0][0].transcript; enviar(); };
    rec.onerror = e => toast('No se pudo escuchar (' + (e.error || 'error') + '). Revisá el permiso del micrófono.', true);
    rec.onend = () => { const b = $('#consMic'); if (b) b.classList.remove('grabando'); };
    try { rec.start(); } catch (e) { toast(e.message, true); }
  };
  $('#consTxt').focus();
}
// Período nombrado en un texto ("agosto", "septiembre 2026"): el que termina ese mes
function periodoDeTexto(t) {
  const M = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
  const u = norm(t).replace('SETIEMBRE', 'SEPTIEMBRE'), k = M.findIndex(m => u.indexOf(m) >= 0);
  if (k < 0) return '';
  const y = (u.match(/20\d\d/) || [])[0] || String(new Date().getFullYear());
  return sumarMes(y + '-' + pad(k + 1), -1);
}

        todas.slice(1, 9).map(f => '<tr>' + Array.from({ length: W }, (_, k) => '<td>' + esc(f[k] || '') + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
      $('#pgOk').disabled = todas.length < 2;

      if (i1 >= 0 && k >= i1 && k < i1 + 31) return 'Día ' + (k - i1 + 1);

/* ---------- Turno automático (Diurno, Nocturno o Mixto según los colores) ---------- */
// Blanco (y celeste) = diurno · gris = nocturno · los dos = mixto. Si se escribió a mano otro turno, se respeta.
function turnoAuto(f) {
  let dia = false, noche = false;
  for (let i = 0; i < f.Dias.length; i++) {
    const b = valorBase(f.Dias[i]);
    if (!b || !RX_HORAS.test(b)) continue;
    if ((f.Col[i] || '') === 'N') noche = true; else dia = true;
  }
  return dia && noche ? 'Mixto' : noche ? 'Nocturno' : dia ? 'Diurno' : '';
}
function actualizarTurnosAuto() {
  if (!S.pl || S.pl.soloVer) return;
  S.pl.filas.forEach((f, r) => { try { turnoAutoFila(f, r); } catch (e) { console.warn('Turno fila ' + r, e); } });
}
function turnoAutoFila(f, r) {
  {
    // v1.22.3: si se borran todas las horas de la fila, se borra también su turno (cobertura) o "Instrucción o Retén"
    const tiene = f.Dias.some(v => valorBase(v));
    if (f._teniaDias && !tiene && String(f.Puesto || '').trim()) {
      f.Puesto = ''; f._tAuto = '';
      const el = $('input.tx-in[data-r="' + r + '"][data-campo="Puesto"]'); if (el) { el.value = ''; el.classList.remove('t-auto'); }
      const se = $('select.pue-sel[data-r="' + r + '"]'); if (se) se.value = '';
    }
    f._teniaDias = tiene;
    if (f.Seccion !== 'COBERTURA') return;
    // v1.22.4: Supervisor (categoría SP) o el estado de todo el mes (Enfermedad, ART, Vacaciones...): lo pone el sistema, no se elige
    const elT = $('input.tx-in[data-r="' + r + '"][data-campo="Puesto"]');
    const fijo = turnoFijo(f);
    // v1.25.1: administración puede cambiar el turno que pone el sistema (ej.: RAIZEN Dock Sud Supervisores)
    if (fijo && esAdmin()) {
      const act = String(f.Puesto || '').trim();
      if (f._tAuto === undefined) f._tAuto = (!act || act === fijo) ? fijo : null;
      if (elT) { elT.readOnly = false; elT.classList.remove('t-fijo'); }
      if (f._tAuto === null) return;        // cambiado a mano: no se toca
      f.Puesto = fijo; f._tAuto = fijo;
      if (elT) { if (document.activeElement !== elT) elT.value = fijo; elT.classList.add('t-auto'); elT.title = 'Lo pone el sistema (administración lo puede cambiar)'; }
      return;
    }
    if (fijo) {
      f.Puesto = fijo; f._fijo = fijo; f._tAuto = fijo;
      if (elT) { if (document.activeElement !== elT) elT.value = fijo; elT.readOnly = true; elT.classList.add('t-auto', 't-fijo'); elT.title = 'Lo pone el sistema'; }
      return;
    }
    if (f._fijo) { f._fijo = ''; f.Puesto = ''; f._tAuto = ''; if (elT) { elT.readOnly = false; elT.classList.remove('t-fijo'); elT.value = ''; } }
    const a = turnoAuto(f), actual = String(f.Puesto || '').trim();
    // Primera vez: si lo que tenía coincide con lo automático (o está vacío / es de los viejos Día-Noche), queda en automático
    if (f._tAuto === undefined) f._tAuto = (!actual || actual === a || TURNOS_VIEJOS[actual] === a) ? '' : null;
    if (f._tAuto === null) return;          // turno puesto a mano: no se toca
    if (!a || actual === a) { f._tAuto = a; return; }
    f.Puesto = a; f._tAuto = a;
    const el = $('input.tx-in[data-r="' + r + '"][data-campo="Puesto"]');
    if (el && document.activeElement !== el) { el.value = a; el.classList.add('t-auto'); el.title = 'Puesto solo según los colores (se puede cambiar a mano)'; }
  }
}
const TURNOS_VIEJOS = { 'Día': 'Diurno', 'Dia': 'Diurno', 'Noche': 'Nocturno' };
function turnoFijo(f) {
  if (!f || !(f.Nombre || f.Legajo)) return '';
  const p = fichaPersona(f.Legajo, f.Empresa, f.Nombre);
  if (norm(p.Categoria) === 'SP') return 'Supervisor';
  // v1.22.7: en RAIZEN Dock Sud Supervisores todo el que se carga es "SUPERVISOR OPERATIVO" (salvo los supervisores, arriba)
  const sv = S.pl.serv || {};
  if (/RAIZEN/.test(norm(sv.Servicio + ' ' + sv.Cliente)) && /SUPERVIS/.test(norm(sv.Servicio + ' ' + sv.Cliente))) return 'SUPERVISOR OPERATIVO';
  const n = S.pl.info.n, vals = f.Dias.slice(0, n).map(v => valorBase(v));
  if (vals.length < n || vals.some(v => !v)) return '';
  const c = vals[0];
  if (c === 'F' || RX_HORAS.test(c) || vals.some(v => v !== c)) return '';
  const cod = S.codigos[c];
  return cod ? (cod.Descripcion || c) : '';
}

/* ---------- Autofiltro (como en Excel) en todos los listados ---------- */
// Cada título de columna tiene un ▾: ordenar A→Z / Z→A y elegir qué valores mostrar (con buscador).
// Se agrega solo a toda tabla de datos que aparezca en pantalla.
const AF_SEL = 'table.t:not(.conf-dia):not(.pg-t):not(.af-no), table.std, table.os-t, table.stsup';
const AF_ESPECIAL = /(^|\s)(total|gen-grupo|gen-sub|std-tot|std-tot2|std-sep|cm-det|vacio)(\s|$)/;
function afGrilla(tabla) {
  // Columna de cada celda del encabezado (respeta colspan y rowspan)
  const filas = [...tabla.tHead.rows], ocup = [], porCol = [];
  filas.forEach((tr, r) => {
    let c = 0;
    [...tr.cells].forEach(th => {
      while (ocup[r] && ocup[r][c]) c++;
      const cs = th.colSpan || 1, rs = th.rowSpan || 1;
      for (let i = 0; i < rs; i++) for (let j = 0; j < cs; j++) { ocup[r + i] = ocup[r + i] || []; ocup[r + i][c + j] = 1; }
      if (cs === 1) porCol[c] = th;   // la de más abajo gana
      th.dataset.afc = cs === 1 ? c : '';
      c += cs;
    });
  });
  return porCol;
}
function afCelda(tr, col) {
  let c = 0;
  for (const td of tr.cells) { const cs = td.colSpan || 1; if (col >= c && col < c + cs) return cs === 1 ? td : null; c += cs; }
  return null;
}
const afTexto = td => { if (!td) return ''; const i = td.querySelector('input,select'); return (i ? i.value : td.textContent).trim(); };
function afPreparar(tabla) {
  if (tabla.dataset.af || !tabla.tHead || !tabla.tBodies[0] || tabla.tBodies[0].rows.length < 2) return;
  tabla.dataset.af = '1';
  tabla._af = {};
  const porCol = afGrilla(tabla);
  porCol.forEach((th, col) => {
    if (!th || th.querySelector('.af-btn') || !th.textContent.trim() && !th.innerHTML.trim()) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'af-btn'; b.title = 'Filtrar u ordenar'; b.textContent = '▾'; b.dataset.col = col;
    th.appendChild(b);
  });
}
function afAplicar(tabla) {
  const f = tabla._af || {}, cols = Object.keys(f).filter(k => f[k]);
  [...tabla.tBodies[0].rows].forEach(tr => {
    if (AF_ESPECIAL.test(tr.className)) { tr.hidden = cols.length > 0 && /gen-grupo|gen-sub/.test(tr.className); return; }
    tr.hidden = cols.some(k => !f[k].has(afTexto(afCelda(tr, +k))));
  });
  tabla.querySelectorAll('.af-btn').forEach(b => b.classList.toggle('on', !!f[b.dataset.col]));
}
function afAbrir(btn) {
  afCerrar();
  const tabla = btn.closest('table'), col = +btn.dataset.col, filas = [...tabla.tBodies[0].rows].filter(tr => !AF_ESPECIAL.test(tr.className));
  const valores = [...new Set(filas.map(tr => afTexto(afCelda(tr, col))))].sort((a, b) => {
    const x = Number(String(a).replace(/\./g, '').replace(',', '.')), y = Number(String(b).replace(/\./g, '').replace(',', '.'));
    return (!isNaN(x) && !isNaN(y) && a !== '' && b !== '') ? x - y : a.localeCompare(b, 'es');
  });
  const act = (tabla._af || {})[col];
  const caja = document.createElement('div');
  caja.className = 'af-caja';
  caja.innerHTML = '<button type="button" data-afo="asc">Ordenar A → Z</button><button type="button" data-afo="desc">Ordenar Z → A</button>' +
    '<input type="search" placeholder="Buscar…" class="af-bus"><label class="af-todo"><input type="checkbox" checked> (Seleccionar todo)</label>' +
    '<div class="af-lista">' + valores.map(v => '<label><input type="checkbox" value="' + esc(v) + '"' + (!act || act.has(v) ? ' checked' : '') + '> ' + (v === '' ? '<i>(vacías)</i>' : esc(v)) + '</label>').join('') + '</div>' +
    '<div class="af-pie"><button type="button" class="btn chico" data-afx>Borrar filtro</button><button type="button" class="btn chico prim" data-afok>Aceptar</button></div>';
  document.body.appendChild(caja);
  const r = btn.getBoundingClientRect();
  caja.style.left = Math.max(6, Math.min(window.innerWidth - 270, r.left - 200)) + 'px';
  caja.style.top = Math.min(window.innerHeight - 340, r.bottom + 4) + 'px';
  const checks = () => [...caja.querySelectorAll('.af-lista input')];
  caja.querySelector('.af-todo input').checked = checks().every(c => c.checked);
  caja.querySelector('.af-todo input').onchange = e => checks().forEach(c => { if (!c.parentElement.hidden) c.checked = e.target.checked; });
  caja.querySelector('.af-bus').oninput = e => { const q = norm(e.target.value); checks().forEach(c => { c.parentElement.hidden = q && norm(c.value).indexOf(q) < 0; }); };
  caja.querySelector('[data-afx]').onclick = () => { delete tabla._af[col]; afAplicar(tabla); afCerrar(); };
  caja.querySelector('[data-afok]').onclick = () => {
    const q = caja.querySelector('.af-bus').value.trim();
    const sel = new Set(checks().filter(c => c.checked && !c.parentElement.hidden).map(c => c.value));
    tabla._af = tabla._af || {};
    if (sel.size === valores.length && !q) delete tabla._af[col]; else tabla._af[col] = sel;
    afAplicar(tabla); afCerrar();
  };
  caja.querySelectorAll('[data-afo]').forEach(b => b.onclick = () => {
    const tb = tabla.tBodies[0], desc = b.dataset.afo === 'desc';
    const comunes = [...tb.rows].filter(tr => !AF_ESPECIAL.test(tr.className)), especiales = [...tb.rows].filter(tr => AF_ESPECIAL.test(tr.className));
    if (especiales.some(tr => /gen-grupo|gen-sub/.test(tr.className))) { toast('Esta tabla está agrupada: se puede filtrar pero no ordenar.', true); return; }
    comunes.sort((a, c) => {
      const x = afTexto(afCelda(a, col)), y = afTexto(afCelda(c, col));
      const nx = Number(x.replace(/\./g, '').replace(',', '.')), ny = Number(y.replace(/\./g, '').replace(',', '.'));
      const o = (x !== '' && y !== '' && !isNaN(nx) && !isNaN(ny)) ? nx - ny : x.localeCompare(y, 'es');
      return desc ? -o : o;
    }).forEach(tr => tb.insertBefore(tr, especiales[0] || null));
    afCerrar();
  });
  setTimeout(() => caja.querySelector('.af-bus').focus(), 30);
}
function afCerrar() { $$('.af-caja').forEach(x => x.remove()); }
document.addEventListener('click', e => {
  const b = e.target.closest('.af-btn');
  if (b) { e.preventDefault(); e.stopPropagation(); afAbrir(b); return; }
  if (!e.target.closest('.af-caja')) afCerrar();

document.addEventListener('keydown', e => { if ((e.key === 'Escape' || e.key === 'Esc') && $('.af-caja')) { afCerrar(); e.stopPropagation(); } }, true);
new MutationObserver(() => {
  clearTimeout(window.__afT);
  window.__afT = setTimeout(() => $$(AF_SEL).forEach(afPreparar), 120);
}).observe(document.body, { childList: true, subtree: true });

/* ============================================================
   PLANIFICACIÓN DE SERVICIOS (antes "Diagrama")
   Cada servicio se ve igual que su pestaña en la Planificación de la empresa: mismo diseño, colores,
   bordes, tipografía, anchos y alturas (salen del modelo, ver Formato.html), con las horas separadas en
   diurnas y nocturnas y la liquidación de horas (Diurnas, Nocturnas, Horas, Hs. Extras, Diferencias,
   estados, contratado y realizado por día). Se arma con lo que cargan los supervisores en Proyección y
   Novedades semanales: es lo mismo que después va al Consolidado, al STD y al 30/31 días.
   ============================================================ */
const PLANS = { zona: '', periodo: '', servicioId: '', datos: {} };
const COL = s => { let n = 0; for (const ch of s) n = n * 26 + ch.charCodeAt(0) - 64; return n; };
// Estados de la liquidación (columnas BW..CJ): los mismos títulos del modelo
const PLAN_COD_COLS = (() => { const v = (window.FORMATO_PLAN && FORMATO_PLAN.filas[8].v) || {}; const o = {}; for (let c = COL('BW'); c <= COL('CJ'); c++) o[c] = String(v[c] || '').toUpperCase(); return o; })();
const PLAN_AUSENCIA_COLS = ['BZ', 'CA', 'CB', 'CD', 'CE', 'CF', 'CI'].map(COL);
// Colores de los estados en los días (formato condicional de la pestaña de servicio)
function planColorCodigo(cod) {
  const t = String(cod || '').toUpperCase();

  if (t === 'F' || t === 'FCO') return { bg: '#c5e0b4', b: 1 };

}
function planNum(v, dec) {

  if (Math.abs(v) < 0.0001) return '';      // los ceros no se muestran

}

/* ---------- v1.21 · Formato igual al Excel: formatos de número y formato condicional ---------- */
// Formato de número de Excel (secciones positivo;negativo;cero;texto, decimales, miles, [Red]). Coma decimal como en el Excel de la empresa.
function fmtXL(v, nf) {
  if (v === undefined || v === null || v === '') return { t: '' };
  if (typeof v !== 'number') return { t: String(v) };
  if (!isFinite(v)) return { t: '' };
  const gen = x => {
    if (Number.isInteger(x)) return String(x);
    const r = Number(x.toPrecision(10));
    return String(r).replace('.', ',');
  };
  if (!nf || nf === 'General' || /^@$/.test(nf)) return { t: gen(v) };
  if (/[dmyhs]/i.test(nf.replace(/\[[^\]]*\]|"[^"]*"/g, '')) && !/[0#]/.test(nf)) return { t: gen(v) };
  const sec = []; let cur = '', q = false;
  for (const ch of nf) { if (ch === '"') q = !q; if (ch === ';' && !q) { sec.push(cur); cur = ''; } else cur += ch; }
  sec.push(cur);
  let f = sec[0], val = v, sign = '';
  if (v < 0 && sec.length > 1) { f = sec[1]; val = -v; }
  else if (v === 0 && sec.length > 2) f = sec[2];
  else if (v < 0) { sign = '-'; val = -v; }
  let color = null;
  const mc = f.match(/\[(Red|Rojo|Blue|Azul|Green|Verde)\]/i);
  if (mc) color = /red|rojo/i.test(mc[1]) ? '#ff0000' : /blue|azul/i.test(mc[1]) ? '#0000ff' : '#008000';
  f = f.replace(/\[[^\]]*\]/g, '').replace(/_./g, '').replace(/\\(.)/g, '$1').replace(/\*./g, '');
  const m = f.match(/[#0,]*0?(\.[0#]+)?/g).filter(Boolean).sort((a, b) => b.length - a.length)[0] || '';
  if (!m) return { t: f.replace(/"/g, '').trim() || '', color };
  const dec = (m.split('.')[1] || '').length, miles = m.split('.')[0].indexOf(',') >= 0, pct = f.indexOf('%') >= 0;
  if (pct) val = val * 100;
  let num = val.toFixed(dec);
  let [ent, de] = num.split('.');
  if (miles) ent = ent.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  num = ent + (de ? ',' + de : '');
  if (/^-?0+([.,]0+)?$/.test(num) && sign) sign = '';
  const i = f.indexOf(m);
  const pre = f.slice(0, i).replace(/"/g, ''), pos = f.slice(i + m.length).replace(/"/g, '');
  return { t: (sign + pre + num + pos).trim(), color };
}
// Reglas de formato condicional del modelo (incluye los colores de los estados).
// reglas: [{rg:[[r1,c1,r2,c2]], t, op, tx, f, st}] ordenadas por prioridad · fila/col: coordenadas del modelo · v: valor.
function cfXL(reglas, fila, col, v) {
  if (!reglas) return null;
  let out = null;
  const txt = typeof v === 'number' ? String(v) : String(v === undefined || v === null ? '' : v);
  for (const r of reglas) {
    if (!r.rg.some(g => fila >= g[0] && fila <= g[2] && col >= g[1] && col <= g[3])) continue;
    let ok = false;

// v1.22.8: al arrastrar una selección hasta el borde, la tabla (o la página) se desplaza sola sin soltar el mouse
const autoDesplazar = {
  x: 0, y: 0, t: null, on: false,
  iniciar(e, t) { this.t = t; this.x = e.clientX; this.y = e.clientY; if (!this.on) { this.on = true; requestAnimationFrame(() => this.paso()); } },
  contenedor(el) {
    for (let p = el.parentElement; p; p = p.parentElement) {
      const cs = getComputedStyle(p);
      if (/(auto|scroll)/.test(cs.overflowX + cs.overflowY) && (p.scrollWidth > p.clientWidth || p.scrollHeight > p.clientHeight)) return p;
    }
    return null;
  },
  paso() {
    const activo = (PSEL.arr && PSEL.t) || (SEL.arrastrando && S.vista === 'planilla') || RELL.activo;
    if (!activo || !this.t || !this.t.isConnected) { this.on = false; return; }
    const c = this.contenedor(this.t), M = 36, V = 18;
    const r = c ? c.getBoundingClientRect() : { left: 0, top: 0, right: innerWidth, bottom: innerHeight };
    // borde izquierdo útil: donde terminan las columnas fijas
    let izq = r.left;
    const fin = this.t.querySelector('.fijo-fin, td.fijo.xe, th.fijo.xe');
    if (fin) izq = Math.max(izq, fin.getBoundingClientRect().right);
    let dx = 0, dy = 0;
    if (this.x < izq + M) dx = -V * Math.min(3, 1 + (izq + M - this.x) / 40); else if (this.x > r.right - M) dx = V * Math.min(3, 1 + (this.x - r.right + M) / 40);
    if (this.y < r.top + M) dy = -V; else if (this.y > r.bottom - M) dy = V;
    if (dx || dy) {
      if (c) { c.scrollLeft += dx; c.scrollTop += dy; }
      if (!c || (dy && (c.scrollHeight <= c.clientHeight))) window.scrollBy(c ? 0 : dx, dy);
      const el = document.elementFromPoint(Math.max(r.left + 2, Math.min(this.x, r.right - 2)), Math.max(r.top + 2, Math.min(this.y, r.bottom - 2)));
      if (el) el.dispatchEvent(new MouseEvent('mouseover', { bubbles: true, clientX: this.x, clientY: this.y }));
    }
    requestAnimationFrame(() => this.paso());
  }
};

  return simR(n);
}
const simEsqNombre = e => e[1] === 0 ? 'Fijo (todos los días del puesto)' : e[0] + 'x' + e[1];

// Días del período de referencia
function simDiasPeriodo(periodo) {
  const inf = periodoInfo(periodo), fer = {};
  (S.base && S.base.feriados || []).forEach(f => { fer[f.Fecha] = f.Descripcion || 'Feriado'; });
  const out = [];
  for (let i = 0; i < inf.n; i++) {
    const d = new Date(inf.desde.getTime() + i * 864e5), iso = d.toISOString().slice(0, 10);
    out.push({ i, d, iso, dia: (d.getUTCDay() + 6) % 7, fer: fer[iso] || '', txt: pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1) });
  }
  return out;
}
// Días que cubre un puesto en el período
function simDiasPuesto(p, dias) { return dias.filter(x => p.dias[x.dia] && (p.fer || !x.fer)); }

// Turnos en que se puede partir la franja del puesto
function simPartidas(p, dias) {
  let ini = simHora(p.desde), fin = simHora(p.hasta), L;
  const cub = simDiasPuesto(p, dias).length || 1;
  if (ini == null || fin == null) {
    const hm = Number(String(p.horasMes || '').replace(',', '.')) || 0;
    // horas del mes -> horas por día (720 hs = 24 hs; se redondea al valor común más cercano si está a menos del 5 %)
    L = hm / cub / (p.cant || 1);
    const comun = [24, 16, 12, 10, 9, 8, 6].find(v => Math.abs(L - v) / v <= 0.05);
    L = Math.min(24, comun || Math.round(L * 2) / 2) || 24; ini = 6;
  } else { L = fin - ini; if (L <= 0) L += 24; }
  const cuantos = [];
  if (L <= 12) cuantos.push(1);
  if (p.turno === 'unico' && L <= 12) return [simTurnos(ini, L, 1)];
  const k12 = Math.ceil(L / 12), k8 = Math.ceil(L / 8 - 1e-9);
  if (p.turno === '12') cuantos.push(Math.max(1, k12));
  else if (p.turno === '8') cuantos.push(Math.max(1, k8));
  else { if (L > 12) cuantos.push(k12); if (L > 9) cuantos.push(k8); }
  return [...new Set(cuantos)].map(k => simTurnos(ini, L, k));
}
function simTurnos(ini, L, k) {
  const h = L / k;
  return Array.from({ length: k }, (_, j) => { const s = ini + j * h, n = simNoche(s, h); return { ini: s, h: simR(h), n, d: simR(h - n), txt: simHHMM(s) + ' a ' + simHHMM(s + h) }; });
}

// Penalidad de una persona según sus horas del mes (cuanto más cerca de 216 y menos extras, mejor)
function simPena(h, par) {
  return Math.abs(h - par.obj) + 0.25 * Math.max(0, h - par.base) + 5 * Math.max(0, h - par.max) + 3 * Math.max(0, par.min - h);
}

/* Simula un puesto con un esquema: k titulares en rotación w x o sobre los días que cubre el puesto.
   Devuelve las horas de cada titular, los turnos que quedan sin cubrir (los cubre el franquero) y el detalle día por día. */
function simGrupo(p, turnos, esq, k, dias) {
  const cub = simDiasPuesto(p, dias), [w, o] = esq, c = w + o, S = turnos.length * (p.cant || 1);
  // p._fase corre el arranque de cada puesto para que los francos de los distintos puestos no caigan todos el mismo día
  const tit = Array.from({ length: k }, (_, j) => ({ off: Math.round(j * c / k) + (p._fase || 0), h: 0, d: 0, n: 0, dias: {}, ayer: null, diaAyer: -9 }));
  const falta = [];
  cub.forEach((x, t) => {
    const trab = tit.filter(q => o === 0 || ((t + q.off) % c) < w);
    // turnos del día, del último al primero: así el que viene de un turno de la mañana puede pasar al de la tarde o la noche
    // (nunca al revés: de noche a la mañana siguiente no hay 12 hs de descanso)
    const slots = [];
    for (let r = 0; r < (p.cant || 1); r++) turnos.forEach((tu, j) => slots.push({ j, tu }));
    slots.sort((a, b) => b.j - a.j);
    const libres = trab.slice();
    slots.forEach(sl => {
      const ayer = q => (q.diaAyer === x.i - 1 ? q.ayer : null);
      const ok = libres.filter(q => ayer(q) === null || ayer(q) <= sl.j);
      ok.sort((a, b) => {
        const pa = ayer(a) === sl.j ? 0 : ayer(a) === null ? 1 : 2, pb = ayer(b) === sl.j ? 0 : ayer(b) === null ? 1 : 2;
        return pa - pb || a.h - b.h;
      });
      const q = ok[0];
      if (!q) { falta.push({ dia: x.i, turno: sl.tu, j: sl.j }); return; }
      libres.splice(libres.indexOf(q), 1);
      q.dias[x.i] = { j: sl.j, tu: sl.tu }; q.h += sl.tu.h; q.d += sl.tu.d; q.n += sl.tu.n; q.ayer = sl.j; q.diaAyer = x.i;
    });
  });
  return { tit, falta, faltaH: falta.reduce((a, f) => a + f.turno.h, 0), S, cubDias: cub.length };
}

// Opciones de un puesto: partida en turnos × esquema × cantidad de titulares
function simOpciones(p, dias, par) {
  const out = [], cub = simDiasPuesto(p, dias).length;
  if (!cub) return out;
  simPartidas(p, dias).forEach(turnos => {
    const S = turnos.length * (p.cant || 1);
    const esqs = p.esquema && p.esquema !== 'auto' ? [p.esquema.split('x').map(Number)] : SIM_ESQUEMAS;
    esqs.forEach(esq => {
      const [w, o] = esq, c = w + o;
      if (o === 0 && cub === dias.length && turnos[0].h * cub > par.max * 1.25) return;   // fijo todos los días: imposible sin extras enormes
      const ideal = S * c / Math.max(1, w), ks = [...new Set([Math.max(1, Math.floor(ideal)), Math.max(1, Math.ceil(ideal))])];
      if (o === 0) ks.splice(0, ks.length, S);
      ks.forEach(k => {
        const g = simGrupo(p, turnos, esq, k, dias);
        const hs = g.tit.map(q => q.h);
        const pena = hs.reduce((a, h) => a + simPena(h, par), 0) + g.faltaH * 0.12 + (g.faltaH / par.obj) * 2;
        out.push({ key: turnos.length + 't|' + esq.join('x') + '|' + k, turnos, esq, k, g, hs, pena,
          prom: hs.length ? hs.reduce((a, b) => a + b, 0) / hs.length : 0, max: Math.max(0, ...hs), min: hs.length ? Math.min(...hs) : 0,
          extras: hs.reduce((a, h) => a + Math.max(0, h - par.base), 0) });
      });
    });
  });
  return out.sort((a, b) => a.pena - b.pena);
}

/* Arma la proyección completa con las opciones elegidas (o las mejores) */
function simArmar() {
  const par = SIM.par, dias = simDiasPeriodo(SIM.periodo), n = dias.length;
  const opts = {}, elegidas = {};
  SIM.puestos.forEach((p, i) => { p._fase = i * 2; opts[p.id] = simOpciones(p, dias, par); });
  // mejor combinación: se arranca con la mejor de cada puesto y se prueba cambiar puesto por puesto (3 vueltas)
  SIM.puestos.forEach(p => { const l = opts[p.id]; const k = SIM.elegidas[p.id]; elegidas[p.id] = (k && l.find(o => o.key === k)) || l[0]; });
  const total = el => simTotal(el, par, n);
  if (!Object.keys(SIM.elegidas).length) {
    for (let v = 0; v < 3; v++) SIM.puestos.forEach(p => {
      let mejor = elegidas[p.id], mejorT = total(elegidas).pena;
      opts[p.id].slice(0, 8).forEach(o => { const prueba = Object.assign({}, elegidas, { [p.id]: o }), t = total(prueba).pena; if (t < mejorT - 1e-6) { mejor = o; mejorT = t; } });
      elegidas[p.id] = mejor;
    });
  }
  const tot = total(elegidas);
  const res = simCronograma(elegidas, tot, dias, par);
  return { dias, opts, elegidas, tot, res };
}
// Totales de una combinación: titulares + franqueros/vacacioneros (con la reserva de licencias y vacaciones)
function simTotal(el, par, n) {
  let req = 0, faltaH = 0;
  const tit = [], porDia = {};
  Object.keys(el).forEach(id => { const o = el[id]; if (!o) return; o.g.tit.forEach(q => tit.push(q.h)); faltaH += o.g.faltaH; req += o.g.tit.reduce((a, q) => a + q.h, 0) + o.g.faltaH;
    o.g.falta.forEach(f => { porDia[f.dia] = (porDia[f.dia] || 0) + 1; }); });
  // el día que más turnos quedan sin titular + los que en promedio están de vacaciones: hacen falta al menos esos franqueros
  const pico = Math.max(0, ...Object.values(porDia)) + Math.ceil(tit.length * par.vac / 365);
  const reservaLic = req * par.lic / 100, reservaVac = req * par.vac / 365;
  const pool = faltaH + reservaLic + reservaVac;
  // franqueros: el número que deja sus horas más cerca del objetivo
  let nPool = 0;
  if (pool > 0) {
    const a = Math.max(1, Math.floor(pool / par.obj)), b = Math.max(1, Math.ceil(pool / par.obj));
    nPool = a * simPena(pool / a, par) <= b * simPena(pool / b, par) ? a : b;
  }
  if (pool > 0 && pico > nPool) nPool = pico;
  const hPool = nPool ? pool / nPool : 0;
  const todos = tit.concat(Array(nPool).fill(hPool));
  // Los franqueros no se castigan por hacer pocas horas (se pueden compartir con otro servicio): se cuenta cada hora que
  // depende de ellos (mejor que la cubra un titular) y lo que pasen del máximo.
  const pena = tit.reduce((a, h) => a + simPena(h, par), 0) + 0.15 * pool + nPool * 5 * Math.max(0, hPool - par.max);
  return { req, faltaH, reservaLic, reservaVac, pool, nPool, hPool, nTit: tit.length, personas: todos.length, pena,
    prom: todos.length ? todos.reduce((a, b) => a + b, 0) / todos.length : 0 };
}

/* Cronograma del período: titulares con su esquema, vacaciones del mes (según el cronograma anual) y franqueros que cubren lo que falta */
function simCronograma(el, tot, dias, par) {
  const filas = [], faltas = [];
  SIM.puestos.forEach(p => {
    const o = el[p.id]; if (!o) return;
    o.g.tit.forEach((q, j) => filas.push({ nombre: 'Vigilador ' + (filas.length + 1), puesto: p.nombre, tipo: 'tit', pid: p.id,
      turnoTxt: o.turnos.length === 1 ? o.turnos[0].txt : o.turnos.map(t => t.txt).join(' / '), esquema: simEsqNombre(o.esq), cel: Object.assign({}, q.dias) }));
    o.g.falta.forEach(f => faltas.push(Object.assign({ puesto: p.nombre, pid: p.id }, f)));
  });
  // franqueros / vacacioneros
  const nPool = tot.nPool;
  for (let k = 0; k < nPool; k++) filas.push({ nombre: 'Franquero ' + (k + 1), puesto: 'Franquero / vacacionero', tipo: 'pool', turnoTxt: 'Cubre francos, vacaciones y licencias', esquema: 'Según necesidad', cel: {} });
  // cronograma anual de vacaciones (14 días) y las del mes de referencia
  const vac = simVacaciones(filas, par);
  filas.forEach((f, i) => {
    const v = vac.find(x => x.fila === i && x.periodo === SIM.periodo);
    if (!v) return;
    f.vacDias = 0;
    dias.forEach(x => {
      if (x.iso < v.desde || x.iso > v.hasta) return;
      f.vacDias++;
      const c = f.cel[x.i];
      if (c && c.tu) faltas.push({ dia: x.i, turno: c.tu, j: c.j, puesto: f.puesto, pid: f.pid, porVac: true });
      f.cel[x.i] = { vac: true };
    });
  });
  // los franqueros cubren lo que falta (12 hs de descanso entre turnos, hasta 6 días seguidos, el que menos horas tiene)
  const pool = filas.filter(f => f.tipo === 'pool');
  const horas = f => Object.values(f.cel).reduce((a, c) => a + (c.tu ? c.tu.h : 0), 0);
  const puede = (f, x, tu) => {
    if (f.cel[x]) return false;
    const prev = f.cel[x - 1];
    if (prev && prev.tu && (prev.tu.ini + prev.tu.h) - 24 + 12 > tu.ini) return false;   // descanso de 12 hs
    const sig = f.cel[x + 1];
    if (sig && sig.tu && (tu.ini + tu.h) - 24 + 12 > sig.tu.ini) return false;
    let seg = 0; for (let d = x - 1; d >= 0 && f.cel[d] && f.cel[d].tu; d--) seg++;
    return seg < 6;
  };
  faltas.sort((a, b) => a.dia - b.dia || a.turno.ini - b.turno.ini);
  let sinCubrir = 0;
  faltas.forEach(fa => {
    let cand = pool.filter(f => puede(f, fa.dia, fa.turno)).sort((a, b) => horas(a) - horas(b))[0];
    if (!cand) {
      // nadie disponible: se suma un franquero más
      cand = { nombre: 'Franquero ' + (pool.length + 1), puesto: 'Franquero / vacacionero', tipo: 'pool', turnoTxt: 'Cubre francos, vacaciones y licencias', esquema: 'Según necesidad', cel: {}, agregado: true };
      pool.push(cand); filas.push(cand);
      if (!puede(cand, fa.dia, fa.turno)) { sinCubrir++; return; }
    }
    cand.cel[fa.dia] = { j: fa.j, tu: fa.turno, cubre: fa.puesto + (fa.porVac ? ' (vacaciones)' : '') };
  });
  // totales por persona (normales = 208 − vacaciones × 208 / días del período, como el Consolidado)
  const n = dias.length;
  filas.forEach(f => {
    let h = 0, d = 0, nn = 0, trab = 0;
    Object.values(f.cel).forEach(c => { if (c.tu) { h += c.tu.h; d += c.tu.d; nn += c.tu.n; trab++; } });
    const normales = par.base - (f.vacDias || 0) * par.base / n;
    Object.assign(f, { h: simR(h), d: simR(d), n: simR(nn), trab, francos: n - trab - (f.vacDias || 0), normales: simR(normales),
      extras: simR(h - normales > 0 && h - normales < par.base ? h - normales : 0) });
  });
  const reserva = tot.reservaLic, poolF = filas.filter(f => f.tipo === 'pool');
  return { filas, vac, sinCubrir, reservaPorFranquero: poolF.length ? reserva / poolF.length : 0 };
}

/* Cronograma anual de vacaciones: 12 períodos desde el de referencia, bloques de 14 días (del 26 y del 10 de cada período),
   repartidos para que no salgan juntos dos del mismo puesto y nunca más gente que franqueros. */
function simVacaciones(filas, par) {
  const out = [], dur = Math.max(1, Math.round(par.vac)), nPool = Math.max(1, filas.filter(f => f.tipo === 'pool').length);
  const slots = [];
  for (let m = 0; m < 12; m++) {
    const per = sumarMes(SIM.periodo, m), inf = periodoInfo(per);
    [0, 14].forEach(off => { const d0 = new Date(inf.desde.getTime() + off * 864e5); slots.push({ per, desde: d0.toISOString().slice(0, 10), hasta: new Date(d0.getTime() + (dur - 1) * 864e5).toISOString().slice(0, 10), gente: [] }); });
  }
  // orden intercalado por puesto para que los del mismo puesto queden separados
  const porP = {};
  filas.forEach((f, i) => { (porP[f.puesto] = porP[f.puesto] || []).push(i); });
  const orden = [], listas = Object.values(porP);
  for (let r = 0; listas.some(l => l.length > r); r++) listas.forEach(l => { if (l[r] !== undefined) orden.push(l[r]); });
  const paso = slots.length / Math.max(1, orden.length);
  orden.forEach((fi, k) => {
    let s = Math.floor(k * paso) % slots.length, intentos = 0;
    while (intentos < slots.length && (slots[s].gente.length >= nPool || slots[s].gente.some(g => filas[g].puesto === filas[fi].puesto && filas[fi].tipo === 'tit'))) { s = (s + 1) % slots.length; intentos++; }
    slots[s].gente.push(fi);
    out.push({ fila: fi, nombre: filas[fi].nombre, puesto: filas[fi].puesto, periodo: slots[s].per, desde: slots[s].desde, hasta: slots[s].hasta, dias: dur });
  });
  return out.sort((a, b) => a.desde < b.desde ? -1 : a.desde > b.desde ? 1 : 0);
}

    out[x.iso] = { d: simR(d), n: simR(n) };

}

  let contr = 0, real = 0, faltan = 0, sobran = 0, diasF = 0;
  for (let i = 0; i < n; i++) {

    contr += req; real += realDia[i]; if (df < -0.01) { faltan -= df; diasF++; } if (df > 0.01) sobran += df;
  }
  const hs = pers.map(x => x.h), prom = hs.length ? hs.reduce((a, b) => a + b, 0) / hs.length : 0, max = Math.max(0, ...hs), sobreMax = pers.filter(x => x.h > par.max);
  const kpi = (v, l, cls) => '<div class="sim-kpi ' + (cls || '') + '"><b>' + v + '</b><span>' + l + '</span></div>';
  return '<div class="sim-kpis">' + kpi(fmtN(contr), 'horas contratadas del mes') + kpi(fmtN(real), 'horas realizadas (cobertura)') +
    kpi(faltan ? '−' + fmtN(simR(faltan)) : '0', 'horas sin cubrir' + (diasF ? ' en ' + diasF + ' día' + (diasF > 1 ? 's' : '') : ''), faltan ? 'mal' : 'ok') +
    kpi(fmtN(simR(sobran)), 'horas de más (sobre lo contratado)', sobran ? 'aviso' : 'ok') +
    kpi(pers.length, 'personas · ' + fmtN(simR(prom)) + ' hs promedio') +

    kpi(fmtN(simR(ext)), 'horas extras (sobre ' + par.base + ')') + '</div>';
}

function simResultado(r) {
  const par = SIM.par, t = r.tot, cr = r.res, dias = r.dias;
  const tit = cr.filas.filter(f => f.tipo === 'tit'), pool = cr.filas.filter(f => f.tipo === 'pool');
  const todos = cr.filas, hsT = tit.map(f => f.h + 0);
  const prom = hsT.reduce((a, b) => a + b, 0) / (hsT.length || 1), maxH = Math.max(0, ...todos.map(f => f.h));
  // franqueros: horas del cronograma + la reserva de licencias. Si no llegan a una jornada, se pueden compartir con otro servicio.
  const hsPool = pool.reduce((a, f) => a + f.h + cr.reservaPorFranquero, 0), ftePool = hsPool / par.obj;
  const txtPool = pool.length ? pool.length + ' franquero' + (pool.length === 1 ? '' : 's') + '/vacacionero' + (pool.length === 1 ? '' : 's') + ' con ' + fmtN(hsPool) + ' hs en total' +
    (ftePool < pool.length - 0.25 ? ' (equivale a ' + fmtN(Math.round(ftePool * 10) / 10) + ' jornada' + (ftePool >= 1.05 ? 's' : '') + ': se puede compartir con otro servicio)' : '') : '';
  const extras = todos.reduce((a, f) => a + f.extras, 0);
  const cot = Number(String(SIM.horasCot || '').replace(/\./g, '').replace(',', '.')) || 0, req = t.req;
  const kpi = (v, l, cls) => '<div class="sim-kpi ' + (cls || '') + '"><b>' + v + '</b><span>' + l + '</span></div>';
  let h = '<div class="panel"><h3 style="margin-top:0">Resultado' + (SIM.nombre ? ': ' + esc(SIM.nombre) : '') + ' · ' + esc(nombrePeriodo(SIM.periodo)) + ' (' + dias.length + ' días)</h3>' +
    '<div class="sim-kpis">' + kpi(fmtN(req), 'horas a cubrir en el mes') +
    (cot ? kpi(fmtN(cot), 'horas cotizadas · ' + (Math.abs(cot - req) < 1 ? 'coinciden' : (req > cot ? 'faltan ' : 'sobran ') + fmtN(Math.abs(cot - req)) + ' hs en los puestos'), Math.abs(cot - req) < 1 ? 'ok' : 'aviso') : '') +
    kpi(todos.length, 'personas: ' + tit.length + ' titulares + ' + txtPool) +
    kpi(fmtN(prom), 'hs promedio de los titulares (objetivo ' + par.obj + ')', Math.abs(prom - par.obj) <= 12 ? 'ok' : 'aviso') +
    kpi(fmtN(maxH), 'hs la que más hace (máximo ' + par.max + ')', maxH <= par.max ? 'ok' : 'mal') +
    kpi(fmtN(extras), 'horas extras del mes (sobre ' + par.base + ')') +

async function simExcel(r) {
  try {
    await cargarLib(LIB_XLSX);
    const cr = r.res, dias = r.dias, wb = XLSX.utils.book_new();
    const cab1 = ['#', 'Persona', 'Puesto', 'Turno', 'Esquema'].concat(...dias.map(x => [x.txt + ' ' + SIM_DIAS[x.dia], ''])).concat(['Hs.', 'D', 'N', 'Días', 'Francos', 'Extras']);
    const cab2 = ['', '', '', '', ''].concat(...dias.map(() => ['D', 'N'])).concat(['', '', '', '', '', '']);
    const filas = cr.filas.map((f, i) => [i + 1, f.nombre, f.puesto, f.turnoTxt, f.esquema].concat(...dias.map(x => { const c = f.cel[x.i]; return !c ? ['F', ''] : c.vac ? ['VAC', ''] : [c.tu.d || '', c.tu.n || '']; }))
      .concat([f.h, f.d || '', f.n || '', f.trab, f.francos || '', f.extras || '']));
    const ws = XLSX.utils.aoa_to_sheet([['Proyección: ' + (SIM.nombre || '') + ' · ' + nombrePeriodo(SIM.periodo)], [], cab1, cab2].concat(filas));
    ws['!cols'] = [{ wch: 4 }, { wch: 16 }, { wch: 22 }, { wch: 20 }, { wch: 12 }].concat(...dias.map(() => [{ wch: 4 }, { wch: 4 }]));
    XLSX.utils.book_append_sheet(wb, ws, 'Cronograma');
    const op = [['Puesto', 'Turnos', 'Esquema', 'Titulares', 'Hs. de cada uno', 'Extras', 'Para el franquero', 'Elegida']];
    SIM.puestos.forEach(p => (r.opts[p.id] || []).slice(0, 12).forEach(o => op.push([p.nombre, o.turnos.map(x => x.txt).join(' / '), simEsqNombre(o.esq), o.k, o.hs.map(x => simR(x)).join(' / '), simR(o.extras), simR(o.g.faltaH), r.elegidas[p.id] && r.elegidas[p.id].key === o.key ? 'SÍ' : ''])));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(op), 'Opciones');
    const vac = [['Persona', 'Puesto', 'Período', 'Desde', 'Hasta', 'Días']].concat(cr.vac.map(v => [v.nombre, v.puesto, nombrePeriodo(v.periodo), fechaDMA(v.desde), fechaDMA(v.hasta), v.dias]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(vac), 'Vacaciones');
    const pu = [['Puesto', 'Cobertura']].concat(SIM.puestos.map(p => [p.nombre, simDescPuesto(p)]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pu), 'Puestos');
    XLSX.writeFile(wb, 'Proyección ' + (SIM.nombre || 'servicio') + ' - ' + nombrePeriodo(SIM.periodo) + '.xlsx');
  } catch (e) { toast(e.message, true); }
}

    EST.desde = $('#esDesde').value; EST.hasta = $('#esHasta').value; EST.empresa = $('#esEmp').value;

    $('#esCuerpo').innerHTML = '<div class="cargando">Calculando… (la primera vez puede tardar: lee todas las planillas del rango)</div>';

    pintar();

    $$('[data-est]', m).forEach(b => b.classList.toggle('on', b.dataset.est === EST.tab));

  ['esDesde', 'esHasta', 'esEmp'].forEach(id => { $('#' + id).onchange = cargar; });
  $('#esXls').onclick = () => estExcel();
  cargar();
}

    l.map(a => '<tr><td><b>' + esc(a.servicio) + '</b></td><td class="n">' + nz(a.prog) + '</td><td class="n"><b>' + estPct(a.pct) + '</b></td>' + tipos.map(k => '<td class="n">' + estPct(a.tipos[k] ? a.tipos[k] / a.prog * 100 : 0) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
}
async function estExcel() {
  const r = EST.datos; if (!r) return;
  try {
    await cargarLib(LIB_XLSX);
    const wb = XLSX.utils.book_new(), R = r.rotacion;
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Período', 'Dotación al inicio', 'Altas', 'Bajas', 'Dotación al final', 'Rotación %', 'Índice de rotación %']]
      .concat(R.porPeriodo.map(x => [nombrePeriodo(x.p), x.ini, x.altas, x.bajas, x.fin, x.rot, x.indice])).concat([[]], [['Año', 'Períodos', 'Altas', 'Bajas', 'Dotación promedio', 'Rotación anual %', 'Índice %']], R.porAnio.map(x => [x.anio, x.periodos, x.altas, x.bajas, x.prom, x.rot, x.indice]))), 'Rotación');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Período', 'Personas', 'Días trabajados', 'Días programados', 'Ausentismo %'].concat(r.tipos.map(k => r.nombres[k] + ' %'), r.tipos.map(k => r.nombres[k] + ' (días)'))]
      .concat(r.licencias.map(x => [nombrePeriodo(x.p), x.personas, x.trab, x.prog, x.pctAus].concat(r.tipos.map(k => x.pct[k]), r.tipos.map(k => x.tipos[k]))))), 'Licencias');
    XLSX.writeFile(wb, 'Estadísticas ' + nombrePeriodo(r.periodos[0].p) + ' a ' + nombrePeriodo(r.periodos[r.periodos.length - 1].p) + '.xlsx');
  } catch (e) { toast(e.message, true); }
}

// Perfil para el instructivo: ADMIN, SUPERVISOR o CONSULTA
function rolInstr() { return esAdmin() ? 'ADMIN' : (S.u && S.u.rol === 'CONSULTA' ? 'CONSULTA' : 'SUPERVISOR'); }
const NOMBRE_ROL_INSTR = { ADMIN: 'Administrador', SUPERVISOR: 'Supervisor', CONSULTA: 'Consulta' };
function instrVale(solo, rol) {
  if (!solo) return true;
  if (solo === 'ADMIN') return rol === 'ADMIN';
  if (solo === 'SUP') return rol === 'SUPERVISOR';
  if (solo === 'NOSUP') return rol !== 'SUPERVISOR';
  return true;
}
// Secciones que le corresponden a un perfil. acc = permisos del perfil elegido en "Ver como" (si no, los del usuario).
function instrSecciones(rol, acc) {
  const tiene = p => !p || (acc ? rol === 'ADMIN' || !!acc[p] : puede(p));
  return INSTR.filter(s => instrVale(s.soloRol, rol) && tiene(s.perm));
}
function rolDePerfil(p) { const n = norm(p || ''); return n === 'ADMINISTRADOR' ? 'ADMIN' : n === 'SUPERVISOR' ? 'SUPERVISOR' : 'CONSULTA'; }
function instrImg(s, rol) { return !s.img ? '' : typeof s.img === 'string' ? s.img : (s.img[rol] || s.img.def); }
// Busca el elemento que señala un paso: "#id", ".clase" o "text=Texto" (varias opciones separadas por ||)
function instrBuscar(m, raiz) {
  raiz = raiz || document;
  for (const alt of String(m || '').split('||')) {
    if (!alt) continue;
    if (alt.indexOf('text=') === 0) {
      const t = alt.slice(5).toLowerCase();
      const el = Array.from(raiz.querySelectorAll('button, .tab, .dia-tab, .proy-tit, h1, h2, h3, label, a'))
        .find(e => { const r = e.getBoundingClientRect(); return r.width && (e.innerText || '').trim().toLowerCase().indexOf(t) === 0; });
      if (el) return el;
    } else {
      const el = Array.from(raiz.querySelectorAll(alt)).find(e => { const r = e.getBoundingClientRect(); return r.width && r.height; });
      if (el) return el;
    }
  }
  return null;
}

const INSTRV = { perfil: '', perfiles: null, imgs: null };
async function instrImagenes() {
  if (window.IMG_INSTR) return window.IMG_INSTR;
  if (INSTRV.imgs) return INSTRV.imgs;
  try { INSTRV.imgs = await api('instructivoImg'); } catch (e) { INSTRV.imgs = {}; }
  return INSTRV.imgs || {};
}

async function vInstructivo() {
  $('#main').innerHTML = '<div class="cargando">Abriendo el instructivo…</div>';
  const imgs = await instrImagenes();
  // Administración puede ver cómo le queda el instructivo a cada perfil de "Usuarios y perfiles"
  if (esAdmin() && !INSTRV.perfiles) { try { INSTRV.perfiles = await api('perfiles'); } catch (e) { INSTRV.perfiles = { perfiles: [], filas: [] }; } }
  if (S.vista !== 'instructivo') return;
  let rol = rolInstr(), acc = null, nomPerfil = NOMBRE_ROL_INSTR[rol];
  if (esAdmin() && INSTRV.perfil) {
    rol = rolDePerfil(INSTRV.perfil); nomPerfil = INSTRV.perfil;
    acc = {}; (INSTRV.perfiles.filas || []).forEach(f => { acc[f.clave] = (f.acc || {})[INSTRV.perfil] || ''; });
  } else if (S.u && S.u.perfil) nomPerfil = S.u.perfil;
  const secs = instrSecciones(rol, acc);
  const figura = (s, n0) => {
    const im = imgs[instrImg(s, rol)];
    if (!im) return '';
    let n = 0;
    const marcas = s.pasos.map((p, k) => {
      if (!instrVale(p.solo, rol)) return '';
      n++;
      const xy = im.marcas && im.marcas[k];
      return xy ? '<span class="ins-mk" data-n="' + n + '" style="left:' + (xy[0] * 100).toFixed(2) + '%;top:' + (xy[1] * 100).toFixed(2) + '%">' + n + '</span>' : '';
    }).join('');
    return '<div class="ins-fig"><img src="' + im.src + '" alt="' + esc(s.t) + '" loading="lazy">' + marcas + '</div>';
  };
  const seccion = s => {
    const pasos = s.pasos.filter(p => instrVale(p.solo, rol));
    const tips = (s.tips || []).filter(p => instrVale(p.solo, rol));
    return '<section class="ins-sec" id="ins-' + s.k + '" style="--c:' + s.c + '">' +
      '<h2><i class="tile-ic">' + icono(s.ic) + '</i>' + esc(s.t) + '</h2>' +
      '<p class="ins-para"><b>Para qué sirve:</b> ' + s.para + '</p>' +
      figura(s) +
      (pasos.length ? '<ol class="ins-pasos">' + pasos.map((p, k) => '<li data-n="' + (k + 1) + '"><span class="ins-n">' + (k + 1) + '</span><div>' + p.t + '</div></li>').join('') + '</ol>' : '') +
      (s.img2 && imgs[s.img2] ? '<p class="ins-para" style="margin-top:14px"><b>' + s.img2t + '</b></p><div class="ins-fig"><img src="' + imgs[s.img2].src + '" alt="" loading="lazy"></div>' : '') +
      (tips.length ? '<div class="ins-tips"><b>💡 Para tener en cuenta</b><ul>' + tips.map(p => '<li>' + p.t + '</li>').join('') + '</ul></div>' : '') +
      (s.ir ? '<div class="pie" style="justify-content:flex-start"><button class="btn" data-insir="' + s.k + '">Ir a ' + esc(s.t) + ' →</button></div>' : '') +
      '</section>';
  };
  $('#main').innerHTML =
    '<div class="barra"><div><h1>Instructivo</h1><p class="sub" style="margin:0">Para qué sirve cada pantalla y cómo se usa. Perfil: <b>' + esc(nomPerfil) + '</b>. ' +
    'Los números de cada imagen corresponden a los pasos de abajo.</p></div><div class="esp"></div>' +
    (esAdmin() ? '<label class="campo" title="Elegí para quién es: el instructivo y el PDF muestran solo lo que tiene asignado ese perfil">Instructivo para<select id="insRol"><option value="">Administrador</option>' + opciones((INSTRV.perfiles.perfiles || []).filter(p => norm(p) !== 'ADMINISTRADOR').map(p => ({ v: p, t: p })), INSTRV.perfil) + '</select></label>' : '') +
    '<button class="btn btn-pdf" id="insPdf">Descargar PDF</button></div>' +
    '<div class="ins-wrap"><nav class="ins-idx">' + secs.map(s => '<a href="#ins-' + s.k + '" data-k="' + s.k + '" style="--c:' + s.c + '"><i>' + icono(s.ic) + '</i>' + esc(s.t) + '</a>').join('') + '</nav>' +
    '<div class="ins-cont">' + secs.map(seccion).join('') + '</div></div>';
  $('.ins-idx').onclick = e => { const a = e.target.closest('[data-k]'); if (!a) return; e.preventDefault(); const t = $('#ins-' + a.dataset.k); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  $('.ins-cont').onclick = e => {
    const b = e.target.closest('[data-insir]'); if (b) { const s = INSTR.find(x => x.k === b.dataset.insir); ir(s.ir[0], s.ir[1]); return; }
    const mk = e.target.closest('.ins-mk, .ins-pasos li'); if (!mk) return;
    const sec = mk.closest('.ins-sec'), n = mk.dataset.n;
    $$('.ins-mk, .ins-pasos li', sec).forEach(x => x.classList.toggle('on', x.dataset.n === n));
  };
  $('.ins-cont').onmouseover = e => {
    const mk = e.target.closest('.ins-mk, .ins-pasos li'); if (!mk) return;
    const sec = mk.closest('.ins-sec'), n = mk.dataset.n;
    $$('.ins-mk, .ins-pasos li', sec).forEach(x => x.classList.toggle('on', x.dataset.n === n));
  };
  if ($('#insRol')) $('#insRol').onchange = () => { INSTRV.perfil = $('#insRol').value; vInstructivo(); };
  $('#insPdf').onclick = () => instrPdf(rol, secs, imgs, nomPerfil);
}

// PDF del instructivo con el logo de Delben en cada página
async function instrPdf(rol, secs, imgs, nomPerfil) {
  const btn = $('#insPdf'); if (btn) { btn.disabled = true; btn.textContent = 'Armando el PDF…'; }
  try {
    await cargarLib(LIB_JSPDF);
    const doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
    const W = 210, H = 297, M = 14, AN = W - 2 * M;
    // Las capturas ya vienen en JPEG: se usan tal cual (el PDF queda liviano). El logo se pasa a PNG.
    const aPng = src => new Promise(res => { if (!src) return res(null); const im = new Image(); im.onload = () => {
      if (/^data:image\/jpe?g/.test(src)) return res({ d: src, f: 'JPEG', w: im.naturalWidth, h: im.naturalHeight });
      const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext('2d').drawImage(im, 0, 0); res({ d: c.toDataURL('image/png'), f: 'PNG', w: im.naturalWidth, h: im.naturalHeight }); }; im.onerror = () => res(null); im.src = src; });
    const logo = await aPng(window.LOGO_DELBEN);
    const hex = h => { const m = String(h).match(/^#?(..)(..)(..)$/); return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [11, 99, 201]; };
    const plano = h => String(h || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"');
    const hoy = new Date(), fecha = pad(hoy.getDate()) + '/' + pad(hoy.getMonth() + 1) + '/' + hoy.getFullYear();
    let y = 0;
    const encabezado = () => {
      if (logo) doc.addImage(logo.d, 'PNG', M, 7, 26, 26 * logo.h / logo.w, 'logoDelben', 'FAST');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(19, 38, 63); doc.text('Instructivo · Novedades del Personal', M + 32, 14);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(100); doc.text('Perfil: ' + nomPerfil + ' · ' + fecha, M + 32, 19.5);
      doc.setDrawColor(249, 115, 22); doc.setLineWidth(0.8); doc.line(M, 25, W - M, 25);
      y = 32;
    };
    const lugar = h => { if (y + h > H - 14) { doc.addPage(); encabezado(); } };
    const parrafo = (txt, tam, color, sangria) => {
      doc.setFontSize(tam); doc.setTextColor.apply(doc, color || [30, 30, 30]);
      const lineas = doc.splitTextToSize(plano(txt), AN - (sangria || 0));
      lineas.forEach(l => { lugar(tam * 0.45); doc.text(l, M + (sangria || 0), y); y += tam * 0.45; });
    };
    // Portada
    encabezado();
    doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(19, 38, 63); doc.text('Instructivo', M, y + 10); y += 18;
    doc.setFont('helvetica', 'normal');
    parrafo('Para qué sirve cada pantalla de Novedades del Personal y cómo se usa. Perfil: ' + nomPerfil + '.', 11, [60, 60, 60]); y += 4;
    doc.setFont('helvetica', 'bold'); parrafo('Contenido', 12, [19, 38, 63]); doc.setFont('helvetica', 'normal'); y += 1;
    secs.forEach((s, i) => parrafo((i + 1) + '. ' + s.t, 10.5, hex(s.c), 4));
    for (let i = 0; i < secs.length; i++) {
      const s = secs[i];
      doc.addPage(); encabezado();
      const col = hex(s.c);
      doc.setFillColor.apply(doc, col); doc.roundedRect(M, y - 6, AN, 10, 2, 2, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(255); doc.text((i + 1) + '. ' + s.t, M + 4, y + 0.8); y += 10;
      doc.setFont('helvetica', 'bold'); parrafo('Para qué sirve', 10.5, col); doc.setFont('helvetica', 'normal');
      parrafo(s.para, 10, [40, 40, 40]); y += 3;
      const im = imgs[instrImg(s, rol)];
      const pasosK = s.pasos.map((p, k) => ({ p, k })).filter(x => instrVale(x.p.solo, rol));
      if (im) {
        const png = await aPng(im.src);
        if (png) {
          let w = AN, h = w * png.h / png.w; if (h > 120) { h = 120; w = h * png.w / png.h; }
          lugar(h + 2);
          const x0 = M + (AN - w) / 2;
          doc.addImage(png.d, png.f, x0, y, w, h); doc.setDrawColor(200); doc.setLineWidth(0.2); doc.rect(x0, y, w, h);
          pasosK.forEach((x, n) => {
            const xy = im.marcas && im.marcas[x.k]; if (!xy) return;
            const cx = x0 + xy[0] * w, cy = y + xy[1] * h;
            doc.setFillColor(229, 57, 53); doc.setDrawColor(255); doc.setLineWidth(0.5); doc.circle(cx, cy, 2.6, 'FD');
            doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(255); doc.text(String(n + 1), cx, cy + 1.05, { align: 'center' });
          });
          doc.setFont('helvetica', 'normal');
          y += h + 6;
        }
      }
      if (pasosK.length) {
        doc.setFont('helvetica', 'bold'); parrafo('Cómo se usa', 10.5, col); doc.setFont('helvetica', 'normal'); y += 1;
        pasosK.forEach((x, n) => {
          const lineas = doc.splitTextToSize(plano(x.p.t), AN - 9);
          lugar(lineas.length * 4.6 + 1.5);
          doc.setFillColor(229, 57, 53); doc.circle(M + 2.6, y - 1.2, 2.4, 'F');
          doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(255); doc.text(String(n + 1), M + 2.6, y - 0.1, { align: 'center' });
          doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(30);
          lineas.forEach(l => { doc.text(l, M + 8, y); y += 4.6; });
          y += 1.5;
        });
      }
      if (s.img2 && imgs[s.img2]) {
        const png2 = await aPng(imgs[s.img2].src);
        if (png2) {
          let w = AN, h = w * png2.h / png2.w; if (h > 110) { h = 110; w = h * png2.w / png2.h; }
          y += 2; doc.setFont('helvetica', 'bold'); parrafo(s.img2t, 10, col); doc.setFont('helvetica', 'normal'); y += 1;
          lugar(h + 2); const x0 = M + (AN - w) / 2;
          doc.addImage(png2.d, png2.f, x0, y, w, h); doc.setDrawColor(200); doc.setLineWidth(0.2); doc.rect(x0, y, w, h); y += h + 5;
        }
      }
      const tips = (s.tips || []).filter(p => instrVale(p.solo, rol));
      if (tips.length) {
        y += 2; doc.setFont('helvetica', 'bold'); parrafo('Para tener en cuenta', 10.5, [180, 83, 9]); doc.setFont('helvetica', 'normal');
        tips.forEach(t => parrafo('•  ' + plano(t.t), 9.5, [60, 60, 60], 3));
      }
    }
    const nPag = doc.getNumberOfPages();
    for (let p = 1; p <= nPag; p++) { doc.setPage(p); doc.setFontSize(8); doc.setTextColor(140); doc.text('Delben · Novedades del Personal · página ' + p + ' de ' + nPag, W / 2, H - 7, { align: 'center' }); }
    doc.save('Instructivo Novedades del Personal - ' + nomPerfil + '.pdf');
  } catch (e) { toast('No se pudo armar el PDF: ' + e.message, true); }
  if (btn) { btn.disabled = false; btn.textContent = 'Descargar PDF'; }
}
