<script>
'use strict';

/* ============================================================
   NOVEDADES DEL PERSONAL  -  cliente v0.1
   ============================================================ */

const ES_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const DIAS = ['LUN', 'MAR', 'MIE', 'JUE', 'VIE', 'SAB', 'DOM'];
const DIAS_LARGO = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto',
  'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const CICLOS = [
  { v: '26-25', t: 'Del 26 al 25' },
  { v: '01-31', t: 'Mes calendario' },
  { v: '01-31-22', t: 'Mes calendario (se entrega el 22)' }
];
const TIPOS_CODIGO = ['FRANCO', 'LICENCIA', 'AUSENCIA', 'BAJA', 'OTRO'];
const FUNCIONES_PLUS = ['Encargado', 'Jefe de turno', 'Otra'];
const EMPRESAS = ['KTL', 'PPQ', 'LEG', 'KDE', 'LE GUYET'];

const S = {
  token: null, u: null, base: null, vista: 'menu', params: {},
  periodo: null, pl: null, sucio: false, codigos: {}, personalIdx: []
};

/* ---------- utilidades ---------- */

const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toUpperCase().replace(/\s+/g, ' ').trim();
const num = v => { const n = Number(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtN = n => { const r = Math.round(n * 10) / 10; return r.toLocaleString('es-AR'); };
const pad = n => ('0' + n).slice(-2);
const esAdmin = () => S.u && S.u.rol === 'ADMIN';

function periodoInfo(periodo) {
  const [y, m] = periodo.split('-').map(Number);
  const desde = new Date(Date.UTC(y, m - 1, 26));
  const hasta = new Date(Date.UTC(y, m, 25));
  return { desde, hasta, n: Math.round((hasta - desde) / 864e5) + 1 };
}
const fechaDia = (periodo, i) => new Date(periodoInfo(periodo).desde.getTime() + i * 864e5);
const diaSem = d => (d.getUTCDay() + 6) % 7;
const iso = d => d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
const ddmm = d => pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1);

function semanasPeriodo(periodo) {
  const info = periodoInfo(periodo);
  // Semanas cargadas a mano en Semanas informadas > Semanas (si no hay, van de lunes a domingo)
  const def = ((S.base && S.base.semanasDef) || []).filter(w => w.Periodo === periodo && w.Desde && w.Hasta);
  if (def.length) {
    const d0 = info.desde.getTime();
    return def.slice().sort((a, b) => Number(a.Semana) - Number(b.Semana)).map(w => ({
      numero: Number(w.Semana),
      desdeIdx: Math.max(0, Math.round((Date.parse(w.Desde + 'T00:00:00Z') - d0) / 864e5)),
      hastaIdx: Math.min(info.n - 1, Math.round((Date.parse(w.Hasta + 'T00:00:00Z') - d0) / 864e5))
    })).filter(w => w.desdeIdx <= w.hastaIdx);
  }
  const out = [];
  let cur = null;
  for (let i = 0; i < info.n; i++) {
    if (!cur || diaSem(fechaDia(periodo, i)) === 0) {
      cur = { numero: out.length + 1, desdeIdx: i, hastaIdx: i };
      out.push(cur);
    }
    cur.hastaIdx = i;
  }
  return out;
}

const isoATexto = iso => { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; };
function textoAIso(t) {
  const m = String(t || '').trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if (!m) return '';
  const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
  const d = new Date(Date.UTC(y, Number(m[2]) - 1, Number(m[1])));
  if (d.getUTCMonth() !== Number(m[2]) - 1) return '';
  return y + '-' + pad(Number(m[2])) + '-' + pad(Number(m[1]));
}
// Campo de fecha: se escribe dd/mm/aaaa o se elige con el calendario.
function campoFecha(attrs, iso) {
  return '<span class="fecha-campo"><input class="fecha-tx" ' + attrs + ' value="' + esc(isoATexto(iso)) + '" placeholder="dd/mm/aaaa" inputmode="numeric">' +
    '<input type="date" class="fecha-pick" tabindex="-1" value="' + esc(iso || '') + '" title="Elegir en el calendario"></span>';
}
// Une el calendario con el texto (delegado en un contenedor).
function enlazarFechas(cont, alCambiar) {
  cont.addEventListener('change', e => {
    if (!e.target.classList.contains('fecha-pick')) return;
    const tx = e.target.parentElement.querySelector('.fecha-tx');
    tx.value = isoATexto(e.target.value);
    tx.dispatchEvent(new Event('input', { bubbles: true }));
    if (alCambiar) alCambiar(tx);
  });
  cont.addEventListener('input', e => {
    if (!e.target.classList.contains('fecha-tx')) return;
    const iso = textoAIso(e.target.value);
    e.target.classList.toggle('mal', !!e.target.value.trim() && !iso);
    if (iso) e.target.parentElement.querySelector('.fecha-pick').value = iso;
  });
}

function periodoActual() {
  const h = new Date();
  let y = h.getFullYear(), m = h.getMonth() + 1;
  if (h.getDate() < 26) { m--; if (m < 1) { m = 12; y--; } }
  return y + '-' + pad(m);
}
// El día 26 el supervisor todavía completa el período que terminó el 25 (informa el 25 al día siguiente).
function periodoTrabajo() {
  return new Date().getDate() === 26 ? sumarMes(periodoActual(), -1) : periodoActual();
}
function sumarMes(p, k) {
  const [y, m] = p.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 1 + k, 1));
  return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1);
}
function nombrePeriodo(p) {
  const i = periodoInfo(p);
  const a = MESES[i.desde.getUTCMonth()], b = MESES[i.hasta.getUTCMonth()];
  return a + ' - ' + b + ' ' + i.hasta.getUTCFullYear();
}
function listaPeriodos(centro) {
  const out = [];
  for (let k = -6; k <= 1; k++) out.push(sumarMes(centro || periodoActual(), k));
  // Más los períodos que tienen datos (por ejemplo, el histórico desde 2023)
  ((S.base && S.base.periodosDatos) || []).forEach(p => { if (out.indexOf(p) < 0) out.push(p); });
  return out.sort();
}
function nombreMes(ym) {
  const [y, m] = ym.split('-').map(Number);
  return MESES[m - 1] + ' ' + y;
}

/* ---------- comunicación ---------- */

// Consultas que se repiten al ir y venir entre ventanas: se guardan 2 minutos (cualquier cambio las borra).
const API_CACHE = {}, API_CACHEABLES = { datosPeriodos: 1, ubicaciones: 1 };
function api(accion, datos) {
  // Lo que cambia datos borra las planillas guardadas en memoria
  if (/^(guardar|enviar|reabrir|nueva|marcar|cargar|subir|historico|limpiar|pegar|reparar|mandar)/.test(accion) || (datos && /^guardar/.test(datos.modo || ''))) {
    S.cachePl = {}; Object.keys(API_CACHE).forEach(k => delete API_CACHE[k]);
    try { Object.keys(VIS_CACHE).forEach(k => delete VIS_CACHE[k]); if (typeof PLANS !== 'undefined' && PLANS.datos) PLANS.datos = {}; } catch (e) { }
  }
  if (API_CACHEABLES[accion]) {
    const k = accion + JSON.stringify(datos || {}), c = API_CACHE[k];
    if (c && Date.now() - c.t < 120000) return c.p;
    const p = apiServidor(accion, datos);
    API_CACHE[k] = { t: Date.now(), p };
    p.catch(() => { delete API_CACHE[k]; });
    return p;
  }
  return apiServidor(accion, datos);
}
function apiServidor(accion, datos) {
  return new Promise((res, rej) => {
    const fin = r => {
      if (r && r.ok) return res(r.data);
      const msg = r ? r.error : 'Sin respuesta del servidor.';
      if (msg === 'SESION_VENCIDA') { salir(true); toast('La sesión venció. Volvé a entrar.', true); }
      const er = new Error(msg); if (r && r.authUrl) er.authUrl = r.authUrl;
      rej(er);
    };
    if (ES_GAS) {
      google.script.run.withSuccessHandler(fin)
        .withFailureHandler(e => rej(new Error(e && e.message ? e.message : String(e))))
        .api(S.token, accion, datos || {});
    } else {
      setTimeout(() => fin(MOCK.api(S.token, accion, JSON.parse(JSON.stringify(datos || {})))), 120);
    }
  });
}

function loginServidor(u, c) {
  return new Promise((res, rej) => {
    const fin = r => r && r.ok ? res(r.data) : rej(new Error(r ? r.error : 'Sin respuesta.'));
    if (ES_GAS) google.script.run.withSuccessHandler(fin).withFailureHandler(e => rej(e)).login(u, c);
    else setTimeout(() => fin(MOCK.login(u, c)), 150);
  });
}

/* ---------- avisos y modales ---------- */

let toastT = null;
function toast(msg, malo) {
  if (malo && /Cannot (set|read) properties of null/i.test(String(msg))) { console.warn(msg); return; }
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.className = 'toast' + (malo ? ' bad' : '');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.hidden = true; }, malo ? 6000 : 3500);
}

function modal(html) {
  $('#capaModal').innerHTML = '<div class="modal-fondo"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
  const primero = $('#capaModal input, #capaModal select, #capaModal textarea, #capaModal .btn.prim');
  if (primero) setTimeout(() => primero.focus(), 30);
  return $('#capaModal .modal');
}
function cerrarModal() { $('#capaModal').innerHTML = ''; }
const modalAbierto = () => !!$('#capaModal .modal');

function confirmar(titulo, texto, boton) {
  return new Promise(res => {
    const m = modal('<h3>' + esc(titulo) + '</h3><div>' + texto + '</div>' +
      '<div class="pie"><button class="btn" data-r="0">Cancelar</button>' +
      '<button class="btn prim" data-r="1">' + esc(boton || 'Aceptar') + '</button></div>');
    m.addEventListener('click', e => {
      const b = e.target.closest('[data-r]');
      if (!b) return;
      cerrarModal();
      res(b.dataset.r === '1');
    });
    S.modalCancelar = () => res(false);
  });
}

function leerForm(el) {
  const o = {};
  $$('[name]', el).forEach(i => {
    o[i.name] = i.type === 'checkbox' ? (i.checked ? 'SI' : 'NO') : i.value.trim();
  });
  return o;
}

function opciones(lista, sel) {
  return lista.map(o => {
    const v = typeof o === 'object' ? o.v : o, t = typeof o === 'object' ? o.t : o;
    return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(t) + '</option>';
  }).join('');
}

async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); toast('Copiado. Pegalo en Excel.'); }
  catch (e) { toast('No se pudo copiar desde este navegador.', true); }
}

/* ============================================================
   INICIO, LOGIN Y NAVEGACIÓN
   ============================================================ */

function guardarToken(t) { try { t ? sessionStorage.setItem('nov_token', t) : sessionStorage.removeItem('nov_token'); } catch (e) { } }
function tokenGuardado() { try { return sessionStorage.getItem('nov_token'); } catch (e) { return null; } }

/* ---------- Hablarle a la app ---------- */
// Comandos: "abrir planilla de ailinco", "personal", "buscar perez", "informes", "conformación", "presentismo",
// "programación", "semanas enviadas", "diagrama", "datos", "menú". Funciona en Chrome.
function iniciarVoz() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, b = $('#btnVoz');
  if (!b) return;
  b.hidden = false;
  b.onclick = () => {
    if (!SR) return pedirComando('Este navegador no reconoce la voz (usá Chrome).');
    let rec;
    try { rec = new SR(); } catch (e) { return pedirComando(); }
    rec.lang = 'es-AR'; rec.interimResults = false; rec.maxAlternatives = 1;
    let oyo = false, fallo = false;
    b.classList.add('escuchando'); toast('Te escucho…');
    rec.onresult = e => { oyo = true; ejecutarVoz(e.results[0][0].transcript); };
    rec.onerror = e => {
      fallo = true;
      b.classList.remove('escuchando');
      // Dentro de Google Apps Script el navegador bloquea el micrófono: se ofrece escribir o dictar con el teclado.
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') pedirComando();
      else if (!oyo) toast('No te escuché. Probá de nuevo.', true);
    };
    rec.onend = () => { b.classList.remove('escuchando'); if (!oyo && !fallo) pedirComando('No se escuchó nada.'); };
    try { rec.start(); } catch (e) { b.classList.remove('escuchando'); pedirComando(); }
  };
}
// Alternativa al micrófono: escribir el pedido (en el celular se puede dictar con el micrófono del teclado).
function pedirComando(motivo) {
  modal('<h3>¿Qué querés hacer?</h3>' +
    '<p class="sub">' + esc(motivo || 'Google no deja usar el micrófono dentro de la app mientras esté publicada en Apps Script.') +
    ' Escribilo acá o, en el celular, tocá el micrófono del teclado y dictalo.</p>' +
    '<input id="cmdTxt" class="cmd-in" placeholder="Ej.: abrir planilla de Ailinco · buscar Pérez · informes">' +
    '<div class="pie"><button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn prim" id="cmdIr">Ir</button></div>');
  const ir2 = () => { const t = $('#cmdTxt').value.trim(); if (!t) return; cerrarModal(); ejecutarVoz(t); };
  $('#cmdIr').onclick = ir2;
  $('#cmdTxt').addEventListener('keydown', e => { if (e.key === 'Enter') ir2(); });
}
function ejecutarVoz(texto) {
  const t = norm(texto);
  toast('«' + texto + '»');
  const servicioEn = () => {
    const ss = S.base.servicios.filter(s => s.Activo !== 'NO');
    return ss.find(s => t.includes(norm(s.Servicio))) || ss.find(s => norm(s.Servicio).split(' ').some(p => p.length > 3 && t.includes(p)));
  };
  if (/BUSCA|BUSCAR/.test(t)) { const q = t.replace(/.*BUSCA[R]?\s*(A\s+)?/, '').trim(); PF.q = q; return ir('personal'); }
  if (/PROYECCION/.test(t) && !servicioEn()) return ir('planilla');
  if (/PROGRAMACION|NOVEDADES SEMANAL/.test(t)) { const s = servicioEn(); return ir('planilla', { periodo: '__prog', servicioId: s && s.Id }); }
  if (/PLANILLA|SERVICIO|ABRI/.test(t) && servicioEn()) return ir('planilla', { servicioId: servicioEn().Id });
  const vistas = [['PERSONAL', 'personal'], ['INFORME', 'informes'], ['CONFORMACION', 'conformacion'], ['PRESENTISMO', 'presentismo'],
    ['SEMANA', esAdmin() ? 'bandeja' : 'missemanas'], ['PLANIFICACION DE SERVICIO', 'diagrama'], ['DIAGRAMA', 'diagrama'], ['DATOS', 'datos'], ['SERVICIOS', 'servicios'], ['USUARIO', 'usuarios'],
    ['PLUS', 'plus'], ['CODIGO', 'codigos'], ['MENU', 'menu'], ['INICIO', 'menu'], ['PLANILLA', 'planilla']];
  const v = vistas.find(x => t.includes(x[0]));
  if (v) return ir(v[1]);
  toast('No entendí "' + texto + '". Probá: "abrir planilla de Ailinco", "buscar Pérez", "informes".', true);
}

// v1.22.6: en toda la app no se muestran los ceros solos (una celda que dice solo 0, 0,0 o 0.00)
const RX_CERO = /^-?\$?\s?0+(?:[.,]0+)?\s?%?$/;
function ocultarCeros(raiz) {
  const celdas = raiz.matches && raiz.matches('td,th') ? [raiz] : (raiz.querySelectorAll ? raiz.querySelectorAll('td,th') : []);
  for (const c of celdas) {
    if (c.childElementCount > 1) continue;
    const el = c.childElementCount === 1 ? c.firstElementChild : c;
    if (el.childElementCount || /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(el.tagName) || el.closest('.cero-ok')) continue;
    const t = el.textContent;
    if (t && t.length < 9 && RX_CERO.test(t.trim())) el.textContent = '';
  }
}
// v1.22.8: personal al que se le abona Básico de 200 horas: en todas las pantallas su nombre va en celeste (#00FFFF)
const BASICO200 = ['DIAZ CLAUDIO VICTOR G.', 'POSOCCO HERNAN ALEJANDRO', 'PEREA CARLOS JAVIER', 'APARICIO ARIEL ABEL', 'JAY RICARDO ESTEBAN'];
const B200_TIT = 'Personal que se le abona Básico de 200 horas';
const B200_TOK = BASICO200.map(n => norm(n).replace(/[^A-Z ]/g, ' ').split(/\s+/).filter(x => x.length > 1));
const RX_B200 = new RegExp('\\b(' + [...new Set(B200_TOK.map(t => t[0]))].join('|') + ')\\b');
function esBasico200(txt) {
  const t0 = norm(txt);
  if (!t0 || t0.length > 70 || !RX_B200.test(t0)) return false;
  const t = t0.replace(/[^A-Z ]/g, ' ').split(/\s+/).filter(x => x.length > 1);
  if (t.length < 2) return false;
  return B200_TOK.some(b => b[0] === t[0] && t.every(x => b.indexOf(x) >= 0));
}
function marcarB200(el, si) {
  if (!el) return;
  el.classList.toggle('b200', !!si);
  if (si) el.title = B200_TIT; else if (el.title === B200_TIT) el.removeAttribute('title');
}
function repasarB200(raiz) {
  if (!raiz.querySelectorAll) return;
  const els = raiz.matches && raiz.matches('td,th,a,span,b,input.nom-in') ? [raiz] : [];
  els.push(...raiz.querySelectorAll('td,th,a,span,b,input.nom-in'));
  for (const el of els) {
    if (el.tagName === 'INPUT') { marcarB200(el.closest('td') || el, esBasico200(el.value)); continue; }
    if (el.childElementCount) continue;
    const t = el.textContent;
    if (!t || t.length > 70) continue;
    if (esBasico200(t)) marcarB200(el.closest('td,th') || el, true);
  }
}
document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('nom-in')) marcarB200(e.target.closest('td') || e.target, esBasico200(e.target.value)); }, true);
document.addEventListener('change', e => { if (e.target.classList && e.target.classList.contains('nom-in')) marcarB200(e.target.closest('td') || e.target, esBasico200(e.target.value)); }, true);
// v1.22.8: en Planificación de servicios, STD, Consolidado, 30/31 días y demás tablas por día, lo que está antes del día 26
// (orden, legajo, nombre, puesto, cliente...) queda fijo y solo se desplazan las fechas.
const SEL_FIJAR = 'table.plan-t, table.stx, table.std';
function fijarColumnas(t, forzar) {
  if (!t || !t.isConnected || !t.rows.length) return;
  const firma = t.rows.length + '|' + (t.rows[0].cells.length);
  if (!forzar && t.dataset.fijado === firma) return;
  // v1.25.5: antes de medir se sueltan las columnas fijadas (si cambió el ancho de alguna columna, se vuelve a calcular bien)
  if (t._fij) t._fij.forEach(td => { td.style.position = ''; td.style.left = ''; td.style.zIndex = ''; if (td._bgFij) { td.style.backgroundColor = ''; td._bgFij = false; } td.classList.remove('fijo-fin'); });
  t._fij = [];
  const g = (t._g = null, gridTabla(t));
  // primera columna de fechas: la celda que dice 26 (o 26/xx)
  let nFix = -1;
  for (let r = 0; r < Math.min(t.rows.length, 14) && nFix < 0; r++) for (const c of t.rows[r].cells) {
    if (/^26(\s|\/|$)/.test(c.textContent.trim())) { const p = g.pos.get(c); if (p && p.c > 0) { nFix = p.c; break; } }
  }
  if (nFix < 1) return;
  const lefts = [], cand = [];
  g.pos.forEach((p, td) => {
    if (p.c2 >= nFix) return;
    cand.push([td, td.offsetLeft, p]);
  });
  const fondoTabla = getComputedStyle(t).backgroundColor;
  const sinFondo = x => !x || x === 'transparent' || /rgba\(\d+,\s*\d+,\s*\d+,\s*0\)/.test(x);
  const bgs = cand.map(([td]) => getComputedStyle(td).backgroundColor);
  cand.forEach(([td, left, p], k) => {
    td.style.position = 'sticky'; td.style.left = left + 'px';
    td.style.zIndex = td.tagName === 'TH' || td.closest('thead') ? 5 : 3;
    if (sinFondo(bgs[k])) { td.style.backgroundColor = sinFondo(fondoTabla) ? '#fff' : fondoTabla; td._bgFij = true; }
    if (p.c2 === nFix - 1) td.classList.add('fijo-fin');
    t._fij.push(td);
  });
  t.dataset.fijado = firma;
  // v1.25.5: si después cambia el ancho de la tabla o de una columna fija (pantalla completa, letra que tarda en cargar,
  // filtros), se vuelve a calcular: así las columnas fijas no dejan un hueco por donde se ven los días de atrás.
  if (window.ResizeObserver && !t._ro) {
    t._ro = new ResizeObserver(() => { clearTimeout(t._roT); t._roT = setTimeout(() => { if (t.isConnected) { try { fijarColumnas(t, true); } catch (e) { } } else if (t._ro) { t._ro.disconnect(); } }, 150); });
    t._ro.observe(t);
  }
  if (t._ro) {
    const porFila = {}; cand.forEach(([td, , p]) => { (porFila[p.r] = porFila[p.r] || []).push(td); });
    const fila = Object.values(porFila).sort((a, b) => b.length - a.length)[0] || [];
    (t._roCeldas || []).forEach(c => { try { t._ro.unobserve(c); } catch (e) { } });
    t._roCeldas = fila; fila.forEach(c => t._ro.observe(c));
  }
}
function vigilarCeros() {
  let pend = new Set(), prog = false;
  const correr = () => {
    prog = false; const l = pend; pend = new Set(); const tablas = new Set();
    l.forEach(n => {
      if (!n.isConnected) return;
      ocultarCeros(n); try { repasarB200(n); } catch (e) { }
      if (n.querySelectorAll) { if (n.matches && n.matches(SEL_FIJAR)) tablas.add(n); n.querySelectorAll(SEL_FIJAR).forEach(x => tablas.add(x)); }
    });
    if (tablas.size) setTimeout(() => tablas.forEach(x => { try { fijarColumnas(x); } catch (e) { console.warn(e); } }), 30);
  };
  new MutationObserver(ms => {
    ms.forEach(m => {
      const t = m.type === 'characterData' ? m.target.parentElement : m.target;
      if (t && t.closest) { const c = t.closest('td,th'); if (c) pend.add(c); }
      m.addedNodes.forEach(n => { if (n.nodeType === 1) pend.add(n); });
    });
    if (!prog && pend.size) { prog = true; requestAnimationFrame(correr); }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
}

function vLogin(error) {
  $('#btnMenu').hidden = true;
  if ($('#btnSGI')) $('#btnSGI').hidden = true;
  $('#btnSalir').hidden = true;
  $('#quien').textContent = '';
  const demo = window.MODO_DEMO
    ? '<div class="demo">Para probar:<br>' +

      '<button class="btn" data-demo="scarabetta|1234">Entrar como supervisor Scarabetta</button>' +

      '<button class="btn" data-demo="reset" style="margin-top:12px">Borrar cambios de la demo</button></div>'
    : '';
  $('#main').innerHTML =
    '<form class="login" id="fLogin" autocomplete="on">' +
    (window.LOGO_DELBEN ? '<img class="login-logo" src="' + window.LOGO_DELBEN + '" alt="Delben">' : '') +
    '<h1>Novedades del Personal</h1><p class="sub">Planillas de cobertura y novedades del personal.</p>' +
    '<label class="campo">Usuario<input name="u" autocomplete="username" required></label>' +
    '<label class="campo">Clave<input name="c" type="password" autocomplete="current-password" required></label>' +
    '<button class="btn prim" type="submit">Entrar</button>' +
    '<div class="err">' + esc(error || '') + '</div>' + demo + '</form>';
  const f = $('#fLogin');
  f.onsubmit = e => { e.preventDefault(); if (f.u.value && f.c.value) entrar(f.u.value, f.c.value); else (f.u.value ? f.c : f.u).focus(); };
  // Enter en cualquiera de los dos campos entra
  // v1.21.2: con el usuario y la clave guardados por el navegador, Chrome recién deja leer la clave un instante después
  // de tocar una tecla: se espera un momento antes de leerla (si no, Enter no entraba y había que hacer clic).
  let entrando = false;
  const enterLogin = () => setTimeout(() => {
    if (entrando || !$('#fLogin')) return;
    if (f.u.value && f.c.value) { entrando = true; entrar(f.u.value, f.c.value).finally(() => { entrando = false; }); }
    else (f.u.value ? f.c : f.u).focus();
  }, 60);
  [f.u, f.c].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); enterLogin(); } }));
  // Enter aunque el cursor no esté en ningún campo
  if (!window.__enterLoginGlobal) {
    window.__enterLoginGlobal = true;
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || !$('#fLogin') || e.defaultPrevented) return;
      const t = e.target; if (t && (t.tagName === 'BUTTON' || t.closest && t.closest('#fLogin'))) return;
      e.preventDefault(); const ff = $('#fLogin'); if (ff) ff.requestSubmit ? ff.requestSubmit() : ff.onsubmit(new Event('submit'));
    });
  }
  $$('[data-demo]', f).forEach(b => b.onclick = () => {
    if (b.dataset.demo === 'reset') { MOCK.reiniciar(); toast('La demo volvió a los datos iniciales.'); return; }
    const [u, c] = b.dataset.demo.split('|');
    entrar(u, c);
  });
  f.u.focus();
}

async function entrar(u, c) {
  // v1.22.6: se ve enseguida que está entrando (antes parecía que Enter no hacía nada mientras el servidor respondía)
  const b = $('#fLogin button[type="submit"]');
  if (b) { if (b.disabled) return; b.disabled = true; b.innerHTML = '<span class="spin-mini"></span> Entrando…'; }
  if ($('#fLogin .err')) $('#fLogin .err').textContent = '';
  try {
    const r = await loginServidor(u, c);
    S.token = r.token;
    guardarToken(r.token);
    await cargarBase(r.base || null);
    ir('menu');
  } catch (e) {
    vLogin(e.message);
  }
}

function salir(silencioso) {
  S.token = null; S.u = null; S.base = null; S.pl = null; S.sucio = false; S.tabsPend = {}; S.cargadaSem = {};
  guardarToken(null);
  cerrarModal();
  vLogin();
}

async function ir(vista, params) {
  if (S.vista === 'diagrama' && vista !== 'diagrama' && PLANS.ed && planCambios().length) {
    if (!(await planConfirmarSalida())) return;
  }
  if (hayCambiosPl() && S.vista === 'planilla') {
    const n = tabsPendientes().length + (S.sucio ? 1 : 0);
    const ok = await confirmar('Cambios sin guardar', n > 1 ? 'Hay cambios en <b>' + n + ' pestañas</b> que no guardaste (' + esc(tabsPendientes().map(p => p.nombre).concat(S.sucio && S.pl ? [S.pl.serv.Servicio] : []).join(', ')) + ').' : 'Hay cambios en la planilla que no guardaste.', 'Salir sin guardar');
    if (!ok) return;
    S.sucio = false; S.tabsPend = {};
  }
  acCerrar();
  try { window.focus(); } catch (e) { }
  S.vista = vista;
  S.params = params || {};
  const v = VISTAS[vista] || VISTAS.menu;
  window.scrollTo(0, 0);
  try { await v(S.params); }
  catch (e) {
    // Si la sesión venció o el usuario ya se fue a otra pantalla, no se muestra el error técnico.
    if (!S.token || e.message === 'SESION_VENCIDA' || S.vista !== vista) return;
    if (/Cannot (set|read) properties of null/i.test(e.message)) { console.warn(e); return; }
    $('#main').innerHTML = '<div class="vacio-msg">' + esc(e.message) + '</div>';
  }
}

/* ============================================================
   PLANILLA DEL SERVICIO
   ============================================================ */

/**
 * Reparte las horas de un turno en diurnas (06 a 21) y nocturnas (21 a 06).
 * Mañana (D) empieza a las 06, tarde (T) a las 14 y noche (N) termina a las 06.
 *   8D = 06 a 14 -> 8 diurnas      12D = 06 a 18 -> 12 diurnas
 *   8T = 14 a 22 -> 7 + 1          12N = 18 a 06 -> 3 + 9
 *   8N = 22 a 06 -> 0 + 8          24  = 06 a 06 -> 15 + 9
 */
function repartirHoras(h, turno) {
  const ini = turno === 'T' ? 14 : turno === 'N' && h < 24 ? 30 - h : 6;
  return repartirDesde(ini, h);
}
// Horas nocturnas (21 a 06) de un turno de h horas que empieza a la hora ini (puede tener minutos: 7.5 = 07:30).
function repartirDesde(ini, h) {
  let n = 0;
  for (let k = -1; k <= 1; k++) {
    const a = 21 + 24 * k, b = 30 + 24 * k;
    n += Math.max(0, Math.min(ini + h, b) - Math.max(ini, a));
  }
  n = Math.round(n * 100) / 100;
  return { d: Math.round((h - n) * 100) / 100, n };
}

/**
 * Comentario de celda. Se guarda en la misma celda después de una barra: "9|Refuerzo de 18 a 03".
 * Si el comentario dice un horario, las horas se reparten según ese horario y no según el color.
 */
const valorBase = v => { const s = String(v || ''); const k = s.indexOf('|'); return (k < 0 ? s : s.slice(0, k)).trim().toUpperCase(); };
const notaDe = v => { const s = String(v || ''); const k = s.indexOf('|'); return k < 0 ? '' : s.slice(k + 1).trim(); };
function limpiarNota(t) { return String(t || '').replace(/[|\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200); }
// v1.22.7: si el comentario tiene un horario, las horas de la celda son las del horario (redondeadas a media hora)
function ajustarHorasPorNota(v) {
  const nota = notaDe(v), hor = horarioDeNota(nota);
  if (!hor) return v;
  const b = valorBase(v);
  if (b && !RX_HORAS.test(b)) return v;          // un código (F, ENF...) no se toca
  const h = Math.round(hor.dur * 2) / 2;
  if (!h) return v;
  return String(h) + colorPorHorario(hor.ini, h) + '|' + nota;
}
function horarioDeNota(nota) {
  const m = String(nota || '').toUpperCase().match(/(\d{1,2})(?:[:.](\d{2}))?\s*(?:HS\.?|H)?\s*(?:A|AL|-|HASTA)\s*(?:LAS\s*)?(\d{1,2})(?:[:.](\d{2}))?/);
  if (!m) return null;
  const ini = Number(m[1]) + (Number(m[2]) || 0) / 60, fin = Number(m[3]) + (Number(m[4]) || 0) / 60;
  if (ini >= 24 || fin > 24) return null;
  let dur = fin - ini;
  if (dur <= 0) dur += 24;
  return { ini, fin, dur };
}
const hhmm = x => { const h = Math.floor(x) % 24, m = Math.round((x - Math.floor(x)) * 60); return pad(h) + ':' + pad(m); };
/**
 * Color que corresponde a un horario escrito en un comentario:
 * blanco si arranca de día (06 a 13), celeste si arranca a la tarde y casi no tiene horas nocturnas,
 * gris si es de noche. Un turno de 24 h va en blanco.
 */
function colorPorHorario(ini, h) {
  if (h >= 24) return '';
  const r = repartirDesde(ini, h);
  const hora = ini % 24;
  if (r.n === 0) return hora >= 13 ? 'T' : '';
  if (hora >= 5 && hora < 13) return '';            // v1.22.7: de 05.30 en adelante es turno de día (blanco)
  if (hora >= 13 && hora < 21 && r.n <= 2) return 'T';
  return 'N';
}

function armarValor(texto, color, nota) {
  const b = conColor(texto, color);
  return nota ? b + '|' + nota : b;
}

/**
 * El turno lo da el color de la celda, como en el Excel:
 *   blanco = mañana (8 de 06 a 14, 12 de 06 a 18)
 *   celeste = tarde (8 de 14 a 22)
 *   gris = noche (8 de 22 a 06, 12 de 18 a 06)
 * En la base se guarda el número con una letra al final: sin letra blanco,
 * T celeste, N gris. El supervisor no escribe la letra: pinta la celda.
 */
const COLORES = { '': 'Blanco', T: 'Celeste', N: 'Gris' };
const RX_HORAS = /^(\d{1,2}(?:[.,]5)?)([NDT])?$/;

function colorDeValor(v) {
  const m = valorBase(v).match(RX_HORAS);
  return m && (m[2] === 'N' || m[2] === 'T') ? m[2] : '';
}
function soloNumero(v) {
  const b = valorBase(v), m = b.match(RX_HORAS);
  return m ? m[1] : b;
}
function conColor(v, color) {
  v = valorBase(v);
  const m = v.match(RX_HORAS);
  return m ? m[1].replace(',', '.') + (color || '') : v;
}
// Color que toma una celda: el pintado; si no tiene, el de la última celda con horas a su izquierda.
function colorCelda(f, i) {
  if (f.Col[i] !== undefined) return f.Col[i];
  for (let k = i - 1; k >= 0; k--) {
    if (f.Col[k] !== undefined && RX_HORAS.test(valorBase(f.Dias[k]))) return f.Col[k];
  }
  return '';
}
// Pasa las filas viejas (turno de la fila, letra D) al formato de color por celda.
function prepararFila(f) {
  f.Col = [];
  f.Dias = f.Dias.map((v, i) => {
    const nota = limpiarNota(notaDe(v));
    const b = valorBase(v);
    const m = b.match(RX_HORAS);
    if (!m) return nota ? b + '|' + nota : b;
    const c = m[2] === 'N' || m[2] === 'T' ? m[2] : (!m[2] && f.Turno === 'Nocturno' ? 'N' : '');
    f.Col[i] = c;
    return armarValor(m[1], c, nota);
  });
  return f;
}

// "turno" solo se usa para filas viejas sin letra cargadas como Nocturno.
function parseCelda(v, turno) {
  const nota = notaDe(v);
  v = valorBase(v).replace(',', '.');
  if (!v) return { t: 'vacio' };
  const m = v.match(/^(\d{1,2}(?:\.5)?)([NDT])?$/);
  if (m) {
    const h = Number(m[1]);
    if (h > 24) return { t: 'error' };
    const tu = m[2] === 'N' || m[2] === 'T' ? m[2] : (!m[2] && turno === 'Nocturno' ? 'N' : 'D');
    const hor = horarioDeNota(nota);
    const r = hor ? repartirDesde(hor.ini, h) : repartirHoras(h, tu);
    return { t: 'horas', h, turno: tu, noche: tu === 'N', tarde: tu === 'T', d: r.d, n: r.n, horario: hor };
  }
  const c = S.codigos[v];
  if (c) return { t: 'codigo', tipo: v === 'VAC' ? 'VAC' : (c.Tipo || 'OTRO') };
  // v1.25.5: sigla de otro servicio (P4, AO, OS, R...): no es un error; al guardar se controla que tenga las horas en algún servicio
  if (/^[A-ZÑ]/.test(v)) return { t: 'sigla', sig: normSigla(v) };
  return { t: 'error' };
}
/* ---------- v1.25.5 Siglas de otros servicios ----------
   En las planillas suelen poner P4 (= servicio 4, SUCRE 4225), AO (Arauco Oasis), OS (otro servicio)... para decir que ese día
   la persona fue a cubrir otro servicio. Esas horas tienen que estar cargadas en ese otro servicio: si no, es un día sin cubrir. */
const SIGLAS_DEFECTO = { P4: 'SUCRE 4225', P6: 'TRES DE FEBRERO 945', P8: 'AMENABAR 1570', P10: 'DIAGONAL NORTE 1145', P12: 'SUCRE 1949', P13: 'CONGRESO 1661',
  P22: 'OLLEROS 2202', P26: 'ARCOS 1744', P30: 'JOSE HERNANDEZ 1721', P43: 'CORDOBA 1131', P46: 'ACIFI', P55: 'DEMARIA 4780', P56: 'CONGRESO 1622',
  P57: 'ENRIQUE MARTINEZ 210', P60: 'CONSTRUCTORA SUDAMERICANA', P65: 'LIBERTADOR 3050', AO: 'ARAUCO OASIS', AZ: 'ARAUCO ZARATE' };
function normSigla(v) { return String(v || '').toUpperCase().replace(/[.\s\-_]/g, '').replace(/^P0+(\d)/, 'P$1'); }
// Servicio al que apunta una sigla: primero lo cargado en Servicios (columna Siglas), después la tabla de la empresa (P4 = SUCRE 4225...)
function servicioDeSigla(sig) {
  sig = normSigla(sig);
  const servs = (S.base && S.base.servicios) || [];
  const explicito = servs.find(x => String(x.Siglas || '').split(/[,;\s]+/).map(normSigla).filter(Boolean).indexOf(sig) >= 0);
  if (explicito) return explicito;
  const objetivo = SIGLAS_DEFECTO[sig]; if (!objetivo) return null;
  const t = norm(objetivo);
  const cand = servs.filter(x => norm(String(x.Cliente || '') + ' ' + String(x.Servicio || '')).indexOf(t) >= 0);
  return cand.find(x => x.Activo !== 'NO') || cand[0] || null;
}
// Horas de cada persona por día en todos los servicios del período que tiene la app (planillas abiertas, pendientes y lo de otras zonas)
function horasPorPersonaDia(periodo) {
  const out = {}, vistos = {};
  const nomServ = id => ((S.base.servicios || []).find(x => x.Id === id) || {}).Servicio || id;
  const sumar = (f, dias, sid, snom) => {
    const k = clavePersona(f); if (!k) return;
    const a = out[k] = out[k] || [];
    dias.forEach((v, i) => { const p = parseCelda(v); if (p.t === 'horas') (a[i] = a[i] || []).push({ id: sid, nom: snom, h: p.h }); });
  };
  const usarFilas = (sid, filas, crudas) => {
    vistos[sid] = 1;
    filas.forEach(f => sumar(f, crudas ? Array.from({ length: 31 }, (_, i) => f['D' + pad(i + 1)] || (f.Dias || [])[i] || '') : f.Dias, sid, nomServ(sid)));
  };
  if (S.pl && S.pl.periodo === periodo) usarFilas(S.pl.servicioId, S.pl.filas, false);
  tabsPendientes().filter(p => p.periodo === periodo && !vistos[p.servicioId]).forEach(p => usarFilas(p.servicioId, p.filas, false));
  Object.keys(S.cachePl || {}).forEach(k => {
    const c = S.cachePl[k], sid = k.split('|')[1];
    if (k.split('|')[0] !== periodo || !c || !c.filas || vistos[sid]) return;
    usarFilas(sid, c.filas, true);
  });

  const nomVistos = {}; Object.keys(vistos).forEach(id => { nomVistos[norm(nomServ(id))] = 1; });
  ((S.pl && S.pl.periodo === periodo && S.pl.ocup) || []).forEach(o => { if (!nomVistos[norm(o.Servicio)]) sumar(o, o.Dias, o.ServicioId || '', o.Servicio); });
  return out;
}
// Días con una sigla en los que la persona no tiene horas cargadas (o no las tiene en el servicio de la sigla)
function siglasSinHoras(filas, periodo, nombreServ) {
  const horas = horasPorPersonaDia(periodo), n = periodoInfo(periodo).n, out = [];
  filas.forEach(f => {
    if (!(f.Nombre || f.Legajo)) return;
    const hs = horas[clavePersona(f)] || [];
    for (let i = 0; i < n; i++) {
      const p = parseCelda(f.Dias[i]); if (p.t !== 'sigla') continue;
      const dest = servicioDeSigla(p.sig), del = hs[i] || [];
      const ok = dest ? del.some(x => x.id === dest.Id || norm(x.nom) === norm(dest.Servicio)) : del.length > 0;
      if (ok) continue;
      out.push({ nombre: f.Nombre, fecha: ddmm(fechaDia(periodo, i)), sigla: valorBase(f.Dias[i]), servicio: nombreServ,
        motivo: dest ? 'Dice que fue a cubrir ' + dest.Servicio + ', pero ahí no tiene horas ese día' + (del.length ? ' (tiene horas en ' + del.map(x => x.nom).join(', ') + ')' : '')
          : (SIGLAS_DEFECTO[p.sig] ? 'Dice que fue a cubrir ' + SIGLAS_DEFECTO[p.sig] + ', pero no tiene horas en ningún servicio ese día' : 'La sigla no corresponde a ningún código y no tiene horas en ningún servicio ese día') });
    }
  });
  return out;
}
// Aviso al guardar: muestra los días con sigla sin horas. Devuelve true para guardar igual, false para corregir.
function avisoSiglas() {
  const lista = [];
  tabsPendientes().forEach(p => siglasSinHoras(p.filas, p.periodo, p.nombre).forEach(x => lista.push(x)));
  if (S.pl && !S.pl.soloVer) siglasSinHoras(S.pl.filas, S.pl.periodo, (S.pl.serv && S.pl.serv.Servicio) || '').forEach(x => lista.push(x));

      '<div class="tabla-wrap" style="max-height:50vh;overflow:auto"><table class="t"><thead><tr><th>Apellido y nombre</th><th>Día</th><th>Sigla</th><th>Servicio</th><th>Qué pasa</th></tr></thead><tbody>' +
      lista.map(x => '<tr><td><b>' + esc(x.nombre) + '</b></td><td>' + esc(x.fecha) + '</td><td><b>' + esc(x.sigla) + '</b></td><td>' + esc(x.servicio) + '</td><td>' + esc(x.motivo) + '</td></tr>').join('') +
      '</tbody></table></div><div class="pie"><button class="btn" id="sgCorregir">Corregir</button><button class="btn prim" id="sgIgual">Guardar igual</button></div>');

// Feriados cargados en Datos (iguales para todos los servicios).
/** Palabra de feriado con descripción al pasar el mouse (solo sobre la palabra, desde 2026). */
function ferWord(txt, d) {
  const f = feriadoDe(d);
  if (!f || d.getUTCFullYear() < 2026) return esc(txt);
  return '<span class="fer-w" title="' + esc(typeof f === 'string' ? f : 'Feriado') + '">' + esc(txt) + '</span>';
}
function ferWordIso(txt, iso) {
  const m = String(iso || '').match(/(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return esc(txt);
  return ferWord(txt, new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])));
}
function feriadoDe(d) {
  const iso = d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  const f = (S.base && S.base.feriados || []).find(x => x.Fecha === iso);
  return f ? (f.Descripcion || 'Feriado') : '';
}
// v1.22.8: servicios donde lo contratado es lo realizado (RAZ Barracas, Trelles y Montenegro)
function sinDiferencia(serv) {
  if (!serv) return false;
  const v = String(serv.SinDiferencia || '').toUpperCase();
  if (v === 'SI') return true;
  if (v === 'NO') return false;
  const t = norm(String(serv.Servicio || '') + ' ' + String(serv.Cliente || ''));
  return /\bRAZ\b/.test(t) && /BARRACAS|TRELLES|MONTENEGRO/.test(t);
}
// v1.25.0: servicios que carga Administración (el supervisor los ve solo para consultar y no los tiene que completar).
// En Servicios: "Lo carga" Administración / Supervisor; vacío = por el nombre (RAIZEN Dock Sud Supervisores y los 3 RAZ).
function cargaAdmin(serv) {

  if (v === 'SI') return true;
  if (v === 'NO') return false;
  const t = norm(String(serv.Servicio || '') + ' ' + String(serv.Cliente || ''));
  return (/\bRAIZEN\b/.test(t) && /SUPERVISOR/.test(t)) || (/\bRAZ\b/.test(t) && /BARRACAS|TRELLES|MONTENEGRO/.test(t));
}
function contratadoDia(serv, d) {
  const ov = serv && S.base.contrDia && S.base.contrDia[serv.Id + '|' + d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate())];
  if (ov) return { d: ov.d, n: ov.n };   // v1.22.9: cargado a mano en la Planificación de servicios
  return contratadoDiaServicio(serv, d);
}
function contratadoDiaServicio(serv, d) {
  if (feriadoDe(d) && (String(serv.D_FER || '') !== '' || String(serv.N_FER || '') !== '')) return { d: num(serv.D_FER), n: num(serv.N_FER) };
  const k = DIAS[diaSem(d)];
  return { d: num(serv['D_' + k]), n: num(serv['N_' + k]) };
}

function semanaEnviada(n) {
  return S.pl.semanas.find(s => Number(s.Semana) === n);
}
function semanaDeDia(i) {
  return S.pl.sems.find(s => i >= s.desdeIdx && i <= s.hastaIdx);
}
// Semana ya informada o que ya no se puede modificar: recuadro azul cerrado alrededor de cada semana
// (borde arriba en la fila de los números, abajo en la última fila de la sección, y a los costados del primer y último día).
function semanaFija(w) {
  if (!w) return false;

}
function bordeSemanaInformada(i, pos) {
  const w = S.pl && S.pl.sems && semanaDeDia(i);
  if (!semanaFija(w)) return '';
  return ' sem-inf' + (i === w.desdeIdx ? ' sem-infL' : '') + (i === w.hastaIdx ? ' sem-infR' : '') +
    (pos === 'T' ? ' sem-infT' : pos === 'B' ? ' sem-infB' : '');
}
function bloqueado(i) {
  if (S.pl && S.pl.soloVer) return true;
  // v1.22.5: en Novedades semanales, los días anteriores a la semana que se está informando no se modifican (nadie)
  // v1.25.1: administración tiene todas las planillas desbloqueadas
  if (S.pl && S.pl.modoNov && i < S.pl.limiteNov && !esAdmin()) return true;
  const w = semanaDeDia(i);
  return !esAdmin() && !!(w && semanaEnviada(w.numero));
}
// Primer día que se puede modificar en Novedades semanales: el inicio de la semana que terminó ayer o que está en curso
// (ej.: hoy 12/10 se informa la semana del 05/10 al 11/10: se puede tocar del 05/10 en adelante).
function limiteNovedades(periodo) {
  const hoyP = periodoTrabajo();
  if (window.MODO_DEMO) return 0;
  if (periodo < hoyP) return 99;
  if (periodo > hoyP) return 0;
  const info = periodoInfo(periodo), h = new Date();
  const ayer = Date.UTC(h.getFullYear(), h.getMonth(), h.getDate()) - 864e5;
  const iAyer = Math.round((ayer - info.desde.getTime()) / 864e5);
  if (iAyer < 0) return 0;
  const w = semanasPeriodo(periodo).find(x => iAyer >= x.desdeIdx && iAyer <= x.hastaIdx);
  return w ? w.desdeIdx : Math.max(0, iAyer);
}

  const r = S.cachePl[key] || await traerPlanilla(per, servicioId);

const SECC_NOMBRE = { COBERTURA: 'Cobertura de servicio', RETEN: 'Retén e instrucción', EVENTO: 'Eventuales / adicionales' };
function prepararProyectado(proy) {
  const pl = S.pl;
  pl.proy = proy.map(f => ({ Seccion: f.Seccion, Legajo: f.Legajo, Nombre: f.Nombre, cuando: f.Proyectado,
    Dias: Array.from({ length: 31 }, (_, i) => f['D' + pad(i + 1)] || '') }));
  pl.proyCuando = proy.length ? proy[0].Proyectado : '';
  const usadas = new Set();
  pl.filas.forEach(f => {
    f._proy = null;
    if (!pl.proy.length || !(f.Nombre || f.Legajo)) return;
    const k = pl.proy.findIndex((p, j) => !usadas.has(j) && p.Seccion === f.Seccion && ((f.Legajo && clavePersona(p) === clavePersona(f)) || norm(p.Nombre) === norm(f.Nombre)));
    if (k >= 0) { usadas.add(k); f._proy = pl.proy[k]; }
  });

function esModificado(f, i) {
  const pl = S.pl;
  if (!pl || !pl.proy || !pl.proy.length) return false;
  const ahora = celdaComparable(f.Dias[i]), antes = f._proy ? celdaComparable(f._proy.Dias[i]) : '';

  const porSec = {};

  const conEv = pl.filas.some(f => f.Seccion === 'EVENTO' && (f.Nombre || f.Dias.some(v => valorBase(v))));

/* ---------- v1.25.0 Novedades semanales: pestañas de la semana y guardado de todas juntas ----------
   Los lunes todas las pestañas arrancan sin pintar. Se pintan cuando el servicio se carga o se modifica esa semana
   (o cuando se marca "Sin novedades"). Al cambiar de pestaña los cambios quedan pendientes y se guardan todos juntos con Guardar. */
function lunesSemana() {
  const h = new Date(), d = new Date(h.getFullYear(), h.getMonth(), h.getDate());
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function tabsPendientes() { return Object.values(S.tabsPend || {}); }
function hayCambiosPl() { return !!S.sucio || tabsPendientes().length > 0; }
// '' sin pintar · 'pend' con cambios sin guardar · 'ok' cargada esta semana · 'sinnov' marcada sin novedades
function tabSemana(id, periodo) {
  const key = periodo + '|' + id;
  if ((S.tabsPend || {})[key] || (S.pl && S.pl.servicioId === id && S.pl.periodo === periodo && S.sucio)) return 'pend';
  const lun = lunesSemana(), me = String((S.u && S.u.usuario) || '').toLowerCase(), adm = esAdmin();
  if ((S.cargadaSem || {})[key] === lun) return 'ok';
  const sn = S.pl && S.pl.servicioId === id && S.pl.periodo === periodo ? S.pl.sinNov : null;
  const c = S.cachePl && S.cachePl[key];
  if ((sn || (c && c.sinNov) || []).some(x => x.Lunes === lun)) return 'sinnov';
  if (c && (c.filas || []).some(f => fechaIsoDe(f.Actualizado) >= lun && guardadoPorUsuario(f.ActualizadoPor, adm, me))) return 'ok';
  return '';
}
// v1.25.1: solo cuenta lo guardado por una persona (no lo que se trae del histórico o del Excel de Drive)
function guardadoPorUsuario(quien, adm, me) {
  const q = String(quien || '').trim().toLowerCase();
  if (!q) return false;
  if (!adm) return q === me;
  return q === me || (S.base.supervisores || []).some(x => String(x.usuario || '').toLowerCase() === q);
}
// "2026-10-19 09:15" o "19/10/2026 09:15" -> "2026-10-19"
function fechaIsoDe(v) {
  const t = String(v || '').trim();
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
  m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m ? m[3] + '-' + pad(+m[2]) + '-' + pad(+m[1]) : '';
}
function claseTab(s, pl) {

  return tabLlena(s.Id, pl.periodo) ? ' tab-llena' : '';
}

}
// Deja los cambios de la pestaña abierta como pendientes (se guardan todos juntos con Guardar)
function guardarEnPendientes() {

}
function datosParaGuardar(periodo, servicioId, filas, plus, forzar) {
  return { forzar: !!forzar, periodo, servicioId,
    filas: filas.map(f => ({ Seccion: f.Seccion, Legajo: f.Legajo, Nombre: String(f.Nombre || '').trim().toUpperCase(), Empresa: f.Empresa, Puesto: f.Puesto, Turno: f.Turno, Dias: f.Dias })),
    plus: plus.filter(p => p.Nombre) };
}
// Guarda las pestañas pendientes. Si alguna tiene un problema (falta el turno, choques), la abre para corregirla.
// v1.25.0: lo guardado queda también en la memoria de la app: al pasar de Proyección a Novedades semanales
// (o al revés) se ve enseguida lo último guardado, sin esperar a que se vuelva a traer del servidor.
function actualizarCachePl(pl, filas) {
  const c = S.cachePl && S.cachePl[pl.periodo + '|' + pl.servicioId]; if (!c) return;
  const h = new Date(), ahora = h.getFullYear() + '-' + pad(h.getMonth() + 1) + '-' + pad(h.getDate()) + ' ' + pad(h.getHours()) + ':' + pad(h.getMinutes());
  c.filas = filas.map((f, i) => {
    const o = { Periodo: pl.periodo, ServicioId: pl.servicioId, Seccion: f.Seccion, Orden: String(i + 1), Legajo: f.Legajo || '', Nombre: String(f.Nombre || '').trim().toUpperCase(),
      Empresa: f.Empresa || '', Puesto: f.Puesto || '', Turno: f.Turno || '', ActualizadoPor: S.u.usuario, Actualizado: ahora };
    f.Dias.forEach((v, j) => { o['D' + pad(j + 1)] = v || ''; });
    return o;
  });
  c.plus = pl.plus.filter(p => p.Nombre).map(p => Object.assign({}, p));
}
function faltaTurnoPuesto(filas) {
  return filas.some(f => (f.Seccion === 'RETEN' || f.Seccion === 'COBERTURA') && (String(f.Nombre || '').trim() || f.Dias.some(Boolean)) && !String(f.Puesto || '').trim());
}
async function guardarPestanasPend(forzar) {
  let n = 0;
  const conProblema = [];
  for (const p of tabsPendientes()) {
    const filas = p.filas.filter(f => String(f.Nombre || '').trim() || f.Dias.some(Boolean));
    if (faltaTurnoPuesto(filas)) { conProblema.push(p); continue; }
    const datos = datosParaGuardar(p.periodo, p.servicioId, filas, p.plus, forzar);
    if (navigator.onLine === false) { guardarSinConexion(datos, filas); delete S.tabsPend[p.key]; n++; continue; }
    let res;
    try { res = await api('guardarPlanilla', datos); }
    catch (e) {
      if (esErrorDeRed(e)) { guardarSinConexion(datos, filas); delete S.tabsPend[p.key]; n++; continue; }
      toast('No se guardó ' + p.nombre + ': ' + e.message, true); return false;
    }
    if (res && res.conflictos && res.conflictos.length) {
      await cambiarPlanilla(p.servicioId, p.periodo);
      mostrarConflictos(res.conflictos, { alGuardar: esAdmin() ? () => guardarPlanilla(false, true) : null });
      return false;
    }
    delete S.tabsPend[p.key];
    if (S.cachePl) delete S.cachePl[p.key];
    S.cargadaSem = S.cargadaSem || {}; S.cargadaSem[p.key] = lunesSemana();
    n++;
  }
  // Las que tienen algo sin completar quedan pendientes: se abre la primera para corregirla
  if (conProblema.length) {
    const p = conProblema[0];
    toast((n ? (n === 1 ? 'Se guardó 1 pestaña. ' : 'Se guardaron ' + n + ' pestañas. ') : '') + 'En ' + p.nombre + ' falta completar el turno o el puesto: completalo y volvé a tocar Guardar.', true);
    await cambiarPlanilla(p.servicioId, p.periodo);
    setTimeout(() => { if (validarTurnos()) validarPuestosReten(); }, 300);
    return false;
  }
  return n;
}

// v1.25.1: copia con el método clásico del navegador (funciona también dentro de Apps Script, donde el portapapeles moderno está bloqueado)
function copiarConColores(d) {
  PORTA.forzado = d;
  const ta = document.createElement('textarea');
  ta.value = d.tsv; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  const antes = document.activeElement;

  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove(); PORTA.forzado = null;
  try { if (antes && antes.focus) antes.focus({ preventScroll: true }); } catch (e) { }
  return ok;
}

    if (!o) { q('ObjetivoId').value = ''; q('Cliente').value = t; if (!q('Servicio').dataset.tocado) q('Servicio').value = t; return; }
    q('Cliente').value = o.Nombre; if (!q('Servicio').dataset.tocado) q('Servicio').value = o.Nombre;
    q('Empresa').value = o.Empresa; q('Direccion').value = o.Direccion; q('Localidad').value = o.Localidad;
    q('Jurisdiccion').value = o.Jurisdiccion; q('ObjetivoId').value = o.Id;
  };
  q('Servicio').addEventListener('input', () => { q('Servicio').dataset.tocado = '1'; });
  $('#mCancel').onclick = cerrarModal;
  $('#mOk').onclick = async () => {
    const d = leerForm(m);
    if (!d.Cliente || !d.Servicio) { toast('Elegí el objetivo (o escribí el cliente) y el nombre de la planilla.', true); return; }
    try {
      const g = await api('nuevaPlanilla', { servicio: d });
      S.base.servicios.push(g);
      cerrarModal(); toast('Planilla creada: ' + g.Servicio + '.');
      S.sucio = false;
      vPlanilla({ servicioId: g.Id, periodo: S.periodo });
    } catch (e) { toast(e.message, true); }
  };
}

async function cambiarPlanilla(servicioId, periodo) {
  // v1.25.0: en Novedades semanales no se guarda pestaña por pestaña: los cambios quedan pendientes y se guardan todos juntos
  if (S.sucio && S.pl && S.pl.modoNov && !S.pl.soloVer) guardarEnPendientes();
  if (S.sucio) {

// Turnos de la columna Turno (lista con autocompletado). Mixto: ni gris ni blanco.
const TURNOS = ['Diurno', 'Nocturno', 'Mixto'];

// Mínimo de filas que se muestran en cada sección, como en el Excel (10 de cobertura y 5 de retén).
const MIN_FILAS = { COBERTURA: 10, RETEN: 5, EVENTO: 0 };
function asegurarFilasMinimas() {
  const pl = S.pl;
  ['COBERTURA', 'RETEN', 'EVENTO'].forEach(sec => {
    const n = pl.filas.filter(f => f.Seccion === sec).length;
    for (let k = n; k < MIN_FILAS[sec]; k++) {
      const f = filaVacia(sec);
      if (sec === 'COBERTURA') {
        const ult = pl.filas.map(x => x.Seccion).lastIndexOf('COBERTURA');
        pl.filas.splice(ult + 1, 0, f);
      } else pl.filas.push(f);
    }
  });
}

    let t = '';

      t += '<th class="xd-sem' + (fer ? ' fer' : w === 5 ? ' sab' : w === 6 ? ' dom' : '') + bordeSemanaInformada(i) + '">' + (fer ? ferWord('Fer', fd) : DIAS_XL[w]) + '</th>';

  // v1.22.3: Eventuales / Adicional ya no se usa (las horas de más de Cobertura de Servicios salen como adicionales en la conformación).

  if (!pl.filas.some(f => f.Seccion === 'EVENTO' && (f.Nombre || f.Dias.some(v => valorBase(v))))) return h + '</tbody></table>';

// v1.22.6: comentarios de un Excel. Al copiar y pegar desde Excel los comentarios no viajan (Excel no los pone en el
// portapapeles), así que se leen del archivo: se elige el Excel y se pasan a las mismas personas y días de esta planilla.
async function cargarExcelJS() {
  if (window.ExcelJS) return;
  await new Promise((ok, mal) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'; sc.onload = ok; sc.onerror = () => mal(new Error('No se pudo cargar el lector de Excel.')); document.head.appendChild(sc); });
}
function comentariosDeExcel() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.xlsx,.xlsm';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0]; if (!file) return;
    const pl = S.pl, n = pl.info.n, serv = pl.serv || {};
    try {
      toast('Leyendo los comentarios del Excel…');
      await cargarExcelJS();
      const wb = new ExcelJS.Workbook();
      await wb.xlsx.load(await file.arrayBuffer());
      const txtNota = c => {
        let t = c && c.note; if (!t) return '';
        if (typeof t === 'object') t = (t.texts || []).map(x => x.text || '').join('');
        t = String(t).replace(/\r/g, '').replace(/^\s*\[[^\]]*\][^\n]*\n/, '').replace(/^[^\n:]{2,60}:\s*\n/, '');
        return limpiarNota(t);
      };
      const txt = c => { const v = c && c.value; return v == null ? '' : typeof v === 'object' ? String(v.result != null ? v.result : (v.richText ? v.richText.map(x => x.text).join('') : v.text || '')) : String(v); };
      const nombres = [serv.Servicio, serv.Cliente, serv.Pestana, nombreTab(serv)].filter(Boolean);
      const hojas = wb.worksheets.filter(ws => ws.state !== 'veryHidden');
      const delServicio = hojas.filter(ws => nombres.some(x => mismoNombre(ws.name, x) || norm(ws.name) === norm(x) || mismoNombre(txt(ws.getCell(1, 4)), x)));
      let puestas = 0, personas = new Set(), sinLugar = 0;
      (delServicio.length ? delServicio : hojas).forEach(ws => {
        let cN = -1, cD = -1;
        for (let r = 1; r <= Math.min(ws.rowCount, 400); r++) {
          let hdr = -1;
          for (let c = 1; c <= 8; c++) if (norm(txt(ws.getCell(r, c))) === 'APELLIDO Y NOMBRE') { hdr = c; break; }
          if (hdr > 0) { cN = hdr; cD = hdr + 2; r++; continue; }
          if (cN < 0) continue;
          const nom = txt(ws.getCell(r, cN)).trim(), linea = norm([1, 2, 3, 4, cN].map(c => txt(ws.getCell(r, c))).join(' '));
          if (/TOTAL|CONTRATADO|DIFERENCIA/.test(linea)) { cN = -1; continue; }
          if (!nom) continue;
          const rf = pl.filas.findIndex(f => f.Nombre && (norm(f.Nombre) === norm(nom) || mismaPersonaNombre(f.Nombre, nom)));
          for (let j = 0; j < n; j++) {
            const t = txtNota(ws.getCell(r, cD + j)); if (!t) continue;
            if (rf < 0) { sinLugar++; continue; }
            const f = pl.filas[rf], base = String(f.Dias[j] || '').split('|')[0];
            if (!valorBase(base) || (bloqueado(j) && !esAdmin()) || notaDe(f.Dias[j]) === t) continue;
            f.Dias[j] = ajustarHorasPorNota(base + '|' + t); if (horarioDeNota(t)) f.Col[j] = colorDeValor(f.Dias[j]);
            const ec = $('#c-' + rf + '-' + j); if (ec) ec.value = soloNumero(f.Dias[j]);
            refrescarCelda(rf, j); puestas++; personas.add(rf);
          }
        }
      });
      if (puestas) { marcarSucio(); renderPlanilla(true); }
      toast(puestas ? puestas + ' comentarios puestos en ' + personas.size + (personas.size === 1 ? ' persona' : ' personas') + '. Tocá Guardar.' + (sinLugar ? ' (' + sinLugar + ' de personas que no están en esta planilla)' : '')
        : 'No se encontraron comentarios para las personas de esta planilla' + (sinLugar ? ' (' + sinLugar + ' son de personas que no están acá)' : '') + '.', !puestas);
    } catch (e) { toast('No se pudo leer el Excel: ' + e.message, true); }
  };
  inp.click();
}

async function quitarServicioTab(id) {
  const sv = S.base.servicios.find(x => x.Id === id); if (!sv) return;
  const ok = await confirmar('Borrar servicio', 'Se quita <b>' + esc(nombreTab(sv)) + '</b> del listado de servicios.<br>' +
    'Si tiene planillas o novedades cargadas, no se pierden: queda de baja con fecha de hoy (se puede volver a activar desde Servicios).', 'Borrar servicio');
  if (!ok) return;
  try {
    const r = await api('quitarServicio', { id });
    if (r && r.demo) { toast(r.demo); return; }
    if (r.borrado) S.base.servicios = S.base.servicios.filter(x => x.Id !== id);
    else { sv.Activo = 'NO'; sv.FechaBaja = r.FechaBaja; }
    NOM_OBJ.firma = '';
    toast(r.borrado ? 'Servicio borrado.' : 'El servicio tenía datos: quedó de baja.');

      if (otro) { cambiarPlanilla(otro.Id); return; }

}

// v1.22.6: borrar todo el personal de la sección o los que se elijan
function btnBorrarPers(sec) {
  return S.pl && !S.pl.soloVer ? ' <button class="x-borrar-pers" data-borrarpers="' + sec + '" title="Borrar personal (todos o los que elijas)">🗑</button>' : '';
}
function ventanaBorrarPersonal(sec) {
  const pl = S.pl, n = pl.info.n;
  const filas = filasDeSeccion(sec).filter(r => pl.filas[r].Nombre || pl.filas[r].Legajo || pl.filas[r].Dias.some(Boolean));
  if (!filas.length) { toast('No hay personal cargado en esta sección.'); return; }
  const conBloq = r => pl.filas[r].Dias.some((v, i) => i < n && v && bloqueado(i));
  const m = modal('<h3>Borrar personal · ' + (sec === 'RETEN' ? 'Retén / Instrucción' : 'Cobertura de servicios') + '</h3>' +
    '<p class="sub">Elegí a quiénes sacar de la planilla (con todos sus días). Los que tienen días de semanas cerradas solo se limpian en los días que se pueden modificar.</p>' +
    '<label style="display:block;margin:6px 0 8px"><input type="checkbox" id="bpTodos"> <b>Seleccionar todos</b></label>' +
    '<div class="bp-lista" style="max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px">' +
    filas.map(r => '<label style="display:block;padding:3px 0"><input type="checkbox" data-bp="' + r + '"> ' + esc(pl.filas[r].Nombre || '(sin nombre)') +
      (pl.filas[r].Legajo ? ' <small style="color:var(--ink-2)">· ' + esc(pl.filas[r].Legajo) + '</small>' : '') + (conBloq(r) ? ' <small style="color:#b26a00">· tiene días cerrados</small>' : '') + '</label>').join('') + '</div>' +
    '<div class="pie"><button class="btn" id="bpNo">Cancelar</button><button class="btn peligro prim" id="bpSi">Borrar seleccionados</button></div>');
  m.querySelector('#bpTodos').onchange = e => m.querySelectorAll('[data-bp]').forEach(c => { c.checked = e.target.checked; });
  m.querySelector('#bpNo').onclick = cerrarModal;
  m.querySelector('#bpSi').onclick = () => {
    const sel = [...m.querySelectorAll('[data-bp]:checked')].map(c => +c.dataset.bp);
    if (!sel.length) { toast('Elegí al menos una persona.', true); return; }
    let quitadas = 0, limpias = 0;
    sel.sort((a, b) => b - a).forEach(r => {
      if (conBloq(r)) { const f = pl.filas[r]; for (let i = 0; i < n; i++) if (!bloqueado(i)) f.Dias[i] = ''; limpias++; }
      else { pl.filas.splice(r, 1); quitadas++; }
    });
    cerrarModal(); marcarSucio(); renderPlanilla(true);
    toast((quitadas ? quitadas + (quitadas === 1 ? ' persona sacada' : ' personas sacadas') : '') + (quitadas && limpias ? ' · ' : '') +
      (limpias ? limpias + ' con días cerrados: se limpiaron solo los días que se pueden modificar' : '') + '. Tocá Guardar para confirmar.');
  };
}

    if (b && f.Dias[i]) tieneBloq = true;
    h += '<td class="' + claseCelda(f, i) + '" data-r="' + r + '" data-d="' + i + '"' + tituloCelda(f, i) + '><input class="cel" id="c-' + r + '-' + i + '" data-r="' + r + '" data-d="' + i +
      '" value="' + esc(soloNumero(f.Dias[i])) + '" maxlength="13" autocomplete="off"' + (b ? ' readonly' : '') + '></td>';
  }
  const vacia = !f.Nombre && !f.Dias.some(Boolean);
  h += '<td class="x-tot" id="tot-' + r + '"></td><td class="x-acc">' +
    (tieneBloq || vacia ? '' : '<button title="Quitar fila" data-quitar="' + r + '">×</button>') + '</td></tr>';
  return h;
}

function claseCelda(f, i) {
  const p = parseCelda(f.Dias[i]);
  let c = '';
  if (p.t === 'horas' && p.noche) c = 'noche';
  else if (p.t === 'horas' && p.tarde) c = 'tarde';
  else if (p.t === 'vacio' && f.Col[i] === 'N') c = 'noche';
  else if (p.t === 'vacio' && f.Col[i] === 'T') c = 'tarde';
  else if (p.t === 'codigo') c = 'k-' + p.tipo + ' ' + claseCodigoXl(valorBase(f.Dias[i]));
  else if (p.t === 'error') c = 'k-ERROR';
  else if (p.t === 'sigla') c = 'k-SIGLA';
  if (notaDe(f.Dias[i])) c += ' con-nota';
  if (bloqueado(i)) c += ' bloq';
  c += bordeSemanaInformada(i);
  if (esModificado(f, i)) c += ' mod';
  return c;
}

// Colores de los códigos, iguales al formato condicional de las planillas Excel.
const COLORES_CODIGO_XL = ['INJ', 'SUS', 'ENF', 'ART', 'RES', 'VAC', 'DV', 'BAJA'];
function claseCodigoXl(cod) {
  if (COLORES_CODIGO_XL.indexOf(cod) >= 0) return 'cx-' + cod;
  if (cod.indexOf('F') >= 0) return 'cx-F'; // en el Excel, todo lo que tiene una F (F, FALL) va en verde
  return '';
}

function tituloCelda(f, i) {
  const nota = notaDe(f.Dias[i]);
  const p = parseCelda(f.Dias[i]);
  if (p.t === 'sigla') {
    const d = servicioDeSigla(p.sig);
    return ' title="' + esc((d ? valorBase(f.Dias[i]) + ' = ' + d.Servicio + ': las horas tienen que estar cargadas en ese servicio' : SIGLAS_DEFECTO[p.sig] ? valorBase(f.Dias[i]) + ' = ' + SIGLAS_DEFECTO[p.sig] : 'Sigla de otro servicio: las horas tienen que estar cargadas en el servicio que cubrió') + (nota ? '\n' + nota : '')) + '"';
  }
  if (!nota) return '';
  let t = nota;
  if (p.t === 'horas' && p.horario) t += '\n' + hhmm(p.horario.ini) + ' a ' + hhmm(p.horario.ini + p.h) + ': ' + fmtN(p.d) + ' diurnas y ' + fmtN(p.n) + ' nocturnas';
  return ' title="' + esc(t) + '"';
}
function refrescarCelda(r, i) {
  const el = $('#c-' + r + '-' + i);
  if (!el) return;
  const td = el.parentElement, f = S.pl.filas[r];
  td.className = claseCelda(f, i);
  const t = tituloCelda(f, i).replace(/^ title="|"$/g, '');
  if (t) td.setAttribute('title', t.replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&'));
  else td.removeAttribute('title');
}

function isoDiaUTC(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }

function recalcular() {
  clearTimeout(S.tProy); S.tProy = setTimeout(actualizarProyectado, 250);
  try { actualizarTurnosAuto(); } catch (e) { }
  const pl = S.pl;
  if (!pl || !$('#rsT-0')) return;
  const n = pl.info.n;
  const T = new Array(n).fill(0), R = new Array(n).fill(0), E = new Array(n).fill(0);
  pl.filas.forEach((f, r) => {
    let tot = 0;
    for (let i = 0; i < n; i++) {
      const p = parseCelda(f.Dias[i]);
      if (p.t !== 'horas') continue;
      tot += p.h;
      if (f.Seccion === 'RETEN') R[i] += p.h; else if (f.Seccion === 'EVENTO') E[i] += p.h; else T[i] += p.h;
    }
    const el = $('#tot-' + r);
    if (el) el.textContent = f.Nombre || tot ? fmtN(tot) : '';
  });
  let sT = 0, sC = 0;
  const colorDif = (el, v) => { el.classList.remove('neg', 'pos'); if (v < 0) el.classList.add('neg'); else if (v > 1) el.classList.add('pos'); };
  for (let i = 0; i < n; i++) {
    const c = sinDiferencia(pl.serv) ? { d: T[i], n: 0 } : contratadoDia(pl.serv, fechaDia(pl.periodo, i));
    const cT = c.d + c.n, dif = T[i] - cT;
    sT += T[i]; sC += cT;
    $('#rsT-' + i).textContent = fmtN(T[i]);
    $('#rsC-' + i).textContent = cT ? fmtN(cT) : '';
    const d = $('#rsD-' + i);
    d.textContent = fmtN(dif);
    colorDif(d, dif);
    $('#rsR-' + i).textContent = fmtN(R[i]);
    if ($('#rsE-' + i)) $('#rsE-' + i).textContent = E[i] ? fmtN(E[i]) : '';
  }
  $('#rsT-T').textContent = fmtN(sT);
  $('#rsC-T').textContent = fmtN(sC);
  $('#rsD-T').textContent = fmtN(sT - sC);
  if ($('#rsE-T')) { const sE = E.reduce((a, b) => a + b, 0); $('#rsE-T').textContent = sE ? fmtN(sE) : ''; }
  colorDif($('#rsD-T'), sT - sC);
}

function marcarSucio(v) {
  if (v === undefined) v = true;
  S.sucio = v;
  // v1.22.8: cada cambio queda para poder deshacerlo (los cambios seguidos, como escribir en una celda, van juntos)
  if (v && S.pl && S.undoPl && !S._restaurando && !S._undoPend) {
    S._undoPend = true;
    const ahora = Date.now();
    if (ahora - (S._undoT || 0) > 700 || !S.undoPl.length) { S.undoPl.push(S.fotoPl); if (S.undoPl.length > 100) S.undoPl.shift(); S.redoPl = []; }
    S._undoT = ahora;
    setTimeout(() => { if (S.pl) S.fotoPl = fotoPl(); S._undoPend = false; }, 0);
  }
  const el = $('#estGuardado');
  // v1.25.0: cuenta también las otras pestañas con cambios pendientes
  const nPend = tabsPendientes().length + (v ? 1 : 0);
  if (el) {
    el.textContent = nPend > 1 ? 'Cambios sin guardar en ' + nPend + ' pestañas' : nPend ? 'Cambios sin guardar' : 'Todo guardado';
    el.className = 'estado-guardado' + (nPend ? ' sucio' : '');
  }
  const bg = $('#btnGuardar'); if (bg && !bg.disabled) bg.textContent = nPend > 1 ? 'Guardar todo (' + nPend + ')' : 'Guardar';
  if (S.pl && S.pl.modoNov && S.vista === 'planilla') pintarTabsSemana();
}

function agregarFila(seccion, sinRender) {
  const pl = S.pl;
  const f = filaVacia(seccion);
  // Se inserta al final de su sección para mantener el orden.
  let pos = pl.filas.length;
  if (seccion === 'COBERTURA') {
    const ult = pl.filas.map(x => x.Seccion).lastIndexOf('COBERTURA');
    pos = ult + 1;
  }
  pl.filas.splice(pos, 0, f);
  marcarSucio();
  if (!sinRender) {
    renderPlanilla(true);
    const inp = $('.nom-in[data-r="' + pos + '"]');
    if (inp) inp.focus();
  }
  return pos;
}

async function traerAnterior() {
  const pl = S.pl;
  const ant = sumarMes(pl.periodo, -1);
  const r = await api('planilla', { periodo: ant, servicioId: pl.servicioId });
  if (!r.filas.length) { toast('En ' + nombrePeriodo(ant) + ' no hay personal cargado en este servicio.', true); return; }
  pl.filas = r.filas.map(f => Object.assign(filaVacia(f.Seccion), {
    Legajo: f.Legajo, Nombre: f.Nombre, Empresa: f.Empresa, Puesto: f.Puesto
  }));
  marcarSucio();
  renderPlanilla();
  toast('Se trajeron ' + pl.filas.length + ' personas de ' + nombrePeriodo(ant) + ', sin los días.');
}

function filasDeSeccion(seccion) {
  const out = [];
  S.pl.filas.forEach((f, r) => { if (f.Seccion === seccion) out.push(r); });
  return out;
}

function personaExacta(nombre) {
  const k = norm(nombre);
  if (!k) return null;
  const hit = S.base.personal.filter(p => norm(p.Nombre) === k);   // solo por nombre (el legajo se repite entre empresas)
  return hit.length === 1 ? hit[0] : null;
}

function asignarPersona(r, p) {
  const f = S.pl.filas[r];
  f.Nombre = p ? p.Nombre : f.Nombre;
  f.Legajo = p ? p.Legajo : '';
  f.Empresa = p ? p.Empresa : '';
  const inp = $('.nom-in[data-r="' + r + '"]');
  if (inp) {
    inp.value = f.Nombre;
    const td = inp.parentElement;
    td.classList.toggle('sin-legajo', !!f.Nombre && !f.Legajo);
    td.title = f.Nombre && !f.Legajo ? 'No está en Personal: elegilo de la lista' : '';
  }
  if ($('#leg-' + r)) $('#leg-' + r).textContent = f.Legajo;
  if ($('#emp-' + r)) $('#emp-' + r).textContent = f.Empresa;
  marcarSucio();
  if (p) revisarCeldas(Array.from({ length: S.pl.info.n }, (_, i) => ({ r, i })));
}

function asignarPersonaPlus(k, p) {
  const x = S.pl.plus[k];
  if (p) { x.Nombre = p.Nombre; x.Legajo = p.Legajo; } else { x.Legajo = ''; }
  const inp = $('.nom-in[data-p="' + k + '"]');
  if (inp) { inp.value = x.Nombre; inp.parentElement.classList.toggle('sin-legajo', !!x.Nombre && !x.Legajo); }
  $('#pleg-' + k).textContent = x.Legajo;
  marcarSucio();
}

function pegar(t, texto, colores) {
  const pl = S.pl;
  const lineas = texto.replace(/\r/g, '').split('\n');
  while (lineas.length && !lineas[lineas.length - 1].trim()) lineas.pop();
  const r0 = +t.dataset.r;
  const seccion = pl.filas[r0].Seccion;
  let orden = filasDeSeccion(seccion);
  let pos = orden.indexOf(r0);
  const esNombre = t.classList.contains('nom-in');
  const d0 = esNombre ? 0 : +t.dataset.d;
  let noReconocidos = 0;

  lineas.forEach((linea, k) => {
    let r = orden[pos + k];
    if (r === undefined) {
      r = agregarFila(seccion, true);
      orden = filasDeSeccion(seccion);
    }
    const f = pl.filas[r];
    let cel = linea.split('\t'), colFila = colores ? (colores[k] || []) : null, notFila = colores && colores.notas ? (colores.notas[k] || []) : null;
    if (esNombre) {
      f.Nombre = norm(cel[0]);
      const p = personaExacta(cel[0]);
      if (p) { f.Nombre = p.Nombre; f.Legajo = p.Legajo; f.Empresa = p.Empresa; }
      else { f.Legajo = ''; f.Empresa = ''; if (f.Nombre) noReconocidos++; }
      if (cel.length > 2) { f.Puesto = (cel[1] || '').trim(); cel = cel.slice(2); if (colFila) colFila = colFila.slice(2); if (notFila) notFila = notFila.slice(2); } else cel = [];
    }
    cel.forEach((v, j) => {
      const i = d0 + j;
      if (i < pl.info.n && !bloqueado(i)) {
        const cx = colFila ? colFila[j] : undefined;
        const c = cx !== undefined && cx !== null ? cx : colorCelda(f, i);
        f.Dias[i] = armarValor(v, c, (notFila && notFila[j]) || notaDe(f.Dias[i]));
        if (RX_HORAS.test(valorBase(f.Dias[i]))) f.Col[i] = c;
      }
    });
  });
  lineas.forEach((l, k) => { const r = orden[pos + k]; if (r !== undefined) completarBajas([r]); });
  marcarSucio();
  renderPlanilla(true);
  const pegadas = [];
  lineas.forEach((l, k) => { const r = orden[pos + k]; if (r !== undefined) for (let i = 0; i < pl.info.n; i++) pegadas.push({ r, i }); });
  revisarCeldas(pegadas);
  toast('Pegado.' + (noReconocidos === 1 ? ' Un nombre no está en Personal: elegilo de la lista.' : noReconocidos > 1 ? ' ' + noReconocidos + ' nombres no están en Personal: elegilos de la lista.' : ''));
}

function semanaProblemas(s) {
  const pl = S.pl, errores = [];
  let vacias = 0;
  pl.filas.forEach(f => {
    const nombre = f.Nombre || '(fila sin nombre)';
    let tieneDatos = false;
    for (let i = s.desdeIdx; i <= s.hastaIdx; i++) {
      const p = parseCelda(f.Dias[i]);
      if (p.t === 'error') errores.push(esc(nombre) + ': "' + esc(valorBase(f.Dias[i])) + '" el ' + ddmm(fechaDia(pl.periodo, i)) + ' no es un valor válido.');
      if (p.t !== 'vacio') tieneDatos = true;
      else if (f.Seccion === 'COBERTURA' && f.Nombre) vacias++;
    }
    if (f.Nombre && !f.Legajo && f.Seccion === 'COBERTURA') errores.push(esc(f.Nombre) + ' no está en Personal. Elegilo de la lista.');
    if (!f.Nombre && tieneDatos) errores.push('Hay una fila con días cargados y sin nombre.');
  });
  return { errores, vacias };
}

/* ---------- Trabajo sin internet ----------
   Si se corta internet con la app abierta, se puede seguir completando: al guardar, la planilla queda en esta
   computadora (navegador) y se manda sola apenas vuelve la conexión. */
const CLAVE_PEND = 'novedades_pendientes';
function pendientes() { try { return JSON.parse(localStorage.getItem(CLAVE_PEND) || '[]'); } catch (e) { return []; } }
function guardarPendientes(l) { try { localStorage.setItem(CLAVE_PEND, JSON.stringify(l)); } catch (e) { } mostrarAvisoPendientes(); }
const esErrorDeRed = e => /network|red|internet|failed to fetch|NetworkError|conexi|timeout|Sin respuesta/i.test(String(e && e.message || e)) || navigator.onLine === false;
function guardarSinConexion(datos, filas) {
  const l = pendientes().filter(x => !(x.periodo === datos.periodo && x.servicioId === datos.servicioId && x.usuario === (S.u && S.u.usuario)));
  l.push(Object.assign({}, datos, { usuario: S.u && S.u.usuario, cuando: new Date().toLocaleString('es-AR') }));
  guardarPendientes(l);
  if (S.pl) { S.pl.filas = filas; marcarSucio(false); renderPlanilla(true); }
  if (S.cachePl) S.cachePl[datos.periodo + '|' + datos.servicioId] = null;
  toast('Sin internet: quedó guardado en esta computadora. Se manda solo cuando vuelva la conexión.');
}
function mostrarAvisoPendientes() {
  let el = $('#avisoPend');
  const l = pendientes().filter(x => !S.u || x.usuario === S.u.usuario);
  if (!l.length) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'avisoPend'; document.body.appendChild(el); }
  el.className = 'aviso-pend';
  el.innerHTML = (navigator.onLine === false ? '📴 Sin internet · ' : '⏳ ') + l.length + ' planilla' + (l.length === 1 ? '' : 's') + ' sin mandar (guardadas en esta computadora)' +
    (navigator.onLine === false ? '' : ' <button class="btn chico" id="btnPendEnviar">Enviar ahora</button>');
  const b = $('#btnPendEnviar'); if (b) b.onclick = () => enviarPendientes(true);
}
let enviandoPend = false;
async function enviarPendientes(avisar) {
  if (enviandoPend || navigator.onLine === false || !S.token) return;
  const l = pendientes().filter(x => S.u && x.usuario === S.u.usuario);
  if (!l.length) { mostrarAvisoPendientes(); return; }
  enviandoPend = true;
  let ok = 0;
  try {
    for (const x of l) {
      try {
        const datos = Object.assign({}, x); delete datos.usuario; delete datos.cuando;
        const r = await api('guardarPlanilla', datos);
        if (r && r.conflictos && r.conflictos.length) { toast('La planilla guardada sin internet tiene a alguien en dos lugares: abrila y guardala de nuevo.', true); continue; }
        guardarPendientes(pendientes().filter(y => !(y.periodo === x.periodo && y.servicioId === x.servicioId && y.usuario === x.usuario)));
        ok++;
      } catch (e) { if (esErrorDeRed(e)) break; toast('No se pudo mandar una planilla guardada sin internet: ' + e.message, true); }
    }
  } finally { enviandoPend = false; mostrarAvisoPendientes(); }
  if (ok && (avisar || true)) toast('Volvió la conexión: se mandaron ' + ok + ' planilla' + (ok === 1 ? '' : 's') + ' guardada' + (ok === 1 ? '' : 's') + ' sin internet.');
}
// Errores de pantallas que ya se cerraron (por ejemplo, una respuesta que llega tarde): no se muestran.
window.addEventListener('unhandledrejection', e => { const m = String((e.reason && e.reason.message) || e.reason || ''); if (/properties of null|SESION_VENCIDA/.test(m)) { e.preventDefault(); console.warn(m); } });
window.addEventListener('error', e => { if (/properties of null/.test(String(e.message || ''))) { e.preventDefault(); console.warn(e.message); } });
window.addEventListener('online', () => { mostrarAvisoPendientes(); setTimeout(() => enviarPendientes(), 1500); });
window.addEventListener('offline', () => { mostrarAvisoPendientes(); toast('Se cortó internet. Podés seguir completando: al guardar queda en esta computadora.', true); });
setInterval(() => enviarPendientes(), 60000);
