async function guardarPlanilla(silencioso, forzar) {
  const pl = S.pl;
  const btn = $('#btnGuardar');
  // v1.25.5: siglas de otro servicio sin horas cargadas: aviso antes de guardar
  if (!S._siglasVistas) { if (!(await avisoSiglas())) return false; S._siglasVistas = true; setTimeout(() => { S._siglasVistas = false; }, 4000); }
  // v1.25.0: primero las otras pestañas con cambios pendientes (Novedades semanales: se guarda todo junto al final)
  let nOtras = 0;
  if (tabsPendientes().length) {
    // La pestaña abierta, si está completa, se guarda junto con las otras
    const actual = S.sucio && pl && !pl.soloVer && !faltaTurnoPuesto(pl.filas) ? pl.periodo + '|' + pl.servicioId : '';
    if (actual) guardarEnPendientes();
    if (btn) btn.disabled = true;
    avisoGuardando(true);
    try { nOtras = await guardarPestanasPend(forzar); }
    finally { avisoGuardando(false); if (btn) btn.disabled = false; }
    if (actual && S.pl === pl && (S.tabsPend || {})[actual]) {   // no se llegó a guardar: vuelve a quedar como cambios de la pestaña abierta
      delete S.tabsPend[actual]; S.sucio = true;
    }
    if (nOtras === false) { marcarSucio(S.sucio); return false; }
    if (!S.sucio) {
      if (!silencioso) toast(nOtras === 1 ? 'Se guardó 1 pestaña.' : 'Se guardaron ' + nOtras + ' pestañas.');
      marcarSucio(false); pintarTabsLlenas();
      return true;
    }
  }
  if (btn) btn.disabled = true;
  avisoGuardando(true);
  try {
    if (!validarTurnos()) return false;
    const filas = pl.filas.filter(f => f.Nombre.trim() || f.Dias.some(Boolean));
    if (!validarPuestosReten()) return false;
    const datosGuardar = {
      forzar: !!forzar,
      periodo: pl.periodo, servicioId: pl.servicioId,
      filas: filas.map(f => ({
        Seccion: f.Seccion, Legajo: f.Legajo, Nombre: f.Nombre.trim().toUpperCase(),
        Empresa: f.Empresa, Puesto: f.Puesto, Turno: f.Turno, Dias: f.Dias
      })),
      plus: pl.plus.filter(p => p.Nombre)
    };
    // Sin internet: queda guardado en esta computadora y se manda solo cuando vuelve la conexión.
    if (navigator.onLine === false) { guardarSinConexion(datosGuardar, filas); return true; }
    let res;
    try { res = await api('guardarPlanilla', datosGuardar); }
    catch (e) { if (esErrorDeRed(e)) { guardarSinConexion(datosGuardar, filas); return true; } throw e; }
    if (res && res.conflictos && res.conflictos.length) {
      mostrarConflictos(res.conflictos, {
        alGuardar: esAdmin() ? () => guardarPlanilla(silencioso, true) : null
      });
      return false;
    }
    pl.filas = filas;
    actualizarCachePl(pl, filas);
    marcarSucio(false);
    if (pl.modoNov) { S.cargadaSem = S.cargadaSem || {}; S.cargadaSem[pl.periodo + '|' + pl.servicioId] = lunesSemana(); }
    if (!silencioso) toast(nOtras ? 'Se guardaron ' + (nOtras + 1) + ' pestañas.' : 'Planilla guardada.');
    renderPlanilla(true);
    return true;
  } catch (e) {
    toast('No se guardó: ' + e.message, true);
    return false;
  } finally {
    avisoGuardando(false);
    if (btn) btn.disabled = false;
  }
}

async function enviarSemana(n) {
  if (!validarTurnos()) return;
  const pl = S.pl, s = pl.sems[n - 1];
  const desde = fechaDia(pl.periodo, s.desdeIdx), hasta = fechaDia(pl.periodo, s.hastaIdx);
  const prob = semanaProblemas(s);
  if (prob.errores.length) {
    modal('<h3>Falta corregir antes de enviar</h3><ul style="margin:0;padding-left:18px;line-height:1.5">' +
      prob.errores.slice(0, 15).map(x => '<li>' + x + '</li>').join('') + '</ul>' +
      (prob.errores.length > 15 ? '<p>Y ' + (prob.errores.length - 15) + ' más.</p>' : '') +
      '<div class="pie"><button class="btn prim" onclick="cerrarModal()">Entendido</button></div>');
    return;
  }
  const hoy = new Date();
  const hoyUTC = Date.UTC(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  const avisos = [];
  if (hasta.getTime() >= hoyUTC) avisos.push('La semana todavía no terminó.');
  // Se envían juntas las novedades de todos los servicios de la zona (del mismo supervisor).
  const sup = String(pl.serv.Supervisor || '').toLowerCase();
  const zona = S.base.servicios.filter(s => s.Id === pl.servicioId || (s.Activo !== 'NO' && String(s.Supervisor || '').toLowerCase() === sup));
  const ok = await confirmar('Enviar novedades',
    '<p>Vas a enviar las novedades del ' + ddmm(desde) + ' al ' + ddmm(hasta) + ' de ' +
    (zona.length === 1 ? '<b>' + esc(pl.serv.Servicio) + '</b>' : 'tu zona: <b>' + zona.map(s => esc(s.Servicio)).join(', ') + '</b>') + '. ' +
    'Antes se controla que cada vigilador tenga algo cargado todos los días. ' +
    'Administración recibe el aviso y esos días quedan cerrados para vos.</p>' +
    (avisos.length ? '<p style="color:var(--warn)">' + avisos.join(' ') + '</p>' : ''), 'Seguir');
  if (!ok) return;
  const per = nombrePeriodo(pl.periodo);
  ventanaCorreo({ titulo: 'Informar la semana ' + n, para: S.base.avisos || '', adjunto: 'Detalle de la semana en el cuerpo del correo',
    asunto: 'Delben - ' + (esAdmin() ? 'Administración ' : 'Supervisor ') + S.u.nombre + ' - Modificación semanal ' + n + ' (' + ddmm(desde) + ' al ' + ddmm(hasta) + ') ' + per,
    cuerpo: 'Buenos días:\n\nInformo que ya realicé la modificación semanal de la semana ' + n + ' (del ' + ddmm(desde) + ' al ' + ddmm(hasta) + ') de ' +
      (zona.length === 1 ? pl.serv.Servicio : 'mi zona: ' + zona.map(s => s.Servicio).join(', ')) + '.' + firmaUsuario(),
    alEnviar: correo => mandarNovedades(n, false, correo) });
}

async function mandarNovedades(n, forzar, correo) {
  const pl = S.pl;
  if (hayCambiosPl() && !(await guardarPlanilla(true))) return;
  try {
    const r = await api('enviarSemana', { periodo: pl.periodo, servicioId: pl.servicioId, semana: n, forzar: !!forzar, correo });
    if (r.faltan && r.faltan.length) { mostrarFaltantes(r.faltan, n, () => mandarNovedades(n, true, correo)); return; }
    (r.semanas || []).forEach(s => { if (s.ServicioId === pl.servicioId) pl.semanas.push(s); });
    renderPlanilla(true);
    const cuantos = (r.servicios || []).length;
    if (r.aviso) toast(r.aviso, true);
    else toast('Novedades enviadas' + (cuantos > 1 ? ' (' + cuantos + ' servicios)' : '') + '. ' +
      (ES_GAS ? 'Administración recibió el aviso.' : 'En la demo el mail se simula.'));
  } catch (e) { toast(e.message, true); }
}

// Cada fila de cobertura con algo cargado tiene que tener el turno: Día, Noche o Mixto.
function filasSinTurno() {
  const out = [];
  let nro = 0;
  S.pl.filas.forEach((f, r) => {
    if (f.Seccion !== 'COBERTURA') return;
    nro++;
    if (!(String(f.Nombre || '').trim() || f.Dias.some(Boolean))) return;
    const t = String(f.Puesto || '').trim();
    // Se exige que tenga turno. Los textos viejos de las planillas (ej.: "Guardia - 200 HS") se aceptan.
    if (!t) out.push({ r, nro, nombre: f.Nombre || '(sin nombre)', valor: t });
  });
  return out;
}

    const r = await api('enviarProgramacion', { periodo: pl.periodo, servicioId: pl.servicioId, forzar: !!forzar, correo });
    if (r.faltan && r.faltan.length) { mostrarFaltantes(r.faltan, null, () => enviarProgramacion(true, correo)); return; }
    pl.progEnviada = r.programacion;
    renderPlanilla(true);
    toast(r.aviso || 'Novedades semanales enviadas.', !!r.aviso);
  } catch (e) { toast(e.message, true); }
}

/* ---------- autocompletar de personal ---------- */

const AC = { el: null, input: null, items: [], idx: 0, pick: null };

function acAbrir(input, pick) {
  AC.input = input; AC.pick = pick;
  if (!AC.el) {
    AC.el = document.createElement('div');
    AC.el.className = 'ac';
    AC.el.addEventListener('mousedown', e => {
      e.preventDefault();
      const d = e.target.closest('[data-i]');
      if (d) acElegir(+d.dataset.i);
    });
    document.body.appendChild(AC.el);
  }
  acFiltrar();
}

// v1.22.4: la lista siempre justo debajo de la celda donde se escribe (si no entra, se corre la planilla para que entre)
function acUbicar(sinMover) {
  if (!AC.el || !AC.input) return;
  let r = AC.input.getBoundingClientRect();
  if (!sinMover && window.innerHeight - r.bottom < 200) {
    const wrap = AC.input.closest('.grilla-wrap');
    if (wrap) { wrap.scrollTop += r.bottom - (window.innerHeight - 220); r = AC.input.getBoundingClientRect(); }
    if (window.innerHeight - r.bottom < 200) { window.scrollBy(0, r.bottom - (window.innerHeight - 220)); r = AC.input.getBoundingClientRect(); }
  }
  const td = AC.input.closest('td') || AC.input, rt = td.getBoundingClientRect();
  AC.el.style.left = Math.max(4, Math.min(rt.left, window.innerWidth - Math.max(360, rt.width) - 4)) + 'px';
  AC.el.style.top = (rt.bottom + 1) + 'px';
  AC.el.style.minWidth = Math.max(340, rt.width) + 'px';
  AC.el.style.maxHeight = Math.max(140, Math.min(280, window.innerHeight - rt.bottom - 10)) + 'px';
}
function acFiltrar() {
  const q = norm(AC.input.value);
  const toks = q.split(' ').filter(Boolean);
  AC.items = toks.length ? S.personalIdx.filter(x => toks.every(t => x.k.includes(t))).slice(0, 40).map(x => x.p) : [];
  AC.idx = 0;
  if (!toks.length) { AC.el.hidden = true; return; }
  AC.el.innerHTML = AC.items.length
    ? AC.items.map((p, i) => '<div data-i="' + i + '" class="' + (i === 0 ? 'on' : '') + '">' + esc(p.Nombre) +
      '<span>' + esc(p.Empresa) + ' ' + esc(p.Legajo) + (norm(p.Estado) === 'BAJA' ? ' (baja)' : '') + '</span></div>').join('')
    : '<div class="vacio">No aparece en Personal. Si es nuevo, pedile a administración que lo dé de alta.</div>';
  acUbicar();
  AC.el.hidden = false;
}

function acMarcar(i) {
  if (!AC.items.length) return;
  AC.idx = (i + AC.items.length) % AC.items.length;
  $$('div[data-i]', AC.el).forEach(d => d.classList.toggle('on', +d.dataset.i === AC.idx));
  const on = $('div.on', AC.el);
  if (on) on.scrollIntoView({ block: 'nearest' });
}

function acElegir(i) {
  const p = AC.items[i];
  const pick = AC.pick;
  acCerrar();
  if (p && pick) pick(p);
}

function acCerrar() {
  if (AC.el) AC.el.hidden = true;
  AC.input = null; AC.pick = null; AC.items = [];
}
const acAbierto = () => AC.el && !AC.el.hidden && AC.input;

/* ---------- eventos de la planilla (delegados) ---------- */

function moverFoco(r, i, dr, di) {
  const orden = ordenFilas();
  let pos = orden.indexOf(r) + dr;
  if (pos < 0 || pos >= orden.length) return;
  const ni = Math.max(0, Math.min(S.pl.info.n - 1, i + di));
  const el = $('#c-' + orden[pos] + '-' + ni);
  if (el) { el.focus({ preventScroll: true }); el.select(); mostrarCelda(el, ni); }
}
// Lleva la grilla hasta la celda: que no quede tapada por las columnas fijas, y al llegar al primer o al último día va hasta la punta.
function mostrarCelda(el, i) {
  const wrap = el.closest('.grilla-wrap'), td = el.closest('td');
  if (!wrap || !td) { el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); return; }
  const fijas = [...td.parentElement.querySelectorAll('td.fijo')].reduce((a, x) => a + x.offsetWidth, 0);
  const izq = td.offsetLeft - wrap.scrollLeft, der = izq + td.offsetWidth;
  if (i === 0) wrap.scrollLeft = 0;
  else if (S.pl && i === S.pl.info.n - 1) wrap.scrollLeft = wrap.scrollWidth;
  else if (izq < fijas) wrap.scrollLeft -= (fijas - izq) + 8;
  else if (der > wrap.clientWidth) wrap.scrollLeft += (der - wrap.clientWidth) + 8;
  // Arriba y abajo
  const cab = wrap.querySelector('tr.x-hd2');
  const top = td.offsetTop - wrap.scrollTop, alto = cab ? cab.offsetTop + cab.offsetHeight - wrap.scrollTop : 0;
  if (td.offsetTop - wrap.scrollTop + td.offsetHeight > wrap.clientHeight) wrap.scrollTop += (td.offsetTop - wrap.scrollTop + td.offsetHeight - wrap.clientHeight) + 8;
  else if (top < 0) wrap.scrollTop += top - 8;
  const r = td.getBoundingClientRect();
  if (r.bottom > window.innerHeight || r.top < 0) td.scrollIntoView({ block: 'nearest' });
}

// ---------- Persona cargada dos veces a la misma hora ----------
// Horario de una celda en horas contadas desde el primer día del período (día i a las 00 = i * 24).
function intervaloCelda(v, i) {
  const m = valorBase(v).replace(',', '.').match(/^(\d{1,2}(?:\.5)?)([NDT])?$/);
  if (!m) return null;
  const h = Number(m[1]);
  if (!h || h > 24) return null;
  const hor = horarioDeNota(notaDe(v));
  const ini = hor ? hor.ini : m[2] === 'T' ? 14 : m[2] === 'N' && h < 24 ? 30 - h : 6;
  return { a: i * 24 + ini, b: i * 24 + ini + h, h };
}
// v1.22.4: el legajo se repite entre empresas: la persona es legajo + apellido (o el nombre si no tiene legajo)
const clavePersona = f => f.Legajo ? 'L' + String(f.Legajo).trim() + '|' + (norm(f.Nombre).split(' ')[0] || '') : (f.Nombre ? 'N' + norm(f.Nombre) : '');
const textoTurno = (v, iv) => soloNumero(v) + ' (' + hhmm(iv.a % 24) + ' a ' + hhmm(iv.b % 24) + ')';

/**
 * propias: filas de esta planilla {Nombre, Legajo, Dias[], _r}
 * ajenas: filas de otros servicios {Nombre, Legajo, Servicio, Dias[]}
 * revisar(r, i): qué celdas propias controlar (todas si no se pasa).
 */
function buscarConflictos(propias, ajenas, periodo, revisar) {
  const out = [], vistos = {};
  const porClave = {};
  propias.forEach(p => { const k = clavePersona(p); if (k) (porClave[k] = porClave[k] || []).push({ f: p, propia: true }); });
  ajenas.forEach(o => { const k = clavePersona(o); if (k && porClave[k]) porClave[k].push({ f: o, propia: false }); });
  propias.forEach(p => {
    const k = clavePersona(p);
    if (!k) return;
    for (let i = 0; i < 31; i++) {
      if (revisar && !revisar(p._r, i)) continue;
      const iv = intervaloCelda(p.Dias[i], i);
      if (!iv) continue;
      porClave[k].forEach(x => {
        if (x.f === p) return;
        for (let j = Math.max(0, i - 1); j <= Math.min(30, i + 1); j++) {
          const iv2 = intervaloCelda(x.f.Dias[j], j);
          if (!iv2 || !(iv.a < iv2.b && iv2.a < iv.b)) continue;
          const id = [k, i, x.propia ? 'P' + x.f._r : x.f.Servicio, j].join('|');
          const id2 = x.propia ? [k, j, 'P' + p._r, i].join('|') : '';
          if (vistos[id] || vistos[id2]) continue;
          vistos[id] = 1;
          out.push({
            r: p._r, i, nombre: p.Nombre, fecha: ddmm(fechaDia(periodo, i)),
            aca: textoTurno(p.Dias[i], iv),
            servicio: x.propia ? 'Esta misma planilla (otra fila)' : x.f.Servicio,
            alla: ddmm(fechaDia(periodo, j)) + ' · ' + textoTurno(x.f.Dias[j], iv2)
          });
        }
      });
    }
  });
  return out;
}

function revisarCeldas(celdas) {
  const pl = S.pl;
  if (!pl || !celdas.length || modalAbierto()) return;
  const set = {};
  celdas.forEach(c => { set[c.r + '-' + c.i] = 1; });
  const propias = pl.filas.map((f, r) => Object.assign({ _r: r }, f));
  const lista = buscarConflictos(propias, pl.ocup || [], pl.periodo, (r, i) => set[r + '-' + i]);
  if (lista.length) mostrarConflictos(lista, { borrar: true });
}

function mostrarConflictos(lista, op) {
  op = op || {};
  const filas = lista.slice(0, 12).map(c =>
    '<tr><td><b>' + esc(c.nombre) + '</b></td><td>' + esc(c.fecha) + '</td><td>' + esc(c.aca) + '</td>' +
    '<td>' + esc(c.servicio) + '<br><small>' + esc(c.alla) + '</small></td></tr>').join('');
  const m = modal(
    '<div class="aviso-doble">' +
      '<div class="aviso-icono">!</div>' +
      '<h3>' + (lista.length === 1 ? 'Esta persona ya está cargada a esa hora' : 'Hay personas cargadas dos veces a la misma hora') + '</h3>' +
      '<p>Una persona no puede estar en dos servicios al mismo tiempo. Revisá cuál de los dos es el correcto antes de guardar.</p>' +

// ---------- Comentario de celda ----------
function editarNota(r, i) {
  const f = S.pl.filas[r];
  if (bloqueado(i)) { toast('Esa semana ya se envió: no se puede cambiar.', true); return; }
  const nota = notaDe(f.Dias[i]);
  const d = fechaDia(S.pl.periodo, i);
  const m = modal('<h3>Comentario del ' + ddmm(d) + (f.Nombre ? ' · ' + esc(f.Nombre) : '') + '</h3>' +
    '<label class="campo">Comentario<textarea id="notaTxt" rows="3" maxlength="200" placeholder="Ej.: Refuerzo de 18 a 03">' + esc(nota) + '</textarea></label>' +
    '<p class="sub" id="notaInfo" style="margin:8px 0 0"></p>' +
    '<div class="pie">' + (nota ? '<button class="btn" id="mQuitar" style="margin-right:auto">Quitar comentario</button>' : '') +
    '<button class="btn" id="mCancel">Cancelar</button><button class="btn prim" id="mOk">Guardar comentario</button></div>');
  const txt = $('#notaTxt'), info = $('#notaInfo');
  const vista = () => {
    const hor = horarioDeNota(txt.value);
    const p = parseCelda(valorBase(f.Dias[i]));
    if (!hor) { info.textContent = 'Si escribís un horario (de 18 a 03), las horas se reparten según ese horario.'; return; }
    const h = p.t === 'horas' || !p.t || p.t === 'vacio' ? Math.round(hor.dur * 2) / 2 : hor.dur;
    const x = repartirDesde(hor.ini, h);
    const cn = colorPorHorario(hor.ini, h);
    info.textContent = 'Se toma de ' + hhmm(hor.ini) + ' a ' + hhmm(hor.ini + h) + ': ' + fmtN(x.d) + ' diurnas y ' + fmtN(x.n) + ' nocturnas. La celda se pinta de ' +
      (cn === 'N' ? 'gris' : cn === 'T' ? 'celeste' : 'blanco') +
      (p.t === 'horas' && Math.abs(hor.dur - p.h) > 0.01 ? '. La celda dice ' + fmtN(p.h) + ' h: se cambia a ' + fmtN(Math.round(hor.dur * 2) / 2) + ' h (manda el horario).' : '.');
  };
  txt.addEventListener('input', vista); vista();
  const guardar = nueva => {
    const nota = limpiarNota(nueva);
    const hor = horarioDeNota(nota);
    let color = colorDeValor(f.Dias[i]);
    let base = f.Dias[i];
    if (hor) {
      const p0 = parseCelda(valorBase(f.Dias[i]));
      // v1.22.7: manda el horario del comentario (de 05.30 a 14 = 8,5 horas), también si la celda tenía otro número
      // o estaba vacía. Si la celda tiene un código (F, ENF...), queda el código.
      if (!valorBase(f.Dias[i]) || p0.t === 'horas') base = String(Math.round(hor.dur * 2) / 2);
      color = colorPorHorario(hor.ini, hor.dur);
      f.Col[i] = color;
    }
    f.Dias[i] = armarValor(base, color, nota);
    const elc = $('#c-' + r + '-' + i); if (elc) elc.value = soloNumero(f.Dias[i]);
    cerrarModal(); refrescarCelda(r, i); marcarSucio(); recalcular();
    const el = $('#c-' + r + '-' + i); if (el) el.focus();
  };
  $('#mCancel').onclick = cerrarModal;
  $('#mOk').onclick = () => guardar(txt.value);
  if ($('#mQuitar')) $('#mQuitar').onclick = () => guardar('');
  txt.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); guardar(txt.value); } });
}

// ---------- Selección de celdas y pintado ----------
const SEL = { a: null, b: null, arrastrando: false, conShift: false, extra: [] };

function celdasSeleccionadas() {
  const base = celdasRect(), extra = (SEL.extra || []).filter(c => !base.some(x => x.r === c.r && x.i === c.i));
  return extra.filter((c, k) => extra.findIndex(x => x.r === c.r && x.i === c.i) === k).concat(base);
}
function celdasRect() {
  if (!SEL.a || !SEL.b || !S.pl) return [];
  const orden = ordenFilas();
  const pa = orden.indexOf(SEL.a.r), pb = orden.indexOf(SEL.b.r);
  if (pa < 0 || pb < 0) return [];
  const out = [];
  for (let p = Math.min(pa, pb); p <= Math.max(pa, pb); p++)
    for (let i = Math.min(SEL.a.i, SEL.b.i); i <= Math.max(SEL.a.i, SEL.b.i); i++) out.push({ r: orden[p], i });
  return out;
}

function marcarSeleccion() {
  $$('table.g td.sel').forEach(td => td.classList.remove('sel'));
  $$('table.g .asa').forEach(x => x.remove());
  const lista = celdasSeleccionadas();

  if (lista.length > 1) lista.forEach(c => { const el = $('#c-' + c.r + '-' + c.i); if (el) el.parentElement.classList.add('sel'); });
  // Cuadradito para arrastrar y rellenar, como en Excel, en la esquina de abajo a la derecha.
  const R = rectSeleccion();
  if (R && S.vista === 'planilla') {
    const el = $('#c-' + R.orden[R.p1] + '-' + R.i1);
    if (el) { const a = document.createElement('span'); a.className = 'asa'; a.title = 'Arrastrá para rellenar'; el.parentElement.appendChild(a); }
  }
}

/* ---------- Funciones tipo Excel: copiar, cortar, pegar, borrar y rellenar ---------- */
const PORTA = { tsv: '', bloque: null, forzado: null };

function rectSeleccion() {
  if (!SEL.a || !SEL.b || !S.pl) return null;
  const orden = ordenFilas();
  const pa = orden.indexOf(SEL.a.r), pb = orden.indexOf(SEL.b.r);
  if (pa < 0 || pb < 0) return null;
  return { orden, p0: Math.min(pa, pb), p1: Math.max(pa, pb), i0: Math.min(SEL.a.i, SEL.b.i), i1: Math.max(SEL.a.i, SEL.b.i) };
}

// Pone un valor completo (con su color y comentario) en una celda.
function ponerValor(r, i, v) {
  if (bloqueado(i)) return false;
  const f = S.pl.filas[r];
  v = String(v || '');
  f.Dias[i] = v;
  if (!valorBase(v)) { f.Dias[i] = ''; f.Col[i] = ''; }
  else if (RX_HORAS.test(valorBase(v))) f.Col[i] = colorDeValor(v);
  const el = $('#c-' + r + '-' + i);
  if (el) el.value = soloNumero(v);
  refrescarCelda(r, i);
  return true;
}

function seleccionTodo(R) {
  if (!R || R.i0 !== 0 || R.i1 !== S.pl.info.n - 1) return false;
  const ord = R.orden.filter(r => S.pl.filas[r] && (String(S.pl.filas[r].Nombre || '').trim() || S.pl.filas[r].Dias.some(Boolean)));
  return ord.length > 1 && R.orden.indexOf(ord[0]) >= R.p0 && R.orden.indexOf(ord[ord.length - 1]) <= R.p1;
}
function copiarSeleccion(cortar) {
  const R = rectSeleccion();
  if (!R) return '';
  const bloque = [];
  for (let p = R.p0; p <= R.p1; p++) {
    const f = S.pl.filas[R.orden[p]], fila = [];
    for (let i = R.i0; i <= R.i1; i++) fila.push(f.Dias[i] || '');
    bloque.push(fila);
  }
  PORTA.bloque = bloque;
  PORTA.tsv = bloque.map(f => f.map(soloNumero).join('\t')).join('\n');
  if (cortar) borrarSeleccion();
  return PORTA.tsv;
}

function borrarSeleccion() {
  const R = rectSeleccion();
  if (!R) return;
  let bloq = 0;
  celdasSeleccionadas().forEach(c => { if (!ponerValor(c.r, c.i, '')) bloq++; });
  marcarSeleccion(); marcarSucio(); recalcular();
  if (bloq) toast('Algunas celdas son de semanas enviadas y no se borraron.', true);
}

// Pega un bloque en la selección. Si la selección es más grande que lo copiado, lo repite (como Excel).
/**
 * Colores de las celdas copiadas de Excel o de Google (vienen en el HTML del portapapeles).
 * Devuelve una grilla [fila][columna] con 'N' (gris = noche), 'T' (celeste = tarde), '' (blanco = mañana)
 * o null (otro color o sin dato: se respeta el de la planilla).
 */
function coloresDeExcel(html) {
  return new Promise((ok, mal) => {
    const fr = document.createElement('iframe');
    fr.style.cssText = 'position:fixed;left:-9999px;top:0;width:10px;height:10px;visibility:hidden';
    fr.setAttribute('sandbox', 'allow-same-origin');
    document.body.appendChild(fr);
    const fin = () => setTimeout(() => fr.remove(), 50);
    const leer = () => {
      try {
        const doc = fr.contentDocument, out = [];
        out.notas = [];
        const tabla = doc.querySelector('table');
        if (!tabla) { fin(); ok(out); return; }
        // Comentarios de Excel: la celda tiene un ancla (#_msocom_1) y el texto está al final (id _com_1)
        const textoNota = a => {
          const num = ((a.getAttribute('href') || '') + ' ' + (a.getAttribute('name') || '')).match(/(\d+)/);
          const id = num ? '_com_' + num[1] : '';
          const div = id && (doc.getElementById(id) || doc.querySelector('[id="' + id + '"], [name="' + id + '"]'));
          if (!div) return '';
          let t = (div.innerText || div.textContent || '').replace(/\u00a0/g, ' ').trim();
          t = t.replace(/^[^:\n]{1,60}:\s*\n/, '');          // el nombre de quien lo escribió ("Fernando:")
          return limpiarNota(t);
        };
        const ocup = [];
        [...tabla.rows].forEach((tr, r) => {
          let c = 0; out[r] = out[r] || [];
          [...tr.cells].forEach(td => {
            while (ocup[r] && ocup[r][c]) c++;
            const cs = td.colSpan || 1, rs = td.rowSpan || 1;
            const col = turnoPorColor(fr.contentWindow.getComputedStyle(td).backgroundColor);
            // Comentario de la celda: Excel (ancla al texto del comentario, o mso-comment-reference) o Google (data-sheets-note)
            let nota = '';
            const an = td.querySelector('a[href*="msocom"]');
            if (an) nota = textoNota(an);
            if (!nota) {
              const ref = (td.outerHTML.match(/mso-comment-reference:\s*"?([^";']+)/i) || [])[1];
              if (ref) { const div = doc.getElementById(ref.replace(/^#/, '')) || doc.getElementById('_com_' + ref.replace(/\D/g, '')); if (div) nota = limpiarNota(String(div.innerText || div.textContent || '').replace(/^[^:\n]{1,60}:\s*\n/, '')); }
            }
            if (!nota && td.getAttribute('data-sheets-note')) nota = limpiarNota(td.getAttribute('data-sheets-note'));
            for (let a = 0; a < rs; a++) for (let b = 0; b < cs; b++) { ocup[r + a] = ocup[r + a] || []; ocup[r + a][c + b] = 1; (out[r + a] = out[r + a] || [])[c + b] = col; }
            if (nota) (out.notas[r] = out.notas[r] || [])[c] = nota;
            c += cs;
          });
        });
        fin(); ok(out);
      } catch (err) { fin(); mal(err); }
    };
    fr.onload = leer;
    fr.srcdoc = html.replace(/<script[\s\S]*?<\/script>/gi, '');
    setTimeout(() => { if (fr.isConnected) leer(); }, 1500);
  });
}
function turnoPorColor(css) {
  const m = String(css || '').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);
  if (!m || (m[4] !== undefined && Number(m[4]) === 0)) return '';          // sin relleno = blanco
  const r = +m[1], g = +m[2], b = +m[3], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  if (mn > 240) return '';                                                    // blanco
  if (mx - mn <= 24 && mx < 235) return 'N';                                  // gris
  if (b > 150 && b - r >= 25 && b >= g) return 'T';                          // celeste
  return null;                                                                // otro color (verde de franco, etc.)
}
// v1.22.3: una BAJA sigue hasta el último día del período (el 25), también al pegar
function completarBajas(filas) {
  let n = 0;
  [...new Set(filas)].forEach(r => {
    const f = S.pl.filas[r]; if (!f) return;
    const i0 = f.Dias.findIndex((v, i) => i < S.pl.info.n && (valorBase(v) === 'BAJA' || (parseCelda(v).t === 'codigo' && parseCelda(v).tipo === 'BAJA')));
    if (i0 < 0) return;
    const cod = valorBase(f.Dias[i0]);
    for (let k = i0 + 1; k < S.pl.info.n; k++) if (valorBase(f.Dias[k]) !== cod && ponerValor(r, k, cod)) n++;
  });
  if (n) { marcarSucio(); recalcular(); }
  return n;
}
function pegarBloque(bloque, esCompleto, colores) {
  const R = rectSeleccion();
  if (!R || !bloque.length) return;
  const h = bloque.length, w = Math.max.apply(null, bloque.map(f => f.length));
  const alto = (R.p1 - R.p0 + 1) > 1 || (R.i1 - R.i0 + 1) > 1 ? Math.max(R.p1 - R.p0 + 1, h) : h;
  const ancho = (R.p1 - R.p0 + 1) > 1 || (R.i1 - R.i0 + 1) > 1 ? Math.max(R.i1 - R.i0 + 1, w) : w;
  const repetir = (R.p1 - R.p0 + 1) * (R.i1 - R.i0 + 1) > 1;
  const altoF = repetir ? R.p1 - R.p0 + 1 : alto, anchoF = repetir ? R.i1 - R.i0 + 1 : ancho;
  const tocadas = [];
  let bloq = 0;
  for (let dp = 0; dp < altoF; dp++) {
    const p = R.p0 + dp;
    if (p >= R.orden.length) break;
    const r = R.orden[p], f = S.pl.filas[r];
    for (let di = 0; di < anchoF; di++) {
      const i = R.i0 + di;
      if (i >= S.pl.info.n) break;
      const src = (bloque[dp % h] || [])[di % w];
      if (src === undefined) continue;
      const col = colores ? ((colores[dp % h] || [])[di % w]) : undefined;
      const nx = colores && colores.notas ? ((colores.notas[dp % h] || [])[di % w]) : '';
      let v = esCompleto ? src : armarValor(src, col !== undefined && col !== null ? col : colorCelda(f, i), nx || notaDe(f.Dias[i]));
      if (nx) v = ajustarHorasPorNota(v);
      if (ponerValor(r, i, v)) tocadas.push({ r, i }); else bloq++;
    }
  }
  SEL.a = { r: R.orden[R.p0], i: R.i0 };
  SEL.b = { r: R.orden[Math.min(R.p0 + altoF - 1, R.orden.length - 1)], i: Math.min(R.i0 + anchoF - 1, S.pl.info.n - 1) };
  marcarSeleccion(); marcarSucio(); recalcular();
  completarBajas(tocadas.map(x => x.r));
  if (bloq) toast('Algunas celdas son de semanas enviadas y no se cambiaron.', true);
  if (tocadas.length) revisarCeldas(tocadas);
}

// Rellenar arrastrando el cuadradito de la esquina.
const RELL = { activo: false, base: null, hasta: null };
function marcarRelleno() {
  $$('table.g td.rell').forEach(td => td.classList.remove('rell'));
  const z = zonaRelleno();
  if (!z) return;
  z.celdas.forEach(c => { const el = $('#c-' + c.r + '-' + c.i); if (el) el.parentElement.classList.add('rell'); });
}
function zonaRelleno() {
  if (!RELL.activo || !RELL.base || !RELL.hasta) return null;
  const B = RELL.base, orden = B.orden;
  const ph = orden.indexOf(RELL.hasta.r), ih = RELL.hasta.i;
  if (ph < 0) return null;
  const abajo = ph - B.p1, arriba = B.p0 - ph, der = ih - B.i1, izq = B.i0 - ih;
  const celdas = [];
  let dir = null;
  const v = Math.max(abajo, arriba), hz = Math.max(der, izq);
  if (v <= 0 && hz <= 0) return null;
  if (v >= hz) {
    dir = abajo > 0 ? 'abajo' : 'arriba';
    const desde = dir === 'abajo' ? B.p1 + 1 : ph, hasta = dir === 'abajo' ? ph : B.p0 - 1;
    for (let p = desde; p <= hasta; p++) for (let i = B.i0; i <= B.i1; i++) celdas.push({ r: orden[p], i, p });
  } else {
    dir = der > 0 ? 'der' : 'izq';
    const desde = dir === 'der' ? B.i1 + 1 : ih, hasta = dir === 'der' ? ih : B.i0 - 1;
    for (let p = B.p0; p <= B.p1; p++) for (let i = desde; i <= hasta; i++) celdas.push({ r: orden[p], i, p });
  }
  return { dir, celdas };
}
function terminarRelleno() {
  const z = zonaRelleno(), B = RELL.base;
  RELL.activo = false;
  $$('table.g td.rell').forEach(td => td.classList.remove('rell'));
  if (!z) return;
  const h = B.p1 - B.p0 + 1, w = B.i1 - B.i0 + 1;
  const val = (p, i) => S.pl.filas[B.orden[p]].Dias[i] || '';
  const tocadas = [];
  let bloq = 0;
  z.celdas.forEach(c => {
    const dp = ((c.p - B.p0) % h + h) % h, di = ((c.i - B.i0) % w + w) % w;
    if (ponerValor(c.r, c.i, val(B.p0 + dp, B.i0 + di))) tocadas.push(c); else bloq++;
  });
  const todas = z.celdas.concat([{ p: B.p0, i: B.i0 }, { p: B.p1, i: B.i1 }]);
  const pMin = Math.min.apply(null, todas.map(c => c.p)), pMax = Math.max.apply(null, todas.map(c => c.p));
  const iMin = Math.min.apply(null, todas.map(c => c.i)), iMax = Math.max.apply(null, todas.map(c => c.i));
  SEL.a = { r: B.orden[pMin], i: iMin }; SEL.b = { r: B.orden[pMax], i: iMax };
  marcarSeleccion(); marcarSucio(); recalcular();
  if (bloq) toast('Algunas celdas son de semanas enviadas y no se rellenaron.', true);
  if (tocadas.length) revisarCeldas(tocadas);
}

function pintarSeleccion(color) {
  const lista = celdasSeleccionadas();
  if (!lista.length) { toast('Marcá primero las celdas que querés pintar.', true); return; }
  let bloq = 0;
  lista.forEach(({ r, i }) => {
    if (bloqueado(i)) { bloq++; return; }
    const f = S.pl.filas[r];
    f.Col[i] = color;
    f.Dias[i] = armarValor(f.Dias[i], color, notaDe(f.Dias[i]));
    refrescarCelda(r, i);
  });
  marcarSeleccion();
  marcarSucio(); recalcular();
  if (bloq) toast('Algunas celdas son de semanas enviadas y no se pintaron.', true);
  else revisarCeldas(lista);
}

function enlazarEventos() {
  const main = $('#main');

  main.addEventListener('input', e => {
    const t = e.target;
    if (S.vista !== 'planilla' || !S.pl) return;
    if (t.classList.contains('cel')) {
      const r = +t.dataset.r, i = +t.dataset.d, f = S.pl.filas[r];
      const c = colorCelda(f, i);
      if (!t.value.trim()) { f.Dias[i] = ''; f.Col[i] = ''; }   // celda borrada: blanca, sin color ni comentario
      else {
        f.Dias[i] = armarValor(t.value, c, notaDe(f.Dias[i]));
        if (RX_HORAS.test(valorBase(f.Dias[i]))) f.Col[i] = c;
      }
      refrescarCelda(r, i);
      marcarSeleccion();
      marcarSucio(); recalcular();
      return;
    } else if (t.classList.contains('nom-in')) {
      if (t.dataset.r !== undefined) {
        const r = +t.dataset.r;
        S.pl.filas[r].Nombre = t.value;
        S.pl.filas[r].Legajo = ''; S.pl.filas[r].Empresa = '';
        $('#leg-' + r).textContent = ''; $('#emp-' + r).textContent = '';
        acAbrir(t, p => asignarPersona(r, p));
      } else {

        S.pl.plus[k].Nombre = t.value; S.pl.plus[k].Legajo = '';
        $('#pleg-' + k).textContent = '';
        acAbrir(t, p => asignarPersonaPlus(k, p));
      }
      marcarSucio();
    } else if (t.classList.contains('tx-in')) {
      if (t.dataset.p !== undefined) S.pl.plus[+t.dataset.p][t.dataset.campo] = t.value;
      else {
        const fx = S.pl.filas[+t.dataset.r];
        fx[t.dataset.campo] = t.value;
        // Turno escrito a mano: deja de ponerse solo (si se borra, vuelve a ser automático)
        if (t.dataset.campo === 'Puesto' && fx.Seccion === 'COBERTURA') { fx._tAuto = t.value.trim() ? null : ''; t.classList.remove('t-auto'); if (!t.value.trim()) actualizarTurnosAuto(); }
      }
      marcarSucio();
    }
  });

  main.addEventListener('change', e => {
    const t = e.target;
    if (S.vista !== 'planilla' || !S.pl || !t.classList.contains('tur')) return;
    if (t.dataset.p !== undefined) {
      const x = S.pl.plus[+t.dataset.p];
      x[t.dataset.campo] = t.value; marcarSucio();

    // "21 a 06", "14 a 22", "6 a 18", "21:30 a 06"...: pone las horas y el color del turno; el horario queda en el comentario.
    const hor = /^\s*\d{1,2}([:.]\d{2})?\s*(A|AL|-|HASTA)\s*\d{1,2}([:.]\d{2})?\s*(HS?\.?)?\s*$/i.test(t.value) ? horarioDeNota(t.value) : null;

   SEMANAS ENVIADAS (administración)

const TABS_BANDEJA = per => '<div class="tabs">' +
  '<button class="tab' + (S.params.tab === 'semanas' ? '' : ' on') + '" data-btab="envios">Envíos</button>' +
  (puede('datos', true) ? '<button class="tab' + (S.params.tab === 'semanas' ? ' on' : '') + '" data-btab="semanas">Semanas</button>' : '') + '</div>';

// Pestaña Semanas: administración define las semanas 1 a 5 de cada período (desde / hasta).
// Si la semana 5 queda vacía, ese período tiene 4 semanas. Sin definir, van de lunes a domingo.
function vSemanasDef(periodo) {
  const info = periodoInfo(periodo), sems = semanasPeriodo(periodo);
  const def = (S.base.semanasDef || []).filter(w => w.Periodo === periodo);
  const filas = [1, 2, 3, 4, 5].map(n => {
    const w = sems.find(x => x.numero === n);
    const d = w ? iso(fechaDia(periodo, w.desdeIdx)) : '', h = w ? iso(fechaDia(periodo, w.hastaIdx)) : '';
    return '<tr><td><b>' + n + '° semana</b></td><td>' + campoFecha('data-sd="' + n + '"', d) + '</td><td>' + campoFecha('data-sh="' + n + '"', h) + '</td></tr>';
  }).join('');
  $('#main').innerHTML =
    '<div class="barra"><div><h1>Semanas informadas</h1><p class="sub" style="margin:0">Definí las semanas de cada período. Así se arman los botones "Informar semana" y el bloqueo.</p></div>' +
    '<div class="esp"></div><label class="campo">Período<select id="selPerS">' + opciones(listaPeriodos(periodoActual()).map(p => ({ v: p, t: nombrePeriodo(p) })), periodo) + '</select></label></div>' +
    TABS_BANDEJA(periodo) +
    '<div class="panel inf-panel"><p class="sub">' + esc(nombrePeriodo(periodo)) + ': del ' + ddmm(info.desde) + ' al ' + ddmm(info.hasta) + '. ' +
      (def.length ? 'Semanas definidas a mano.' : 'Hoy van de lunes a domingo (sin definir).') + '</p>' +
      '<table class="t sem-def"><thead><tr><th>Semana</th><th>Desde</th><th>Hasta</th></tr></thead><tbody id="sdBody">' + filas + '</tbody></table>' +
      '<p class="sub">Una semana queda <b>bloqueada para el supervisor</b> cuando la informa (botón "Informar semana" en su planilla). Administración la puede reabrir desde la pestaña Envíos.</p>' +
      '<div class="barra"><button class="btn" id="sdLimpiar">Volver a lunes a domingo</button><div class="esp"></div><button class="btn prim" id="sdGuardar">Guardar semanas</button></div></div>';
  enlazarFechas($('#sdBody'));
  $('#selPerS').onchange = e => ir('bandeja', { periodo: e.target.value, tab: 'semanas' });
  $$('[data-btab]').forEach(b => b.onclick = () => ir('bandeja', { periodo, tab: b.dataset.btab }));
  const guardar = async semanas => {
    try { S.base.semanasDef = await api('guardarSemanasDef', { periodo, semanas }); toast('Semanas guardadas.'); vSemanasDef(periodo); }
    catch (e) { toast(e.message, true); }
  };
  $('#sdLimpiar').onclick = () => guardar([]);
  $('#sdGuardar').onclick = () => {
    const out = [];
    for (let n = 1; n <= 5; n++) {

function rangoCiclo(ciclo, mes) {
  const [y, m] = mes.split('-').map(Number);
  if (ciclo === '26-25') return { desde: new Date(Date.UTC(y, m - 2, 26)), hasta: new Date(Date.UTC(y, m - 1, 25)) };
  return { desde: new Date(Date.UTC(y, m - 1, 1)), hasta: new Date(Date.UTC(y, m, 0)) };
}

function periodosDelRango(desde, hasta) {
  let p = desde.getUTCDate() >= 26
    ? desde.getUTCFullYear() + '-' + pad(desde.getUTCMonth() + 1)
    : sumarMes(desde.getUTCFullYear() + '-' + pad(desde.getUTCMonth() + 1), -1);
  const out = [];
  while (periodoInfo(p).desde <= hasta) { out.push(p); p = sumarMes(p, 1); }
  return out;
}

// v1.22.9: personas cuyas horas no suman para la facturación (por ahora, Daniel Cruz)
const NO_FACTURA = [['CRUZ', 'DANIEL']];
function noFactura(nombre) { const t = norm(nombre).split(/\s+/); return NO_FACTURA.some(x => x.every(k => t.indexOf(k) >= 0)); }
function realizadoPorFecha(filas) {
  const out = {};
  filas.forEach(f => {
    if (noFactura(f.Nombre)) return;
    if (f.Seccion === 'EVENTO') {
      const n = periodoInfo(f.Periodo).n;
      for (let i = 0; i < n; i++) {
        const p = parseCelda(f['D' + pad(i + 1)], f.Turno);
        if (p.t !== 'horas') continue;
        const k = f.ServicioId + '|' + iso(fechaDia(f.Periodo, i));
        out[k] = out[k] || { d: 0, n: 0 };
        out[k].ad = (out[k].ad || 0) + p.d; out[k].an = (out[k].an || 0) + p.n;
      }
      return;
    }
    if (f.Seccion !== 'COBERTURA') return;
    const n = periodoInfo(f.Periodo).n;
    for (let i = 0; i < n; i++) {
      const p = parseCelda(f['D' + pad(i + 1)], f.Turno);
      if (p.t !== 'horas') continue;
      const k = f.ServicioId + '|' + iso(fechaDia(f.Periodo, i));
      out[k] = out[k] || { d: 0, n: 0 };
      out[k].d += p.d;
      out[k].n += p.n;
    }
  });
  return out;
}

function conformacionServicio(serv, rango, real) {
  const dias = [];
  const tot = { cd: 0, cn: 0, rd: 0, rn: 0, adic: 0, caidas: 0 };
  for (let t = rango.desde.getTime(); t <= rango.hasta.getTime(); t += 864e5) {
    const d = new Date(t);
    const r = real[serv.Id + '|' + iso(d)] || { d: 0, n: 0 };
    const c = sinDiferencia(serv) ? { d: r.d, n: r.n } : contratadoDia(serv, d);
    r.ad = r.ad || 0; r.an = r.an || 0;
    const dif = (r.d + r.n) - (c.d + c.n);
    dias.push({ d, c, r, dif });
    tot.cd += c.d; tot.cn += c.n; tot.rd += r.d; tot.rn += r.n;
    tot.adic += r.ad + r.an;
    if (dif < 0) tot.caidas -= dif;
  }
  return { dias, tot };
}

// Conformación horaria: todos los servicios del mes agrupados por ciclo (del 22, del 26 y fin de mes, según el listado de Servicios).
// "Ver" abre la conformación en una ventana emergente donde se cargan las horas a facturar.
// Después se eligen las que hay que bajar y salen en un Excel por ciclo, con el formato de la empresa.
const CONF = { mes: null, empresa: '', sel: new Set(), fact: {}, aj: {} };
// Conformación con los cambios hechos a mano (horas de cada día). Adicionales = realizadas - contratadas, solo lo positivo.
function confAjustada(c, aj) {
  const tot = { cd: 0, cn: 0, rd: 0, rn: 0, ad: 0, an: 0, adic: 0, caidas: 0 };
  const dias = c.dias.map(dd => {
    const k = iso(dd.d), a = (aj && aj.dias && aj.dias[k]) || {};
    const val = (v, def) => v === undefined || v === '' ? def : Number(v) || 0;
    const cD = val(a.cD, dd.c.d), cN = val(a.cN, dd.c.n);
    const rD = val(a.rD, dd.r.d + (dd.r.ad || 0)), rN = val(a.rN, dd.r.n + (dd.r.an || 0));
    const aD = Math.max(0, rD - cD), aN = Math.max(0, rN - cN), dif = (rD + rN) - (cD + cN);
    tot.cd += cD; tot.cn += cN; tot.rd += rD; tot.rn += rN; tot.ad += aD; tot.an += aN; tot.adic += aD + aN;
    if (dif < 0) tot.caidas -= dif;
    return { d: dd.d, cD, cN, rD, rN, aD, aN, cambio: Object.keys(a).length > 0, orig: { cD: dd.c.d, cN: dd.c.n, rD: dd.r.d + (dd.r.ad || 0), rN: dd.r.n + (dd.r.an || 0) } };
  });
  return { dias, tot };
}

// "2026-10-08" -> "08/10/2026"
const fechaLarga = iso => { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : String(iso || ''); };

// Servicios: la lista sale de Stock Manager (pestaña objetivos). Cada objetivo tiene su configuración en la app
// (supervisor, ciclo, horas contratadas). Los que todavía no se configuraron aparecen para configurar.
// Comparación flexible de nombres: "Fincas de Iraola II" = "Fincas de Iraola 2", "Ex Frigorífico Pacheco" = "Frigorífico Pacheco",
// "José Hernández 1721" = "Consorcio José Hernández 1721".
const PALABRAS_VACIAS = ['EX', 'CONSORCIO', 'CONS', 'EDIFICIO', 'EDIF', 'BARRIO', 'B', 'BO', 'OBRA', 'EL', 'LA', 'LOS', 'LAS', 'DE', 'DEL', 'Y', 'SA', 'SRL', 'S', 'A', 'PROPIETARIOS', 'COPROPIETARIOS'];
const ROMANOS = { I: '1', II: '2', III: '3', IV: '4', V: '5', VI: '6', VII: '7', VIII: '8', IX: '9', X: '10' };
function tokensNombre(t) {
  return norm(t).replace(/[^A-Z0-9]+/g, ' ').trim().split(' ').filter(Boolean).map(x => ROMANOS[x] || x).filter(x => PALABRAS_VACIAS.indexOf(x) < 0);
}
function mismoNombre(a, b) {
  const x = tokensNombre(a), y = tokensNombre(b);
  if (!x.length || !y.length) return false;
  if (x.join(' ') === y.join(' ')) return true;
  const [chico, grande] = x.length <= y.length ? [x, y] : [y, x];
  return chico.length >= 2 && chico.every(t => grande.indexOf(t) >= 0);
}
// v1.22.7: mismo nombre aunque tenga un error de tipeo (PACHECHO / PACHECO)
function distEd(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function mismoNombreTipeo(a, b) {
  const x = tokensNombre(a), y = tokensNombre(b);
  if (!x.length || x.length !== y.length) return false;
  let dif = 0;
  for (let k = 0; k < x.length; k++) {
    if (x[k] === y[k]) continue;
    if (/\d/.test(x[k] + y[k]) || Math.min(x[k].length, y[k].length) < 5 || distEd(x[k], y[k]) > 1) return false;
    dif++;
  }
  return dif <= 1;
}
function servicioDeObjetivo(o) {
  const k = t => norm(t).replace(/[^A-Z0-9]/g, '');
  const ss = S.base.servicios;
  const porId = ss.filter(s => s.ObjetivoId && String(s.ObjetivoId) === String(o.Id));
  if (porId.length) return porId;
  const exactos = ss.filter(s => !s.ObjetivoId && (k(s.Cliente) === k(o.Nombre) || k(s.Servicio) === k(o.Nombre)));
  if (exactos.length) return exactos;
  const parecidos = ss.filter(s => !s.ObjetivoId && (mismoNombre(s.Cliente, o.Nombre) || mismoNombre(s.Servicio, o.Nombre)));
  if (parecidos.length) return parecidos;
  const tipeo = ss.filter(s => !s.ObjetivoId && (mismoNombreTipeo(s.Cliente, o.Nombre) || mismoNombreTipeo(s.Servicio, o.Nombre)));
  return tipeo.length === 1 ? tipeo : [];
}
// Nombre del cliente tal cual figura en el listado de objetivos de Stock Manager.
function nombreListado(servicioId) {
  const s = S.base.servicios.find(x => x.Id === servicioId);
  if (!s) return '';
  return (objetivoDeServicio(s) || {}).Nombre || s.Cliente || s.Servicio;
}
// v1.22.9: objetivo del SGI de cada servicio, con el MISMO criterio que la lista de Servicios (columna "Objetivo"),
// así la pestaña dice exactamente lo que dice el listado de clientes.
function objetivoDeServicio(s) {
  const objs = S.base.objetivos || [];
  if (!s || !objs.length) return null;
  const firma = objs.length + '|' + S.base.servicios.length + '|' + S.base.servicios.map(x => x.ObjetivoId || '').join(',');
  if (NOM_OBJ.firma !== firma) {
    NOM_OBJ.firma = firma; NOM_OBJ.map = {};
    const usados = new Set();
    objs.slice().sort((a, b) => a.Nombre.localeCompare(b.Nombre)).forEach(o => {
      servicioDeObjetivo(o).filter(x => !usados.has(x.Id)).forEach(x => { usados.add(x.Id); NOM_OBJ.map[x.Id] = o; });
    });
  }
  return NOM_OBJ.map[s.Id] || null;
}
const NOM_OBJ = {};
// Nombre de la pestaña: el del objetivo en el SGI (ej.: "CONSORCIO ALEM"), o el del servicio si no está en el SGI
function nombreTab(s) {

}

  });
}

/* ---------- Personal (de SGI) ---------- */
// Columnas del listado. Las que tienen "lista" se filtran eligiendo de una lista; las demás escribiendo.
const COLS_PERS = [
  { k: 'Nombre', t: 'Apellido y Nombre' },
  { k: 'Legajo', t: 'Legajo' },
  { k: 'Dni', t: 'DNI' },
  { k: 'Empresa', t: 'Empresa', lista: true },
  { k: 'Categoria', t: 'Categoría', lista: true },
  { k: 'Supervisor', t: 'Supervisor', lista: true },
  { k: 'Zona', t: 'Zona', lista: true }
];
const PF = { q: '', f: {}, orden: 'Nombre', asc: true, sel: new Set() };

function personalActivo() {
  return S.base.personal.filter(p => norm(p.Estado) !== 'BAJA');
}
function personalFiltrado() {
  const toks = norm(PF.q).split(' ').filter(Boolean);
  let l = personalActivo().filter(p => {
    if (toks.length) {
      const k = norm(COLS_PERS.map(c => p[c.k] || '').join(' '));
      if (!toks.every(t => k.includes(t))) return false;
    }
    return COLS_PERS.every(c => {
      const v = PF.f[c.k];
      if (!v) return true;
      return c.lista ? String(p[c.k] || '') === v : norm(p[c.k] || '').includes(norm(v));
    });
  });
  const k = PF.orden, num = k === 'Legajo' || k === 'Dni';
  l.sort((a, b) => {
    const x = a[k] || '', y = b[k] || '';
    const r = num ? (Number(x) || 0) - (Number(y) || 0) : String(x).localeCompare(String(y));
    return PF.asc ? r : -r;
  });
  return l;
}

// v1.22.6: pestañas de Personal: el listado y "Status personal"
function tabsPersonal(on) {
  return '<div class="dia-tabs pers-tabs"><button class="dia-tab' + (on === 'lista' ? ' on' : '') + '" data-perstab="lista">Listado de personal</button>' +
    '<button class="dia-tab' + (on === 'status' ? ' on' : '') + '" data-perstab="status">Status personal</button></div>';
}
function enlazarTabsPersonal() {
  $$('[data-perstab]').forEach(b => b.onclick = () => { S.persTab = b.dataset.perstab; S.persTab === 'status' ? vStatusPersonal() : vPersonal(); });
}
const SPF = { zona: '', estado: '', cat: '', q: '' };
async function vStatusPersonal(periodo) {
  S.persTab = 'status';
  periodo = periodo || SPF.periodo || periodoTrabajo();
  SPF.periodo = periodo;
  $('#main').innerHTML = tabsPersonal('status') + '<div class="cargando">Revisando las planillas de ' + esc(nombrePeriodo(periodo)) + '…</div>';
  enlazarTabsPersonal();
  let r;
  try { r = await api('statusPersonal', { periodo }); }
  catch (e) { $('#main').innerHTML = tabsPersonal('status') + '<div class="panel vacio-msg">' + esc(e.message) + '</div>'; enlazarTabsPersonal(); return; }
  const nomSup = u => (S.base.supervisores.find(x => String(x.usuario).toLowerCase() === u) || {}).nombre || u;
  const zonaDe = p => p.sups.length ? p.sups.map(nomSup).join(', ') : (p.ZonaSGI || 'Sin zona');
  const rangos = idx => {
    const out = []; let a = null, b = null;
    idx.concat([-9]).forEach(i => {
      if (a !== null && i === b + 1) { b = i; return; }
      if (a !== null) out.push(a === b ? ddmm(fechaDia(periodo, a)) : ddmm(fechaDia(periodo, a)) + ' al ' + ddmm(fechaDia(periodo, b)));
      a = b = i;
    });
    return out.join(', ');
  };
  const lista = r.lista.map(p => Object.assign(p, { zona: zonaDe(p), estado: p.sinServicio ? 'Sin servicio' : 'Faltan días' }));
  const opts = k => [...new Set(lista.map(p => p[k] || ''))].filter(Boolean).sort();
  $('#main').innerHTML = tabsPersonal('status') +
    '<div class="barra"><div><h1>Status personal</h1><p class="sub" style="margin:0">Personal activo de SGI que no tiene servicio en ' + esc(nombrePeriodo(periodo)) +
      ' o que tiene días vacíos (sin horas ni código en ninguna planilla).</p></div><div class="esp"></div>' +
      '<label class="campo">Período<select id="spPer">' + opciones(listaPeriodos(periodoActual()).map(p => ({ v: p, t: nombrePeriodo(p) })), periodo) + '</select></label></div>' +
    '<div class="barra">' +
      '<label class="campo" style="flex:1;max-width:340px">Buscar<input id="spQ" value="' + esc(SPF.q) + '" placeholder="Apellido o legajo"></label>' +
      '<label class="campo">Zona<select id="spZona"><option value="">Todas</option>' + opts('zona').map(v => '<option' + (SPF.zona === v ? ' selected' : '') + '>' + esc(v) + '</option>').join('') + '</select></label>' +
      '<label class="campo">Estado<select id="spEst"><option value="">Todos</option>' + ['Sin servicio', 'Faltan días'].map(v => '<option' + (SPF.estado === v ? ' selected' : '') + '>' + v + '</option>').join('') + '</select></label>' +
      '<label class="campo">Categoría<select id="spCat"><option value="">Todas</option>' + opts('Categoria').map(v => '<option' + (SPF.cat === v ? ' selected' : '') + '>' + esc(v) + '</option>').join('') + '</select></label>' +
      '<span class="sub" id="spCuenta" style="margin:0 0 8px"></span></div>' +
    '<div class="tabla-wrap"><table class="t"><thead><tr><th>Legajo</th><th>Apellido y nombre</th><th>Empresa</th><th>Categoría</th><th>Zona</th><th>Servicios</th><th>Estado</th><th>Días vacíos</th></tr></thead><tbody id="spBody"></tbody></table></div>';
  enlazarTabsPersonal();
  const pintar = () => {
    const q = norm(SPF.q);
    const l = lista.filter(p => (!SPF.zona || p.zona === SPF.zona) && (!SPF.estado || p.estado === SPF.estado) && (!SPF.cat || p.Categoria === SPF.cat) &&
      (!q || norm(p.Nombre).indexOf(q) >= 0 || String(p.Legajo) === SPF.q.trim()))
      .sort((a, b) => a.zona.localeCompare(b.zona) || (b.sinServicio - a.sinServicio) || a.Nombre.localeCompare(b.Nombre));
    $('#spBody').innerHTML = l.map(p => '<tr><td>' + esc(p.Legajo) + '</td><td><a href="#" class="ficha-link" data-leg="' + esc(p.Legajo) + '">' + esc(p.Nombre) + '</a></td>' +
      '<td>' + esc(p.Empresa) + '</td><td>' + esc(p.Categoria) + '</td><td>' + esc(p.zona) + '</td><td>' + esc(p.servicios.join(', ')) + '</td>' +
      '<td><span class="sp-est ' + (p.sinServicio ? 'sp-sin' : 'sp-falta') + '">' + p.estado + '</span></td>' +
      '<td>' + (p.sinServicio ? 'Todo el período' : esc(rangos(p.faltan)) + ' <small style="color:var(--ink-2)">(' + p.faltan.length + ' ' + (p.faltan.length === 1 ? 'día' : 'días') + ')</small>') + '</td></tr>').join('') ||
      '<tr><td colspan="8" style="color:var(--ink-2)">Nadie con esos filtros: todo el personal tiene servicio y días cubiertos.</td></tr>';
    $('#spCuenta').textContent = l.length + ' de ' + lista.length + ' personas';
  };
  pintar();
  let t = null;
  $('#spQ').oninput = e => { clearTimeout(t); t = setTimeout(() => { SPF.q = e.target.value; pintar(); }, 150); };
  $('#spZona').onchange = e => { SPF.zona = e.target.value; pintar(); };
  $('#spEst').onchange = e => { SPF.estado = e.target.value; pintar(); };
  $('#spCat').onchange = e => { SPF.cat = e.target.value; pintar(); };
  $('#spPer').onchange = e => vStatusPersonal(e.target.value);
  $('#spBody').onclick = e => { const a = e.target.closest('.ficha-link'); if (!a) return; e.preventDefault(); verFicha(a.dataset.leg); };
}

  $('#main').innerHTML = tabsPersonal('lista') +

      'Tocá un apellido para ver la ficha.</p></div><div class="esp"></div>' +

      '<button class="btn btn-pdf" id="btnPersPdf">Descargar PDF</button></div>' +
    '<div class="sel-barra" id="persSelBarra" hidden><b id="persSelN"></b> seleccionados. Las descargas incluyen solo a los seleccionados. ' +
      '<button class="btn chico" id="btnPersDesel">Quitar selección</button></div>' +
    '<div class="barra"><label class="campo" style="flex:1;max-width:460px">Buscar<input id="qPers" value="' + esc(PF.q) + '" placeholder="Apellido, legajo, DNI, empresa…"></label>' +
      '<button class="btn" id="btnPersLimpiar">Limpiar filtros</button><span class="sub" id="persCuenta" style="margin:0 0 8px"></span></div>' +
    '<div class="tabla-wrap pers-wrap"><table class="t pers"><thead><tr>' +
      '<th class="chk" rowspan="2"><input type="checkbox" id="persTodos" title="Seleccionar todos los que se ven"></th>' +
      COLS_PERS.map(c => '<th data-ord="' + c.k + '" class="ordenable">' + c.t + ' <span class="ord" id="ord-' + c.k + '"></span></th>').join('') +
    '</tr><tr class="filtros">' +
      COLS_PERS.map(c => '<th>' + (c.lista
        ? '<select data-f="' + c.k + '"><option value="">Todos</option>' + distintos(c.k).map(v => '<option' + (PF.f[c.k] === v ? ' selected' : '') + '>' + esc(v) + '</option>').join('') + '</select>'
        : '<input data-f="' + c.k + '" value="' + esc(PF.f[c.k] || '') + '" placeholder="Filtrar">') + '</th>').join('') +
    '</tr></thead><tbody id="persBody"></tbody></table></div>';

  const pintar = () => {
    const l = personalFiltrado();
    $('#persBody').innerHTML = l.map(p => '<tr' + (PF.sel.has(p.Legajo) ? ' class="marcada"' : '') + '><td class="chk"><input type="checkbox" data-sel="' + esc(p.Legajo) + '"' + (PF.sel.has(p.Legajo) ? ' checked' : '') + '></td>' + COLS_PERS.map(c => c.k === 'Nombre'
      ? '<td><a href="#" class="ficha-link" data-leg="' + esc(p.Legajo) + '">' + esc(p.Nombre) + '</a></td>'
      : '<td>' + esc(p[c.k] || '') + '</td>').join('') + '</tr>').join('') ||
      '<tr><td colspan="' + (COLS_PERS.length + 1) + '" style="color:var(--ink-2)">No hay personas con esos filtros.</td></tr>';
    $('#persCuenta').textContent = l.length + ' de ' + todos.length + ' personas';
    $('#persTodos').checked = l.length > 0 && l.every(p => PF.sel.has(p.Legajo));
    $('#persSelBarra').hidden = !PF.sel.size;
    $('#persSelN').textContent = PF.sel.size;
    $('#btnPersXls').textContent = 'Descargar Excel' + (PF.sel.size ? ' (' + PF.sel.size + ')' : '');
    $('#btnPersPdf').textContent = 'Descargar PDF' + (PF.sel.size ? ' (' + PF.sel.size + ')' : '');
    COLS_PERS.forEach(c => { $('#ord-' + c.k).textContent = PF.orden === c.k ? (PF.asc ? '▲' : '▼') : ''; });
  };
  pintar();
  let t = null;
  $('#qPers').oninput = e => { clearTimeout(t); t = setTimeout(() => { PF.q = e.target.value; pintar(); }, 150); };
  $$('[data-f]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => { PF.f[el.dataset.f] = el.value; pintar(); }));
  $$('th[data-ord]').forEach(th => th.onclick = () => {
    if (PF.orden === th.dataset.ord) PF.asc = !PF.asc; else { PF.orden = th.dataset.ord; PF.asc = true; }
    pintar();
  });
  $('#btnPersLimpiar').onclick = () => { PF.q = ''; PF.f = {}; vPersonal(); };
  $('#persTodos').onchange = e => {
    personalFiltrado().forEach(p => { if (e.target.checked) PF.sel.add(p.Legajo); else PF.sel.delete(p.Legajo); });
    pintar();
  };
  $('#btnPersDesel').onclick = () => { PF.sel.clear(); pintar(); };
  $('#persBody').onchange = e => {

    e.preventDefault();
    verFicha(a.dataset.leg);
  };
  enlazarTabsPersonal();
  $('#btnPersXls').onclick = () => descargarPersonal('xlsx');
  $('#btnPersPdf').onclick = () => descargarPersonal('pdf');
}

// Ficha completa de una persona, con los datos de la pestaña personal de SGI.
async function verFicha(legajo) {
  const m = modal('<h3>Ficha del personal</h3><p class="sub">Cargando…</p>');
  m.classList.add('modal-ficha');
  try {
    const f = await api('fichaPersona', { legajo });
    const fila = (t, v) => v ? '<div class="ficha-fila"><span>' + esc(t) + '</span><b>' + esc(v) + '</b></div>' : '';
    m.innerHTML =
      '<div class="ficha-cab"><div class="ficha-avatar">' + esc((f.Nombre || '?').split(' ').slice(0, 2).map(x => x[0]).join('')) + '</div>' +
        '<div><h3 style="margin:0">' + esc(f.Nombre) + '</h3><span class="sub">Legajo ' + esc(f.Legajo) + ' · ' + esc(f.Empresa || '') + '</span></div></div>' +
      '<div class="ficha-grid">' +
        fila('Estado', f.Estado) + fila('Categoría', f.Categoria) + fila('DNI', f.Dni) + fila('CUIL', f.Cuil) +
        fila('Supervisor', f.Supervisor) + fila('Zona', f.Zona) + fila('Fecha de ingreso', f.Ingreso) + fila('Antigüedad', f.Antiguedad) +
        fila('Fecha de nacimiento', f.Nacimiento) + fila('Edad', f.Edad) + fila('Teléfono', f.Telefono) + fila('Correo', f.Correo) +
        fila('Domicilio', f.Domicilio) + fila('Días de vacaciones', f.DiasVacaciones) + fila('Anotaciones', f.Anotaciones) +
      '</div>' +
      '<div class="pie"><button class="btn prim" id="fiCerrar">Cerrar</button></div>';
    $('#fiCerrar').onclick = cerrarModal;
  } catch (e) {
    m.innerHTML = '<h3>Ficha del personal</h3><p>' + esc(e.message) + '</p><div class="pie"><button class="btn prim" onclick="cerrarModal()">Cerrar</button></div>';
  }
}

// Carga una librería de cdnjs una sola vez.
const libsCargadas = {};
function cargarLib(url) {
  if (!libsCargadas[url]) libsCargadas[url] = new Promise((ok, mal) => {
    const sc = document.createElement('script');
    sc.src = url; sc.onload = ok; sc.onerror = () => { delete libsCargadas[url]; mal(new Error('No se pudo cargar la librería para descargar.')); };
    document.head.appendChild(sc);
  });
  return libsCargadas[url];
}
const LIB_XLSX = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const LIB_JSPDF = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const LIB_AUTOTABLE = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';

async function descargarPersonal(formato) {
  // Con personas marcadas se descargan solo ésas; si no, todo lo que se ve con los filtros.
  const l = PF.sel.size ? personalActivo().filter(p => PF.sel.has(p.Legajo)).sort((a, b) => a.Nombre.localeCompare(b.Nombre)) : personalFiltrado();
  const enc = COLS_PERS.map(c => c.t);
  const filas = l.map(p => COLS_PERS.map(c => (c.k === 'Legajo' || c.k === 'Dni') && /^\d+$/.test(p[c.k] || '') ? Number(p[c.k]) : (p[c.k] || '')));
  const hoy = new Date();
  const fecha = pad(hoy.getDate()) + '-' + pad(hoy.getMonth() + 1) + '-' + hoy.getFullYear();
  try {
    if (formato === 'xlsx') {
      await cargarLib(LIB_XLSX);
      const ws = XLSX.utils.aoa_to_sheet([enc].concat(filas));
      ws['!cols'] = [{ wch: 38 }, { wch: 9 }, { wch: 12 }, { wch: 11 }, { wch: 11 }, { wch: 22 }, { wch: 22 }];
      ws['!autofilter'] = { ref: 'A1:G' + (filas.length + 1) };
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Personal');
      XLSX.writeFile(wb, 'Personal Delben ' + fecha + '.xlsx');
    } else {
      await cargarLib(LIB_JSPDF);
      await cargarLib(LIB_AUTOTABLE);
      const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      if (window.LOGO_DELBEN) { try { doc.addImage(window.LOGO_DELBEN, 'WEBP', 14, 8, 30, 17.6); } catch (e) {} }
      doc.setFontSize(15); doc.text('Personal', 50, 16);
      doc.setFontSize(9); doc.setTextColor(90); doc.text(l.length + ' personas · ' + fecha, 50, 22);
      doc.autoTable({
        head: [enc], body: filas, startY: 30, styles: { fontSize: 8, cellPadding: 1.6 },
        headStyles: { fillColor: [21, 101, 192] }, alternateRowStyles: { fillColor: [240, 246, 252] }
      });
      doc.save('Personal Delben ' + fecha + '.pdf');
    }
  } catch (e) { toast(e.message, true); }
}

const VIS_CACHE = {};
async function vistaInforme(tipo, periodo, fondo) {
  const k = tipo + '|' + periodo, ya = VIS_CACHE[k];
  if (ya && Date.now() - ya.t < 300000) return ya.p ? ya.p : ya.r;
  const p = api('informe', { tipo, periodo, modo: 'vista' }).then(r => { VIS_CACHE[k] = { t: Date.now(), r }; return r; }, e => { delete VIS_CACHE[k]; throw e; });
  VIS_CACHE[k] = { t: Date.now(), p };
  if (!fondo) setTimeout(() => precargarInformes(periodo, tipo), 300);
  return p;
}
function precargarInformes(periodo, menos) {
  const tipos = INFORMES.filter(x => (x.tabla || x.rapida) && x.t !== menos).map(x => x.t);
  (async () => { for (const t of tipos) { try { await vistaInforme(t, periodo, true); } catch (e) { } } })();
}

    '<div class="tabs">' + INFORMES.map(x => '<button class="tab' + (x.t === INF.tipo ? ' on' : '') + '" data-inf="' + x.t + '">' + x.n + '</button>').join('') + '</div>' +

  $$('[data-inf]').forEach(b => b.onclick = () => vInformes({ tipo: b.dataset.inf, mantener: true }));

// Lee un archivo elegido en la computadora y lo devuelve en base64 (para mandarlo al servidor).
function leerBase64(f) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1] || '');
    fr.onerror = () => rej(new Error('No se pudo leer el archivo.'));
    fr.readAsDataURL(f);
  });
}

// Mensaje de error en pantalla; si falta autorizar un permiso, con el botón para hacerlo.
function htmlError(e) {
  return '<div class="vacio-msg">' + esc(e.message) +

}

function descargarBase64(b64, nombre, tipo) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], { type: tipo || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

  $('#pfRecargar').onclick = async () => {
    if (sucio && !(await confirmar('Recargar', 'Se pierden los cambios sin guardar.', 'Recargar'))) return;
    vUsuarios();
  };
}

      }

      try { await cargarBase(); } catch (e) { }
      cargarCat();
    } catch (e) { $('#rpEstado').textContent = 'Se cortó: ' + e.message + ' (tocá de nuevo el botón para seguir desde donde quedó).'; }
    finally { b.disabled = false; const c = $('#rpCerrar'); if (c) { c.disabled = false; c.onclick = cerrarModal; } }
  };
  if (!CM.reparado) { CM.reparado = true; reparar(true); }
  $('#cmGuardarCarp').onclick = async () => {
    try { S.base.config = await api('guardarConfig', { config: { HIST_CARPETAS: $('#cmCarp').value.trim() } }); toast('Carpetas guardadas.'); }
    catch (e) { toast(e.message, true); }

    try {
      const r = await api('historico', { reiniciar: !!reiniciar });
      $('#cmDriveLog').textContent = 'Archivos: ' + r.hechos + ' de ' + r.total + (r.hechos >= r.total ? ' — terminó.' : ' — falta: tocá "Traer / continuar" de nuevo.') +
        (r.catalogados ? '\nAnotados en esta tanda: ' + r.catalogados : '') + (r.periodos ? ' · períodos con datos: ' + r.periodos : '') + (r.plus ? ' · plus: ' + r.plus : '') +
        (r.servNuevos ? '\nServicios viejos creados (dados de baja): ' + r.servNuevos : '') + (r.log && r.log.length ? '\n' + r.log.join('\n') : '');
      if (r.total === 0) $('#cmDriveLog').textContent += '\nNo se encontró ningún archivo: revisá las carpetas o los permisos (Datos > Probar instalación).';
      try { await cargarBase(); } catch (e) { }
      cargarCat();
    } catch (e) { $('#cmDriveLog').innerHTML = htmlError(e); }
    finally { b.disabled = false; }
  };
  $('#cmImportar').onclick = () => traer(false);
  $('#cmReiniciar').onclick = async () => { if (await confirmar('Empezar de nuevo', 'Se vuelven a leer todos los archivos de las carpetas (los períodos con datos cargados por los supervisores no se tocan).', 'Empezar')) traer(true); };

  const cargarCat = async () => {
    let r;

    if (r.demo) { $('#cmCat').innerHTML = '<div class="vacio-msg">' + esc(r.demo) + '</div>'; return; }
    if (r.archivoHist) $('#cmArchHist').innerHTML = '<a class="btn chico" target="_blank" rel="noopener" href="' + esc(r.archivoHist) + '">Abrir el Archivo histórico</a>';
    const conDatos = new Set(r.periodosDatos || []);
    const porPer = {};
    (r.archivos || []).forEach(a => { (porPer[a.Periodo || ''] = porPer[a.Periodo || ''] || []).push(a); });
    const periodos = [...new Set(Object.keys(porPer).concat([...conDatos]))].sort().reverse();
    const COLS = ['Novedades del Personal', 'Planificación', 'Horas Contratadas vs Realizadas', 'Conformación horaria', 'Facturación', 'Plus', 'Proyección', 'Planilla de supervisor'];
    CM.tablas = r.tablas || {};
    const cuenta = (l, t) => l.filter(a => a.Tipo === t).length;
    if (!periodos.length) { $('#cmCat').innerHTML = '<div class="vacio-msg">Todavía no hay nada cargado.</div>'; return; }
    $('#cmCat').innerHTML = '<div class="tabla-wrap"><table class="t cm-mat"><thead><tr><th>Período</th><th class="c">Datos en la app</th>' + COLS.map(c => '<th class="c">' + esc(c) + '</th>').join('') + '<th class="c">Otros</th><th></th></tr></thead><tbody>' +
      periodos.map(p => {
        const l = porPer[p] || [];

        return '<tr' + (p === CM.periodo ? ' class="sel"' : '') + '><td><b>' + esc(p ? nombrePeriodo(p) : 'Sin período') + '</b></td><td class="c">' + (conDatos.has(p) ? '<span class="pill ok">✔</span>' : '<span class="sub" style="margin:0">—</span>') + '</td>' +
          COLS.map(c => { const n = cuenta(l, c); return '<td class="c">' + (n ? '<span class="cm-n">' + n + '</span>' : '<span class="cm-falta">·</span>') + '</td>'; }).join('') +
          '<td class="c">' + (otros || '') + '</td><td>' + (l.length ? '<button class="btn chico" data-cmper="' + esc(p) + '">Ver archivos</button>' : '') + '</td></tr>' +
          (p === CM.periodo ? '<tr class="cm-det"><td colspan="' + (COLS.length + 4) + '">' + detalle(l, r.tipos, pers) + '</td></tr>' : '');
      }).join('') + '</tbody></table></div>';
  };
  const detalle = (l, tipos, pers) => ((CM.tablas[CM.periodo] || []).length ? '<div class="cm-tablas"><b>Datos guardados como tabla:</b> ' +
      [...new Set(CM.tablas[CM.periodo].map(t => t.tipo))].map(t => '<button class="btn chico" data-cmver="' + esc(t) + '">' + esc(t) + '</button>').join(' ') + '</div>' : '') + '<table class="t"><thead><tr><th>Tipo</th><th>Archivo</th><th class="n">Filas a la app</th><th>Origen</th><th>Cargado</th><th>Cambiar período / tipo</th><th></th></tr></thead><tbody>' +
    l.map(a => '<tr><td>' + esc(a.Tipo) + '</td><td>' + esc(a.Archivo) + '</td><td class="n">' + esc(a.Filas || '') + '</td><td>' + esc(a.Origen || '') + '</td><td><small>' + esc(a.CargadoPor || '') + ' ' + esc(a.Fecha || '') + '</small></td>' +

  $('#cmCat').addEventListener('click', async e => {
    const b = e.target.closest('[data-cmper]'); if (b) { CM.periodo = CM.periodo === b.dataset.cmper ? '' : b.dataset.cmper; cargarCat(); return; }

  $('#cmCat').addEventListener('change', async e => {

// v1.22.10: fecha en DD/MM/AAAA (acepta 2026-09-30, 30/9/2026 o una fecha)
function fechaDMA(v) {
  const t = String(v || '').trim();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[3] + '/' + m[2] + '/' + m[1];
  m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if (m) return pad(+m[1]) + '/' + pad(+m[2]) + '/' + (m[3].length === 2 ? '20' + m[3] : m[3]);
  const d = new Date(t); return isNaN(d) ? t : pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
}
function ventanaFicha(r) {
  const html = htmlFicha(r);
  const nombreArchivo = r.persona.Nombre + ' - ' + r.nombrePeriodo;
  const m = modal('<div class="ficha-pop"><div class="barra" style="margin:0 0 6px"><div class="esp"></div><button class="btn btn-excel" id="fiPdf">Descargar PDF</button><button class="btn" onclick="cerrarModal()">Cerrar</button></div>' +
    '<div class="ficha">' + html + '</div></div>');
  m.classList.add('modal-ancho');
  $('#fiPdf').onclick = async () => {
    const b = $('#fiPdf'); b.disabled = true; b.textContent = 'Armando el PDF…';
    try {
      const x = await api('fichaPdf', { html, nombre: nombreArchivo });
      if (x.demo) { toast(x.demo); return; }
      descargarBase64(x.base64, x.nombre, 'application/pdf');
    } catch (e) { toast(e.message, true); }
    finally { b.disabled = false; b.textContent = 'Descargar PDF'; }
  };
}

/* ============================================================

   salen de las mismas planillas) contra el listado de personal.

const CIERRE = { periodo: '' };
async function vCierre(params) {
  params = params || {};
  const pers = [...new Set(listaPeriodos(periodoActual()).concat(S.base.periodosDatos || []))].sort().reverse();
  CIERRE.periodo = params.periodo || CIERRE.periodo || sumarMes(periodoTrabajo(), new Date().getDate() >= 20 || new Date().getDate() <= 5 ? 0 : -1);
  if (pers.indexOf(CIERRE.periodo) < 0) CIERRE.periodo = periodoTrabajo();
  $('#main').innerHTML =
    '<div class="barra"><div><h1>Control de cierre</h1><p class="sub" style="margin:0">Hacelo siempre antes de pasar las novedades a RRHH para la liquidación. El STD, el Consolidado y el 30/31 días salen de las mismas planillas: acá se controlan contra el listado de personal.</p></div>' +
      '<div class="esp"></div><label class="campo">Período<select id="ciPer">' + opciones(pers.map(p => ({ v: p, t: nombrePeriodo(p) })), CIERRE.periodo) + '</select></label>' +
      '<button class="btn btn-excel" id="ciBajar" disabled>Descargar (Excel)</button></div>' +
    '<div id="ciRes"><div class="cargando">Controlando…</div></div>';
  $('#ciPer').onchange = e => vCierre({ periodo: e.target.value });
  let r;
  try { r = await api('cierre', { periodo: CIERRE.periodo }); } catch (e) { $('#ciRes').innerHTML = htmlError(e); return; }
  if (S.vista !== 'cierre') return;
  if (r.demo) { $('#ciRes').innerHTML = '<div class="vacio-msg">' + esc(r.demo) + '</div>'; return; }
  const BLOQUES = [

    ['noEnListado', 'No están en el listado de personal', 'Revisar el legajo o el nombre: así no se pueden liquidar.', 'bad'],

    ['sinInformar', 'Activos en el listado que no figuran en ninguna planilla', 'Confirmar si están de licencia, de baja o si falta cargarlos.', 'warn']
  ];
  // v1.25.2: en "informados el mismo día en dos servicios" va un día por renglón
  const tabla = (l, renglones) => '<div class="tabla-wrap"><table class="t"><thead><tr><th>Legajo</th><th>Apellido y nombre</th><th>Empresa</th><th>Servicios</th><th>Detalle</th></tr></thead><tbody>' +
    l.map(x => '<tr><td>' + esc(x.Legajo || '') + '</td><td><b>' + esc(x.Nombre) + '</b></td><td>' + esc(x.Empresa || '') + '</td><td><small>' + esc(x.Servicios || '') + '</small></td><td>' +
      (renglones ? String(x.Detalle).split(' · ').map(d => /^⚠/.test(d) ? '<b style="color:#b91c1c">' + esc(d) + '</b>' : esc(d)).join('<br>') : esc(x.Detalle)) + '</td></tr>').join('') + '</tbody></table></div>';
  BLOQUES.forEach(b => { r[b[0]] = r[b[0]] || []; });
  const totalProb = BLOQUES.reduce((a, b) => a + r[b[0]].length, 0);
  $('#ciRes').innerHTML =
    (!r.conDatos ? '<div class="panel vacio-msg">El período ' + esc(r.nombrePeriodo) + ' no tiene planillas cargadas.</div>' : '') +
    '<div class="ci-cards"><div class="ci-card"><b>' + r.informados + '</b><span>personas informadas<br>(STD · Consolidado · 30/31 días)</span></div>' +
      '<div class="ci-card"><b>' + r.activosListado + '</b><span>activos en el listado de personal</span></div>' +
      '<div class="ci-card ' + (totalProb ? 'mal' : 'bien') + '"><b>' + totalProb + '</b><span>' + (totalProb ? 'cosas para revisar' : 'todo en orden') + '</span></div></div>' +
    htmlResumenCierre(r.resumen) +
    BLOQUES.map(b => '<div class="panel ci-blq ' + b[3] + '"><div class="barra" style="margin:0"><div><h2 style="margin:0">' + esc(b[1]) + ' <span class="pill ' + (r[b[0]].length ? (b[3] === 'bad' ? 'bad' : 'warn') : 'ok') + '">' + r[b[0]].length + '</span></h2>' +
      '<p class="sub" style="margin:0">' + esc(b[2]) + '</p></div></div>' + ((r[b[0]] || []).length ? tabla(r[b[0]], b[0] === 'dobleCarga' || b[0] === 'siglaSinHoras') : '<p class="sub" style="margin:6px 0 0">Sin observaciones.</p>') + '</div>').join('');
  $$('[data-cires]').forEach(b => b.onclick = () => ventanaResumenCierre(b.dataset.cires));

    // v1.25.2: el resumen de vacaciones, horas extras y licencias también va en el archivo
