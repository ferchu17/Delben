<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1d2a3a;
  --ink-2: #55606e;
  --navy: #1d3557;
  --blue: #1565c0;
  --verde-marca: #2e9d3e;
  --azul-marca: #0b63c9;
  --grad-marca: linear-gradient(90deg, #3aa935 0%, #0f9b8e 45%, #0b63c9 100%);
  --blue-soft: #e6effa;
  --paper: #eef1f4;
  --surface: #ffffff;
  --line: #d5dbe3;
  --line-2: #e7ebf0;
  --night: #a6a6a6;
  --night-ink: #111827;
  --tarde: #cfe0f5;
  --tarde-ink: #1d3f73;
  --ok: #1e7a45;
  --ok-soft: #e0f2e7;
  --warn: #8a5a00;
  --warn-soft: #fff1d6;
  --bad: #b3261e;
  --bad-soft: #fde4e2;
  --font: 'Barlow', 'Segoe UI', Arial, sans-serif;
  --font-cond: 'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 15px;
  color: var(--ink);
  background: radial-gradient(1200px 500px at 85% -10%, #e3f0ff 0%, rgba(227,240,255,0) 60%),
              radial-gradient(900px 400px at -10% 0%, #e6f6e8 0%, rgba(230,246,232,0) 55%), var(--paper);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

/* ---------- barra superior ---------- */
.top {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px;
  height: 60px; padding: 0 18px;
  background: rgba(255,255,255,.96); color: var(--ink);
  box-shadow: 0 2px 10px rgba(16, 40, 80, .08);
  backdrop-filter: blur(6px);
}
.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--grad-marca); }
.top .marca { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 17px; letter-spacing: .2px; color: #1f3b63; }
.top .marca img { height: 40px; width: auto; display: block; }
.top .marca img:not([src]) { display: none; }
.top .marca span { padding-left: 12px; border-left: 1px solid var(--line); }
.top .esp { flex: 1; }
.top .quien { font-size: 13px; color: var(--ink-2); text-align: right; line-height: 1.2; }
.top button {
  background: var(--grad-marca); border: 0; color: #fff; font-weight: 600;
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
  box-shadow: 0 2px 6px rgba(11, 99, 201, .25); transition: transform .12s, box-shadow .12s;
}
.top button:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(11, 99, 201, .3); }
.top #btnSalir { background: #fff; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.demo-flag {
  background: #ffd166; color: #3d2c00; font-size: 12px; font-weight: 600;
  padding: 3px 8px; border-radius: 4px;
}

main { padding: 22px 22px 60px; max-width: 1600px; margin: 0 auto; }

/* ---------- títulos y bloques ---------- */
h1 { font-size: 24px; margin: 0 0 4px; font-weight: 700; }
h2 { font-size: 18px; margin: 26px 0 10px; font-weight: 600; }
.sub { color: var(--ink-2); margin: 0 0 18px; }
.barra { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; margin-bottom: 16px; }
.barra .esp { flex: 1; }
.campo { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); }
.campo input, .campo select, .campo textarea {
  border: 1px solid var(--line); background: #fff; border-radius: 6px;
  padding: 7px 9px; font-size: 15px; color: var(--ink); min-width: 0;
}
.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 16px;
}

/* ---------- botones ---------- */
.btn {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 500;
  white-space: nowrap; transition: transform .12s, box-shadow .12s, border-color .12s;
}
.btn:hover { border-color: #9fb3cc; box-shadow: 0 2px 6px rgba(16, 40, 80, .08); }
.btn:active { transform: translateY(1px); }
.btn.prim { background: linear-gradient(135deg, #1565c0, #0b8fd6); border-color: #1565c0; color: #fff; box-shadow: 0 2px 8px rgba(21, 101, 192, .28); }
.btn.prim:hover { box-shadow: 0 4px 12px rgba(21, 101, 192, .35); }
.btn.btn-excel { background: linear-gradient(135deg, #1e7a45, #2e9d3e); border-color: #1e7a45; color: #fff; }
.btn.btn-pdf { background: linear-gradient(135deg, #b3261e, #e0523f); border-color: #b3261e; color: #fff; }
.btn.peligro { color: var(--bad); }
.btn.chico { padding: 3px 8px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- menú ---------- */
.menu-grid {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;
  max-width: 1100px;
}
.tile {
  position: relative; overflow: hidden;
  text-align: left; background: #fff; border: 1px solid var(--line);
  border-radius: 14px; padding: 18px 16px 18px; cursor: pointer; min-height: 126px;
  box-shadow: 0 2px 8px rgba(16, 40, 80, .06); transition: transform .15s, box-shadow .15s;
}
.tile::before { content: ''; position: absolute; left: 0; top: 0; right: 0; height: 5px; background: var(--c, var(--blue)); }
.tile::after { content: ''; position: absolute; right: -40px; top: -40px; width: 120px; height: 120px; border-radius: 50%;
  background: var(--c, var(--blue)); opacity: .07; }
.tile:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(16, 40, 80, .13); }
.tile-ic { display: inline-flex; width: 40px; height: 40px; border-radius: 11px; align-items: center; justify-content: center;
  background: var(--c, var(--blue)); color: #fff; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,.12); }
.tile-ic svg { width: 22px; height: 22px; }
.tile b { display: block; font-size: 17px; margin-bottom: 6px; color: #13263f; }
.menu-head { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }
.menu-head img { height: 74px; width: auto; }
.login-logo { display: block; width: 260px; max-width: 80%; margin: 0 auto 14px; }

/* ---------- personal ---------- */
.pers-wrap { max-height: calc(100vh - 250px); overflow: auto; }
table.t.pers th.ordenable { cursor: pointer; user-select: none; white-space: nowrap; }
table.t.pers th .ord { color: var(--blue); font-size: 11px; }
table.t.pers tr.filtros th { top: 35px; background: #fff; padding: 4px 6px; }
table.t.pers tr.filtros input, table.t.pers tr.filtros select {
  width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 13px; font-weight: 400; background: #fff;
}
table.t.pers tbody tr:hover td { background: #f3f8ff; }
.ficha-link { color: var(--blue); font-weight: 600; text-decoration: none; }
.ficha-link:hover { text-decoration: underline; }
.modal.modal-ficha { max-width: 640px; }
.ficha-cab { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.ficha-avatar { width: 54px; height: 54px; border-radius: 50%; background: var(--grad-marca); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px; }
.ficha-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }
.ficha-fila { display: flex; flex-direction: column; padding: 7px 10px; background: #f6f9fc; border-radius: 8px; }
.ficha-fila span { font-size: 12px; color: var(--ink-2); }
.ficha-fila b { font-weight: 600; word-break: break-word; }
.tile span { color: var(--ink-2); font-size: 14px; line-height: 1.35; }
.tile .num { float: right; font-weight: 700; color: var(--c); font-size: 15px; }

/* ---------- tablas comunes ---------- */
.tabla-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th {
  text-align: left; font-weight: 600; color: var(--ink-2); font-size: 13px;
  padding: 8px 10px; border-bottom: 1px solid var(--line); background: #f7f9fb;
  position: sticky; top: 0;
}
table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.total td { font-weight: 700; background: #f7f9fb; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neu { background: var(--line-2); color: var(--ink-2); }

/* ---------- planilla del supervisor ---------- */
.grilla-wrap {
  overflow: auto; max-height: calc(100vh - 230px);
  background: #fff; border: 1px solid var(--line); border-radius: 8px;
}
table.g { border-collapse: separate; border-spacing: 0; font-family: var(--font-cond); font-size: 14px; }
table.g th, table.g td { border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); padding: 0; }
table.g thead th {
  position: sticky; z-index: 3; background: #f7f9fb; font-weight: 600;
  color: var(--ink-2); font-size: 12px; text-align: center;
}
table.g thead tr.sem th { top: 0; height: 30px; }
table.g thead tr.dia th { top: 30px; height: 38px; line-height: 1.05; }
table.g thead tr.dia th b { display: block; font-size: 15px; color: var(--ink); }
table.g thead th.finde b { color: var(--blue); }
table.g .fijo { position: sticky; background: #fff; z-index: 2; }
table.g thead .fijo { z-index: 4; background: #f7f9fb; }
table.g .c-n { left: 0; width: 34px; min-width: 34px; text-align: center; color: var(--ink-2); }
table.g .c-nom { left: 34px; min-width: 240px; }
table.g .c-leg { left: 274px; min-width: 64px; text-align: center; }
table.g .c-emp { left: 338px; min-width: 52px; text-align: center; }
table.g .c-pue { left: 390px; min-width: 128px; border-right: 2px solid var(--line) !important; }
table.g td.c-leg, table.g td.c-emp { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 13px; }

.sem-cab { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 4px; white-space: nowrap; }
.sem-cab.enviada { background: var(--ok-soft); color: var(--ok); height: 100%; }
.sem-cab .btn { padding: 1px 7px; font-size: 12px; font-family: var(--font); }

input.cel {
  width: 40px; height: 32px; border: 0; text-align: center; background: transparent;
  font-family: var(--font-cond); font-size: 15px; font-weight: 500; padding: 0;
  text-transform: uppercase;
}
input.cel:focus { outline: 2px solid var(--blue); outline-offset: -2px; background: #fff; color: var(--ink); }
td.noche { background: var(--night); }
td.noche input.cel { color: var(--night-ink); }
td.tarde { background: var(--tarde); }
td.tarde input.cel { color: var(--tarde-ink); }
td.k-FRANCO input.cel { color: #8a96a3; }
td.k-LICENCIA { background: var(--warn-soft); }
td.k-LICENCIA input.cel { color: var(--warn); font-size: 13px; }
td.k-VAC { background: var(--ok-soft); }
td.k-VAC input.cel { color: var(--ok); font-size: 13px; }
td.k-AUSENCIA { background: var(--bad-soft); }
td.k-AUSENCIA input.cel { color: var(--bad); font-size: 13px; }
td.k-BAJA { background: #ececec; }
td.k-BAJA input.cel { color: #777; font-size: 13px; text-decoration: line-through; }
td.k-OTRO { background: var(--blue-soft); }
td.k-OTRO input.cel { color: #284b9b; font-size: 13px; }
td.k-ERROR { box-shadow: inset 0 0 0 2px var(--bad); }
td.k-ERROR input.cel { color: var(--bad); }
td.bloq input.cel { cursor: not-allowed; }
td.bloq { background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(30,122,69,.07) 6px 7px); }
td.noche.bloq { background-color: var(--night); }
td.tarde.bloq { background-color: var(--tarde); }
table.g td[data-d] { position: relative; }
table.g td.con-nota::after { content: ''; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 7px 7px 0; border-color: transparent #d32f2f transparent transparent; pointer-events: none; }
.ley-nota { position: relative; background: #fff; }
.ley-nota::after { content: ''; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 7px 7px 0; border-color: transparent #d32f2f transparent transparent; }
table.g td.resaltar { animation: resaltar 0.65s ease-in-out 4; }
@keyframes resaltar { 0%, 100% { box-shadow: inset 0 0 0 2px #e53935; } 50% { box-shadow: inset 0 0 0 3px #e53935; background: #fdecea; } }
table.g td.sel { box-shadow: inset 0 0 0 2px var(--blue); }
table.g td.sel input.cel { background: rgba(37, 99, 235, .10); }
.carga-ini { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px 16px; margin-bottom: 18px; border-left: 5px solid var(--blue); }
.carga-ini div { flex: 1; min-width: 260px; }
.pinceles { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
.pincel { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card, #fff); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
.pincel:hover { border-color: var(--blue); }
.pincel i { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--line); }
.pincel small { font-weight: 400; color: var(--ink-2); }

.nom-in {
  width: 100%; border: 0; height: 32px; padding: 0 8px; background: transparent;
  font-family: var(--font-cond); font-size: 14px; text-transform: uppercase;
}
.nom-in:focus { outline: 2px solid var(--blue); outline-offset: -2px; background: #fff; }
td.sin-legajo { box-shadow: inset 3px 0 0 var(--bad); }
td.sin-legajo .nom-in { color: var(--bad); }
.tx-in { width: 100%; border: 0; height: 32px; padding: 0 6px; background: transparent; font-family: var(--font-cond); font-size: 13px; }
.tx-in:focus { outline: 2px solid var(--blue); outline-offset: -2px; background: #fff; }
select.tur { width: 100%; border: 0; height: 32px; background: transparent; font-family: var(--font-cond); font-size: 13px; padding: 0 4px; }
td.tot { text-align: right; padding: 0 8px !important; font-variant-numeric: tabular-nums; font-weight: 600; min-width: 48px; }
td.tot small { display: block; font-weight: 400; color: var(--ink-2); font-size: 11px; }
td.acc { min-width: 30px; text-align: center; }
td.acc button { border: 0; background: none; color: #9aa4b0; cursor: pointer; font-size: 16px; padding: 4px; }
td.acc button:hover { color: var(--bad); }

tr.resumen td { background: #f7f9fb; font-weight: 600; text-align: center; height: 28px; font-variant-numeric: tabular-nums; }
tr.resumen td.etq { text-align: right; padding-right: 10px; color: var(--ink-2); font-weight: 600; }
tr.resumen td.neg { color: var(--bad); }
tr.resumen td.pos { color: var(--ok); }
tr.sep td { height: 10px; background: var(--paper); border-right: 0; }
tr.sec td { background: #f7f9fb; font-weight: 700; padding: 8px 10px; font-family: var(--font); font-size: 13px; color: var(--ink-2); }

.leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); margin: 10px 0 0; }
.leyenda i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }

.estado-guardado { font-size: 13px; color: var(--ink-2); }
.estado-guardado.sucio { color: var(--warn); font-weight: 600; }

/* ---------- autocompletar ---------- */
.ac {
  position: fixed; z-index: 60; background: #fff; border: 1px solid #b7c0cc;
  border-radius: 6px; box-shadow: 0 8px 24px rgba(29,42,58,.18);
  max-height: 280px; overflow: auto; min-width: 340px; font-size: 14px;
}
.ac div { padding: 6px 10px; cursor: pointer; display: flex; gap: 10px; }
.ac div span { color: var(--ink-2); font-size: 12px; margin-left: auto; white-space: nowrap; }
.ac div.on, .ac div:hover { background: var(--blue-soft); }
.ac .vacio { color: var(--ink-2); cursor: default; }

/* ---------- modal y avisos ---------- */
.modal-fondo {
  position: fixed; inset: 0; background: rgba(20,30,45,.45); z-index: 65;
  display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow: auto;
}
.modal { background: #fff; border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.25); width: 100%; max-width: 640px; padding: 20px 22px; }
.modal h3 { margin: 0 0 14px; font-size: 19px; }
.modal-aviso { max-width: 760px; }
.aviso-doble { text-align: center; margin-bottom: 14px; }
.aviso-doble h3 { margin: 10px 0 6px; }
.aviso-doble p { margin: 0; color: var(--ink-2); }
.aviso-icono { width: 52px; height: 52px; margin: 0 auto; border-radius: 50%; background: #fdecea; color: #c62828; font-size: 30px; font-weight: 800; line-height: 52px; }
.aviso-tabla td { vertical-align: top; }
.aviso-tabla small { color: var(--ink-2); }
.modal .pie { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .ancho { grid-column: 1 / -1; }
table.contrato { border-collapse: collapse; font-size: 13px; }
table.contrato th { font-weight: 600; color: var(--ink-2); padding: 3px 4px; }
table.contrato td { padding: 2px; }
table.contrato input { width: 52px; text-align: center; border: 1px solid var(--line); border-radius: 4px; padding: 4px; }

.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 70;
  background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px;
  max-width: 90vw;
}
.toast.bad { background: var(--bad); }
.cargando { padding: 40px; text-align: center; color: var(--ink-2); }
.vacio-msg { padding: 28px; text-align: center; color: var(--ink-2); }
.vacio-msg .btn { margin-top: 10px; }

/* ---------- login ---------- */
.login {
  max-width: 400px; margin: 7vh auto 0; background: #fff; border: 1px solid var(--line);
  border-radius: 16px; padding: 28px; box-shadow: 0 14px 40px rgba(16, 40, 80, .12); position: relative; overflow: hidden;
}
.login::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--grad-marca); }
.login h1 { font-size: 22px; text-align: center; }
.login .sub { text-align: center; }
.login .campo { margin-bottom: 12px; }
.login .btn { width: 100%; padding: 10px; }
.login .err { color: var(--bad); font-size: 14px; min-height: 20px; margin-top: 8px; }
.login .demo { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-2); font-size: 13px; color: var(--ink-2); }
.login .demo .btn { margin-top: 6px; }

/* ---------- semáforo de bandeja ---------- */
.sem-dots { display: flex; gap: 4px; }
.sem-dots span {
  width: 28px; height: 22px; border-radius: 4px; font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--line-2); color: var(--ink-2);
}
.sem-dots span.env { background: var(--warn-soft); color: var(--warn); cursor: pointer; }
.sem-dots span.rev { background: var(--ok-soft); color: var(--ok); cursor: pointer; }

@media (max-width: 900px) {
  .menu-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  main { padding: 14px 10px 50px; }
  .form-grid { grid-template-columns: 1fr; }
  .top .quien { display: none; }
}
@media (max-width: 520px) {
  .menu-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ============================================================
   PLANILLA CON FORMATO DEL EXCEL (calco de las planillas de los supervisores)
   ============================================================ */
.xl-wrap { border-radius: 0; border: 1px solid #bfbfbf; max-height: calc(100vh - 190px); }
table.g.xl {
  table-layout: fixed;
  border-collapse: separate; border-spacing: 0; background: #fff; color: #000;
  font-family: Calibri, Carlito, 'Segoe UI', Arial, sans-serif; font-size: 14.5px;
}
table.g.xl th, table.g.xl td {
  border: 0; border-right: 1px solid #000; border-bottom: 1px solid #000;
  padding: 0; height: 20px; text-align: center; vertical-align: middle; white-space: nowrap;
}
table.g.xl thead th { position: static; }
/* columnas fijas: A (#), B (Empresa), C (LP), D (Apellido y nombre), E (Turno) */
table.g.xl .fijo { position: sticky; z-index: 2; background: #fff; }
table.g.xl .xa { left: 0; min-width: 28px; width: 28px; max-width: 28px; border-left: 1px solid #000; }
table.g.xl .xb { left: 30px; }
