<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b111a">
<link rel="icon" type="image/png" sizes="64x64" href="/Delben/iconos/metropolis-64.png">
<link rel="apple-touch-icon" href="/Delben/iconos/metropolis-192.png">
<style>html,body{margin:0}</style>
</head>
<body>
<title>Metrópolis Infinita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: mapa isométrico a pantalla completa; barra de estado arriba, riel de herramientas tipo cartel de transporte abajo, panel lateral (hoja inferior en celular); menú de inicio superpuesto */
:root{
  --ink:#0b111a; --panel:#131c2a; --panel-2:#1b2637; --line:#2a3850; --fg:#e9eff8; --muted:#92a2b9;
  --sign:#f2b33d; --sign-ink:#1d1405; --good:#4cc38a; --bad:#ef5b5b;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --tbh:120px; --toph:64px;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sign);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

#top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,rgba(11,17,26,.96),rgba(11,17,26,.82));border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;flex-direction:column;min-width:0}
.city{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.date{font-size:12px;color:var(--muted)}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.stat .val{font-family:var(--f-num);font-weight:700;font-size:16px}
.stat .sub{font-size:11px;color:var(--sign)}
.delta{font-family:var(--f-num);font-size:11px}
.delta.up{color:var(--good)} .delta.dn{color:var(--bad)}
.demand{display:flex;gap:5px;align-items:flex-end}
.dm{display:flex;flex-direction:column;align-items:center;gap:2px}
.dm .bar{position:relative;width:9px;height:26px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.dm .bar::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.dm .bar i{position:absolute;left:0;right:0}
.dm b{font-size:10px;font-weight:700;color:var(--muted)}
.speed{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.speed button{padding:6px 8px;font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--muted)}
.speed button.on{background:var(--sign);color:var(--sign-ink)}
.panels{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
.panels::-webkit-scrollbar{display:none}
.panels button{padding:7px 11px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.panels button.on{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.panels button.menu-b{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.panels button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sign);margin-left:5px;vertical-align:1px}

#bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);
  padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
#tools{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:thin;border-bottom:1px solid var(--line);background:var(--panel-2)}
.tool{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 11px 7px 8px;border-radius:9px;background:var(--panel);border:1px solid var(--line);text-align:left}
.tool .sw{width:22px;height:22px;border-radius:5px;flex:0 0 auto;display:grid;place-items:center;font-size:10px;font-weight:800;color:#10151d}
.tool .tx{display:flex;flex-direction:column;line-height:1.15}
.tool .tn{font-size:13px;font-weight:600;white-space:nowrap}
.tool .tc{font-family:var(--f-num);font-size:11px;color:var(--muted);white-space:nowrap}
.tool.on{border-color:var(--sign);box-shadow:inset 0 0 0 1px var(--sign);background:#2a2412}
.tool.locked{opacity:.45}
.tool.locked .tc{color:var(--sign)}
.tool.small{padding:7px 10px}
#cats{display:flex;overflow-x:auto;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
.cat{flex:1 0 auto;padding:11px 14px;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--muted);border-top:3px solid transparent;white-space:nowrap}
.cat.on{color:var(--fg);border-top-color:var(--sign);background:var(--panel-2)}

#sheet{position:fixed;z-index:6;right:max(12px,env(safe-area-inset-right,0px));top:calc(var(--toph) + 10px);width:390px;max-height:calc(100% - var(--toph) - var(--tbh) - 24px);
  overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:16px;user-select:text;-webkit-user-select:text}
#sheet h2{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance;padding-right:36px}
#sheet h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 0 8px;font-weight:700}
#sheet p{color:var(--muted);font-size:13px;line-height:1.5;margin:4px 0 10px}
.x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:8px;background:var(--panel-2);font-size:18px;line-height:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted)} .row .v{font-family:var(--f-num);font-weight:700;text-align:right}
.v.up{color:var(--good)} .v.dn{color:var(--bad)}
.meter{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:4px}
.res{padding:10px 0;border-bottom:1px solid var(--line)}
.res .top{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.res .top b{font-weight:700}
.res .top span{font-family:var(--f-num);color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vbtn{padding:10px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;font-weight:600;text-align:left}
.vbtn.on{border-color:var(--sign);color:var(--sign)}
.reward{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.reward .rn{font-weight:700;font-size:14px}
.reward .rd{grid-column:1;font-size:12px;color:var(--muted)}
.reward .rm{font-family:var(--f-num);font-size:12px;color:var(--sign);text-align:right}
.claim{padding:7px 11px;border-radius:8px;background:var(--sign);color:var(--sign-ink);font-weight:800;font-size:12px}
.claim.ghost{background:var(--panel-2);color:var(--fg);border:1px solid var(--line)}
.done{font-size:12px;color:var(--good);font-weight:700}
.pend{font-size:12px;color:var(--muted)}
.ms{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.ms .bullet{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.ms.got .bullet{background:var(--sign);border-color:var(--sign)}
.ms .mn{font-weight:700} .ms .mu{font-size:11px;color:var(--muted)}
.line-card,.partner{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--panel-2)}
.line-head{display:flex;align-items:center;gap:8px;font-size:13px}
.line-chip{min-width:30px;height:22px;padding:0 6px;border-radius:5px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.line-head .meta{margin-left:auto;font-family:var(--f-num);font-size:11px;color:var(--muted);text-align:right}
.diag{overflow-x:auto;margin-top:6px}
.diag svg text{fill:var(--fg);font-family:var(--f-body);font-size:11px}
.partner .ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.partner .pn{font-weight:800;font-size:15px}
.partner .pd{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.chip.ok{border-color:var(--good);color:var(--good)} .chip.no{color:var(--muted)}
.deal{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.deal select{padding:7px 8px;font-size:13px}
#netmap{width:100%;aspect-ratio:1;max-width:100%;border-radius:10px;background:#0f1722;display:block}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;margin:8px 0}
label.fld span{display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--sign)}
input[type=text],select{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--fg);font:inherit;min-width:0}
.tog{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;gap:10px}
.sw2{width:42px;height:24px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);position:relative;flex:0 0 auto}
.sw2::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw2.on{background:var(--sign);border-color:var(--sign)} .sw2.on::after{left:20px;background:var(--sign-ink)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin:6px 0 4px}
.seg button{padding:9px 6px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-weight:700;font-size:13px}
.seg button.on{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.seg button small{display:block;font-weight:500;font-size:11px;opacity:.75}
.bigbtn{width:100%;padding:12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-weight:700;margin-top:8px}
.bigbtn.warn{background:#3a1717;border-color:var(--bad);color:#ffd2d2}
.bigbtn.primary{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
#chart{width:100%;height:150px;display:block}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kpi{background:var(--panel-2);border-radius:10px;padding:10px}
.kpi .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.kpi .val{font-family:var(--f-num);font-weight:700;font-size:17px;margin-top:2px}
.town{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.town input{width:100%}
.town .tp{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right}

#mini{position:fixed;z-index:4;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(var(--tbh) + 12px);width:150px;height:150px;border-radius:10px;border:1px solid var(--line);background:#0f1722;box-shadow:0 8px 24px rgba(0,0,0,.4);touch-action:none}
#card{position:fixed;z-index:4;left:max(12px,env(safe-area-inset-left,0px));top:calc(var(--toph) + 10px);width:270px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
#card{max-height:calc(100% - var(--toph) - var(--tbh) - 40px);overflow:auto;user-select:text;-webkit-user-select:text}
#card .cs{font-size:12px;color:var(--sign);margin:-2px 0 6px}
#card .ch{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:12px 0 2px}
#card .row{padding:5px 0}
#card .ct{font-family:var(--f-display);font-weight:800;font-size:16px;margin-bottom:4px;padding-right:28px}
#card .x{width:26px;height:26px;font-size:15px;top:8px;right:8px}
#toasts{position:fixed;z-index:30;top:calc(var(--toph) + 12px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .25s ease-out;text-align:center}
.toast.gold{background:var(--sign);color:var(--sign-ink)}
.toast.bad{background:#3a1717;color:#ffd2d2;border:1px solid var(--bad)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#hint{position:fixed;z-index:4;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--tbh) + 12px);background:rgba(19,28,42,.9);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);max-width:280px;pointer-events:none}
#hint b{color:var(--fg)}
#zoom{position:fixed;z-index:4;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--tbh) + 64px);display:flex;flex-direction:column;gap:6px}
#zoom button{width:40px;height:40px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:20px;font-weight:700}

/* menú de inicio */
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:radial-gradient(ellipse at 30% 30%,rgba(11,17,26,.15),rgba(11,17,26,.78) 70%);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.mbox{width:min(820px,100%);max-height:100%;overflow:auto;background:rgba(15,22,34,.93);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.55);backdrop-filter:blur(10px)}
.mtitle{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,8vw,64px);letter-spacing:-.035em;line-height:.92;margin:0}
.mtitle em{font-style:normal;color:var(--sign)}
.msub{color:var(--muted);margin:10px 0 0;font-size:15px;max-width:52ch}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:22px}
@media (max-width:600px){.mgrid{grid-template-columns:1fr}}
.mbtn{padding:15px 16px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-weight:700;font-size:16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mbtn small{font-weight:500;font-size:12px;color:var(--muted)}
.mbtn.primary{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.mbtn.primary small{color:#5a4410}
.mbtn:disabled{opacity:.4;cursor:default}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mback{padding:9px 13px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);font-weight:700;font-size:13px;flex:0 0 auto}
.mh2{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0}
.msec{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 0 8px;font-weight:700}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mapc{border:2px solid var(--line);border-radius:12px;padding:8px;background:var(--panel-2);text-align:left;display:flex;flex-direction:column;gap:6px}
.mapc.on{border-color:var(--sign);background:#2a2412}
.mapc canvas{width:100%;aspect-ratio:1;border-radius:8px;display:block;image-rendering:pixelated;background:#0f1722}
.mapc b{font-size:14px} .mapc span{font-size:11px;color:var(--muted);line-height:1.35}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);margin-bottom:8px}
.slot .sn{font-weight:800} .slot .si{font-size:12px;color:var(--muted)}
.slot .sb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.help p{color:var(--muted);line-height:1.55;font-size:14px;margin:6px 0;max-width:65ch}
.help b{color:var(--fg)}
#menu .macc{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;font-size:14px}
#menu .macc small{color:var(--muted);margin-left:4px}
.mcredit{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--muted);letter-spacing:.02em}
.mcredit b{color:var(--sign)}
body.inmenu #top,body.inmenu #bottom,body.inmenu #mini,body.inmenu #zoom,body.inmenu #hint,body.inmenu #card,body.inmenu #sheet{display:none}
#loading{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(11,17,26,.8);font-family:var(--f-display);font-weight:800;font-size:22px}

@media (max-width:760px){
  #sheet{left:0;right:0;width:auto;top:auto;bottom:var(--tbh);max-height:60%;border-radius:16px 16px 0 0;border-bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #mini{width:96px;height:96px}
  .city{font-size:15px;max-width:120px}
  .stat .val{font-size:14px}
  .panels{margin-left:0;order:9;flex-basis:100%}
  #hint{display:none}
  #card{width:auto;right:max(12px,env(safe-area-inset-right,0px))}
  .mbox{padding:18px}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.sw2::after{transition:none}}
</style>

<canvas id="cv" aria-label="Mapa"></canvas>

<header id="top">
  <div class="brand"><div class="city" id="cityName">Nuevo Estado</div><div class="date" id="date">Ene 2027</div></div>
  <div class="stat"><span class="lbl">Caja</span><span class="val" id="money">$ 0</span><span class="delta" id="delta"></span></div>
  <div class="stat"><span class="lbl">Habitantes</span><span class="val" id="pop">0</span><span class="sub" id="msName">Aldea</span></div>
  <div class="stat"><span class="lbl">Felicidad</span><span class="val" id="hap">–</span></div>
  <div class="demand" title="Demanda de zonas">
    <div class="dm"><div class="bar"><i id="dR"></i></div><b>R</b></div>
    <div class="dm"><div class="bar"><i id="dC"></i></div><b>C</b></div>
    <div class="dm"><div class="bar"><i id="dI"></i></div><b>I</b></div>
    <div class="dm"><div class="bar"><i id="dO"></i></div><b>O</b></div>
  </div>
  <div class="speed" id="speed">
    <button data-sp="0" aria-label="Pausa">II</button><button data-sp="0.5">½×</button><button data-sp="1">1×</button><button data-sp="2">2×</button><button data-sp="4">4×</button><button data-sp="8">8×</button>
  </div>
  <nav class="panels" id="panels">
    <button data-p="menu" class="menu-b">Menú</button>
    <button data-p="volver" id="btnVolver" class="menu-b" hidden>Volver a mi estado</button>
    <button data-p="online">En línea</button>
    <button data-p="vistas">Vistas</button>

function genWorld(n,seed,preset,ox,oy,n0,sc){
  sc=sc||1;const T=new Uint8Array(n*n),H=new Float32Array(n*n),R=new Uint8Array(n*n);
  const wt={islas:.36,lagos:.36,pampa:.22,plano:.05}[preset]||.3,rt={montanas:.66,pampa:.97,plano:.99}[preset]||.76,plano=preset==='plano';

  for(let y=0;y<n;y++){const Y=y*sc+oy;rcache[y]=n0*(preset==='bahia'?.45:.42)+(fbm(Y*.006,1.7,seed+11,3)-.5)*n0*.8;rw[y]=(1.4+fbm(Y*.05,5.1,seed+12,2)*1.8)*(preset==='montanas'?.8:1)}
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=y*n+x,X=x*sc+ox,Y=y*sc+oy;
    let h=fbm(X*.021,Y*.021,seed,5);h=(h-.5)*1.7+.5;
    if(preset==='montanas')h+=fbm(X*.011,Y*.011,seed+5,3)*.42-.17;
    else if(preset==='islas')h-=.08;
    else if(preset==='pampa')h=.5+(h-.5)*.45;
    else if(plano)h=.5+(h-.5)*.18;
    else if(preset==='costa')h-=smooth(n0*.66,n0*.84,X)*.7;
    else if(preset==='bahia'){const d=Math.hypot((X-n0*.5)/1.3,Y-n0*1.02);h-=smooth(n0*.5,n0*.2,d)*.75}
    if(river){const dx=Math.abs(X-rcache[y]);if(dx<=rw[y]*sc+.5&&!(preset==='bahia'&&Y>n0*.8)){h=Math.min(h,.24)}}
    H[i]=h;T[i]=h<wt?1:h>rt?4:0}
  if(plano)return{T,H,R,rt};
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=y*n+x;if(T[i]===0&&fbm((x*sc+ox)*.05,(y*sc+oy)*.05,seed+77,4)>(preset==='pampa'?.7:.6))T[i]=2}
  const beachW=preset==='costa'||preset==='islas'||preset==='bahia'?2:1;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=y*n+x;if(T[i]!==0)continue;let w=false;for(let dy=-beachW;dy<=beachW&&!w;dy++)for(let dx=-beachW;dx<=beachW;dx++){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<n&&Y<n&&T[Y*n+X]===1&&Math.abs(dx)+Math.abs(dy)<=beachW){w=true;break}}if(w)T[i]=3}
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=y*n+x,X=x*sc+ox,Y=y*sc+oy;
    if(T[i]===1){if(fbm(X*.08,Y*.08,seed+501,2)>.58)R[i]=5;continue}
    if(fbm(X*.07,Y*.07,seed+201,3)>(preset==='montanas'?.64:.685))R[i]=1;else if(fbm(X*.07,Y*.07,seed+301,3)>.705)R[i]=2;else if(T[i]===2)R[i]=4;else if((T[i]===0||T[i]===3)&&fbm(X*.06,Y*.06,seed+401,3)>(preset==='pampa'?.55:.64))R[i]=3}
  return{T,H,R,rt};
}

/* ================= guardado (con compresión simple) ================= */
function rle(u8){const out=[];for(let i=0;i<u8.length;){const v=u8[i];let n=1;while(i+n<u8.length&&u8[i+n]===v&&n<255)n++;out.push(v,n);i+=n}return new Uint8Array(out)}
function unrle(r,len){const u=new Uint8Array(len);let o=0;for(let i=0;i<r.length;i+=2){u.fill(r[i],o,o+r[i+1]);o+=r[i+1]}return u}
function b64(u8){let s='';const ch=0x8000;for(let i=0;i<u8.length;i+=ch)s+=String.fromCharCode.apply(null,u8.subarray(i,i+ch));return btoa(s)}
function unb64(str){const s=atob(str),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
const ARR8=['kind','zone','lvl','svc','metro','tram','mono','tun','terr','gsz'];
function serialize(){
  const o={};for(const k in G){if(ARR8.includes(k)||k==='anch'||k==='grp')continue;o[k]=G[k]}
  o.arr={};ARR8.forEach(k=>o.arr[k]=b64(rle(G[k])));o.arr.anch=b64(rle(new Uint8Array(G.anch.buffer)));o.arr.grp=b64(rle(new Uint8Array(G.grp.buffer)));o.rle=1;
  if(G.tedit){const hq=new Uint8Array(N*N);for(let i=0;i<N*N;i++)hq[i]=clamp(Math.round(hgt[i]*255),0,255);o.arr.hq=b64(hq);o.arr.res=b64(rle(res))}
  delete o.visiting;
  return JSON.stringify(o);
}
function deserialize(str){
  const o=JSON.parse(str);if(!o||!o.arr)return false;N=o.N;const a=o.arr,n=N*N,isR=!!o.rle;delete o.arr;delete o.rle;
  const get=(k,len)=>a[k]?(isR?unrle(unb64(a[k]),len):unb64(a[k])):new Uint8Array(len);
  G=o;ARR8.forEach(k=>G[k]=get(k,n));G.anch=new Int32Array(get('anch',n*4).buffer);
  if(!a.anch)G.anch.fill(-1);
  G.grp=a.grp?new Int32Array(get('grp',n*4).buffer):new Int32Array(n).fill(-1);
  G.n0=G.n0||N;G.ox=G.ox||0;G.oy=G.oy||0;G.preset=G.preset||'rio';G.towns=G.towns||[];G.deals=G.deals||[];G.partners=G.partners||makePartners(G.seed);G.expand=G.expand||0;
  G.stock=G.stock||{};
  const w=genWorld(N,G.seed,G.preset,G.ox,G.oy,G.n0,1);hgt=w.H;res=w.R;G.rt=G.rt||w.rt;
  if(a.hq){const hq=unb64(a.hq);for(let i=0;i<n;i++)hgt[i]=hq[i]/255;if(a.res)res=unrle(unb64(a.res),n)}
  bindArrays();
  if((G.v||1)<4){for(let i=0;i<n;i++){if(kind[i]===K.ZONE){if(zone[i]===1&&lvl[i]>=3)zone[i]=5;else if(zone[i]===2&&lvl[i]>=3)zone[i]=6;else if(zone[i]===3&&res[i]===1)zone[i]=9;else if(zone[i]===3&&res[i]===2)zone[i]=10;else if(zone[i]===3&&res[i]===3)zone[i]=7}}
    if(!G.towns.length)G.towns.push({name:G.name||'Ciudad Capital',x:N>>1,y:N>>1});G.name=G.name||'Nuevo Estado';G.v=4}
  calcWaterNear();afterLoad();return true;
}

/* ================= lienzo del terreno ================= */
function hBil(fx,fy){const x0=clamp(Math.floor(fx),0,N-1),y0=clamp(Math.floor(fy),0,N-1),x1=Math.min(x0+1,N-1),y1=Math.min(y0+1,N-1),tx=clamp(fx-x0,0,1),ty=clamp(fy-y0,0,1);
  return(hgt[y0*N+x0]*(1-tx)+hgt[y0*N+x1]*tx)*(1-ty)+(hgt[y1*N+x0]*(1-tx)+hgt[y1*N+x1]*tx)*ty}
function terrRGB(px,py){
  const fx=px/TPX-.5,fy=py/TPX-.5,h=hBil(fx,fy);
  const sh=clamp((h-hBil(fx-.7,fy-.7))*1.6,-.12,.12)*3.2;
  const i=clamp(Math.floor(py/TPX),0,N-1)*N+clamp(Math.floor(px/TPX),0,N-1),t=terr[i],nz=hash2(px,py,G.seed)-.5;

  if(t===1){const d=clamp((.3-h)/.3,0,1);r=58-30*d;g=140-66*d;b=172-40*d;r+=nz*4;g+=nz*5;b+=nz*5;if(h>.272){const f=clamp((h-.272)/.028,0,1);r+=f*55;g+=f*48;b+=f*30}}
  else if(t===3){r=214;g=198;b=150;r+=sh*60+nz*14;g+=sh*60+nz*14;b+=sh*40+nz*10}
  else if(t===4){r=118+h*30;g=110+h*26;b=98+h*18;r+=sh*90+nz*18;g+=sh*90+nz*18;b+=sh*70+nz*16}
  else if(t===2){r=48;g=92;b=46;r+=sh*70+nz*12;g+=sh*80+nz*14;b+=sh*40+nz*8}
  else{const vn=vnoise(fx*.35,fy*.35,G.seed+9)-.5;r=78+h*46+vn*26;g=134+h*48+vn*18;b=64+h*18-vn*6;r+=sh*110+nz*12;g+=sh*120+nz*16;b+=sh*60+nz*7}

const nb4=c=>{const x=c%N;return[x>0?c-1:-1,x<N-1?c+1:-1,c-N,c+N]};
function recalcNetwork(){

    while(h<t){const c=q[h++];roadList.push(c);for(const j of nb4(c)){if(j<0||j>=n||comp[j]>=0||!isRoadK(kind[j]))continue;comp[j]=nc;q[t++]=j}}

  for(const r of roadList){if(kind[r]===K.HWY||tun[r])continue;const x=r%N,y=(r/N)|0,c=comp[r];for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=N||Y>=N)continue;const j=Y*N+X;if(acc[j]<0)acc[j]=c}}
  for(const r of roadList)if(kind[r]===K.HWY||tun[r])acc[r]=comp[r];
  compPow=new Uint8Array(nc+1);compWat=new Uint8Array(nc+1);
  for(let i=0;i<n;i++){if(kind[i]!==K.BLD&&kind[i]!==K.PART)continue;const d=SV[svc[i]];if(!d||acc[i]<0)continue;if(d.pw)compPow[acc[i]]=1;if(d.wt)compWat[acc[i]]=1}
  // conexiones con el exterior
  const sides=f=>{const s=new Set();for(let k=0;k<N;k++){if(f(k))s.add('N');if(f((N-1)*N+k))s.add('S');if(f(k*N))s.add('O');if(f(k*N+N-1))s.add('E')}return s};
  const edgeRoads={N:0,S:0,E:0,O:0};for(let k=0;k<N;k++){if(isRoadK(kind[k]))edgeRoads.N++;if(isRoadK(kind[(N-1)*N+k]))edgeRoads.S++;if(isRoadK(kind[k*N]))edgeRoads.O++;if(isRoadK(kind[k*N+N-1]))edgeRoads.E++}
  edgeInfo={road:sides(i=>isRoadK(kind[i])),rail:sides(i=>isRailK(kind[i])),water:sides(i=>terr[i]===1),edgeRoads};
  dirty.net=false;
}
function bfsComp(start,isT,seen){const out=[],q=[start];seen[start]=1;while(q.length){const c=q.pop();out.push(c);for(const j of nb4(c)){if(j<0||j>=N*N||seen[j]||!isT(j))continue;seen[j]=1;q.push(j)}}return out}
function bfsDist(src,isT){const dist=new Map([[src,0]]),q=[src];let h=0;while(h<q.length){const c=q[h++],d=dist.get(c);for(const j of nb4(c)){if(j<0||j>=N*N||dist.has(j)||!isT(j))continue;dist.set(j,d+1);q.push(j)}}return dist}
function bfsPath(a,isT,goal){const prev=new Map([[a,-1]]),q=[a];let h=0,end=-1;while(h<q.length){const c=q[h++];if(goal(c)){end=c;break}for(const j of nb4(c)){if(j<0||j>=N*N||prev.has(j)||!isT(j))continue;prev.set(j,c);q.push(j)}}
  if(end<0)return null;const p=[];let c=end;while(c!==-1){p.push(c);c=prev.get(c)}return p.reverse()}
function adjFind(i,f,s){s=s||1;const x=i%N,y=(i/N)|0;for(let dy=-1;dy<=s;dy++)for(let dx=-1;dx<=s;dx++){if((dy===-1||dy===s)&&(dx===-1||dx===s))continue;if(dy>=0&&dy<s&&dx>=0&&dx<s)continue;const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=N||Y>=N)continue;const j=Y*N+X;if(f(j))return j}return -1}
const isWaterFree=j=>terr[j]===1&&(kind[j]===0||tun[j]===1);
const LTYPES={
 rail:{isT:i=>isRailK(kind[i])&&!(tun[i]&&false),st:i=>kind[i]===K.TST||(kind[i]===K.BLD&&svc[i]===SVID.trainterm),node:i=>kind[i]===K.TST?i:adjFind(i,j=>isRailK(kind[j]),2),lab:k=>String.fromCharCode(65+k%26),nm:'Tren',sp:5.5,r:13},

 tram:{isT:i=>tram[i]===1&&isRoadK(kind[i]),st:i=>kind[i]===K.BLD&&svc[i]===SVID.tramst,node:i=>adjFind(i,j=>tram[j]===1&&isRoadK(kind[j])),lab:k=>'T'+(k+1),nm:'Tranvía',sp:3.2,r:8},
 mono:{isT:i=>mono[i]===1,st:i=>kind[i]===K.BLD&&svc[i]===SVID.monost,node:i=>i,lab:k=>'M'+(k+1),nm:'Monorriel',sp:6.5,r:11},
 ferry:{isT:isWaterFree,st:i=>kind[i]===K.BLD&&svc[i]===SVID.ferry,node:i=>adjFind(i,isWaterFree),lab:k=>'F'+(k+1),nm:'Ferry',sp:3,r:12},

function recalcLines(){
  lines=[];lineOfTile=new Map();

    for(let i=0;i<N*N;i++){if(LT.st(i)){const nd=LT.node(i);if(nd>=0&&LT.isT(nd)&&!nodeSt.has(nd))nodeSt.set(nd,i)}}
    if(nodeSt.size<2)continue;const seen=new Uint8Array(N*N);let li=0;
    for(const[nd0]of nodeSt){if(seen[nd0])continue;const tiles=bfsComp(nd0,LT.isT,seen);const nodes=tiles.filter(t=>nodeSt.has(t));if(nodes.length<2)continue;
      const d0=bfsDist(nodes[0],LT.isT);let s0=nodes[0],mx=-1;for(const s of nodes){const v=d0.get(s);if(v>mx){mx=v;s0=s}}
      const d1=bfsDist(s0,LT.isT);nodes.sort((a,b)=>d1.get(a)-d1.get(b));
      let route=[nodes[0]];for(let k=0;k<nodes.length-1;k++){const tgt=nodes[k+1];const p=bfsPath(nodes[k],LT.isT,c=>c===tgt)||[nodes[k],tgt];for(let j=1;j<p.length;j++)route.push(p[j])}

      stations.forEach(s=>{if(!G.sn[s])nameStation(s);lineOfTile.set(s,L)});lines.push(L);li++}}
  trains=[];lines.forEach((L,li)=>{const n=Math.max(1,Math.round(L.route.length/(L.type==='tram'?14:28)));for(let k=0;k<n;k++)trains.push({L:li,pos:(L.route.length-1)*k/n,dir:k%2?-1:1,wait:0})});
  // rutas de carga: tren de carga hasta el borde y barcos hasta mar abierto
  freightR=[];shipR=[];airports=[];waterOpen=[];for(let i=0;i<N*N;i+=3){if(isWaterFree(i)){const x=i%N,y=(i/N)|0;if(x>1&&y>1&&x<N-2&&y<N-2&&isWaterFree(i-1)&&isWaterFree(i+1)&&isWaterFree(i-N)&&isWaterFree(i+N))waterOpen.push(i)}}const onEdge=c=>{const x=c%N,y=(c/N)|0;return x===0||y===0||x===N-1||y===N-1};

function nameStation(i){const used=new Set(Object.values(G.sn));let nm=NAMES.find(n=>!used.has(n));if(!nm){let k=2;do{nm=NAMES[(i+k)%NAMES.length]+' '+k;k++}while(used.has(nm))}G.sn[i]=nm}

function stampCov(arr,cx,cy,r,mul){const x0=Math.max(0,Math.floor(cx-r)),x1=Math.min(N-1,Math.ceil(cx+r)),y0=Math.max(0,Math.floor(cy-r)),y1=Math.min(N-1,Math.ceil(cy+r));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const d=Math.hypot(x+.5-cx,y+.5-cy);if(d>r)continue;const v=(1-d/r*.75)*mul,j=y*N+x;if(v>arr[j])arr[j]=v}}
function addPol(cx,cy,r,s){const x0=Math.max(0,Math.floor(cx-r)),x1=Math.min(N-1,Math.ceil(cx+r)),y0=Math.max(0,Math.floor(cy-r)),y1=Math.min(N-1,Math.ceil(cy+r));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const d=Math.hypot(x+.5-cx,y+.5-cy);if(d>r)continue;const j=y*N+x;pol[j]=Math.min(1,pol[j]+s*(1-d/r))}}
function recalcCoverage(){
  COVK.forEach(k=>cov[k].fill(0));pol.fill(0);

    if(k===K.BLD){const d=SV[svc[i]];if(!d)continue;const x=i%N,y=(i/N)|0,cx=x+d.s/2,cy=y+d.s/2;
      if(d.cov){let ok=d.cov==='park'||d.cov==='joy'||acc[i]>=0;if(['mst','tramst','monost','ferry'].includes(d.k))ok=lineOfTile.has(i);if(ok)stampCov(cov[d.cov],cx,cy,d.r,1)}

    else if(k===K.ZONE&&lvl[i]>0){const z=zone[i];if(z===3||z===9||z===10)addPol(i%N+.5,((i/N)|0)+.5,3+lvl[i],.1+lvl[i]*.05)}}

    let v=24+cov.park[i]*30+cov.joy[i]*16+cov.police[i]*9+cov.fire[i]*6+cov.health[i]*10+cov.edu[i]*10+cov.transit[i]*20+waterNear[i]*12-pol[i]*48-Math.min(1,cong[i])*10;
    if(needG&&cov.garbage[i]<.05)v-=8;lval[i]=clamp(v,0,100);
    let h=46+cov.police[i]*8+cov.fire[i]*5+cov.health[i]*10+cov.edu[i]*7+cov.park[i]*10+cov.joy[i]*22+cov.transit[i]*5-pol[i]*30;
    if(needG&&cov.garbage[i]<.05)h-=14;if(needD&&cov.death[i]<.05)h-=10;hap[i]=clamp(h,0,100);
    if(kind[i]===K.ZONE&&lvl[i]>0&&ZT[zone[i]].g==='R'){const u=ZT[zone[i]].u[lvl[i]];hs+=hap[i]*u;hw+=u}}
  S.hap=hw?hs/hw:60;dirty.cov=false;
}
function unitsAt(i){if(kind[i]!==K.ZONE)return 0;const z=ZT[zone[i]];return z?z.u[lvl[i]]*(grp[i]>=0?1.3:1):0}
function recalcTraffic(){

  for(let i=0;i<N*N;i++){if(kind[i]!==K.ZONE||lvl[i]===0||acc[i]<0)continue;const u=unitsAt(i)*.32*(1-.6*cov.transit[i]);if(u<=0)continue;trips+=u;

/* ================= simulación ================= */
function powered(i){const a=acc[i];if(a<0||!compPow[a])return false;return S.pwRatio>=1||hash2(i,G.m+G.y*12,3)<S.pwRatio}
function watered(i){const a=acc[i];if(a<0||!compWat[a])return false;return S.wtRatio>=1||hash2(i,G.m+G.y*12,5)<S.wtRatio}
function maxLevel(i,z){const v=lval[i],e=cov.edu[i],g=ZT[z].g;let m;
  if(g==='R'||g==='C')m=1+Math.floor(v/19);else if(g==='I')m=2+Math.floor(e*3.2);else{m=1+Math.floor(v/18);if(e<.15)m=Math.min(m,2)}

// Edificios unidos: varias parcelas de la misma zona se convierten en un solo edificio grande
const GSZ={5:4,6:3,4:3,3:3,2:2,7:5,8:5,9:5,10:5,11:5},GMIN={5:3,6:3,4:3,3:3,2:3,7:1,8:1,9:1,10:1,11:1};
function groupTiles(a){const s=gsz[a]||1,ax=a%N,ay=(a/N)|0,o=[];for(let dy=0;dy<s;dy++)for(let dx=0;dx<s;dx++)o.push((ay+dy)*N+ax+dx);return o}

function tryMerge(i){if(grp[i]>=0)return false;const z=zone[i],s=GSZ[z];if(!s)return false;const x=i%N,y=(i/N)|0;let bx=-1,by=-1,sum=-1;
  for(let oy=0;oy<s&&sum<0;oy++)for(let ox=0;ox<s;ox++){const v=blockOK(x-ox,y-oy,s,z);if(v>=0){bx=x-ox;by=y-oy;sum=v;break}}
  if(sum<0)return false;
  const a=by*N+bx,L=Math.max(GMIN[z],Math.round(sum/(s*s)));gsz[a]=s;
  for(let dy=0;dy<s;dy++)for(let dx=0;dx<s;dx++){const j=(by+dy)*N+bx+dx;grp[j]=a;lvl[j]=L;if(z!==11)clearForest(j);setLow(j)}
  dirty.traffic=true;return true}
function dissolve(i){const a=grp[i];if(a<0)return;for(const j of groupTiles(a)){if(grp[j]===a)grp[j]=-1}gsz[a]=0;dirty.traffic=true}
function grow(){
  const n=Math.max(600,(N*N/24)|0),hf=.45+(S.hap||50)/100;
  for(let k=0;k<n;k++){const i=(rnd()*N*N)|0;if(kind[i]!==K.ZONE)continue;if(grp[i]>=0&&grp[i]!==i)continue;const z=zone[i],zt=ZT[z],L=lvl[i],d=dem[zt.g]||0;
    if(zt.need&&res[i]!==zt.need)continue;
    if(acc[i]<0){if(L>0&&rnd()<.08)setLvl(i,L-1);continue}
    const pw=powered(i),wt=watered(i);
    if(L===0){if(pw&&d>-.15&&rnd()<(.22+d*.5)*hf)setLvl(i,1);continue}
    if(grp[i]<0&&L>=GMIN[z]&&GSZ[z]&&rnd()<.25&&tryMerge(i))continue;
    const cap=maxLevel(i,z);
    if(L<cap&&pw&&(wt||L<2||zt.flat)&&d>0&&rnd()<(.1+d*.32)*hf)setLvl(i,L+1);
    else if((L>cap||!pw||(!wt&&L>=2&&!zt.flat))&&rnd()<.03)setLvl(i,L-1);
    else if(d<-.5&&rnd()<.02)setLvl(i,L-1)}
}
function dailyStats(){

      if(zt.g==='R'){s.pop+=u;s.rBld++;if(townOf[i]>=0)s.townPop[townOf[i]]+=u}else if(zt.g==='C')s.jC+=u;else if(zt.g==='O')s.jO+=u;else{s.jI+=u;s.iBld++;if(z===7)s.zc7++;if(z===8)s.zc8++;

  const bt=waterOpen.length?Math.min(70,Math.ceil(waterOpen.length/40)+(S.svcN.fishport||0)*3+(S.svcN.cargo||0)*2):0;
  while(boats.length<bt){const i=waterOpen[(rnd()*waterOpen.length)|0];const nb=nb4(i).filter(j=>j>=0&&j<N*N&&isWaterFree(j));if(!nb.length)break;const r=rnd();boats.push({i,n:nb[(rnd()*nb.length)|0],p:rnd(),type:r<.35?'sail':r<.6?'yacht':r<.85?'fish':'cargo',sp:.25+rnd()*.35})}

}

  else if(!lastTile){applyTool(tool,t[0],t[1]);lastTile=t}}

function drawNetMap(){const c=$('#netmap');if(!c)return;const x=c.getContext('2d'),sc=c.width/N;if(lowDirty){lcx.putImageData(lowImg,0,0);lowDirty=false}x.globalAlpha=.35;x.imageSmoothingEnabled=false;x.drawImage(lcv,0,0,c.width,c.height);x.globalAlpha=1;
  const path=(r,col,w)=>{x.strokeStyle=col;x.lineWidth=w;x.lineJoin='round';x.lineCap='round';x.beginPath();r.forEach((t,k)=>{const px=(t%N+.5)*sc,py=(((t/N)|0)+.5)*sc;k?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()};
  freightR.forEach(f=>path(f.route,'#8a5a3a',2));shipR.forEach(s=>{x.setLineDash([4,4]);path(s.route,'#7fc8e8',2);x.setLineDash([])});
  lines.forEach(L=>{path(L.route,L.color,Math.max(3,sc*.7));L.stations.forEach(s=>{x.fillStyle='#fff';x.beginPath();x.arc((s%N+.5)*sc,(((s/N)|0)+.5)*sc,Math.max(4,sc*.9),0,7);x.fill();x.strokeStyle=L.color;x.lineWidth=2.5;x.stroke()})})}
function drawChart(){const c=$('#chart');if(!c)return;const w=c.clientWidth,h=c.clientHeight;c.width=w*DPR;c.height=h*DPR;const x=c.getContext('2d');x.setTransform(DPR,0,0,DPR,0,0);x.clearRect(0,0,w,h);
  const H2=G.hist;if(H2.length<2){x.fillStyle='#92a2b9';x.font='13px Figtree,sans-serif';x.fillText('El gráfico aparece después del primer mes.',8,h/2);return}
  const pad={l:44,r:8,t:10,b:18},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b,mp=Math.max(10,...H2.map(e=>e.p)),mm=Math.max(10,...H2.map(e=>e.m));
  x.strokeStyle='#2a3850';x.lineWidth=1;x.fillStyle='#92a2b9';x.font='10px "JetBrains Mono",monospace';x.textAlign='right';
  for(let k=0;k<=3;k++){const yy=pad.t+ph*k/3;x.beginPath();x.moveTo(pad.l,yy);x.lineTo(w-pad.r,yy);x.stroke();x.fillText(fmt(mp*(1-k/3)),pad.l-4,yy+3)}
  const line=(key,mx,col)=>{x.strokeStyle=col;x.lineWidth=2;x.beginPath();H2.forEach((e,k)=>{const px=pad.l+pw*k/(H2.length-1),py=pad.t+ph*(1-Math.max(0,e[key])/mx);k?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();const e=H2[H2.length-1];x.fillStyle=col;x.beginPath();x.arc(pad.l+pw,pad.t+ph*(1-Math.max(0,e[key])/mx),3.5,0,7);x.fill()};
  if(!G.unlimited)line('m',mm,'#f2b33d');line('p',mp,'#5bc46a');
  x.textAlign='left';x.fillStyle='#5bc46a';x.fillText('Habitantes',pad.l+4,h-4);if(!G.unlimited){x.fillStyle='#f2b33d';x.fillText('Caja (escala propia)',pad.l+84,h-4)}}

async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const ch of s)h=(Math.imul(h,31)+ch.charCodeAt(0))|0;return'x'+h}}

  if(serverURL()){const j=await api(create?'register':'login',{user,pass});ACC={user:j.user,token:j.token,mode:'online'}}
  else{const us=localUsers(),k=user.toLowerCase();
    if(create){if(us[k])throw new Error('Ese usuario ya existe en este dispositivo');const salt=Math.random().toString(36).slice(2);us[k]={name:user,salt,hash:await sha(salt+pass)};try{localStorage.setItem('metropolis-users',JSON.stringify(us))}catch(e){throw new Error('No se pudo guardar el usuario en este dispositivo')}}
    else{const u=us[k];if(!u||u.hash!==await sha(u.salt+pass))throw new Error('Usuario o contraseña incorrectos');user=u.name}

  if(m==='continue'){showLoading(()=>{if(loadFrom(KEY())){G.demo=false;closeMenu();toast('Bienvenido de vuelta a '+G.name,'gold')}else toast('No se pudo cargar la partida','bad')});return}
  if(m==='reseed'){ng.seed=(Math.random()*1e9)|0;renderMenu();return}
  if(m==='gfx'){if(G){G.quality={alta:'media',media:'baja',baja:'alta'}[G.quality];resize()}renderMenu();return}
  if(m==='create'){const nm=($('#ngname').value||'Mi Estado').trim();ng.name=nm;showLoading(()=>{newGame({size:ng.size,seed:ng.seed,preset:ng.preset,name:nm,money:{facil:2e6,normal:4e5,dificil:15e4}[ng.diff],unlimited:ng.unlimited,unlockAll:ng.unlockAll});G.demo=false;prevSpeed=1;saveLocal(false);closeMenu();
    cat='nav';renderCats();selectTool('pan');toast('Bienvenido a '+nm+'. Empezá trazando calles desde la autopista de acceso.','gold');ng.seed=(Math.random()*1e9)|0});return}
  if(m==='login'||m==='register'){const u=$('#lguser').value,p=$('#lgpass').value,msg=$('#lgmsg');msg.textContent='Un momento…';
    if(G&&!G.demo&&!G.visiting)saveLocal(false);
    doLogin(u,p,m==='register').then(async()=>{let ok=false;try{ok=loadFrom(KEY())}catch(e){}
      if(!ok&&online()){try{const j=await api('load');if(j.data)ok=deserialize(j.data)}catch(e){}}
      if(ok){G.demo=false;prevSpeed=G.speed||1}else if(G)G.demo=true;menuScreen='main';renderMenu();toast('Hola, '+ACC.user+(ok?'. Tu partida está lista.':'. Creá tu primera partida.'),'gold')}).catch(e=>{msg.textContent=e.message});return}
  if(m==='logout'){if(G&&!G.demo)saveLocal(false);ACC={user:null,token:null,mode:'guest'};saveSession();let ok=false;try{ok=loadFrom(KEY())}catch(e){}if(ok)G.demo=false;else if(G)G.demo=true;menuScreen='main';renderMenu();return}
  if(m==='srvsave'){const u=$('#srvurl').value.trim(),msg=$('#srvmsg');try{localStorage.setItem('metropolis-server',u)}catch(e){}if(!u){msg.textContent='Servidor quitado. Las cuentas vuelven a ser de este dispositivo.';return}
    msg.textContent='Probando…';api('ping').then(j=>{msg.style.color='var(--good)';msg.textContent='Conectado al servidor. '+(j.jugadores||0)+' jugadores registrados. Ahora ingresá o creá tu usuario.';if(ACC.mode!=='online'){ACC={user:null,token:null,mode:'guest'};saveSession()}}).catch(e=>{msg.style.color='var(--bad)';msg.textContent='No se pudo conectar: '+e.message})
    return}
  if(m){menuScreen=m;slotArm=null;renderMenu();return}
  if(b.dataset.preset){ng.preset=b.dataset.preset;ng.name=$('#ngname').value;renderMenu();return}
  if(b.dataset.size){ng.size=+b.dataset.size;ng.name=$('#ngname').value;renderMenu();return}
  if(b.dataset.diff){ng.diff=b.dataset.diff;ng.name=$('#ngname').value;renderMenu();return}
  if(b.dataset.ngt){ng[b.dataset.ngt]=!ng[b.dataset.ngt];ng.name=$('#ngname').value;renderMenu();return}
  if(b.dataset.load){const key=b.dataset.load==='auto'?KEY():SKEY(b.dataset.load);showLoading(()=>{if(loadFrom(key)){G.demo=false;prevSpeed=1;closeMenu();toast('Partida cargada: '+G.name,'gold')}else toast('No se pudo cargar','bad')});return}
  if(b.dataset.saveslot){const k=+b.dataset.saveslot;if(slotMeta(SKEY(k))&&slotArm!==k){slotArm=k;renderMenu();return}if(saveTo(SKEY(k),true)){slotArm=null;renderMenu()}return}
  if(b.dataset.del){const k=b.dataset.del;if(slotArm!=='d'+k){slotArm='d'+k;renderMenu();return}try{localStorage.removeItem(SKEY(k));localStorage.removeItem(SKEY(k)+'-meta')}catch(e){}slotArm=null;renderMenu();return}
});
function showLoading(fn){$('#loading').hidden=false;setTimeout(()=>{try{fn()}finally{$('#loading').hidden=true}},40)}

/* ================= bucle ================= */
let lastT=performance.now(),accum=0,uiT=0,saveT=0,dirtyT=0,sheetT=0,netT=40,cloudT=0;
function frame(now){
  const dt=Math.min(.1,(now-lastT)/1000);lastT=now;T+=dt;
  if(inMenu){cam.x+=dt*.6;cam.y-=dt*.25;if(cam.x>N*.8)cam.x=N*.2;if(cam.y<N*.2)cam.y=N*.8;updVehicles(dt*.5)}
  else{
    if(G.speed>0){accum+=dt*1000;const dayMs=650/G.speed;let n=0;while(accum>=dayMs&&n<2){accum-=dayMs;simDay();n++}if(n>=2)accum=Math.min(accum,dayMs)}
    dirtyT+=dt;if(dirtyT>.5&&(dirty.net||dirty.lines||dirty.cov||dirty.towns)){dirtyT=0;recalcAll();dailyStats()}
    if(G.speed>0)updVehicles(dt*Math.min(G.speed,3));
    {let dx=0,dy=0;const kh=keysHeld;if(kh.has('arrowleft')||kh.has('a'))dx=1;if(kh.has('arrowright')||kh.has('d'))dx=-1;if(kh.has('arrowup')||kh.has('w'))dy=1;if(kh.has('arrowdown')||kh.has('s'))dy=-1;
     if(!dx&&!dy&&G.edgeScroll!==false&&mouseIn&&!gest){const m=Math.max(24,Math.min(W,H)*.035);let f=1;
       if(mouseX<m){dx=1;f=1-mouseX/m}else if(mouseX>W-m){dx=-1;f=1-(W-mouseX)/m}if(mouseY<m){dy=1;f=Math.max(f,1-mouseY/m)}else if(mouseY>H-m){dy=-1;f=Math.max(f,1-(H-mouseY)/m)}
       if(dx||dy){const el=document.elementFromPoint(mouseX,mouseY);if(el&&el.closest&&el.closest('#sheet,#card,#mini,#zoom,input,select'))dx=dy=0;else{dx*=.5+f;dy*=.5+f}}}
     if(dx||dy){const v=Math.min(W,H)*.9*dt;panBy(W/2,H/2,W/2+dx*v,H/2+dy*v)}}
  }
  draw();
  if(!inMenu){uiT+=dt;sheetT+=dt;if(uiT>.3){uiT=0;updateHUD();drawMini();if(selTile>=0)renderCard();
    if(sheetP&&sheetT>1.5&&!['ajustes','vistas','comercio','pueblos','online'].includes(sheetP)){const ae=document.activeElement;if(!(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT')&&$('#sheet').contains(ae))){sheetT=0;renderSheet(true)}}}
    saveT+=dt;if(saveT>30){saveT=0;saveLocal(false)}
    netT+=dt;cloudT+=dt;if(netT>45){netT=0;syncInbox()}if(cloudT>300){cloudT=0;cloudSave(false)}}
  requestAnimationFrame(frame);
}
function start(data){
  makeSprites();resize();
  let ok=false;if(data&&data.save){try{ok=deserialize(data.save)}catch(e){ok=false}}
  if(!ok){try{ok=loadFrom(KEY())}catch(e){ok=false}}
  if(!ok){newGame({size:192,seed:(Math.random()*1e9)|0,preset:PRESETS[(Math.random()*PRESETS.length)|0].k,name:'Demostración',money:4e5});G.demo=true;
    // pequeña ciudad de muestra para el fondo del menú
    const c=N>>1;for(let x=c;x<c+16;x++)for(const y of[c,c+6])placeLineDemo(x,y);for(let y=c;y<=c+6;y++)for(const x of[c,c+8,c+15])placeLineDemo(x,y);
    for(let y=c+1;y<c+6;y++)for(let x=c+1;x<c+15;x++){const i=y*N+x;if(kind[i]===0&&buildable(i)){kind[i]=K.ZONE;zone[i]=x<c+8?5:6;lvl[i]=1+((hash2(x,y,1)*5)|0);setLow(i)}}
    dirty.net=true;dirty.traffic=true;recalcAll();dailyStats();cam.x=c+6;cam.y=c;cam.z=22}
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({save:G&&!G.demo&&!G.visiting?serialize():null}));
  renderCats();renderTools();renderSpeed();clampCam();updateHUD();updateHint();
  openMenu('main');if(G&&!G.demo)prevSpeed=G.speed||1;
  requestAnimationFrame(t=>{lastT=t;frame(t)});
}
function placeLineDemo(x,y){const i=y*N+x;if(x<0||y<0||x>=N||y>=N)return;if(kind[i]===0){kind[i]=K.ROAD;if(terr[i]===4)tun[i]=1;setLow(i)}}
addEventListener('pagehide',()=>saveLocal(false));
addEventListener('metropolis-atras',()=>{if(!inMenu)openMenu('main');else if(menuScreen!=='main'){menuScreen='main';renderMenu()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveLocal(false)});
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
</script>
