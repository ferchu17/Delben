<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    html { background: #eef5ff; }

    :root {
      --azul: #0878d1;
      --azul-oscuro: #0056a6;
      --azul-claro: #e7f3ff;
      --verde: #18a558;
      --gris: #536273;
      --borde: #c9dff5;
      --fondo: #eef5ff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--fondo);
      margin: 0;
      padding: 14px 10px 40px;
      color: #202124;
    }
    .contenedor {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0,73,140,.14);
      overflow: hidden;
    }
    .encabezado {
      background: linear-gradient(135deg,#063b75 0%,#0878d1 65%,#12a6e8 100%);
      color: #fff;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .encabezado img {
      height: 72px;
      width: 190px;
      object-fit: contain;
      border-radius: 10px;
      background: #fff;
      padding: 5px 8px;
    }
    .encabezado-texto h1 { margin: 0 0 6px; font-size: 24px; }
    .encabezado-texto p { margin: 0; opacity: .9; font-size: 14px; }
    .seccion {
      padding: 22px 24px;
      background: #fff;
      border-bottom: 1px solid var(--borde);
    }
    .seccion h2 {
      font-size: 18px;
      color: var(--azul-oscuro);
      margin: 0 0 16px;
    }
    .campo { margin-bottom: 16px; }
    .fila { display: flex; gap: 16px; flex-wrap: wrap; }
    .fila .campo { flex: 1; min-width: 180px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #3c4043;
    }
    input[type=text], input[type=email], input[type=tel],
    input[type=number], input[type=date], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea { min-height: 70px; resize: vertical; }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--azul);
      box-shadow: 0 0 0 2px rgba(26,115,232,.15);
    }
    .checkbox-grupo { display: flex; flex-wrap: wrap; gap: 10px 20px; }
    .checkbox-item { display: flex; align-items: center; gap: 6px; }
    .checkbox-item input { width: auto; }
    .checkbox-item label { margin: 0; font-weight: 400; }
    .radio-grupo { display: flex; gap: 20px; }
    .radio-item { display: flex; align-items: center; gap: 6px; }
    .radio-item input { width: auto; }
    .radio-item label { margin: 0; font-weight: 400; }
    .hijo-bloque {
      border: 1px dashed var(--borde);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .declaracion {
      background: var(--azul-claro);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .declaracion input { margin-top: 3px; width: auto; }
    .declaracion label { font-weight: 400; font-size: 13.5px; }
    .pie { padding: 24px 32px; }
    button {
      background: linear-gradient(90deg,#0878d1,#0056a6);
      color: #fff;
      border: none;
      padding: 15px 28px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--azul-oscuro); }
    button:disabled { background: #9aa0a6; cursor: not-allowed; }
    .mensaje {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    .mensaje.ok { background: #e6f4ea; color: #137333; display: block; }
    .mensaje.error { background: #fce8e6; color: #c5221f; display: block; }
    .requerido { color: #d93025; }
    small.ayuda { display:block; color: #176b48; margin-top: 8px; background:#e8f8ef; padding:10px 12px; border-radius:10px; }
    input[type=file] { width:100%; padding:12px; border:2px dashed #8fc4f0; border-radius:12px; background:#f4faff; color:#1d4f7a; }
  @media (max-width: 600px) {
      body { padding: 0 0 24px; }
      .contenedor { border-radius: 0; box-shadow:none; }
      .encabezado { padding: 16px 14px; gap: 12px; }
      .encabezado img { width: 118px; height: 58px; }
      .encabezado-texto h1 { font-size: 20px; }
      .encabezado-texto p { font-size: 12px; }
      .seccion { padding: 18px 14px; }
      .fila .campo { min-width: 100%; }
      .pie { padding: 18px 14px; }
      button { width:100%; }
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="encabezado">
      <img src="./delben-logo.webp" alt="Delben SGI">
      <div class="encabezado-texto">
        <h1>Ficha de Datos del Personal</h1>
        <p>Completá el formulario con tus datos. Los campos con <span style="color:#ffd">*</span> son obligatorios.</p>
      </div>
    </div>

    <form id="form-personal">

      <!-- DATOS PERSONALES -->
      <div class="seccion">
        <h2>Datos personales</h2>
        <div class="campo">
          <label>Dirección de correo <span class="requerido">*</span></label>
          <input type="email" name="direccionCorreo" required>
        </div>
        <div class="campo">
          <label>Apellido y Nombre <span class="requerido">*</span></label>
          <input type="text" name="apellidoNombre" required>
        </div>
        <div class="fila">
          <div class="campo">
            <label>Legajo</label>
            <input type="text" name="legajo">
          </div>
          <div class="campo">
            <label>DNI <span class="requerido">*</span></label>
            <input type="text" name="dni" required>
          </div>
          <div class="campo">
            <label>Fecha de nacimiento</label>
            <input type="date" name="fechaNacimiento">
          </div>
        </div>
      </div>

      <!-- DOMICILIO -->
      <div class="seccion">
        <h2>Domicilio</h2>
        <div class="fila">
          <div class="campo" style="flex:2">
            <label>Domicilio (calle)</label>
            <input type="text" name="domicilio">
          </div>
          <div class="campo">
            <label>Altura</label>
            <input type="text" name="altura">
          </div>
          <div class="campo">
            <label>Piso - Dpto</label>
            <input type="text" name="pisoDpto">
          </div>
        </div>
        <div class="fila">
          <div class="campo">
            <label>Entre calle</label>
            <input type="text" name="entreCalle1">
          </div>
          <div class="campo">
            <label>Entre calle</label>
            <input type="text" name="entreCalle2">
          </div>
        </div>
        <div class="campo">
          <label>Datos adicionales del domicilio</label>
          <input type="text" name="datosAdicional">
        </div>
        <div class="fila">
          <div class="campo">
            <label>Localidad</label>
            <input type="text" name="localidad">
          </div>
          <div class="campo">
            <label>Partido</label>
            <input type="text" name="partido">
          </div>
        </div>
        <div class="campo">
          <label>Observaciones</label>
          <textarea name="observaciones"></textarea>
        </div>
      </div>

      <!-- CONTACTO -->
      <div class="seccion">
        <h2>Datos de contacto</h2>
        <div class="fila">
          <div class="campo">
            <label>Teléfono celular</label>
            <input type="tel" name="telefonoCelular">
          </div>
          <div class="campo">
            <label>Teléfono fijo</label>
            <input type="tel" name="telefonoFijo">
          </div>
          <div class="campo">
            <label>Otro teléfono</label>
            <input type="tel" name="otroTelefono">
          </div>
        </div>
        <div class="campo">
          <label>Teléfono de otro contacto a quien corresponde</label>
          <input type="text" name="telefonoOtroContacto" placeholder="Ej: 11-2233-4455 (hermano)">
        </div>
        <div class="campo">
          <label>Correo electrónico (contacto)</label>
          <input type="email" name="correoElectronico">
        </div>
      </div>

      <!-- CON QUIEN VIVE -->
      <div class="seccion">
        <h2>¿Con quién vive?</h2>
        <div class="checkbox-grupo">
          <div class="checkbox-item"><input type="checkbox" id="cqv-padre" name="conQuienVive.padre"><label for="cqv-padre">Padre</label></div>
          <div class="checkbox-item"><input type="checkbox" id="cqv-madre" name="conQuienVive.madre"><label for="cqv-madre">Madre</label></div>
          <div class="checkbox-item"><input type="checkbox" id="cqv-suegro" name="conQuienVive.suegro"><label for="cqv-suegro">Suegro</label></div>
          <div class="checkbox-item"><input type="checkbox" id="cqv-suegra" name="conQuienVive.suegra"><label for="cqv-suegra">Suegra</label></div>
          <div class="checkbox-item"><input type="checkbox" id="cqv-esposa" name="conQuienVive.esposa"><label for="cqv-esposa">Esposa</label></div>
          <div class="checkbox-item"><input type="checkbox" id="cqv-hijo1" name="conQuienVive.hijo1"><label for="cqv-hijo1">Hijo 1</label></div>
          <div class="checkbox-item"><input type="checkbox" id="cqv-hijo2" name="conQuienVive.hijo2"><label for="cqv-hijo2">Hijo 2</label></div>
          <div class="checkbox-item"><input type="checkbox" id="cqv-hijo3" name="conQuienVive.hijo3"><label for="cqv-hijo3">Hijo 3</label></div>
          <div class="checkbox-item"><input type="checkbox" id="cqv-hijo4" name="conQuienVive.hijo4"><label for="cqv-hijo4">Hijo 4</label></div>
          <div class="checkbox-item"><input type="checkbox" id="cqv-hijo5" name="conQuienVive.hijo5"><label for="cqv-hijo5">Hijo 5</label></div>
        </div>
      </div>

      <!-- FAMILIARES -->
      <div class="seccion">
        <h2>Familiares</h2>
        <div class="fila">
          <div class="campo"><label>Padre</label><input type="text" name="nombrePadre"></div>
          <div class="campo"><label>Madre</label><input type="text" name="nombreMadre"></div>
        </div>
        <div class="fila">
          <div class="campo"><label>Suegro</label><input type="text" name="nombreSuegro"></div>
          <div class="campo"><label>Suegra</label><input type="text" name="nombreSuegra"></div>
        </div>

        <div class="hijo-bloque">
          <div class="fila">
            <div class="campo"><label>Hijo 1 - Nombre</label><input type="text" name="hijo1Nombre"></div>
            <div class="campo"><label>Hijo 1 - Fecha de nacimiento</label><input type="date" name="hijo1Fecha"></div>
          </div>
        </div>
        <div class="hijo-bloque">
          <div class="fila">
            <div class="campo"><label>Hijo 2 - Nombre</label><input type="text" name="hijo2Nombre"></div>
            <div class="campo"><label>Hijo 2 - Fecha de nacimiento</label><input type="date" name="hijo2Fecha"></div>
          </div>
        </div>
        <div class="hijo-bloque">
          <div class="fila">
            <div class="campo"><label>Hijo 3 - Nombre</label><input type="text" name="hijo3Nombre"></div>
            <div class="campo"><label>Hijo 3 - Fecha de nacimiento</label><input type="date" name="hijo3Fecha"></div>
          </div>
        </div>
        <div class="hijo-bloque">
          <div class="fila">
            <div class="campo"><label>Hijo 4 - Nombre</label><input type="text" name="hijo4Nombre"></div>
            <div class="campo"><label>Hijo 4 - Fecha de nacimiento</label><input type="date" name="hijo4Fecha"></div>
          </div>
        </div>
        <div class="hijo-bloque">
          <div class="fila">
            <div class="campo"><label>Hijo 5 - Nombre</label><input type="text" name="hijo5Nombre"></div>
            <div class="campo"><label>Hijo 5 - Fecha de nacimiento</label><input type="date" name="hijo5Fecha"></div>
          </div>
        </div>
      </div>

      <!-- EDUCACIÓN -->
      <div class="seccion">
        <h2>Educación</h2>
        <div class="campo">
          <label>¿Posee secundario?</label>
          <div class="radio-grupo">
            <div class="radio-item"><input type="radio" id="sec-si" name="poseeSecundario" value="Sí"><label for="sec-si">Sí</label></div>
            <div class="radio-item"><input type="radio" id="sec-no" name="poseeSecundario" value="No"><label for="sec-no">No</label></div>
          </div>
        </div>
        <div class="campo">
          <label>¿Posee analítico o título?</label>
          <div class="radio-grupo">
            <div class="radio-item"><input type="radio" id="tit-si" name="poseeAnaliticoTitulo" value="Sí"><label for="tit-si">Sí</label></div>
            <div class="radio-item"><input type="radio" id="tit-no" name="poseeAnaliticoTitulo" value="No"><label for="tit-no">No</label></div>
          </div>
        </div>
        <div class="campo">
          <label>Observaciones de analítico o título</label>
          <textarea name="observacionesAnalitico"></textarea>
        </div>
      </div>

      <!-- FOTOS DNI -->
      <div class="seccion">
        <h2>Foto del DNI</h2>
        <div class="fila">
          <div class="campo">
            <label>Foto DNI - Anverso</label>
            <input type="file" name="fotoDniAnverso" accept="image/*,.pdf">
          </div>
          <div class="campo">
            <label>Foto DNI - Reverso</label>
            <input type="file" name="fotoDniReverso" accept="image/*,.pdf">
          </div>
        </div>
        <small class="ayuda">Las fotos se guardan en una carpeta de Drive y el link se registra en la hoja.</small>
      </div>

      <!-- DECLARACIONES -->
      <div class="seccion">
        <h2>Declaraciones</h2>
        <div class="declaracion">
          <input type="checkbox" id="decl-domicilio" name="declaracionDomicilio" required>
          <label for="decl-domicilio">Acepto mantener informado el domicilio a la empresa. <span class="requerido">*</span></label>
        </div>
        <div class="declaracion">
          <input type="checkbox" id="decl-jurada1" name="declaracionJurada1" required>
          <label for="decl-jurada1">Declaro que todos los datos son veraces y completos, y que están presentados de acuerdo a mi leal saber y entender. <span class="requerido">*</span></label>
        </div>
        <div class="declaracion">
          <input type="checkbox" id="decl-jurada2" name="declaracionJurada2" required>
          <label for="decl-jurada2">Declaración jurada. <span class="requerido">*</span></label>
        </div>
      </div>

      <div class="pie">
        <button type="submit" id="btn-enviar">Enviar</button>
        <div id="mensaje" class="mensaje"></div>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('form-personal');
    const btn = document.getElementById('btn-enviar');
    const mensaje = document.getElementById('mensaje');

    function leerArchivo(input) {
      return new Promise((resolve) => {
        const file = input.files && input.files[0];
        if (!file) { resolve(null); return; }
        const reader = new FileReader();
        reader.onload = function() {
          const base64 = reader.result.split(',')[1];
          resolve({ fileName: file.name, mimeType: file.type, bytes: base64 });
        };
        reader.readAsDataURL(file);
      });
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Enviando...';
      mensaje.className = 'mensaje';
      mensaje.textContent = '';

      const fd = new FormData(form);
      const data = {
        conQuienVive: {}
      };

      // Campos simples (excepto checkboxes de "con quien vive" y archivos)
      const camposSimples = [
        'direccionCorreo','apellidoNombre','legajo','dni','fechaNacimiento',
        'domicilio','altura','pisoDpto','entreCalle1','entreCalle2','datosAdicional',
        'localidad','partido','observaciones','telefonoCelular','telefonoFijo',
        'otroTelefono','telefonoOtroContacto','correoElectronico',
        'nombrePadre','nombreMadre','nombreSuegro','nombreSuegra',
        'hijo1Nombre','hijo1Fecha','hijo2Nombre','hijo2Fecha',
        'hijo3Nombre','hijo3Fecha','hijo4Nombre','hijo4Fecha',
        'hijo5Nombre','hijo5Fecha','poseeSecundario','poseeAnaliticoTitulo',
        'observacionesAnalitico'
      ];
      camposSimples.forEach(nombre => { data[nombre] = fd.get(nombre) || ''; });

      // Con quien vive (checkboxes)
      ['padre','madre','suegro','suegra','esposa','hijo1','hijo2','hijo3','hijo4','hijo5'].forEach(k => {
        data.conQuienVive[k] = !!form.querySelector('[name="conQuienVive.' + k + '"]').checked;
      });

      // Declaraciones
      data.declaracionDomicilio = form.querySelector('[name="declaracionDomicilio"]').checked;
      data.declaracionJurada1 = form.querySelector('[name="declaracionJurada1"]').checked;
      data.declaracionJurada2 = form.querySelector('[name="declaracionJurada2"]').checked;

      // Archivos DNI
      data.fotoDniAnverso = await leerArchivo(form.querySelector('[name="fotoDniAnverso"]'));
      data.fotoDniReverso = await leerArchivo(form.querySelector('[name="fotoDniReverso"]'));

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.textContent = 'Enviar';
          if (res.ok) {
            mensaje.className = 'mensaje ok';
            mensaje.textContent = 'Datos guardados correctamente (ID ' + res.id + ').';
            form.reset();
          } else {
            mensaje.className = 'mensaje error';
            mensaje.textContent = 'Error al guardar: ' + res.error;
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = 'Enviar';
          mensaje.className = 'mensaje error';
          mensaje.textContent = 'Error: ' + err.message;
        })
        .guardarDatos(data);
    });
  </script>
</body>
</html>
